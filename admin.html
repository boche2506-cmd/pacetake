<!-- ========================================== -->
<!-- 🔮 派思核心控制台 (Admin 視圖) -->
<!-- ========================================== -->
<div id="adminView"
    style="display: none; padding: 0.25cqw; background: #121212; color: #e0e0e0; min-height: 100vh; overflow: auto; font-family: sans-serif;">
    <div
        style="display: flex; justify-content: space-between; align-items: center; border-bottom: 0.125cqw solid #333; padding-bottom: 0.5cqw;">
        <h1 style="color: #4dadff; margin: 0; font-size: 0.75cqw;">🔮 派思最高意志控制台</h1>
        <button id="toggleBuyerViewBtn"
            style="padding: 0.5cqw 1cqw; background: #ff4d4d; color: white; border: none; border-radius: 0.375cqw; cursor: pointer; font-weight: bold; font-size: 0.75cqw; transition: 0.2s;">
            🧑‍💼 返回一般買家視圖
        </button>
    </div>
    <div
        style="background: #1e1e1e; padding: 0.25cqw; border-radius: 0.5cqw; margin-bottom: 0.25cqw; border: 0.2cqw solid #2d2d2d;overflow-y: auto;">
        <h3 style="color: #ffca28; margin-top: 0;">➕ 新增全新店家</h3>
        <p style="color: #aaa; font-size: 0.75cqw; margin-bottom: 0.25cqw;">請輸入店家資訊，新增後將立即同步至 Firebase 雲端資料庫。
        </p>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.25cqw; margin-bottom: 0.25cqw;">
            <input type="text" id="adminNewStoreName" placeholder="店家名稱 (*必填)"
                style="padding: 0.25cqw; background: #2a2a2a; border: 0.2cqw solid #444; color: white; border-radius: 0.25cqw;">
            <input type="text" id="adminNewStorePhone" placeholder="聯絡電話 (*必填)"
                style="padding: 0.25cqw; background: #2a2a2a; border: 0.2cqw solid #444; color: white; border-radius: 0.25cqw;">
            <input type="text" id="adminNewStoreCity" placeholder="縣市 (如: 基隆市) (*必填)"
                style="padding: 0.25cqw; background: #2a2a2a; border: 0.2cqw solid #444; color: white; border-radius: 0.25cqw;">
            <input type="text" id="adminNewStoreDistrict" placeholder="區域 (如: 七堵區) (*必填)"
                style="padding: 0.25cqw; background: #2a2a2a; border: 0.2cqw solid #444; color: white; border-radius: 0.25cqw;">
            <input type="text" id="adminNewStoreAddress" placeholder="詳細地址 (*必填)"
                style="padding: 0.25cqw; background: #2a2a2a; border: 0.2cqw solid #444; color: white; border-radius: 0.25cqw; grid-column: span 2;">

        </div>
        <button id="adminSubmitStoreBtn"
            style="width: 10cqw; padding: 0.25cqw; background: #059669; color: white; border: none; border-radius: 0.25cqw; font-weight: bold; cursor: pointer; transition: 0.2s;">✅
            確認新增店家至雲端</button>
    </div>
    <div
        style="background: #1e1e1e; padding: 0.25cqw; border-radius: 0.5cqw; border: 0.2cqw solid #2d2d2d; overflow-x: auto;">
        <h3 style="color: #4da5ff; margin-top: 0;"> 📋 目前雲端店家總覽</h3>
        <table
            style="width: 10cqw; border-collapse: collapse; margin-top: 0.5cqw; text-align: left; font-size: 0.75cqw;">
            <tr style="background: #2d2d2d; color: #fff;">
                <th style="padding: 0.75cqw; border: 0.2cqw solid #3a3a3a;">店家名稱</th>
                <th style="padding: 0.75cqw; border: 0.2cqw solid #3a3a3a;">詳細地址</th>
                <th style="padding: 0.75cqw; border: 0.2cqw solid #3a3a3a;">聯絡電話</th>
                <th style="padding: 0.75cqw; border: 0.2cqw solid #3a3a3a; text-align: center;">核心操作
                </th>
            </tr>
            <tbody id="adminStoreTableBody">
                <tr>
                    <td colspan="4" style="text-align: center; padding: 0.25cqw; color: #888;">正在載入雲端資料...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="lightbox-modal" id="loginLightbox" style="display: none;">
        <div class="modal-card">
            <div class="modal-title" style=" font-weight: 600; color: var(--text-main);">加入PACE 派思</div>
            <button class="modal-btn google" data-action="googleLoginAction"
                style="box-shadow: 0 0.2cqw 0.125 rgba(0,0,0,0.05);">
                <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right:0.5cqw;">
                    <path fill="#4285F4"
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                    <path fill="#34A853"
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                    <path fill="#FBBC05"
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
                    <path fill="#EA4335"
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
                </svg>
                Google 登入
            </button>
            <button id="toggleEmailFormBtn"
                style="display: flex; align-items: center; justify-content: center; width: 100%; margin-bottom: 5cqw; background-color: white; border: 0.2cqw solid #e5e7eb; border-radius: 2cqw; padding: 3cqw 0; font-size: 5cqw; font-weight: 600; color: #374151; cursor: pointer; box-shadow: 0 0.5cqw 2cqw rgba(0,0,0,0.05);">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" style="margin-right:0.5cqw;">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
                使用電子郵件登入
            </button>
            <div id="emailFormSection"
                style="display: none; margin-top: 5cqw; text-align: left; height: 100%; box-sizing: border-box; background-color: var(--bg-Container); border: 0.2cqw solid var(--border-color); ">
                <div style="margin-bottom: 1cqw;">
                    <label for="loginEmail"
                        style="display:block; margin-bottom: 5cqw; font-size:5cqw; color:#6b7280; font-weight:700;">電子郵件</label>
                    <input type="email" id="loginEmail" placeholder="請輸入 Email" autocomplete="username"
                        style="width: 100%; box-sizing: border-box; padding: 2cqw; border:0.2cqw solid #e5e7eb; border-radius:2cqw; box-sizing:border-box; font-size:5cqw; background-color:#f9fafb; color: #111111;">
                </div>
                <div style="margin-bottom:10cqw;">
                    <label for="loginPassword"
                        style="display:block; margin-bottom:0.25cqw; font-size:5cqw; color:#6b7280; font-weight:500;">密碼</label>
                    <div style="position: relative; display: flex; align-items: center;">
                        <input type="password" id="loginPassword" placeholder="請輸入密碼" autocomplete="current-password"
                            style="width: 100%; padding:0.25cqw 0.75cqw; border:0.2cqw solid #e5e7eb; border-radius:2cqw; box-sizing:border-box; font-size:5cqw; background-color:#f9fafb; color: #111111;">
                        <button type="button" id="togglePasswordVisibility"
                            style="position: absolute; right: 5cqw; background: none; border: none; cursor: pointer; font-size: 5cqw; padding: 0; color: #6b7280; z-index: 10;">👁️</button>
                    </div>
                </div> <button id="emailLoginAction"
                    style="background-color: #059669; color: white; border: none; width: 100%; padding: 0.25cqw; border-radius: 0.5cqw; font-size: 5cqw; font-weight: 700; cursor: pointer; box-shadow: 0 0.25cqw 0.5cqw rgba(255, 255, 255, 0.15);">電子郵件登入
                    / 註冊</button>
            </div><span class="modal-close" id="customReturnBtn"
                style="margin-top: 0.5cqw; text-decoration: underline; cursor: pointer; display: block; text-align: center;">暫時返回</span>
        </div>
    </div>
</div>
<script type="module" src="app.js"></script>
<script type="module">
    // 1. admin新增店家邏輯
    const adminSubmitStoreBtn = document.getElementById('adminSubmitStoreBtn');
    if (adminSubmitStoreBtn) {
        adminSubmitStoreBtn.addEventListener('click', async () => {
            const name = document.getElementById('adminNewStoreName')?.value.trim() || '';
            const phone = document.getElementById('adminNewStorePhone')?.value.trim() || '';
            const city = document.getElementById('adminNewStoreCity')?.value || '';
            const district = document.getElementById('adminNewStoreDistrict')?.value.trim() || '';
            const address = document.getElementById('adminNewStoreAddress')?.value.trim() || '';
            const inviteCode = document.getElementById('adminNewStoreInviteCode')?.value.trim() || '';
            const status = document.getElementById('adminNewStoreStatus')?.value || 'online';
            if (!name || !district || !address) {
                alert("⚠️ 店名、區域、詳細地址為必填項目！");
                return;
            }
            adminSubmitStoreBtn.innerText = "⏳ 正在同步至雲端...";
            try {
                await addDoc(collection(db, "stores"), {
                    name: name, shopName: name, phone: phone, city: city, district: district,
                    address: address, shopAddress: address, isCashPayEnabled: isCashPayEnabled,
                    isOnlinePayEnabled: isOnlinePayEnabled, status: status, inviteCode: inviteCode,
                    menu: [], createdAt: new Date().toISOString()
                });
                alert("✅ 店家已成功新增至雲端！");
                fetchStoresFromFirebase();
            } catch (error) {
                console.error("新增店家失敗:", error);
                alert("新增失敗，請檢查網路或資料庫權限！");
            } finally {
                adminSubmitStoreBtn.innerText = "✅ 確認新增店家至雲端";
            }
        });
    }
    // 2. 刪除店家邏輯 (模組化版本)
    async function deleteStore(storeId) {
        if (confirm("⚠️ 確定要從 Firebase 徹底刪除這個店家嗎？(刪除後無法恢復)")) {
            try {
                await deleteDoc(doc(db, "stores", storeId));
                alert("🗑️ 店家已從雲端刪除！");
                fetchStoresFromFirebase();
            } catch (error) {
                console.error("刪除店家失敗:", error);
                alert("刪除失敗，請檢查網路或資料庫權限！");
            }
        }
    }
    // 3. 渲染表格邏輯
    function renderAdminTable() {
        const tbody = document.getElementById('adminStoreTableBody');
        if (!tbody) return;
        tbody.innerHTML = '';
        if (allStores.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:1cqw; color:#aaa;">目前雲端尚無店家資料</td></tr>';
            return;
        }
        allStores.forEach(store => {
            const finalName = store.shopName || store.name || '未命名店家';
            const finalAddress = store.shopAddress || store.address || '';
            const phone = store.phone || '無資料';
            const statusText = store.status === 'offline' ? '🔴 下線' : '🟢 上線';
            const tr = document.createElement('tr');
            tr.innerHTML = `
            <td style="padding: 1cqw; border: 0.2cqw solid #3a3a3a; color: #ffca28; font-weight: bold;">${finalName}</td>
            <td style="padding: 1cqw; border: 0.2cqw solid #3a3a3a; color: #bbb;">${store.city || ''}${store.district || ''} ${finalAddress}</td>
            <td style="padding: 1cqw; border: 0.2cqw solid #3a3a3a; color: #bbb;">${phone}</td>
            <td style="padding: 1cqw; border: 0.2cqw solid #3a3a3a; text-align: center; color: ${store.status === 'offline' ? '#ef4444' : '#10b981'}; font-weight: bold;">${statusText}</td>
            <td style="padding: 1cqw; border: 0.2cqw solid #3a3a3a; text-align: center;">
                <button class="delete-btn" data-id="${store.id}" style="padding: 1cqw 2cqw; background: #ef4444; color: white; border: none; border-radius: 1cqw; cursor: pointer; font-weight: bold;">刪除</button>
            </td>
        `;
            tbody.appendChild(tr);
        });
    }

    // 4. 事件委派：統一處理表格內的所有「刪除」按鈕點擊 (取代原本的 onclick)
    const tbody = document.getElementById('adminStoreTableBody');
    if (tbody) {
        tbody.addEventListener('click', (e) => {
            if (e.target.classList.contains('delete-btn')) {
                const storeId = e.target.getAttribute('data-id');
                deleteStore(storeId);
            }
        });
    }

    // 5. 視圖切換
    // 統一處理所有的視圖切換邏輯
    window.toggleView = function (view) {
        const adminEl = document.getElementById('adminView');
        const buyerEl = document.getElementById('buyerView');
        if (view === 'admin') {
            if (adminEl) adminEl.style.display = 'block';
            if (buyerEl) buyerEl.style.display = 'none';
            window.scrollTo(0, 0);
        } else {
            if (adminEl) adminEl.style.display = 'none';
            if (buyerEl) buyerEl.style.display = 'block';
            window.scrollTo(0, 0); // 建議加上滾動回頂部，讓體驗一致
        }
    };
