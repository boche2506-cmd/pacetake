<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PACE 派思 pacetake.tw - 買家首頁</title>
    <!-- Favicon & Apple Touch Icon -->
    <link rel="icon" type="image/png" href="png/logoapple.png" sizes="180x180">
    <link rel="apple-touch-icon" href="png/logoapple.png">
    <link rel="apple-touch-icon" sizes="180x180" href="png/logoapple.png">
    <link rel="apple-touch-icon-precomposed" href="png/logoapple.png">
    <link rel="stylesheet" href="style.css">
    <style>
        /* 全局變數與主題防線 */
        :root {
            --bg-global: #F8FAFC;
            --bg-container: #FFFFFF;
            --border-color: #E2E8F0;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --brand-blue: #0066FF;
            --card-bg: #FFFFFF;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg-global: #0A0A0A;
            --bg-container: #111111;
            --border-color: #262626;
            --text-main: #F5F5F5;
            --text-muted: #A3A3A3;
            --brand-blue: #3B82F6;
            --card-bg: #1C1C1E;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-global);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            transition: background-color 0.15s ease;
        }

        .phone-wrapper {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            background-color: var(--bg-container);
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            position: relative;
            padding-bottom: 120px;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 24px 20px 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            background: none;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            text-decoration: none;
            background-color: var(--card-bg);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 800;
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            font-size: 16px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            background-color: var(--card-bg);
        }

        .content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .bill-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow-sm);
        }

        .bill-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px dashed var(--border-color);
        }

        .item-name {
            font-size: 15px;
            font-weight: 600;
        }

        .item-qty {
            font-size: 13px;
            color: var(--text-muted);
            margin-left: 6px;
        }

        .item-price {
            font-size: 15px;
            font-weight: 700;
        }

        .bill-total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 14px;
        }

        .total-label {
            font-size: 15px;
            font-weight: 700;
        }

        .total-amount {
            font-size: 20px;
            font-weight: 800;
            color: var(--brand-blue);
        }

        .time-defense-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: var(--bg-global);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
        }

        .input-style {
            width: 100%;
            height: 44px;
            background-color: var(--bg-global);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0 14px;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
            transition: all 0.15s ease;
        }

        .input-style:focus {
            border-color: var(--brand-blue);
        }

        .pay-option {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            box-shadow: var(--shadow-sm);
        }

        .pay-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 700;
        }

        .pay-check-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            transition: all 0.15s ease;
        }

        .footer-action {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 20px 24px 20px;
            background-color: var(--bg-container);
            border-top: 1px solid var(--border-color);
        }

        .submit-order-btn {
            background-color: var(--brand-blue);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(0, 102, 255, 0.15);
            transition: all 0.15s ease;
        }

        .submit-order-btn:active {
            transform: scale(0.98);
        }

        .submit-order-btn:disabled {
            background-color: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>

<body>
    <div class="phone-wrapper">
        <div id="buyerView" style="display: block;">
            <header id="header">
                <div class="pace-logo">
                    <a href="index.html" class="logo-link">
                        <img src="png/pace3.png" alt="派思 官方網站">
                    </a>
                    <span id="defaultIcon" class="avatar-icon">👤</span>
                    <img id="userAvatarImg" src=""
                        style="font-weight: 500; display: none; border-radius: 50%;font-size: 4.25cqw; height: 75%; max-width: 30%; flex-direction: row; justify-content: flex-end; align-items: flex-end;">
                </div>
                <div class="two">
                    <div class="pace">
                        <button class="theme-toggle" id="themeToggleBtn" aria-label="切換主題">🌙</button>
                        <span>店內價外帶自取/點餐系統</span>
                    </div>
                    <button class="login-btn" id="loginBtn">登入/註冊</button>
                    <button class="user-avatar-btn" id="avatarBtn" style="display: none;">
                        <span class="user-name" id="userNameDisplay"></span></button>
                    <div class="dropdown-menu" id="dropdownMenu"></div>
                </div>
            </header>
            <main class="content">
                <div>
                    <div class="section-title">📋 取貨聯絡資訊 (老闆接單安全防線)</div>
                    <div class="bill-card" style="display: flex; flex-direction: column; gap: 12px;">
                        <div>
                            <label
                                style="font-size: 12px; font-weight: 700; color: var(--text-muted); display:block; margin-bottom:4px;">取貨人真實姓名</label>
                            <input type="text" id="buyerNameInput" class="input-style" placeholder="請輸入方便老闆稱呼的姓名"
                                required>
                        </div>
                        <div>
                            <label
                                style="font-size: 12px; font-weight: 700; color: var(--text-muted); display:block; margin-bottom:4px;">手機號碼
                                (聯絡自取用)</label>
                            <input type="tel" id="buyerPhoneInput" class="input-style" placeholder="例如：0912345678"
                                required>
                        </div>
                    </div>
                </div>

                <div>
                    <div class="section-title">🛍️ 點餐明細</div>
                    <div class="bill-card" id="cartItemsContainer">
                        <div style="text-align: center; color: var(--text-muted); padding: 20px;">購物車空空的喔...</div>
                    </div>
                </div>

                <div class="time-defense-box">
                    <span>⏳</span>
                    <span id="defenseTimeText">本單預計 15 分鐘後可至店內現場自取。</span>
                </div>

                <div class="pay-defense-group">
                    <div class="section-title">💳 支付方式</div>

                    <div style="display: flex; flex-direction: column; gap: 10px;">
                        <div class="pay-option" data-paytype="CREDIT" id="payOptCredit"
                            style="transition: all 0.2s ease;">
                            <div class="pay-info">
                                <span>💳</span>
                                <span id="creditText">線上信用卡刷卡 (安全加密)</span>
                            </div>
                            <div class="pay-check-dot" id="creditCheckDot"
                                style="width: 16px; height: 16px; border-radius: 50%; background-color: transparent; border: 2px solid var(--border-color);">
                            </div>
                        </div>
                        <div id="creditNoticeText"
                            style="font-size: 12px; font-weight: 600; color: #EF4444; padding-left: 6px; display: none; margin-top: -4px; margin-bottom: 4px;">
                            ⚠️ 本店家不支援線上刷卡，請使用現金結帳。
                        </div>

                        <div class="pay-option" data-paytype="CASH" id="payOptCash" style="transition: all 0.2s ease;">
                            <div class="pay-info">
                                <span>💵</span>
                                <span id="cashText">現場現金付款 (到店取貨付現)</span>
                            </div>
                            <div class="pay-check-dot" id="cashCheckDot"
                                style="width: 16px; height: 16px; border-radius: 50%; background-color: transparent; border: 2px solid var(--border-color);">
                            </div>
                        </div>
                        <div id="cashNoticeText"
                            style="font-size: 12px; font-weight: 600; color: #EF4444; padding-left: 6px; display: none; margin-top: -4px;">
                            ⚠️ 本店家尚未開啟現場付現功能，請使用信用卡安全結帳。
                        </div>
                    </div>
                </div>
            </main>

            <footer class="footer-action">
                <button class="submit-order-btn" id="submitOrderBtn">
                    <span>🚀 安全前往藍新金流結帳</span>
                </button>
            </footer>
        </div>
    </div>
    <form id="newebpayForm" method="post" action="https://ccore.newebpay.com/MPG/mpg_gateway" style="display:none;">
        <input type="text" name="MerchantID" id="formMerchantID">
        <input type="text" name="TradeInfo" id="formTradeInfo">
        <input type="text" name="TradeSha" id="formTradeSha">
        <input type="text" name="Version" value="2.0">
    </form>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script type="module" src="js/app.js"></script>
    <script src="js/cart-manager.js"></script>
    <script>
        // 藍新測試金鑰配置
        const NEWEBPAY_CONFIG = {
            MerchantID: "MS159240719",
            HashKey: "OHfk5ihgUykYAHw4XGaAKswrPlpnVpfj",
            HashIV: "CIntuhlC0cyZscDP",
            Version: "2.0"
        };

        let finalTotalAmount = 0;
        let cartData = [];
        let currentPayType = "";
        let targetStoreId = "";

        // 🛒 1. 從 localStorage 載入買家在 index.html 選購的真實購物車資料
        function loadCartFromStorage() {
            cartData = getCartData();
            // 順便提取這部購物車是屬於哪一個店家的，用來去雲端看店家的金流開關
            if (cartData.length > 0 && cartData[0].storeId) {
                targetStoreId = cartData[0].storeId;
            }
            renderCart();
        }

        // 🎨 2. 動態渲染點餐明細與計算總額
        function renderCart() {
            const container = document.getElementById('cartItemsContainer');
            if (!container) return;

            // 💡 新增：用來累加購物車裡所有商品的總數量
            let totalQty = 0;

            if (cartData.length === 0) {
                container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 20px;">購物車是空的，快去首頁選購吧！</div>`;
                finalTotalAmount = 0;

                // 💡 關鍵：購物車空了，呼叫更新按鈕計數為 (0)
                updateBottomCartBadge(totalQty);
                return;
            }

            let html = '';
            let total = 0;

            cartData.forEach(item => {
                const itemPrice = parseInt(item.price) || 0;
                const itemQty = parseInt(item.qty) || 1;
                const subtotal = itemPrice * itemQty;
                total += subtotal;

                // 💡 關鍵：把每一項商品的數量累加起來
                totalQty += itemQty;

                html += `
            <div class="bill-item">
                <div>
                    <span class="item-name">${item.name}</span>
                    <span class="item-qty">x${itemQty}</span>
                </div>
                <span class="item-price">$${subtotal}</span>
            </div>
        `;
            });

            finalTotalAmount = total;

            html += `
        <div class="bill-total-row">
            <span class="total-label">總計金額</span>
            <span class="total-amount" id="totalAmountText">$${finalTotalAmount}</span>
        </div>
    `;
            container.innerHTML = html;

            // 💡 關鍵：渲染完明細後，把最後算出來的總數量丟進去更新底部按鈕！
            updateBottomCartBadge(totalQty);

            // 👑 修正點：雙軌支付開關檢查機制，應該放在 renderCart 結束之前！
            if (targetStoreId) {
                checkStorePaymentConfig(targetStoreId);
            } else {
                // 如果是本機隨機產生的模擬資料，預設開啟信用卡
                selectPayment("CREDIT");
                initPaymentSelection(true, true);
            }
        } // 👈 這裡才是 renderCart 真正的結尾！

        // 🏪 3. 核心智慧連動防線：去 Firebase 撈店家設定，決定誰長灰、誰當預設值
        async function checkStorePaymentConfig(storeId) {
            const payOptCredit = document.getElementById('payOptCredit');
            const creditText = document.getElementById('creditText');
            const creditNoticeText = document.getElementById('creditNoticeText');

            const payOptCash = document.getElementById('payOptCash');
            const cashText = document.getElementById('cashText');
            const cashNoticeText = document.getElementById('cashNoticeText');

            try {
                const storeDoc = await getDoc(doc(db, "stores", storeId));

                let isCreditAllowed = true;  // 預設給開，相容舊商家資料
                let isCashAllowed = false;   // 現金自取通常要有勾才算數

                if (storeDoc.exists()) {
                    const storeData = storeDoc.data();
                    // 對應當初註冊時存入的欄位，這裡做防錯處理
                    if (storeData.allowCredit !== undefined) isCreditAllowed = storeData.allowCredit;
                    if (storeData.allowCash !== undefined) isCashAllowed = storeData.allowCash;
                }

                // 🔒 信用卡長灰處理
                if (isCreditAllowed) {
                    payOptCredit.style.opacity = "1";
                    payOptCredit.style.pointerEvents = "auto";
                    payOptCredit.style.cursor = "pointer";
                    creditText.style.color = "var(--text-main)";
                    creditNoticeText.style.display = "none";
                } else {
                    payOptCredit.style.opacity = "0.35";
                    payOptCredit.style.pointerEvents = "none";
                    creditText.style.color = "var(--text-muted)";
                    creditNoticeText.style.display = "block";
                }

                // 🔒 現金自取長灰處理
                if (isCashAllowed) {
                    payOptCash.style.opacity = "1";
                    payOptCash.style.pointerEvents = "auto";
                    payOptCash.style.cursor = "pointer";
                    cashText.style.color = "var(--text-main)";
                    cashNoticeText.style.display = "none";
                } else {
                    payOptCash.style.opacity = "0.35";
                    payOptCash.style.pointerEvents = "none";
                    cashText.style.color = "var(--text-muted)";
                    cashNoticeText.style.display = "block";
                }

                // 🎯 智慧化引導流向：決定第一時間該自動幫買家打勾選誰
                if (isCreditAllowed) {
                    selectPayment("CREDIT");
                } else if (isCashAllowed) {
                    selectPayment("CASH"); // 完美修正！如果沒刷卡但有現金，自動幫買家改勾選現金
                } else {
                    // 極端狀況防守
                    const submitBtn = document.getElementById('submitOrderBtn');
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = "<span>⚠️ 該店家不支援任何支付方式</span>";
                }

                // 綁定可以自由點擊的實體監聽事件
                initPaymentSelection(isCreditAllowed, isCashAllowed);

            } catch (err) {
                console.error("金流防護罩讀取雲端失敗", err);
                // 發生任何異常，退守安全底線：開啟信用卡，啟用基本選取事件
                selectPayment("CREDIT");
                initPaymentSelection(true, true);
            }
        }

        // 🎨 4. 處理實體點擊與勾選圓點之變色效果
        function initPaymentSelection(isCreditAllowed, isCashAllowed) {
            const creditOpt = document.getElementById('payOptCredit');
            const cashOpt = document.getElementById('payOptCash');

            if (isCreditAllowed) creditOpt.onclick = () => selectPayment("CREDIT");
            if (isCashAllowed) cashOpt.onclick = () => selectPayment("CASH");
        }

        function selectPayment(type) {
            currentPayType = type;
            const creditDot = document.getElementById('creditCheckDot');
            const cashDot = document.getElementById('cashCheckDot');
            const creditOpt = document.getElementById('payOptCredit');
            const cashOpt = document.getElementById('payOptCash');
            const submitBtn = document.getElementById('submitOrderBtn');

            if (type === "CREDIT") {
                creditOpt.classList.add('selected');
                cashOpt.classList.remove('selected');
                creditDot.style.backgroundColor = "var(--brand-blue)";
                creditDot.style.border = "none";
                cashDot.style.backgroundColor = "transparent";
                cashDot.style.border = "2px solid var(--border-color)";
                submitBtn.innerHTML = `<span>🚀 安全前往藍新金流結帳</span>`;
            } else {
                cashOpt.classList.add('selected');
                creditOpt.classList.remove('selected');
                cashDot.style.backgroundColor = "var(--brand-blue)";
                cashDot.style.border = "none";
                creditDot.style.backgroundColor = "transparent";
                creditDot.style.border = "2px solid var(--border-color)";
                submitBtn.innerHTML = `<span>👨‍🍳 送出訂單，現場付現</span>`;
            }
        }

        // 🧠 5. Firebase 登入狀態監聽：名字、電話自動填寫與攔截還原
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                console.log("買家驗證已登入:", user.uid);

                if (user.displayName && !document.getElementById('buyerNameInput').value) {
                    document.getElementById('buyerNameInput').value = user.displayName;
                }

                try {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists() && userDoc.data().phone) {
                        document.getElementById('buyerNameInput').value = userDoc.data().realName || user.displayName;
                        document.getElementById('buyerPhoneInput').value = userDoc.data().phone || "";
                    } else {
                        restoreTempData();
                    }
                } catch (err) {
                    restoreTempData();
                }
            } else {
                console.log("買家處於免登入無痛購物中");
                restoreTempData();
            }
        });

        function restoreTempData() {
            if (localStorage.getItem('temp_buyer_name')) {
                document.getElementById('buyerNameInput').value = localStorage.getItem('temp_buyer_name');
            }
            if (localStorage.getItem('temp_buyer_phone')) {
                document.getElementById('buyerPhoneInput').value = localStorage.getItem('temp_buyer_phone');
            }
        }

        document.documentElement.setAttribute('data-theme', localStorage.getItem('pacetake-theme') || 'light');

        // 🛠️ 7. 藍新 AES & SHA256 加密演算法核心
        function encryptAES(parameterString, key, iv) {
            const cryptoKey = CryptoJS.enc.Utf8.parse(key);
            const cryptoIv = CryptoJS.enc.Utf8.parse(iv);
            const encrypted = CryptoJS.AES.encrypt(parameterString, cryptoKey, {
                iv: cryptoIv,
                mode: CryptoJS.mode.CBC,
                padding: CryptoJS.pad.Pkcs7
            });
            return encrypted.toString();
        }

        function hashSHA256(aesString, key, iv) {
            const readyString = `HashKey=${key}&${aesString}&HashIV=${iv}`;
            return CryptoJS.SHA256(readyString).toString(CryptoJS.enc.Hex).toUpperCase();
        }

        // 🚀 8. 按下巨大結帳按鈕：雙層防線全面阻截與對流分支
        const submitOrderBtn = document.getElementById('submitOrderBtn');
        if (submitOrderBtn) {
            submitOrderBtn.addEventListener('click', async () => {
                const buyerName = document.getElementById('buyerNameInput').value.trim();
                const buyerPhone = document.getElementById('buyerPhoneInput').value.trim();

                // 台灣手機號碼格式驗證
                const phoneRegex = /^09\d{8}$/;
                if (!buyerName || !phoneRegex.test(buyerPhone)) {
                    alert("⚠️ 為了確保老闆能聯繫到您，請填寫正確的取貨人姓名與台灣手機號碼(10碼數字)喔！");
                    return;
                }

                if (cartData.length === 0) {
                    alert("您的購物車是空的，無法為您建立任何付款連線。");
                    return;
                }

                // 【第一層防線】：精準攔截未登入用戶，並封存備份資料
                const user = auth.currentUser;
                if (!user) {
                    alert("🔒【PACE 安全提示】偵測到您尚未登入會員！\n系統已為您封存購物車與剛填寫的手機姓名。\n完成登入，回來即可直接結帳。");

                    localStorage.setItem('temp_buyer_name', buyerName);
                    localStorage.setItem('temp_buyer_phone', buyerPhone);

                    window.location.href = "index.html"; // 強制打回首頁觸發極簡登入
                    return;
                }

                // 產生獨一無二不重複訂單號
                const timeStamp = Math.floor(Date.now() / 1000);
                const orderMerchantOrderNo = "PACE_" + timeStamp;

                // --- 🛡️ 雙軌分流核心判斷 ---

                if (currentPayType === "CASH") {
                    // 💵 A 分支：走現場付現流程 (直接存雲端、不扣藍新)
                    try {
                        // 【第二層防線】：同時發動記憶洗回雲端資料庫
                        await setDoc(doc(db, "users", user.uid), {
                            realName: buyerName,
                            phone: buyerPhone,
                            updatedAt: new Date().toISOString()
                        }, { merge: true });

                        // 寫入訂單到 Firestore，狀態給予準備中(PREPARING)
                        await addDoc(collection(db, "orders"), {
                            orderId: orderMerchantOrderNo,
                            buyerUid: user.uid,
                            buyerName: buyerName,
                            buyerPhone: buyerPhone,
                            items: cartData,
                            totalAmount: finalTotalAmount,
                            status: "PREPARING",
                            paymentMethod: "CASH",
                            createdAt: new Date().toISOString()
                        });

                        // 清空本地打包
                        localStorage.removeItem('temp_buyer_name');
                        localStorage.removeItem('temp_buyer_phone');
                        localStorage.removeItem('pacetake_cart'); // 現金送單完成，清空購物車

                        alert(`🎉 訂單已成功送達店家！\n請於到店取貨時现场支付現金 $${finalTotalAmount} 元喔！`);
                        window.location.href = "index.html";
                        return;

                    } catch (cashErr) {
                        alert("現場付現單上傳雲端失敗：" + cashErr.message);
                        return;
                    }
                }

                // 💳 B 分支：走線上刷卡流程 (啟動藍新金流連線)
                alert(`🛒 安全連線建立成功！\n即將為您導向藍新加密刷卡金流，請於頁面完成付款。`);

                const itemNames = cartData.map(i => i.name).join('、');
                const originalParameters = [
                    `MerchantID=${NEWEBPAY_CONFIG.MerchantID}`,
                    `RespondType=JSON`,
                    `TimeStamp=${timeStamp}`,
                    `Version=${NEWEBPAY_CONFIG.Version}`,
                    `MerchantOrderNo=${orderMerchantOrderNo}`,
                    `Amt=${finalTotalAmount}`,
                    `ItemDesc=快拿自取:${itemNames.substring(0, 20)}`,
                    `Email=${user.email || 'buyer@pacetake.tw'}`,
                    `LoginType=0`,
                    `CREDIT=1`
                ].join('&');

                try {
                    // 【第二層防線】：記憶洗回雲端資料庫
                    await setDoc(doc(db, "users", user.uid), {
                        realName: buyerName,
                        phone: buyerPhone,
                        updatedAt: new Date().toISOString()
                    }, { merge: true });

                    // 先寫入一張待付款單到 Firestore (等藍新回傳成功後更新狀態)
                    await addDoc(collection(db, "orders"), {
                        orderId: orderMerchantOrderNo,
                        buyerUid: user.uid,
                        buyerName: buyerName,
                        buyerPhone: buyerPhone,
                        items: cartData,
                        totalAmount: finalTotalAmount,
                        status: "PENDING_PAYMENT",
                        paymentMethod: "CREDIT",
                        createdAt: new Date().toISOString()
                    });

                    // 清除臨時資訊
                    localStorage.removeItem('temp_buyer_name');
                    localStorage.removeItem('temp_buyer_phone');

                    // 執行藍新雙重高階加密演算法
                    const tradeInfo = encryptAES(originalParameters, NEWEBPAY_CONFIG.HashKey, NEWEBPAY_CONFIG.HashIV);
                    const tradeSha = hashSHA256(tradeInfo, NEWEBPAY_CONFIG.HashKey, NEWEBPAY_CONFIG.HashIV);

                    document.getElementById('formMerchantID').value = NEWEBPAY_CONFIG.MerchantID;
                    document.getElementById('formTradeInfo').value = tradeInfo;
                    document.getElementById('formTradeSha').value = tradeSha;

                    // 咻！表單噴發跳轉藍新刷卡頁面
                    document.getElementById('newebpayForm').submit();

                } catch (err) {
                    alert("藍新安全加密防線建立失敗，請聯絡客服：" + err.message);
                }
            });
        }

        // 初始化載入購物車
        loadCartFromStorage();
    </script>
</body>

</html>
