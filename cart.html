<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PACE 派思 pacetake.tw - 買家首頁</title>
    <!-- PWA 配置 -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#ffffff">
    <!-- 一般網頁分頁圖示 -->
    <link rel="icon" type="image/png" href="png/logo192.png" sizes="192x192">
    <!-- iPhone 桌面圖示專用（已修改為 180x180 正方形） -->
    <link rel="apple-touch-icon" href="png/logo180.png">
    <link rel="stylesheet" href="style.css">
    <style>
        .input-style {
            width: 100%;
            height: 7cqw;
            color: var(--text-main);
            background-color: var(--bg-global);
            border: 0.2cqw solid var(--border-color);
            border-radius: 2cqw;
            padding: 0 2cqw;
            font-size: 4cqw;
            font-weight: 500;
            outline: none;
            box-sizing: border-box;

        }

        .ContactInformation {
            height: 12%;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            color: var(--text-main);
            border-radius: 4cqw;
            padding: 0.25cqw;
        }

        .NamePhone {
            height: 40%;
            width: 100%;
            font-size: 5cqw;
            font-weight: 700;
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
            line-height: 1.1;
            padding: 0.5cqw;
            box-sizing: border-box;
        }

        .Information {
            height: 60%;
            width: 100%;
            /* 與 GPS 按鈕加起來剛好分配總寬度 */
            /* 縣市和區域中間的間距 */
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            gap: 0.5cqw;
        }

        .PhoneInformation,
        .NameInformation {
            height: 100%;
            width: 50%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            color: var(--text-muted);
            line-height: 1.1;
            font-size: 4cqw;
            font-weight: 700;
            box-sizing: border-box;
        }

        .PhoneInformation input,
        .NameInformation input {
            text-align: center;
            line-height: 1.1;
        }

        .content {
            height: 51%;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            padding: 1cqw;
            box-sizing: border-box;
        }

        .contentspan {
            height: 8%;
            width: 100%;
            font-size: 5cqw;
            font-weight: 700;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            line-height: 1.1;
            color: var(--text-main);
            box-sizing: border-box;
        }

        .bill-card {
            height: 77%;
            width: 100%;
            padding: 0 2cqw;
            overflow-y: auto;
            scrollbar-width: none;
            /* 確保內容依然可以滑動 */
            -ms-overflow-style: none;
            /* 隱藏 Chrome, Safari, Edge 的卷軸 */
            box-sizing: border-box;
        }

        .bill-card::-webkit-scrollbar {
            /* Chrome, Safari 隱藏軸線 */
            display: none;
        }

        .Remark {
            height: 15%;
            width: 100%;
            font-size: 5cqw;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            line-height: 1.1;
            color: var(--text-main);
            gap: 0.25cqw;
            box-sizing: border-box;
        }

        .Remark input {
            text-align: center;
            line-height: 1.1;
            padding: 2cqw 0;
            font-size: 3.5cqw;
            font-weight: 500;
        }

        .footer-action {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 22%;
            /* 保留你原本佔外殼的 15% 高度比例 */
            width: 100%;
            background-color: var(--blur-bg);
            /* 邊框 cqw */
            padding: 1cqw;
            /* 左右微調內襯，讓留白更好看 */
            box-sizing: border-box;
            gap: 0.5cqw;
        }

        .Dining-style,
        .pay-defense-group {
            height: 35%;
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            border-radius: 3.5cqw;
            gap: 1cqw;
            background-color: var(--card-bg);
            border: 0.2cqw solid var(--border-color);
            box-shadow: var(--shadow-sm);
            color: var(--text-main);
            box-sizing: border-box;
        }

        .option-option {
            height: 95%;
            width: 48%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-sizing: border-box;
        }

        .pay-option {
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2cqw;
            border-radius: 3.5cqw;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .pay-info {
            height: 100%;
            width: 90%;
            display: flex;
            align-items: center;
            font-size: 4cqw;
            font-weight: 700;
            gap: 1cqw;
        }

        .pay-info img {
            height: 50%;
            aspect-ratio: 1 / 1;
        }

        #dineInTable {
            border: 0.2cqw solid var(--border-color);
            border-radius: 3cqw;
            background-color: var(--bg-global);
            color: var(--text-main);
            line-height: 1.1;
            box-sizing: border-box;
            height: 70%;
            width: 35%;
            font-size: 3.5cqw;
            font-weight: 500;
            object-fit: contain;
            user-select: text;
            cursor: text;
            background-color: #f0f0f0;
            /* 你原本的灰色 */
            transition: background-color 0.3s ease;
            /* 讓顏色變換有平滑的過場效果 */
            text-align: center;
        }

        #dineInTable:not(:placeholder-shown) {
            background-color: var(--bg-Container);
            color: var(--text-main);
        }

        .pay-check-dot {
            width: 4cqw;
            height: 4cqw;
            border-radius: 50%;
            transition: all 0.15s ease;
            background-color: transparent;
            border: 0.2cqw solid var(--border-color);
        }

        .submitorderbtn {
            height: 30%;
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .submit-order-btn {
            height: 95%;
            width: 90%;
            background-color: var(--brand-blue);
            color: white;
            border: none;
            padding: 4cqw;
            border-radius: 3.5cqw;
            font-size: 4cqw;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 1cqw 3cqw rgba(0, 102, 255, 0.15);
            transition: all 0.15s ease;
        }

        .submit-order-btn:active {
            transform: scale(0.98);
        }

        .submit-order-btn:disabled {
            background-color: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>

<body>

                <div class="pace-logo">
                    <a href="index.html" class="logo-link">

                </div>
            </main>
            <footer class="footer-action">
                <div class="Dining-style">
                    <div class="option-option">
                        <div class="pay-option selected" data-diningtype="TAKE_OUT" id="dineOptTakeOut">
                            <div class="pay-info">
                                <img src="png/logo180.png" class="buyer" alt="買家圖示">
                                <span id="takeOutText">外帶自取</span>
                            </div>
                            <div class="pay-check-dot" id="takeOutCheckDot">
                            </div>

                    </div>
                    <div class="option-option">
                        <div class="pay-option" data-diningtype="DINE_IN" id="dineOptDineIn">
                            <div class="pay-info">
                                <span>🪑</span>
                                <span id="dineInText">店內內用</span>
                                <input type="text" id="dineInTable" class="input-style" placeholder="桌號">

                            <div class="pay-check-dot" id="dineInCheckDot">

                        <div id="dineInNoticeText"

                            ⚠️ 該店家目前不開放店內內用，僅提供外帶自取喔！
                        </div>
                    </div>
                </div>
                <div class="pay-defense-group">
                    <div class="option-option">
                        <div class="pay-option" data-paytype="CREDIT" id="payOptCredit">
                            <div class="pay-info">
                                <span>💳</span>
                                <span id="creditText">線上支付</span>
                            </div>
                            <div class="pay-check-dot" id="creditCheckDot">
                            </div>
                        </div>
                        <div id="creditNoticeText"
                            style="font-size: 3cqw; font-weight: 500; color: var(--brand-red); display: none; position: absolute; padding: 0 2cqw;">
                            ⚠️ 此店家不支援線上支付，請使用現金結帳。
                        </div>
                    </div>
                    <div class="option-option">
                        <div class="pay-option" data-paytype="CASH" id="payOptCash">
                            <div class="pay-info">
                                <span>💵</span>
                                <span id="cashText">現金付款</span>
                            </div>
                            <div class="pay-check-dot" id="cashCheckDot">
                            </div>
                        </div>
                        <div id="cashNoticeText"
                            style="font-size: 3cqw; font-weight: 500; color: var(--brand-red); display: none; position: absolute; padding: 0 2cqw;">
                            ⚠️ 此店家未開啟現金付款，請使用線上支付。
                        </div>
                    </div>
                </div>
                <div class="submitorderbtn">
                    <button class="submit-order-btn" id="submitOrderBtn">
                        <span>🚀 送出訂單</span>
                    </button>
                </div>
            </footer>
        </div>
        <div class="lightbox-modal" id="loginLightbox" style="display: none;">
            <div class="modal-card">
                <div class="modal-title" style=" font-weight: 600; color: var(--text-main);">加入PACE 派思</div>
                <button class="modal-btn google" data-action="googleLogin"
                    style="box-shadow: 0 0.2cqw 0.125 rgba(0,0,0,0.05);">
                    <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right:0.5cqw;">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
                        <path fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
                    </svg>
                    Google 登入
                </button>
                <button data-action="toggleEmailFormBtn"
                    style="display: flex; align-items: center; justify-content: center; width: 100%; margin-bottom: 5cqw; background-color: white; border: 0.2cqw solid #e5e7eb; border-radius: 3cqw; padding: 3cqw 0; font-size: 5cqw; font-weight: 600; color: #374151; cursor: pointer; box-shadow: 0 0.5cqw 2cqw rgba(0,0,0,0.05);">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" style="margin-right:0.5cqw;">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    使用電子郵件登入
                </button>
                <div id="emailFormSection" class="email-form">
                    <div style="margin-bottom: 1cqw;">
                        <label for="loginEmail"
                            style="display:block; margin-bottom: 5cqw; font-size:5cqw; color:#6b7280; font-weight:700;">電子郵件</label>
                        <input type="email" id="loginEmail" placeholder="請輸入 Email" autocomplete="username"
                            style="width: 100%; box-sizing: border-box; padding: 2cqw; border:0.2cqw solid #e5e7eb; border-radius:2cqw; box-sizing:border-box; font-size:5cqw; background-color:#f9fafb; color: #111111;">
                    </div>
                    <div style="margin-bottom:10cqw;">
                        <label for="loginPassword"
                            style="display:block; margin-bottom:0.25cqw; font-size:5cqw; color:#6b7280; font-weight:500;">密碼</label>
                        <div style="position: relative; display: flex; align-items: center;">
                            <input type="password" id="loginPassword" placeholder="請輸入密碼"
                                autocomplete="current-password"
                                style="width: 100%; padding:0.25cqw 0.75cqw; border:0.2cqw solid #e5e7eb; border-radius:2cqw; box-sizing:border-box; font-size:5cqw; background-color:#f9fafb; color: #111111;">
                            <button type="button" data-action="togglePasswordVisibility"
                                style="position: absolute; right: 5cqw; background: none; border: none; cursor: pointer; font-size: 5cqw; padding: 0; color: #6b7280; z-index: 10;">👁️</button>
                        </div>
                    </div> <button data-action="emailLogin"
                        style="background-color: #059669; color: white; border: none; width: 100%; padding: 0.25cqw; border-radius: 0.5cqw; font-size: 5cqw; font-weight: 700; cursor: pointer; box-shadow: 0 0.25cqw 0.5cqw rgba(255, 255, 255, 0.15);">電子郵件登入
                        / 註冊</button>

                    style="margin-top: 0.5cqw; text-decoration: underline; cursor: pointer; display: block; text-align: center;">暫時返回</span>
            </div>
        </div>
    </div>
    <form id="newebpayForm" method="post" action="https://ccore.newebpay.com/MPG/mpg_gateway" style="display:none;">
        <input type="text" name="MerchantID" id="formMerchantID">
        <input type="text" name="TradeInfo" id="formTradeInfo">
        <input type="text" name="TradeSha" id="formTradeSha">
        <input type="text" name="Version" value="2.0">
    </form>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script type="module" src="app.js"></script>
    <script type="module">
        import { getCartData, modifyCartItemQty, areaData, authReady, app, auth, db, provider, currentStoreInfo, signInAnonymously, signInWithPopup, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword, collection, getDocs, doc, onSnapshot, getDoc, setDoc, updateDoc, addDoc, deleteDoc, query, where, serverTimestamp, orderBy, limit } from './app.js';
        let allStores = [];
        let buyerLat = null;
        let buyerLng = null;
        let currentBuyerAddress = "正在獲取定位中...";
        let finalTotalAmount = 0;
        let cartData = [];
        let currentPayType = "";
        let targetStoreId = "";
        let currentDiningType = "TAKE_OUT";
        // 藍新店家動態金鑰配置（預設為空，動態由 Firebase 覆蓋）
        let currentStoreNewebpay = {
            MerchantID: "",
            HashKey: "",
            HashIV: ""
        };
        const buyerNameInput = document.getElementById('buyerNameInput');
        const buyerPhoneInput = document.getElementById('buyerPhoneInput');
        // 🧠 1. 頁面初始化
        async function initCartPage() {
            // 🎯 卡住等待 Firebase 身份確認 (支援無登入無痛購物 / 匿名登入)
            const user = await authReady;
            if (user) {
                console.log("買家驗證已確認，UID:", user.uid, "是否為匿名登入:", user.isAnonymous);
                // 優先序：上次手動填寫的紀錄 > 雲端users檔案的真實資料
                const savedName = localStorage.getItem('pace_buyer_name');
                const savedPhone = localStorage.getItem('pace_buyer_phone');
                if (savedName) buyerNameInput.value = savedName;
                if (savedPhone) buyerPhoneInput.value = savedPhone;
                // 如果不是匿名登入，嘗試去撈雲端真實檔案
                if (!user.isAnonymous) {
                    try {
                        const userDoc = await getDoc(doc(db, "users", user.uid));
                        if (userDoc.exists()) {
                            const userData = userDoc.data();
                            if (userData.realName && !buyerNameInput.value) buyerNameInput.value = userData.realName;
                            if (userData.phone && !buyerPhoneInput.value) buyerPhoneInput.value = userData.phone;
                        }
                    } catch (err) {
                        console.error("讀取雲端用戶資料失敗，改用本地快取", err);
                    }
                }
            } else {
                console.log("買家尚未進入 Firebase Auth 狀態");
            }
            // 萬一完全沒資料，去撈臨時封存區備份
            if (!buyerNameInput.value) buyerNameInput.value = localStorage.getItem('temp_buyer_name') || '';
            if (!buyerPhoneInput.value) buyerPhoneInput.value = localStorage.getItem('temp_buyer_phone') || '';
            // 載入購物車與金流設定
            loadCartFromStorage();
            // 🎨 【UI 強制視覺雙校正】確保外帶自取預設亮起藍色
            const takeOutCheckDot = document.getElementById('takeOutCheckDot');
            if (takeOutCheckDot) {
                takeOutCheckDot.style.backgroundColor = "var(--brand-blue)";
            }
            const payOptCredit = document.getElementById('payOptCredit');
            const creditCheckDot = document.getElementById('creditCheckDot');
            if (payOptCredit && payOptCredit.classList.contains('selected') && creditCheckDot) {
                creditCheckDot.style.backgroundColor = "var(--brand-blue)";
            }
        }
        // 🛒 2. 從 localStorage 載入資料
        function loadCartFromStorage() {
            cartData = (typeof getCartData === 'function') ? getCartData() : (JSON.parse(localStorage.getItem('cart')) || JSON.parse(localStorage.getItem('pacetake_cart')) || []);
            if (cartData.length > 0) {
                targetStoreId = cartData[0].storeId || "";
            }
            renderCart();
        }
        // 🎨 3. 動態渲染明細與金額計算
        function renderCart() {
            const container = document.getElementById('cartItemsContainer');
            if (!container) return;
            // 🌟 關鍵修改：每次渲染都確保去抓「最新」的資料，而不是依賴舊的全域變數
            const currentCartData = getCartData();
            let totalQty = 0;
            if (currentCartData.length > 0) {
                const targetStoreId = currentCartData[0].storeId; // 從購物車抓出店家 ID
                const namePhoneContainer = document.querySelector('.NamePhone');
                // 檢查容器存在，且還沒塞過按鈕 (避免每次重繪重複塞入)
                if (namePhoneContainer && !document.getElementById('storeLinkBtn')) {
                    const storeLinkHtml = `
                            <div>
                                <a id="storeLinkBtn" href="store.html?storeId=${targetStoreId}" 
                                   style="display: inline-flex; align-items: center; gap: 1cqw; padding: 1cqw 3cqw; background: var(--theme-color, #ff6b6b); color: white; text-decoration: none; border-radius: 5cqw; font-size: 4cqw; font-weight: bold;">
                                   🏪 返回店家繼續選購
                                </a>
                            </div>`;
                    // 將這個連結按鈕，精準地插入到 📋 取餐聯絡資訊 的「最前面」
                    namePhoneContainer.insertAdjacentHTML('afterbegin', storeLinkHtml);
                }
            }
            if (currentCartData.length === 0) {
                container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 5cqw;">購物車是空的，快去首頁選購吧！</div>`;
                finalTotalAmount = 0; // 記得這裡如果是全域變數，要保持一致
                if (typeof updateBottomCartBadge === 'function') updateBottomCartBadge(0);
                return;
            }
            let html = '';
            let total = 0;
            currentCartData.forEach(item => {
                const itemPrice = parseInt(item.price) || 0;
                const itemQty = parseInt(item.quantity || item.qty) || 1;
                const subtotal = itemPrice * itemQty;
                total += subtotal;
                totalQty += itemQty;
                // 🌟 關鍵修改：加入 + - 按鈕的 UI 結構，並加上美化的排版
                html += `
                    <div class="bill-item" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 0.2cqw solid #eee; padding: 0.5cqw 0;">
                        <div style="flex: 1;">
                            <div class="item-name" style="font-weight: bold; font-size: 4cqw; color: var(--text-main);">${item.name}</div>
                        </div>
                        <div class="quantity-control-panel" style="display: flex; align-items: center; gap: 2cqw;">
                            <button class="minus-btn" data-id="${item.id}" style="width: 7cqw; height: 7cqw; border-radius: 1.5cqw; border: 0.2cqw solid #ddd; background: #fff; cursor: pointer;">-</button>
                            <span class="item-qty" style="width: 5cqw; text-align: center; font-weight: bold; font-size: 4cqw; color: var(--text-muted);">${itemQty}</span>
                            <button class="plus-btn" data-id="${item.id}" style="width: 7cqw; height: 7cqw; border-radius: 1.5cqw; border: 0.2cqw solid #ddd; background: #fff; cursor: pointer;">+</button>
                        </div>
                        <div style="width: 17.5cqw; text-align: right; font-weight: bold; color: #ff6b6b;">
                            $${subtotal}
                        </div>
                    </div>`;
            });
            finalTotalAmount = total;
            html += `
                            <div class="bill-total-row" style=" border-top: 0.5cqw solid #333; display: flex; justify-content: space-between; align-items: center; padding: 2cqw 0; color: var(--text-main);">
                                <span class="total-label" style=" font-size: 5cqw; font-weight: 800; color: var(--text-main);">總計金額</span>
                                <span class="total-amount" id="totalAmountText" style="font-size: 5cqw; color: #ff6b6b; font-weight: 800;">$${finalTotalAmount}</span>
                            </div>`;
            container.innerHTML = html;
            if (typeof updateBottomCartBadge === 'function') updateBottomCartBadge(totalQty);
            // 檢查並配置店家的金流與內用開關
            if (typeof targetStoreId !== 'undefined' && targetStoreId) {
                checkStorePaymentConfig(targetStoreId);
            } else if (typeof selectPayment === 'function') {
                selectPayment("CREDIT");
                initPaymentSelection(true, true);
            }
        }
        // 🎯 3. 在 renderCart 下方加入這個事件監聽器 (Event Delegation)
        const cartItemsContainer = document.getElementById('cartItemsContainer');
        if (cartItemsContainer) {
            cartItemsContainer.addEventListener('click', (e) => {
                // 只有點擊到含有 plus-btn 或 minus-btn 的目標才執行
                if (!e.target.matches('.plus-btn, .minus-btn')) return;
                const itemId = e.target.getAttribute('data-id');
                const isPlus = e.target.matches('.plus-btn');
                const delta = isPlus ? 1 : -1;
                // 1. 呼叫 app.js 的大腦，修改 LocalStorage 的數據
                modifyCartItemQty(itemId, delta);
                // 2. 數據改完後，直接重繪整個購物車清單（金額會自動重算！）
                renderCart();
            });
        }
        // 🔍 4. 從雲端資料庫動態撈取商家的支付與內用權限
        async function checkStorePaymentConfig(storeId) {
            const payOptCredit = document.getElementById('payOptCredit');
            const creditText = document.getElementById('creditText');
            const creditNoticeText = document.getElementById('creditNoticeText');
            const payOptCash = document.getElementById('payOptCash');
            const cashText = document.getElementById('cashText');
            const cashNoticeText = document.getElementById('cashNoticeText');
            const dineOptTakeOut = document.getElementById('dineOptTakeOut');
            const dineOptDineIn = document.getElementById('dineOptDineIn');
            const dineInText = document.getElementById('dineInText');
            const dineInNoticeText = document.getElementById('dineInNoticeText');
            if (!payOptCredit || !payOptCash) return;
            try {
                const storeDoc = await getDoc(doc(db, "stores", storeId));
                let isCreditAllowed = true;
                let isCashAllowed = false;
                let isDineInAllowed = true;
                if (storeDoc.exists()) {
                    const storeData = storeDoc.data();
                    window.currentStoreCheckoutInfo = {
                        shopName: storeData.shopName || storeData.name || '未知店家',
                        shopLat: storeData.shopLat || storeData.lat,
                        shopLng: storeData.shopLng || storeData.lng
                    };
                    if (storeData.isOnlinePayEnabled !== undefined) isCreditAllowed = storeData.isOnlinePayEnabled;
                    if (storeData.isCashPayEnabled !== undefined) isCashAllowed = storeData.isCashPayEnabled;
                    // 覆蓋動態金鑰
                    currentStoreNewebpay.MerchantID = storeData.MerchantID || "";
                    currentStoreNewebpay.HashKey = storeData.HashKey || "";
                    currentStoreNewebpay.HashIV = storeData.HashIV || "";

                    if (storeData.hasSeating !== undefined) isDineInAllowed = storeData.hasSeating;
                }
                // 線上支付 UI 渲染
                if (isCreditAllowed) {
                    payOptCredit.style.pointerEvents = "auto";
                    payOptCredit.style.cursor = "pointer";
                    payOptCredit.style.opacity = "1";
                    payOptCredit.style.filter = "none";
                    if (creditText) creditText.style.color = "var(--text-main)";
                    if (creditNoticeText) creditNoticeText.style.display = "none";
                } else {
                    payOptCredit.style.pointerEvents = "none";
                    payOptCredit.style.opacity = "0.35";
                    payOptCredit.style.filter = "grayscale(1)";
                    if (creditText) creditText.style.color = "var(--text-muted)";
                    if (creditNoticeText) creditNoticeText.style.display = "flex";
                }
                // 現金付款 UI 渲染
                if (isCashAllowed) {
                    payOptCash.style.pointerEvents = "auto";
                    payOptCash.style.cursor = "pointer";
                    payOptCash.style.opacity = "1";
                    payOptCash.style.filter = "none";
                    if (cashText) cashText.style.color = "var(--text-main)";
                    if (cashNoticeText) cashNoticeText.style.display = "none";
                } else {
                    payOptCash.style.pointerEvents = "none";
                    payOptCash.style.opacity = "0.35";
                    payOptCash.style.filter = "grayscale(1)";
                    if (cashText) cashText.style.color = "var(--text-muted)";
                    if (cashNoticeText) cashNoticeText.style.display = "flex";
                }
                // 店內內用 UI 渲染
                if (dineOptDineIn) {
                    if (isDineInAllowed) {
                        dineOptDineIn.style.pointerEvents = "auto";
                        dineOptDineIn.style.cursor = "pointer";
                        dineOptDineIn.style.opacity = "1";
                        dineOptDineIn.style.filter = "none";
                        if (dineInText) dineInText.style.color = "var(--text-main)";
                        if (dineInNoticeText) dineInNoticeText.style.display = "none";
                    } else {
                        dineOptDineIn.style.pointerEvents = "none";
                        dineOptDineIn.style.opacity = "0.35";
                        dineOptDineIn.style.filter = "grayscale(1)";
                        if (dineInText) dineInText.style.color = "var(--text-muted)";
                        if (dineInNoticeText) dineInNoticeText.style.display = "flex";

                        if (typeof currentDiningType !== 'undefined') currentDiningType = "TAKE_OUT";
                        if (dineOptTakeOut) dineOptTakeOut.classList.add('selected');
                        dineOptDineIn.classList.remove('selected');
                    }
                }
                // 預設點亮選取
                if (isCreditAllowed) {
                    selectPayment("CREDIT");
                } else if (isCashAllowed) {
                    selectPayment("CASH");
                } else {
                    const submitBtn = document.getElementById('submitOrderBtn');
                    if (submitBtn) {
                        submitBtn.disabled = true;
                        submitBtn.innerHTML = "<span>⚠️ 該店家不支援任何支付方式</span>";
                    }
                }
                // 重新刷新點擊事件監聽器
                initPaymentSelection(isCreditAllowed, isCashAllowed);
                initDiningSelection(isDineInAllowed);
            } catch (err) {
                console.error("金流與用餐讀取失敗，採用預設值", err);
                selectPayment("CREDIT");
                initPaymentSelection(true, true);
            }
        }
        function initDiningSelection(isDineInAllowed) {
            const dineOptTakeOut = document.getElementById('dineOptTakeOut');
            const dineOptDineIn = document.getElementById('dineOptDineIn');
            const takeOutCheckDot = document.getElementById('takeOutCheckDot');
            const dineInCheckDot = document.getElementById('dineInCheckDot');
            if (!dineOptTakeOut || !dineOptDineIn) return;
            dineOptTakeOut.onclick = function () {
                currentDiningType = "TAKE_OUT";
                dineOptTakeOut.classList.add('selected');
                dineOptDineIn.classList.remove('selected');
                if (takeOutCheckDot) takeOutCheckDot.style.backgroundColor = "var(--brand-blue)";
                if (dineInCheckDot) dineInCheckDot.style.backgroundColor = "transparent";
                if (dineInCheckDot) dineInCheckDot.style.border = "0.2cqw solid var(--border-color)";
            };
            if (isDineInAllowed) {
                dineOptDineIn.onclick = function () {
                    currentDiningType = "DINE_IN";
                    dineOptDineIn.classList.add('selected');
                    dineOptTakeOut.classList.remove('selected');
                    if (dineInCheckDot) dineInCheckDot.style.backgroundColor = "var(--brand-blue)";
                    if (dineInCheckDot) dineInCheckDot.style.border = "none";
                    if (takeOutCheckDot) takeOutCheckDot.style.backgroundColor = "transparent";
                };
            }
        }
        function initPaymentSelection(isCreditAllowed, isCashAllowed) {
            const creditOpt = document.getElementById('payOptCredit');
            const cashOpt = document.getElementById('payOptCash');
            if (isCreditAllowed && creditOpt) creditOpt.onclick = () => selectPayment("CREDIT");
            if (isCashAllowed && cashOpt) cashOpt.onclick = () => selectPayment("CASH");
        }
        function selectPayment(type) {
            currentPayType = type;
            const creditDot = document.getElementById('creditCheckDot');
            const cashDot = document.getElementById('cashCheckDot');
            const creditOpt = document.getElementById('payOptCredit');
            const cashOpt = document.getElementById('payOptCash');
            const submitBtn = document.getElementById('submitOrderBtn');
            if (!submitBtn) return;
            if (type === "CREDIT") {
                if (creditOpt) creditOpt.classList.add('selected');
                if (cashOpt) cashOpt.classList.remove('selected');
                if (creditDot) { creditDot.style.backgroundColor = "var(--brand-blue)"; creditDot.style.border = "none"; }
                if (cashDot) { cashDot.style.backgroundColor = "transparent"; cashDot.style.border = "0.2cqw solid var(--border-color)"; }
                submitBtn.innerHTML = `<span>🚀 前往線上支付</span>`;
            } else {
                if (cashOpt) cashOpt.classList.add('selected');
                if (creditOpt) creditOpt.classList.remove('selected');
                if (cashDot) { cashDot.style.backgroundColor = "var(--brand-blue)"; cashDot.style.border = "none"; }
                if (creditDot) { creditDot.style.backgroundColor = "transparent"; creditDot.style.border = "0.2cqw solid var(--border-color)"; }
                submitBtn.innerHTML = `<span>🚀 送出訂單</span>`;
            }
        }
        // 主題設置
        document.documentElement.setAttribute('data-theme', localStorage.getItem('pacetake-theme') || 'light');
        // 🛠️ 5. 藍新加密演算法核心
        function encryptAES(parameterString, key, iv) {
            const cryptoKey = CryptoJS.enc.Utf8.parse(key);
            const cryptoIv = CryptoJS.enc.Utf8.parse(iv);
            // 先將原始字串明確轉為 UTF-8，避免中文加密後爛掉
            const plainText = CryptoJS.enc.Utf8.parse(parameterString);
            const encrypted = CryptoJS.AES.encrypt(plainText, cryptoKey, {
                iv: cryptoIv,
                mode: CryptoJS.mode.CBC,
                padding: CryptoJS.pad.Pkcs7
            });
            // 藍新規定必須轉為 Hex 字串 (小寫/大寫皆可，CryptoJS 預設小寫)
            return encrypted.ciphertext.toString(CryptoJS.enc.Hex);
        }
        function hashSHA256(aesString, key, iv) {
            const readyString = `HashKey=${key}&${aesString}&HashIV=${iv}`;
            return CryptoJS.SHA256(readyString).toString(CryptoJS.enc.Hex).toUpperCase();
        }
        // 🚀 6. 按下巨大結帳按鈕 (雙軌分流送單)
        const submitOrderBtn = document.getElementById('submitOrderBtn');
        if (submitOrderBtn) {
            submitOrderBtn.addEventListener('click', async () => {
                // 1. 基本資料與購物車驗證 (保留你的原貌)
                const freshCartData = getCartData();
                const buyerName = buyerNameInput.value.trim();
                const buyerPhone = buyerPhoneInput.value.trim();
                const phoneRegex = /^09\d{8}$/;
                if (!buyerName || !phoneRegex.test(buyerPhone)) {
                    alert("⚠️ 請填寫正確的取貨人姓名與台灣手機號碼(10碼數字)喔！");
                    return;
                }
                if (cartData.length === 0) {
                    alert("您的購物車是空的，無法為您建立任何付款連線。");
                    return;
                }
                // ==========================================
                // 🌟 新增防呆：在這裡跳出確認燈箱
                // ==========================================
                const confirmResult = await Swal.fire({
                    title: '確認送出訂單？',
                    text: '請確認餐點內容與金額無誤，送出後店家就會開始準備囉！',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#3085d6',
                    cancelButtonColor: '#d33',
                    confirmButtonText: '確認送出',
                    cancelButtonText: '我再想想',
                    reverseButtons: true
                });
                // 如果客人沒有按「確認送出」（例如按了取消或點旁邊關閉），就直接中斷，不要往下跑
                if (!confirmResult.isConfirmed) {
                    return;
                }
                // 2. 以下完全是你的原本邏輯，我一行都沒改！
                // 🌟 【免登入/匿名無痛結帳升級】：完全拔除未登入攔截與強制跳轉
                const user = auth.currentUser;
                // 本地快取記錄，方便下次自動帶入
                localStorage.setItem('pace_buyer_name', buyerName);
                localStorage.setItem('pace_buyer_phone', buyerPhone);
                const timeStamp = Math.floor(Date.now() / 1000);
                const orderMerchantOrderNo = "PACE_" + timeStamp;
                // 如果使用者存在且非匿名，才將資料回寫雲端 users 集合
                if (user && !user.isAnonymous) {
                    try {
                        await setDoc(doc(db, "users", user.uid), {
                            realName: buyerName,
                            phone: buyerPhone,
                            updatedAt: new Date().toISOString()
                        }, { merge: true });
                    } catch (e) { console.error("同步會員姓名失敗", e); }
                }
                const pickupNo = orderMerchantOrderNo.slice(-3);
                const remarkElement = document.getElementById('Remarkinput');
                const tableNumber = document.getElementById('dineInTable');
                const orderRemark = remarkElement ? remarkElement.value.trim() : "";
                const tableRemark = tableNumber ? tableNumber.value.trim() : "";
                // --- 🛡️ 雙軌分流核心 ---
                if (currentPayType === "CASH") {
                    // 💵 A 分支：現場付現流程
                    try {
                        await addDoc(collection(db, "orders"), {
                            orderId: orderMerchantOrderNo,
                            pickupNo: pickupNo,
                            storeId: targetStoreId,
                            shopName: window.currentStoreCheckoutInfo?.shopName || '未知店家',
                            shopLat: window.currentStoreCheckoutInfo?.shopLat || null,
                            shopLng: window.currentStoreCheckoutInfo?.shopLng || null,
                            buyerUid: user ? user.uid : "ANONYMOUS",
                            buyerName: buyerName,
                            buyerPhone: buyerPhone,
                            items: freshCartData,
                            totalAmount: finalTotalAmount,
                            remark: orderRemark,
                            status: "PREPARING",
                            paymentMethod: "CASH",
                            paymentStatus: "UNPAID",
                            diningType: currentDiningType,
                            table: tableRemark,
                            cancelReason: "",
                            cancelledAt: null,
                            refundedAt: null,
                            createdAt: serverTimestamp()
                        });
                        // 這是你本來就做好的漂亮成功燈箱
                        Swal.fire({
                            title: '🎉 訂單送出成功！',
                            html: `您的取餐號碼為：<br><h1 style="color: #ff6b6b;">🔥 ${pickupNo} 🔥</h1><br>請憑此號碼到店取餐。`,
                            icon: 'success',
                            confirmButtonText: '收到',
                            confirmButtonColor: '#3085d6'
                        }).then((result) => {
                            if (result.isConfirmed) {
                                // 清空購物車
                                localStorage.removeItem('cart');
                                localStorage.removeItem('pacetake_cart');
                                localStorage.removeItem('temp_buyer_name');
                                localStorage.removeItem('temp_buyer_phone');
                                // 跳轉頁面
                                window.location.href = "orders.html";
                            }
                        });
                    } catch (cashErr) {
                        alert("現場付現單上傳雲端失敗：" + cashErr.message);
                    }
                } else {
                    // 💳 B 分支：線上刷卡流程 (啟動藍新金流連線)
                    if (!currentStoreNewebpay.MerchantID || !currentStoreNewebpay.HashKey || !currentStoreNewebpay.HashIV) {
                        alert("⚠️ 系統提示：該店家尚未配置線上金流參數，請聯繫店家或改用現場付現。");
                        return;
                    }
                    const itemNames = freshCartData.map(i => i.name).join('、');
                    const timeStamp = Math.round(Date.now() / 1000);
                    const originalParameters = [
                        `MerchantID=${currentStoreNewebpay.MerchantID}`,
                        `RespondType=JSON`,
                        `TimeStamp=${timeStamp}`,
                        `Version=2.0`,
                        `MerchantOrderNo=${orderMerchantOrderNo}`,
                        `Amt=${finalTotalAmount}`,
                        `ItemDesc=派思點餐:${itemNames.substring(0, 20)}`,
                        `Email=${(user && user.email) ? user.email : 'buyer@pacetake.tw'}`,
                        `LoginType=0`,
                        `CREDIT=1`,
                        `ANDROIDPAY=1`,
                        `SAMPAY=1`,
                        `VACC=1`,
                        `CVS=1`,
                        `ReturnURL=https://us-central1-pacetake-c6e1e.cloudfunctions.net/newebpayReturn`,
                        `NotifyURL=https://newebpaynotify-zyqaicumra-uc.a.run.app`
                    ].join('&');
                    try {
                        await addDoc(collection(db, "orders"), {
                            orderId: orderMerchantOrderNo,
                            pickupNo: pickupNo,
                            storeId: targetStoreId,
                            shopName: window.currentStoreCheckoutInfo?.shopName || '未知店家',
                            shopLat: window.currentStoreCheckoutInfo?.shopLat || null,
                            shopLng: window.currentStoreCheckoutInfo?.shopLng || null,
                            buyerUid: user ? user.uid : "ANONYMOUS",
                            buyerName: buyerName,
                            buyerPhone: buyerPhone,
                            items: freshCartData,
                            totalAmount: finalTotalAmount,
                            remark: orderRemark,
                            status: "PREPARING",
                            paymentMethod: "CREDIT",
                            paymentStatus: "UNPAID",
                            diningType: currentDiningType,
                            table: tableRemark,
                            cancelReason: "",
                            cancelledAt: null,
                            refundedAt: null,
                            createdAt: serverTimestamp()
                        });
                        // 清空購物車
                        localStorage.removeItem('cart');
                        localStorage.removeItem('pacetake_cart');
                        localStorage.removeItem('temp_buyer_name');
                        localStorage.removeItem('temp_buyer_phone');
                        // 執行藍新雙重高階加密演算法
                        const tradeInfo = encryptAES(
                            originalParameters,
                            currentStoreNewebpay.HashKey,
                            currentStoreNewebpay.HashIV
                        );
                        const tradeSha = hashSHA256(
                            tradeInfo,
                            currentStoreNewebpay.HashKey,
                            currentStoreNewebpay.HashIV
                        );
                        document.getElementById('formMerchantID').value = currentStoreNewebpay.MerchantID;
                        document.getElementById('formTradeInfo').value = tradeInfo;
                        document.getElementById('formTradeSha').value = tradeSha;
                        alert(`🛒 安全連線建立成功！\n即將為您導向藍新加密金流，請於頁面完成付款。`);
                        document.getElementById('newebpayForm').submit();
                    } catch (err) {
                        alert("藍新安全加密防線建立失敗：" + err.message);
                    }
                }
            });
        }
        // 執行初始化
        document.addEventListener('DOMContentLoaded', () => {
            initCartPage();
            console.log("系統初始化完成");
        });
        window.loadCartFromStorage = loadCartFromStorage;
        window.selectPayment = selectPayment;
    </script>
</body>
