<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PACE 派思 pacetake.tw - 買家首頁</title>
    <!-- Favicon & Apple Touch Icon -->
    <link rel="icon" type="image/png" href="png/logoapple.png" sizes="180x180">
    <link rel="apple-touch-icon" href="png/logoapple.png">
    <link rel="apple-touch-icon" sizes="180x180" href="png/logoapple.png">
    <link rel="apple-touch-icon-precomposed" href="png/logoapple.png">
    <link rel="stylesheet" href="style.css">
    <style>
        .history-list {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .history-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .store-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
        }

        .order-date {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .card-mid {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 8px;
            border-top: 1px dashed var(--border-color);
        }

        .total-amount {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-main);
        }

        .reorder-btn {
            background-color: var(--bg-global);
            border: 1px solid var(--border-color);
            color: var(--brand-blue);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.1s ease;
        }

        .reorder-btn:active {
            transform: scale(0.95);
            background-color: rgba(0, 102, 255, 0.05);
        }
    </style>
</head>

<body>

    <div class="phone-wrapper">
        <div id="buyerView" style="display: block;">
            <header class="header">
                <div class="pace-logo">
                    <a href="index.html" class="logo-link">
                        <img src="png/pace3.png" alt="派思 官方網站">
                    </a>
                    <div class="pace-avatar-icon">
                        <span id="defaultIcon" class="avatar-icon">👤</span>
                        <img id="userAvatarImg" src=""
                            style="display: none; border-radius: 50%;height: 13cqw; width: 13cqw;">
                    </div>
                </div>
                <div class="two">
                    <div class="pace">
                        <button class="theme-toggle" id="themeToggleBtn" aria-label="切換主題">🌙</button>
                        <span>店內價外帶自取/點餐系統</span>
                    </div>
                    <button class="login-btn" id="loginBtn">登入/註冊</button>
                    <button class="user-avatar-btn" id="avatarBtn" style="display: none;">
                        <span class="user-name" id="userNameDisplay"></span></button>
                    <div class="dropdown-menu" id="dropdownMenu"></div>
                </div>
            </header>

            <main class="history-list">
                <!-- 紀錄 1 -->
                <div class="history-card">
                    <div class="card-top">
                        <span class="store-title">池上木盒便當 - 信義店</span>
                        <span class="order-date">2026/05/22</span>
                    </div>
                    <div class="card-mid">
                        招牌木盒便當 x2、酥炸大雞腿便當 x1
                    </div>
                    <div class="card-bottom">
                        <span class="total-amount">實付金額：$375</span>
                        <a href="store.html" class="reorder-btn nav-fast">🔁 再點一次</a>
                    </div>
                </div>

                <!-- 紀錄 2 -->
                <div class="history-card">
                    <div class="card-top">
                        <span class="store-title">大苑子茶飲 - 數位站</span>
                        <span class="order-date">2026/05/18</span>
                    </div>
                    <div class="card-mid">
                        高山青茶(去冰微糖) x2、翡翠檸檬 x1
                    </div>
                    <div class="card-bottom">
                        <span class="total-amount">實付金額：$165</span>
                        <a href="store.html" class="reorder-btn nav-fast">🔁 再點一次</a>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script type="module">
        import { db, auth } from './js/app.js';
        import { doc, getDoc, setDoc, addDoc, collection } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getCartData } from './js/cart-manager.js';
        function bindFastClick(element, callback) {
            if (!element) return;
            let triggered = false;
            function trigger(e) {
                if (!triggered) {
                    triggered = true;
                    setTimeout(() => { triggered = false; }, 300);
                    callback(e);
                }
                e.preventDefault();
            }
            element.addEventListener('touchstart', trigger, { passive: false });
            element.addEventListener('mousedown', trigger);
        }

        const themeToggleBtn = document.getElementById('themeToggleBtn');
        function initTheme() {
            const savedTheme = localStorage.getItem('pacetake-theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        }
        bindFastClick(themeToggleBtn, () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('pacetake-theme', newTheme);
        });
        initTheme();

        const navElements = document.querySelectorAll('.nav-fast');
        navElements.forEach(elem => {
            bindFastClick(elem, () => {
                const dest = elem.getAttribute('href');
                if (dest && dest !== '#') { window.location.href = dest; }
            });
        });
    </script>
</body>

</html>
