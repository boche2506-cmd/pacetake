<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PACE 派思 pacetake.tw - 買家首頁</title>
    <!-- PWA 配置 -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#ffffff">
    <!-- 一般網頁分頁圖示 -->
    <link rel="icon" type="image/png" href="png/logo192.png" sizes="192x192">
    <!-- iPhone 桌面圖示專用（已修改為 180x180 正方形） -->
    <link rel="apple-touch-icon" href="png/logo180.png">
    <link rel="stylesheet" href="style.css">
    <style>
        .history {
            height: 3%;
            max-width: 100%;
            font-size: 6cqw;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.1;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }

        .history-list {
            height: 55%;
            max-width: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5cqw;
            /* 卡片與卡片之間的間距改用 cqw */
            padding: 1cqw;
            /* 微調右邊 padding，留出空間給滾動條，卡片才不會黏在一起 */
            box-sizing: border-box;
            /* 隱藏 Firefox 的卷軸 */
            scrollbar-width: none;
            /* 確保內容依然可以滑動 */
            -ms-overflow-style: none;
            /* 隱藏 Chrome, Safari, Edge 的卷軸 */
        }

        .history-list::-webkit-scrollbar {
            /* Chrome, Safari 隱藏軸線 */
            display: none;
        }

        .history-login {
            height: 30%;
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .submit-order-btn {
            height: 95%;
            width: 90%;
            background-color: var(--brand-blue);
            color: white;
            border: none;
            padding: 4cqw;
            border-radius: 3.5cqw;
            font-size: 4cqw;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 1cqw 3cqw rgba(0, 102, 255, 0.15);
            transition: all 0.15s ease;
        }

        .loginBtn:active {
            transform: scale(0.98);
        }

        .history-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .store-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
        }

        .order-date {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .card-mid {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 8px;
            border-top: 1px dashed var(--border-color);
        }

        .total-amount {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-main);
        }

        .reorder-btn {
            background-color: var(--bg-global);
            border: 1px solid var(--border-color);
            color: var(--brand-blue);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.1s ease;
        }

        .reorder-btn:active {
            transform: scale(0.95);
            background-color: rgba(0, 102, 255, 0.05);
        }
    </style>
</head>

<body>
    <div class="phone-wrapper">
        <div id="buyerView" style="display: block;">
            <header class="header">
                <div class="pace-logo">
                    <a href="index.html" class="logo-link">
                        <img src="png/pace3.png" alt="派思 官方網站">
                    </a>
                    <div class="avatar-container">
                        <span id="defaultIcon">👤</span>
                        <img id="userAvatarImg" src=""
                            style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;"
                            onerror="this.style.display='none'; document.getElementById('defaultIcon').style.display='block';">
                    </div>
                </div>
                <div class="two">
                    <div class="pace">
                        <button class="theme-toggle" id="themeToggleBtn" aria-label="切換主題">🌙</button>
                        <span>店內價外帶自取/點餐系統</span>
                    </div>
                    <div class="avatarBtnMenu" data-action="avatarBtnMenu">
                        <span class="user-name" id="userNameDisplay"></span>
                        <div class="dropdown-menu" id="dropdownMenu"></div>
                    </div>
                </div>
            </header>
            <div class="history"><span>⏳ 歷史訂單</span></div>
            <main class="history-list" id="historylist"></main>
            <div class="history-login">
            </div>
        </div>
        <div class="lightbox-modal" id="loginLightbox" style="display: none;">
            <div class="modal-card">
                <div class="modal-title" style=" font-weight: 600; color: var(--text-main);">加入PACE 派思</div>
                <button class="modal-btn google" data-action="googleLogin"
                    style="box-shadow: 0 0.2cqw 0.125 rgba(0,0,0,0.05);">
                    <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right:0.5cqw;">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
                        <path fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
                    </svg>
                    Google 登入
                </button>
                <button data-action="toggleEmailFormBtn"
                    style="display: flex; align-items: center; justify-content: center; width: 100%; margin-bottom: 5cqw; background-color: white; border: 0.2cqw solid #e5e7eb; border-radius: 3cqw; padding: 3cqw 0; font-size: 5cqw; font-weight: 600; color: #374151; cursor: pointer; box-shadow: 0 0.5cqw 2cqw rgba(0,0,0,0.05);">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" style="margin-right:0.5cqw;">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    使用電子郵件登入
                </button>
                <div id="emailFormSection" class="email-form">
                    <div style="margin-bottom: 1cqw;">
                        <label for="loginEmail"
                            style="display:block; margin-bottom: 5cqw; font-size:5cqw; color:#6b7280; font-weight:700;">電子郵件</label>
                        <input type="email" id="loginEmail" placeholder="請輸入 Email" autocomplete="username"
                            style="width: 100%; box-sizing: border-box; padding: 2cqw; border:0.2cqw solid #e5e7eb; border-radius:2cqw; box-sizing:border-box; font-size:5cqw; background-color:#f9fafb; color: #111111;">
                    </div>
                    <div style="margin-bottom:10cqw;">
                        <label for="loginPassword"
                            style="display:block; margin-bottom:0.25cqw; font-size:5cqw; color:#6b7280; font-weight:500;">密碼</label>
                        <div style="position: relative; display: flex; align-items: center;">
                            <input type="password" id="loginPassword" placeholder="請輸入密碼"
                                autocomplete="current-password"
                                style="width: 100%; padding:0.25cqw 0.75cqw; border:0.2cqw solid #e5e7eb; border-radius:2cqw; box-sizing:border-box; font-size:5cqw; background-color:#f9fafb; color: #111111;">
                            <button type="button" data-action="togglePasswordVisibility"
                                style="position: absolute; right: 5cqw; background: none; border: none; cursor: pointer; font-size: 5cqw; padding: 0; color: #6b7280; z-index: 10;">👁️</button>
                        </div>
                    </div> <button data-action="emailLogin"
                        style="background-color: #059669; color: white; border: none; width: 100%; padding: 0.25cqw; border-radius: 0.5cqw; font-size: 5cqw; font-weight: 700; cursor: pointer; box-shadow: 0 0.25cqw 0.5cqw rgba(255, 255, 255, 0.15);">電子郵件登入
                        / 註冊</button>
                </div><span class="modal-close" data-action="customReturnBtn"
                    style="margin-top: 0.5cqw; text-decoration: underline; cursor: pointer; display: block; text-align: center;">暫時返回</span>
            </div>
        </div>
    </div>
    <script type="module" src="app.js"></script>
    <script type="module">
        import { getCartData, modifyCartItemQty, areaData, authReady, app, auth, db, provider, currentStoreInfo, signInAnonymously, signInWithPopup, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword, collection, getDocs, doc, onSnapshot, getDoc, setDoc, updateDoc, addDoc, deleteDoc, query, where, serverTimestamp, orderBy, limit } from './app.js';
        let allStores = [];
        let buyerLat = null;
        let buyerLng = null;
        let currentBuyerAddress = "正在獲取定位中...";
        let finalTotalAmount = 0;
        let cartData = [];
        let currentPayType = "";
        let targetStoreId = "";
        let currentDiningType = "TAKE_OUT";
        // 藍新店家動態金鑰配置（預設為空，動態由 Firebase 覆蓋）
        let currentStoreNewebpay = {
            MerchantID: "",
            HashKey: "",
            HashIV: ""
        };
        async function renderHistoryOrders() {
            const user = await authReady;
            const historyContainer = document.getElementById('historylist');
            if (!historyContainer) return;
            if (!user) {
                historyContainer.innerHTML = `
                        <div style="text-align:center; padding: 10cqw;">
                            <p>您尚未登入</p>
                            <button onclick="window.location.href='login.html'" style="padding: 2cqw 5cqw;">前往登入/註冊</button>
                        </div>`;
                return;
            }
            if (user.isAnonymous) {
                historyContainer.innerHTML = `
                        <div style="text-align:center; padding: 5cqw; border: 0.2cqw dashed #ccc; border-radius: 4cqw; margin-bottom: 4cqw;">
                            <p style="font-size: 4cqw; font-weight: bold; margin-bottom: 2cqw;">⚠️ 您目前使用匿名身份</p>
                            <p style="font-size: 3.5cqw; color: #666; margin-bottom: 4cqw;">
                                匿名訂單僅在此裝置有效。<br>
                                建議您<b>綁定帳號</b>以永久保存您的歷史紀錄喔！
                            </p>
                            <button class="loginBtn" data-action="loginBtn" 
                                style="display: block; width: 80%; margin: 0 auto; padding: 3cqw; background: var(--brand-green); color: white; border-radius: 3cqw; border: none; font-size: 4cqw; font-weight: bold; cursor: pointer;">
                               🔐 立即綁定 / 登入帳號
                            </button>
                        </div>
                        <div id="historyListContainer"></div> `;
                // 之後再繼續執行 renderHistoryOrders 的列表渲染邏輯...
            }
            try {
                // 1. 抓取該用戶的訂單，按時間排序
                const q = query(
                    collection(db, "orders"),
                    where("buyerUid", "==", user.uid),
                    orderBy("createdAt", "desc")
                );

                const snapshot = await getDocs(q);

                if (snapshot.empty) {
                    historyContainer.innerHTML = '<div style="text-align:center; padding: 5cqw;">📜 目前還沒有歷史訂單紀錄喔！</div>';
                    return;
                }

                historyContainer.innerHTML = ""; // 清空容器

                snapshot.forEach((doc) => {
                    const order = doc.data();
                    const card = createOrderCard(order, doc.id); // 傳入 doc.id 以便後續導向
                    historyContainer.appendChild(card);
                });

            } catch (error) {
                console.error("讀取歷史訂單失敗:", error);
                historyContainer.innerHTML = '<p style="text-align:center;">載入失敗，請稍後再試。</p>';
            }
        }

        function createOrderCard(order, orderId) {
            // 格式化日期
            const date = order.createdAt ? order.createdAt.toDate().toLocaleDateString('zh-TW') : "未知時間";

            // 狀態處理
            const statusMap = {
                "PREPARING": { text: "⏱️ 製作中", color: "#e67e22" },
                "COMPLETED": { text: "✅ 已完成", color: "#2ecc71" },
                "PENDING_PAYMENT": { text: "⏳ 待付款", color: "#9b59b6" }
            };
            const status = statusMap[order.status] || { text: "未知狀態", color: "#95a5a6" };

            const card = document.createElement('a');
            // 點擊後跳轉到 orders.html 並帶上訂單 ID
            card.href = `orders.html?orderId=${orderId}`;
            card.className = 'history-card';
            card.style.cssText = "display: block; text-decoration: none; color: inherit; padding: 4cqw; border-bottom: 0.2cqw solid #eee; background: white;";

            card.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2cqw;">
                        <span style="font-weight: 800; font-size: 4.5cqw;">${order.shopName || '未知店家'}</span>
                        <span style="font-size: 3.5cqw; color: ${status.color}; font-weight: bold;">${status.text}</span>
                    </div>
                   <div style="font-size: 3.5cqw; color: #888;">日期：${date} | 編號：#${order.pickupNo || '---'}</div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 2cqw;">
                        <span style="font-size: 3.5cqw; color: var(--text-muted);">
                            ${order.items.slice(0, 2).map(i => i.name).join('、')}${order.items.length > 2 ? '...' : ''}
                        </span>
                        <span style="font-size: 4cqw; font-weight: bold; color: #ff6b6b;">$${order.totalAmount}</span>
                    </div>`;
            return card;
        }
        document.addEventListener('DOMContentLoaded', () => {
            renderHistoryOrders();
            console.log("系統初始化完成");
        });

    </script>
</body>

</html>
