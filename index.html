<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PACE 派思 - 店內價預約外帶自取/內用點單系統</title>
    <script src="https://google.com" async defer></script>
    <style>
        :root { --brand-blue: #007AFF; --bg-white: #ffffff; --text-dark: #111111; --text-gray: #8E8E93; --bg-light: #F2F2F7; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-white); color: var(--text-dark); margin: 0; padding: 0; }
        .app-container { max-width: 450px; margin: 0 auto; padding-bottom: 90px; }
        header { padding: 40px 24px 16px 24px; display: flex; justify-content: space-between; align-items: flex-start; }
        .header-left h1 { font-size: 32px; font-weight: 900; margin: 0; letter-spacing: -0.5px; }
        .header-left p { font-size: 13px; color: var(--text-gray); margin: 4px 0 0 0; font-weight: 500; }
        .auth-container { margin-top: 6px; }
        .login-btn { background-color: var(--bg-light); color: var(--text-dark); border: none; padding: 8px 14px; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .user-profile { display: none; align-items: center; gap: 8px; cursor: pointer; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid #E5E5EA; }
        .search-container { padding: 0 24px 16px 24px; }
        .search-bar { width: 100%; padding: 12px 16px; background-color: var(--bg-light); border: none; border-radius: 12px; font-size: 15px; box-sizing: border-box; outline: none; }
        .category-slider { display: flex; overflow-x: auto; padding: 0 24px 20px 24px; gap: 8px; }
        .category-slider::-webkit-scrollbar { display: none; }
        .cat-btn { padding: 8px 16px; border-radius: 20px; border: none; background-color: var(--bg-light); color: #555555; font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer; transition: all 0.2s; }
        .cat-btn.active { background-color: var(--brand-blue); color: white; transform: scale(0.96); }
        .store-section { padding: 0 24px; }
        .section-title { font-size: 12px; font-weight: 700; color: var(--text-gray); margin-bottom: 12px; }
        .store-card { display: flex; align-items: center; gap: 16px; padding: 12px 0; border-bottom: 1px solid #F2F2F7; cursor: pointer; }
        .store-img { width: 72px; height: 72px; border-radius: 14px; background-color: var(--bg-light); flex-shrink: 0; object-fit: cover; }
        .store-info { display: flex; flex-direction: column; flex: 1; min-width: 0; }
        .store-name { font-size: 16px; font-weight: 700; margin: 0 0 4px 0; }
        .store-meta { font-size: 13px; color: var(--text-gray); margin: 0 0 6px 0; }
        .store-time-tag { align-self: flex-start; font-size: 11px; font-weight: 700; color: #48484A; background-color: var(--bg-light); padding: 3px 8px; border-radius: 6px; }
        .floating-footer { position: fixed; bottom: 0; left: 0; right: 0; max-width: 450px; margin: 0 auto; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid rgba(0, 0, 0, 0.05); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; z-index: 100; }
        .status-text { font-size: 13px; font-weight: 500; }
        .cart-btn { background-color: var(--brand-blue); color: white; border: none; padding: 10px 20px; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
<div id="g_id_onload" data-client_id="YOUR_GOOGLE_CLIENT_ID" data-callback="handleCredentialResponse" data-auto_prompt="false"></div>
<div class="app-container">
    <header>
        <div class="header-left"><h1>PACE 派思</h1><p>店內價預約外帶自取/內用點單系統</p></div>
        <div class="auth-container">
            <button class="login-btn" id="loginBtn" onclick="triggerGoogleLogin()">註冊 / 登入</button>
            <div class="user-profile" id="userProfile" onclick="handleLogout()"><img class="user-avatar" id="userAvatar" src="" alt="頭像"></div>
        </div>
    </header>
    <div class="search-container"><input type="text" class="search-bar" placeholder="搜尋美食、甜點、店家名稱..."></div>
    <div class="category-slider">
        <button class="cat-btn active" onclick="switchCategory(this)">全部</button>
        <button class="cat-btn" onclick="switchCategory(this)">甜點</button>
        <button class="cat-btn" onclick="switchCategory(this)">漢堡</button>
        <button class="cat-btn" onclick="switchCategory(this)">珍奶</button>
        <button class="cat-btn" onclick="switchCategory(this)">中式美食</button>
    </div>
    <main class="store-section">
        <div class="section-title">附近營業中 (GPS 依距離排序)</div>
        <div class="store-card">
            <img class="store-img" src="https://unsplash.com">
            <div class="store-info"><div class="store-name">司機推爆肉糟飯</div><div class="store-meta">中式美食 · 距離 50m</div><div class="store-time-tag">約 5 分鐘出餐</div></div>
        </div>
        <div class="store-card">
            <img class="store-img" src="https://unsplash.com">
            <div class="store-info"><div class="store-name">黑糖波霸鮮奶茶</div><div class="store-meta">珍奶 · 距離 120m</div><div class="store-time-tag">約 3 分鐘出餐</div></div>
        </div>
    </main>
    <div class="floating-footer"><div class="status-text" id="statusText">您的訂單 #023 製作中...</div><button class="cart-btn">🛒 購物車 (0)</button></div>
</div>
<script>
    function switchCategory(element) { document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active')); element.classList.add('active'); }
    function triggerGoogleLogin() { google.accounts.id.prompt(); }
    function handleCredentialResponse(response) {
        const base64Url = response.credential.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const userData = JSON.parse(decodeURIComponent(escape(window.atob(base64))));
        document.getElementById('loginBtn').style.display = 'none';
        const profileBox = document.getElementById('userProfile');
        profileBox.style.display = 'flex';
        document.getElementById('userAvatar').src = userData.picture;
        document.getElementById('statusText').innerText = `👋 哈囉，${userData.name}！想吃點什麼？`;
    }
    function handleLogout() { if(confirm("確定要登出嗎？")) { document.getElementById('loginBtn').style.display = 'block'; document.getElementById('userProfile').style.display = 'none'; document.getElementById('statusText').innerText = "已成功登出。"; } }
</script>
</body>
</html>
