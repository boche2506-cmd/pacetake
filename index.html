<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>快拿自取街 pacetake.tw - 店內價預約外帶自取系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://jsdelivr.net"></script>
    <!-- FontAwesome 圖標 -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- 🚀 大廠級免外部圖檔「精品藍色便當」我的最愛 Favicon 護城河 -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><rect x='15' y='35' width='70' height='45' rx='10' fill='%230066FF'/><path d='M25 35 Q50 15 75 35' stroke='%230066FF' stroke-width='8' fill='none'/><rect x='35' y='45' width='30' height='6' rx='3' fill='%23FFFFFF'/></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230066FF'/><rect x='20' y='40' width='60' height='40' rx='8' fill='%23FFFFFF'/><path d='M30 40 Q50 20 70 40' stroke='%23FFFFFF' stroke-width='8' fill='none'/></svg>">
    <!-- 預先載入其他後台，強行打通秒開防線 -->
    <link rel="prefetch" href="register.html">
    <link rel="prefetch" href="seller.html">
    <link rel="prefetch" href="manage.html">
    <style>
        .smooth-transition { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .dropdown-menu { display: none; }
        .dropdown-menu.active { display: block; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen pb-28">

    <!-- 頂部大字留白導覽列 -->
    <header class="bg-white/90 backdrop-blur-md border-b border-slate-100 sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex flex-col">
                <span class="text-xl font-black tracking-wider text-[#0066FF]">PACE 派思</span>
                <span class="text-[10px] text-slate-400 font-bold -mt-1">店內價預約外帶自取系統</span>
            </div>
            
            <!-- 右上角 Google 登入一體化防線 -->
            <div class="relative">
                <!-- 未登入按鈕 -->
                <button id="loginBtn" class="smooth-transition text-xs font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 px-4 py-2.5 rounded-full flex items-center gap-1.5 active:scale-95">
                    <i class="fa-brands fa-google text-red-500"></i> Google 一鍵登入
                </button>
                <!-- 登入後的圓形用戶頭像 (預設隱藏) -->
                <button id="userAvatar" class="hidden w-10 h-10 rounded-full border-2 border-[#0066FF] overflow-hidden smooth-transition active:scale-95">
                    <img src="https://unsplash.com" alt="User" class="w-full h-full object-cover">
                </button>
                
                <!-- 帳號狀態整合下拉選單（外人無法看穿的商家隱藏傳送門） -->
                <div id="dropdownMenu" class="dropdown-menu absolute right-0 mt-2 w-56 bg-white rounded-2xl border border-slate-100 shadow-xl overflow-hidden z-50">
                    <div class="p-3 border-b border-slate-100 bg-slate-50">
                        <p class="text-xs font-bold text-slate-800">測試帳號用戶</p>
                        <p id="userRoleText" class="text-[10px] text-slate-400 font-medium mt-0.5">目前身份：一般買家</p>
                    </div>
                    <!-- 一般買家選項 -->
                    <div id="buyerOptions">
                        <a href="register.html" class="fast-link flex items-center gap-2 px-4 py-3 text-xs font-bold text-slate-700 hover:bg-blue-50 hover:text-[#0066FF] smooth-transition text-decoration-none">
                            <i class="fa-solidxl fa-solid fa-store w-4 text-center"></i> 💼 商家 3 分鐘開店
                        </a>
                    </div>
                    <!-- 尊貴賣家解封印選項 (預設隱藏) -->
                    <div id="sellerOptions" class="hidden border-t border-slate-100 bg-blue-50/30">
                        <a href="seller.html" class="fast-link flex items-center gap-2 px-4 py-3 text-xs font-bold text-emerald-600 hover:bg-emerald-50 smooth-transition text-decoration-none">
                            <i class="fa-solid fa-chef-hat w-4 text-center"></i> 🧑‍🍳 進入接單後台
                        </a>
                        <a href="manage.html" class="fast-link flex items-center gap-2 px-4 py-3 text-xs font-bold text-[#0066FF] hover:bg-blue-50 smooth-transition text-decoration-none">
                            <i class="fa-solid fa-gear w-4 text-center"></i> ⚙️ 菜單品項管理
                        </a>
                    </div>
                    <!-- 快捷測試身份升級鈕 -->
                    <div class="p-2 bg-amber-50 border-t border-amber-100">
                        <button id="toggleRoleBtn" class="w-full text-[10px] bg-amber-500 hover:bg-amber-600 text-white font-black py-1.5 px-2 rounded-lg smooth-transition">
                            ⚡ 點我模擬已繳月費老闆
                        </button>
                    </div>
                    <div class="border-t border-slate-100">
                        <button id="logoutBtn" class="w-full flex items-center gap-2 px-4 py-3 text-xs font-bold text-rose-500 hover:bg-rose-50 text-left smooth-transition">
                            <i class="fa-solid fa-right-from-bracket w-4 text-center"></i> 🚪 登出帳號
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 mt-4 space-y-4">

        <!-- 新增加寬搜尋欄（取消橫向滑動分類鈕，確保大字留白高級感） -->
        <div class="relative">
            <input type="text" placeholder="搜尋商圈美味小吃、店家名稱..." class="w-full bg-white pl-11 pr-4 py-3.5 rounded-xl border border-slate-200 focus:outline-none focus:border-[#0066FF] text-sm font-medium smooth-transition shadow-sm">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-slate-400 text-sm"></i>
        </div>

        <!-- 店家清單列表（加入獨立高質感精品細邊界） -->
        <div class="space-y-4" id="storeContainer">
            <!-- 店家卡片 1 -->
            <div class="bg-white rounded-2xl overflow-hidden border border-slate-200 shadow-sm smooth-transition hover:shadow-md">
                <div class="p-3 flex gap-4">
                    <!-- 左側：1:1 圓角正方形店家照片加上細邊界 -->
                    <div class="w-24 h-24 rounded-xl bg-slate-100 overflow-hidden relative border border-slate-100 flex-shrink-0">
                        <img src="https://unsplash.com" alt="派思絕品便當" class="w-full h-full object-cover">
                    </div>
                    <!-- 右側：垂直疊加三格排版 -->
                    <div class="flex flex-col justify-between flex-1 py-0.5">
                        <!-- 第一格：店名 -->
                        <h2 class="font-black text-slate-800 text-base tracking-wide">派思絕品精緻便當屋 (總店)</h2>
                        <!-- 第二格：分類 · GPS距離 -->
                        <p class="text-xs text-slate-400 font-bold">精緻便當 · 站前商圈 <span class="text-[#0066FF] font-black ml-1"><i class="fa-solid fa-location-arrow text-[10px]"></i> 0.05 km</span></p>
                        <!-- 第三格：極簡出餐時間與高質感金流標籤 -->
                        <div class="flex items-center gap-2 mt-1">
                            <span class="bg-blue-50 text-[#0066FF] text-[10px] font-black px-2 py-0.5 rounded border border-blue-100">⏱️ 15 分鐘出餐</span>
                            <!-- 精緻高質感灰色金流防線標籤加上邊框 -->
                            <span class="bg-slate-50 text-slate-500 text-[10px] font-bold px-2 py-0.5 rounded border border-slate-200">💳 支援線上刷卡/LINE Pay</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- 底部：半透明磨砂玻璃懸浮欄 (精簡化，不顯示突兀地推按鈕，安全防禦力爆表) -->
    <div class="fixed bottom-4 left-4 right-4 max-w-md mx-auto bg-white/75 backdrop-blur-lg rounded-2xl border border-white/40 shadow-xl p-4 flex items-center justify-between z-40">
        <div class="flex items-center gap-3">
            <div class="w-2.5 h-2.5 rounded-full bg-[#0066FF] animate-pulse"></div>
            <div>
                <p class="text-xs font-black text-slate-800">您的訂單 #023 製作中</p>
                <p class="text-[10px] text-slate-400 font-medium">預計 12:30 準時可外帶自取</p>
            </div>
        </div>
        <i class="fa-solid fa-chevron-right text-slate-300 text-xs mr-1"></i>
    </div>

    <script>
        // 🚀 地推永久記憶金流護城河
        const urlParams = new URLSearchParams(window.location.search);
        let storeID = urlParams.get('store');
        if (storeID) {
            localStorage.setItem('pacetake_current_store', storeID);
        } else {
            storeID = localStorage.getItem('pacetake_current_store') || "default";
        }

        // 模擬 Google 一體化登入狀態與身份解封印
        const loginBtn = document.getElementById("loginBtn");
        const userAvatar = document.getElementById("userAvatar");
        const dropdownMenu = document.getElementById("dropdownMenu");
        const toggleRoleBtn = document.getElementById("toggleRoleBtn");
        const userRoleText = document.getElementById("userRoleText");
        const sellerOptions = document.getElementById("sellerOptions");
        const logoutBtn = document.getElementById("logoutBtn");

        let isLogged = false;
        let isOwner = false;

        loginBtn.addEventListener("click", () => {
            alert("快拿自取街：Google 一鍵驗證成功！自動偵測開店月費防線...");
            isLogged = true;
            loginBtn.classList.add("hidden");
            userAvatar.classList.remove("hidden");
        });

        userAvatar.addEventListener("click", (e) => {
            e.stopPropagation();
            dropdownMenu.classList.toggle("active");
        });

        document.addEventListener("click", () => { dropdownMenu.classList.remove("active"); });

        // 模擬身份升級
        toggleRoleBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            isOwner = !isOwner;
            if(isOwner) {
                userRoleText.innerText = "目前身份：👑 已繳月費老闆";
                userRoleText.className = "text-[10px] text-emerald-500 font-black mt-0.5";
                sellerOptions.classList.remove("hidden");
                toggleRoleBtn.innerText = "↩️ 還原為一般買家";
                toggleRoleBtn.className = "w-full text-[10px] bg-slate-500 hover:bg-slate-600 text-white font-black py-1.5 px-2 rounded-lg smooth-transition";
            } else {
                userRoleText.innerText = "目前身份：一般買家";
                userRoleText.className = "text-[10px] text-slate-400 font-medium mt-0.5";
                sellerOptions.classList.add("hidden");
                toggleRoleBtn.innerText = "⚡ 點我模擬已繳月費老闆";
                toggleRoleBtn.className = "w-full text-[10px] bg-amber-500 hover:bg-amber-600 text-white font-black py-1.5 px-2 rounded-lg smooth-transition";
            }
        });

        logoutBtn.addEventListener("click", () => {
            isLogged = false;
            isOwner = false;
            userAvatar.classList.add("hidden");
            sellerOptions.classList.add("hidden");
            loginBtn.classList.remove("hidden");
            dropdownMenu.classList.remove("active");
            userRoleText.innerText = "目前身份：一般買家";
            userRoleText.className = "text-[10px] text-slate-400 font-medium mt-0.5";
        });

        // 🚀 大廠級「0秒無縫閃轉外掛」事件綁定
        document.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll(".fast-link").forEach(btn => {
                const redirect = (e) => {
                    const href = btn.getAttribute("href");
                    if(href) {
                        e.preventDefault();
                        window.location.href = href;
                    }
                };
                btn.addEventListener("touchstart", redirect, { passive: false });
                btn.addEventListener("mousedown", redirect);
            });
        });
    </script>
</body>
</html>
