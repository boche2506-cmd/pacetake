<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PACE 派思 pacetake.tw - 買家首頁</title>
<!-- 1. 給電腦版、手機版 Chrome 瀏覽器標籤頁使用的標準圖示 -->
<link rel="icon" type="image/png" sizes="32x32" href="logo.png">
<link rel="icon" type="image/png" sizes="16x16" href="logo.png">
<!-- 2. 給 Apple iOS 系統（Safari/Chrome）加入主畫面與我的最愛使用的圖示 -->
<link rel="apple-touch-icon" sizes="180x180" href="logo.png">
<link rel="stylesheet" href="style.css">
<style>
/* a==========================================================================
   1. 全局變數與主題防線 (Cyber Blue)
   ========================================================================== */
html {
    width: 100vw;
    height: 100vh;
    overflow: hidden !important;
    touch-action: none;
    font-size: 16px !important;
}
:root {
    --bg-global: #F8FAFC;
    --bg-container: #FFFFFF;
    --border-color: #E2E8F0;
    --text-main: #0F172A;
    --text-muted: #64748B;
    --brand-blue: #0062FF; 
    --brand-green: #10B981;
    --brand-red: #EF4444;
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
    --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.05);
    --card-bg: #FFFFFF;
    --blur-bg: rgba(255, 255, 255, 0.95);
}

[data-theme="dark"] {
    --bg-global: #0A0A0A;
    --bg-container: #111111;
    --border-color: #262626;
    --text-main: #F5F5F5;
    --text-muted: #A3A3A3;
    --brand-blue: #2F80ED; 
    --brand-green: #34D399;
    --brand-red: #F87171;
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
    --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.4);
    --card-bg: #1C1C1E;
    --blur-bg: rgba(17, 17, 17, 0.95);
}

/* ==========================================================================
   2. 基礎重設與全域元素 (Reset & Globals)
   ========================================================================== */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    /* ⭕ 修正：將防選取機制嚴格綁定在全域選擇器 * 內，保證所有瀏覽器行為統一 */
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
}

body {
    /* 🔴 關鍵修正：放棄 width:100% 這種會被父層干擾的寫法，改用絕對視窗維度 */
    width: 100vw;
    height: 100vh;
    margin: 0;
    padding: 0;
    background-color: #000000; /* 外圍黑色沙盒 */
    
    /* 鎖死觸控反彈與捲軸 */

    /* 👑 強制向下對齊 */
    display: flex;
    flex-direction: column;    /* 讓排列方向變成垂直軸 */
    justify-content: flex-end; /* 🔴 核心關鍵：將所有東西徹底推到最底部 */
    align-items: center;       /* 橫向依然保持完美置中 */
}

input, textarea {
    -webkit-user-select: text;
    user-select: text; /* 解除輸入框鎖定，保證可正常打字與選取 */
}

img, .card {
    max-width: 100%; /* 圖片與卡片絕對不超過父容器寬度 */
    height: auto;
    box-sizing: border-box;
}

*, *::before, *::after {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;    /* 讓 Mac/iPhone 上的文字更細緻不毛躁 */
    -moz-osx-font-smoothing: grayscale;
    box-sizing: border-box;                 /* 順便鎖死所有盒模型的寬度計算，防止破圖 */
}

@media (max-width: 480px) {

    /* 1. 給大盒子內壁加上緩衝墊，不准黃框貼頂 */
    .sticky-top-group {
        padding-top: 15px !important;
        box-sizing: border-box !important;
    }

    /* 2. 點名搜尋框跟縣市條，在真手機上強制往下推開，拉開比例！ */
    .search-container, 
    .location-bar {
        margin-top: 10px !important; /* 蓋掉原本的 0px，讓它在手機上長出距離 */
    }

}

/* ==========================================================================
   3. 核心佈局架構 (Layout)
   ========================================================================== */
/* 手機直屏精品大外框 */
.phone-wrapper {
    /* 🔴 第一步：不管螢幕多大，強制鎖死 9:16 比例 */
    aspect-ratio: 9 / 16;

    /* 🔴 第二步：最核心！用這四行互相牽制。
       寬螢幕時，高度會卡住，左右自動留黑；
       長螢幕時，寬度會卡住，上下自動留黑！ */
    width: 100vw;
    height: 100vh;
    max-width: calc(100vh * 9 / 16);  /* 根據高度逆推最大寬度 */
    max-height: calc(100vw * 16 / 9); /* 根據寬度逆推最大高度 */

    /* 🔴 第三步：這三行神陣，保證不管是上下留黑還是左右留黑，永遠「絕對正中央」 */
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    /* 🔴 第四步：死不准滑動（你要求的鐵律） */
    overflow: auto; 
    display: flex;
    flex-direction: column;
    padding: 10px;
    justify-content: space-between; /* 新增：這行是關鍵！它會嚴格要求上中下三層乖乖各自定位，不管資料有沒有來，絕對不允許任何人往上吸 */
    /* 確保滑動時有 Apple 原生的絲滑回彈手感（Rubber-banding） */
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
    /* 🔴 第五步：立體手機殼裝飾（邊框與陰影） */
    background-color: var(--bg-container);
    border: 4px solid #222; /* 給它一個扎實的手機黑色外框 */
    border-radius: 20px;    /* 稍微帶點圓角更像手機 */
    box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.5); /* 超立體陰影 */
}

#adminView {
    /* 🔴 關鍵 1：用 absolute，不要用 fixed！
       這樣它才會乖乖以 `.phone-wrapper` 的身體當作世界邊界 */
    position: absolute; 
    
    /* 🔴 關鍵 2：死死貼住手機殼的四個角落，一吋都不準多 */
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 10px !important;;
    
    /* 🔴 關鍵 3：寬高百分之百跟隨手機殼，絕對不會變超大一張 */
    width: 100%;
    height: 100%;
    
    /* 🔴 關鍵 4：層級直接拉到最高，蓋掉原本的店家卡片和底欄黑條 */
    z-index: 999; 
    
    /* 補上底色，切換過去才不會透視看到後面的店家卡片 */
    background-color: #ffffff; 
    
    /* 如果控制台裡面的內容很多，允許它在自己的規格內獨立滾動 */
    overflow-x: hidden;
    overflow-y: auto; 
    box-sizing: border-box !important;
}

#adminView input, 
#adminView select, 
#adminView button {
    width: 100% !important;        /* 🔴 核心：強行蓋掉 JS 寫死的固定 px，改成跟著手機殼縮放 */
    max-width: 100% !important;    /* 絕對不准超過 */
    box-sizing: border-box !important; /* 防爆公式 */
}

#buyerView {
    width: 100%;
    height: 100%;
    display: flex !important; /* 確保不管 JS 怎麼切換 block，都必須維持 flex 佈局 */
    flex-direction: column;
    justify-content: space-between; /* 鐵律：強迫上中下三層死死卡住各自的位置，絕對不准往上吸 */
    box-sizing: border-box;
}

/* 👑 頂部全區常駐吸附天花板 (Sticky) */
.sticky-top-group {
    display: flex;
    flex-direction: column;
    height: 28%;
    box-sizing: border-box; /* 確保 margin/padding 不會把這 30% 的高度撐破 */
    border-bottom: 1px solid var(--border-color);
    flex-shrink: 0;
    gap: 5px;
    top: 0;
    padding-top: 10px;
    margin-bottom: 10px;
    position: sticky;
    background-color: var(--bg-container) !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
    z-index: 100; 
}

*, *::before, *::after {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;    /* 讓 Mac/iPhone 上的文字更細緻不毛躁 */
    -moz-osx-font-smoothing: grayscale;
    box-sizing: border-box;                 /* 順便鎖死所有盒模型的寬度計算，防止破圖 */
}

/* ==========================================================================
   6. 搜尋與定位列 (Search & Location)
   ========================================================================== */

.location-bar {
    padding: 0px;
    display: flex;
    align-items: center;
    gap: 5px;
    height: 36px;                   /* 固定住的數值：鎖定第二排選單高度 */
    flex-shrink: 0;
}

.gps-trigger-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 700;
    color: var(--brand-blue);
    background-color: var(--card-bg);
    border: 1px solid var(--border-color);
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: var(--shadow-sm);
}

.location-select-group {
    display: flex;
    gap: 4px;
    flex-grow: 1;
}

.nav-select {
    flex: 1;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background-color: var(--bg-global);
    color: var(--text-main);
    font-size: 12px;
    font-weight: 600;
    padding: 0 4px;
    outline: none;
    cursor: pointer;
}

.search-container {
    margin-bottom: 0px;
    height: 48px;                   /* 固定住的數值：鎖定第三排搜尋框容器高度 */
    flex-shrink: 0;
    padding: 0 10px;
}

.search-box {
    display: flex;
    align-items: center;
    background-color: var(--bg-global);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 0 5px;
    height: 36px;
}

.search-box input {
    border: none;
    background: none;
    width: 100%;
    height: 100%;
    margin-left: 8px;
    font-size: 14px;
    color: var(--text-main);
    outline: none;
}
/* ==========================================================================
   7. 店家列表 (Store List)
   ========================================================================== */
.store-list {
    height: 57%;
    overflow-y: auto;       
    -webkit-overflow-scrolling: touch; 
    box-sizing: border-box; 
    display: flex;
    flex-direction: column;
    gap: 5px;               /* 修改：由 16px 縮小至 8px，緊湊卡片間距 */
    padding: 0 10px;
}

.store-card {
    display: flex;
    align-items: center;
    gap: 12px;              /* 修改：由 16px 縮小至 12px，縮短圖片與文字的間距 */
    background-color: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    margin-bottom: 0px;     /* 修改：外距歸零，由 list 的 gap 統一控制間距 */
    text-decoration: none;
    color: inherit;
    box-shadow: var(--shadow-sm);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    width: 100%; /* 強迫卡片指名服從手機大外框的限制，絕不擠破框架 */
    box-sizing: border-box; /* 新增：確保寬度計算包含 border 與 padding */
    padding: 5px;
}


.store-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.06);
}

.store-img {
    width: 54px;
    height: 54px;
    background-color: var(--bg-global);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    flex-shrink: 0;
}

.store-info {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    flex-grow: 1;
    gap: 6px;
}

.store-name {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-main);
}

.store-meta {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
}

.store-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

.store-tags span {
    font-size: 10px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
}

.tag-time {
    background-color: rgba(0, 98, 255, 0.08);
    color: var(--brand-blue);
}

.tag-pay {
    background-color: rgba(16, 185, 129, 0.08);
    color: var(--brand-green);
}

.tag-time.inactive,
.tag-pay.inactive {
    opacity: 0.25;          /* 變得很透明，看起來像灰色沒亮燈 */
    filter: grayscale(100%); /* 強制把裡面的顏色跟圖示變純灰色 */
    cursor: not-allowed;    /* 滑鼠移上去時，會顯示禁止符號 */
}

/* ==========================================================================
   8. 底部懸浮列 (Bottom Bar)
   ========================================================================== */
.bottom-bar {
    display: flex;
    height: 15%;              /* 保持：分配剩餘的 20% 高度 */
    flex-shrink: 0;           /* 保持：強制固定，絕不被壓縮 */
    box-sizing: border-box;
    background-color: var(--blur-bg);
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--border-color);
    padding: 10px;
}

.status-msg {
    font-size: 12px;
    color: var(--text-muted);
    max-width: 200px;
    display: flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    height: 36px;             /* 新增：固定狀態文字區域的高度 */
}

footer .status-indicator {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background-color: #ff4d4f;
    flex-shrink: 0;
}

footer .status-indicator.active{
    background-color: #52c41a;
    box-shadow: 0 0 8px #52c41a;
}


.order-badge-count {
    background-color: var(--brand-red);
    color: white;
    font-size: 10px;
    font-weight: 800;
    min-width: 15px;
    height: 15px;
    border-radius: 8px;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
    border: 1px solid var(--bg-container);
}

.cart-status-btn {
    background-color: var(--brand-blue);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    text-decoration: none;
    box-shadow: var(--shadow-sm);
    height: 36px;             /* 新增：固定購物車按鈕的物理高度，防止變形 */
    box-sizing: border-box;   /* 新增：確保 padding 不會影響按鈕固定高度 */
}

/* ==========================================================================
   9. 燈箱模態框與通用組件 (Modals & Utilities)
   ========================================================================== */
.lightbox-modal {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 200;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.modal-card {
    background-color: var(--bg-container);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    width: 100%;
    max-width: 320px;
    padding: 24px;
    box-shadow: var(--shadow-md);
    text-align: center;
}

.modal-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
}

.modal-desc-address {
    font-size: 13px;
    color: var(--text-main);
    line-height: 1.5;
    margin-bottom: 20px;
    word-break: break-all;
    background-color: var(--bg-global);
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    text-align: left;
}

.modal-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 10px;
    border: 1px solid var(--border-color);
    background: var(--card-bg);
    color: var(--text-main);
}

.modal-btn.google {
    background-color: #FFFFFF;
    color: #374151;
    border-color: #E2E8F0;
}

.modal-close {
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
    margin-top: 12px;
    display: inline-block;
}

.loading-spinner {
    text-align: center;
    padding: 40px;
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 600;
}

select {
    width: 100%;       /* 寬度服從父層分配 */
    height: 32px;      /* 鐵律：鎖死高度（配合你原來的 nav-select 設定） */
    padding: 0 8px;    /* 只給左右內距，上下給 0，絕不頂開高度 */
    font-size: 12px;   /* 配合整體導航欄的小巧比例 */
    line-height: 32px; /* 讓 line-height 等於 height，文字就會完美垂直置中 */
    box-sizing: border-box; /* 保險線：確保 border 和 padding 全都算在這 32px 裡面 */
}

</style>
</head>
<body>

<div class="sticky-top-group">
<header id="header-container"></header>

                        <option value="南投縣">南投縣</option>
                        <option value="雲林縣">雲林縣</option>

            <span>🛒 </span>
        </a>
    </footer>
  </div>
<!-- ========================================== -->
<!-- 🔮 派思核心控制台 (Admin 視圖) -->
<!-- ========================================== -->
<div id="adminView" style="display: none; padding: 30px; background: #121212; color: #e0e0e0; min-height: 100vh; font-family: sans-serif;">
    
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding-bottom: 15px; margin-bottom: 20px;">
        <h1 style="color: #4dadff; margin: 0; font-size: 28px;">🔮 派思最高意志控制台</h1>
                <button onclick="window.toggleView('buyer')" style="padding: 10px 20px; background: #ff4d4d; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s;">
            🧑‍💼 返回一般買家視圖
        </button>
    </div> <div style="background: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 25px; border: 1px solid #2d2d2d;">
        <h3 style="color: #ffca28; margin-top: 0;">➕ 新增全新店家</h3>
        <p style="color: #aaa; font-size: 13px; margin-bottom: 15px;">請輸入店家資訊，新增後將立即同步至 Firebase 雲端資料庫。</p>   
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px;">
            <input type="text" id="adminNewStoreName" placeholder="店家名稱 (*必填)" style="padding: 10px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 6px;">
            <input type="text" id="adminNewStorePhone" placeholder="聯絡電話 (*必填)" style="padding: 10px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 6px;">
            <input type="text" id="adminNewStoreCity" placeholder="縣市 (如: 基隆市) (*必填)" style="padding: 10px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 6px;">
            <input type="text" id="adminNewStoreDistrict" placeholder="區域 (如: 七堵區) (*必填)" style="padding: 10px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 6px;">
            <input type="text" id="adminNewStoreAddress" placeholder="詳細地址 (*必填)" style="padding: 10px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 6px; grid-column: span 2;">

        </div>
        <button id="adminSubmitStoreBtn" style="width: 100%; padding: 12px; background: #059669; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s;">✅ 確認新增店家至雲端</button>
    </div> <div style="background: #1e1e1e; padding: 20px; border-radius: 8px; border: 1px solid #2d2d2d; overflow-x: auto;">
        <h3 style="color: #4da5ff; margin-top: 0;"> 📋 目前雲端店家總覽</h3>
        <table style="width: 100%; border-collapse: collapse; margin-top: 15px; text-align: left; font-size: 14px;">
            <tr style="background: #2d2d2d; color: #fff;">
                <th style="padding: 12px; border: 1px solid #3a3a3a;">店家名稱</th>
                <th style="padding: 12px; border: 1px solid #3a3a3a;">詳細地址</th>
                <th style="padding: 12px; border: 1px solid #3a3a3a;">聯絡電話</th>
                <th style="padding: 12px; border: 1px solid #3a3a3a; text-align: center;">核心操作</th>
            </tr>
            <tbody id="adminStoreTableBody">
                <tr><td colspan="4" style="text-align: center; padding: 15px; color: #888;">正在載入雲端資料...</td></tr>
            </tbody>
        </table>
    </div> </div> <div class="lightbox-modal" id="loginLightbox" style="display: none;">
    <div class="modal-card">
        <div class="modal-title" style="font-weight: 700; margin-bottom: 25px; color: #1f2937;">加入PACE 派思</div>
        
        <button class="modal-btn google" id="googleLoginAction" style="box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
            <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right:12px; flex-shrink: 0;">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Google 登入
        </button>

        <button id="toggleEmailFormBtn" style="display: flex; align-items: center; justify-content: center; width: 100%; background-color: white; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 500; color: #374151; margin-top: 14px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:12px; flex-shrink: 0;">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            使用電子郵件登入
        </button>

        <div id="emailFormSection" style="display: none; margin-top: 20px; text-align: left; width: 100%;">
            <div style="margin-bottom: 12px;">
                <label for="loginEmail" style="display:block; margin-bottom:6px; font-size:13px; color:#6b7280; font-weight:500;">電子郵件</label>
                <input type="email" id="loginEmail" placeholder="請輸入 Email" autocomplete="username" style="width:100%; padding:10px 14px; border:1px solid #e5e7eb; border-radius:8px; box-sizing:border-box; font-size:14px; background-color:#f9fafb; color: #111111;">
            </div> <div style="margin-bottom: 20px; position: relative;">
                <label for="loginPassword" style="display:block; margin-bottom:6px; font-size:13px; color:#6b7280; font-weight:500;">密碼</label>
                <div style="position: relative; display: flex; align-items: center;">
                    <input type="password" id="loginPassword" placeholder="請輸入密碼" autocomplete="current-password" style="width:100%; padding:10px 14px; border:1px solid #e5e7eb; border-radius:8px; box-sizing:border-box; font-size:14px; background-color:#f9fafb; color: #111111;">
                    <button type="button" id="togglePasswordVisibility" style="position: absolute; right: 12px; background: none; border: none; cursor: pointer; font-size: 16px; padding: 0; color: #6b7280; z-index: 10;">👁️</button>
                </div>
            </div> <button id="emailLoginAction" style="background-color: #059669; color: white; border: none; width:100%; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 2px 4px rgba(5, 150, 105, 0.15);">電子郵件登入 / 註冊</button>
        </div> <span class="modal-close" id="customReturnBtn" style="margin-top: 20px; text-decoration: underline; cursor: pointer; display: block; text-align: center;">暫時返回</span>
    </div> </div> <div class="lightbox-modal" id="addressDetailLightbox" style="display: none;">
    <div class="modal-card">
        <div class="modal-title" style="color: var(--brand-blue); font-weight: 700;">📍 目前位置</div>
        <div class="modal-desc-address" id="modalAddressText" style="margin-bottom: 20px; margin-top: 10px;">尚未獲取定位，請開啟 GPS。</div>
        <button class="close-modal-btn" id="closeAddressModalBtn" style="background-color: var(--brand-blue); color: white; border: none; width: 100%; height: 42px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;">確認</button>
    </div> </div> </div> <script type="module" src="app.js"></script>
</body>
</html>
