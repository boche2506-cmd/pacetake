<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PACE 派思 pacetake.tw - 買家首頁</title>
    <!-- 精品藍色便當純代碼 SVG Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20x%3D%2210%22%20y%3D%2230%22%20width%3D%2280%22%20height%3D%2255%22%20rx%3D%2210%22%20fill%3D%22%230066FF%22%2F%3E%3Cpath%20d%3D%22M25%2030%20V15%20Q25%2010%2035%2010%20H65%20Q75%2010%2075%2015%20V30%22%20fill%3D%22none%22%20stroke%3D%22%230066FF%22%20stroke-width%3D%228%22%2F%3E%3Cline%20x1%3D%2210%22%20y1%3D%2255%22%20x2%3D%2290%22%20y2%3D%2255%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%224%22%2F%3E%3C%2Fsvg%3E">
 <style>
        /* 全局變數與主題防線 */
        :root {
            --bg-global: #F8FAFC;
            --bg-container: #FFFFFF;
            --border-color: #E2E8F0;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --brand-blue: #0066FF;
            --brand-green: #10B981;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.05);
            --card-bg: #FFFFFF;
            --blur-bg: rgba(255, 255, 255, 0.85);
        }

        [data-theme="dark"] {
            --bg-global: #0A0A0A;
            --bg-container: #111111;
            --border-color: #262626;
            --text-main: #F5F5F5;
            --text-muted: #A3A3A3;
            --brand-blue: #3B82F6;
            --brand-green: #34D399;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.4);
            --card-bg: #1C1C1E;
            --blur-bg: rgba(17, 17, 17, 0.85);
        }

        /* 基礎重設 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-global);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            transition: background-color 0.15s ease;
        }

        /* 手機直屏精品大外框與細邊界 */
        .phone-wrapper {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            background-color: var(--bg-container);
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            position: relative;
            padding-bottom: 90px; /* 留給底部懸浮欄 */
            display: flex;
            flex-direction: column;
        }

        /* 頂部高級大字留白區 */
        .header {
            padding: 24px 20px 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .brand-title-area h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .brand-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 500;
        }

        /* 右上角一體化控制台 */
        .control-panel {
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            font-size: 16px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            background-color: var(--card-bg);
        }

        .login-btn {
            background-color: var(--brand-blue);
            color: #FFFFFF;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
        }

        .user-avatar-btn {
            display: none; /* 初始未登入隱藏 */
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            align-items: center;
            gap: 4px;
        }

        /* 下拉選單選面 */
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 42px;
            right: 0;
            width: 200px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            z-index: 100;
            padding: 6px;
        }

        .dropdown-menu a, .dropdown-menu button {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 10px 12px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 13px;
            border: none;
            background: none;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
        }

        .dropdown-menu a:hover, .dropdown-menu button:hover {
            background-color: var(--bg-global);
        }

        .menu-divider {
            height: 1px;
            background-color: var(--border-color);
            margin: 6px 0;
        }

        .test-panel {
            background-color: var(--bg-global);
            padding: 8px;
            border-radius: 8px;
            margin-top: 4px;
        }

        .test-title {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: bold;
        }

        .test-btns {
            display: flex;
            gap: 4px;
        }

        .test-btns button {
            padding: 4px 6px;
            font-size: 11px;
            justify-content: center;
            background: var(--bg-container);
            border: 1px solid var(--border-color);
        }

        .test-btns button.active {
            background: var(--brand-blue);
            color: white;
            border-color: var(--brand-blue);
        }

        .seller-unlock {
            display: none; /* 賣家專屬功能初始隱藏 */
        }

        /* 中間：加寬搜尋欄 */
        .search-container {
            padding: 8px 20px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background-color: var(--bg-global);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0 14px;
            height: 46px;
        }

        .search-box input {
            border: none;
            background: none;
            width: 100%;
            height: 100%;
            margin-left: 8px;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
        }

        /* 橫向滑動圓角分類鈕 */
        .category-scroll {
            display: flex;
            overflow-x: auto;
            padding: 12px 20px;
            gap: 8px;
            scrollbar-width: none;
        }

        .category-scroll::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            flex-shrink: 0;
            background-color: var(--bg-global);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .cat-btn.active {
            background-color: var(--brand-blue);
            color: #FFFFFF;
            border-color: var(--brand-blue);
        }

        /* 下方：店家列表區 */
        .store-list {
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .store-card {
            display: flex;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px;
            gap: 12px;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            text-decoration: none;
        }

        .store-img {
            width: 85px;
            height: 85px;
            border-radius: 12px;
            background-color: var(--bg-global);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            flex-shrink: 0;
        }

        .store-info {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .store-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
        }

        .store-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .store-tags {
            display: flex;
            gap: 6px;
            margin-top: 4px;
            align-items: center;
        }

        .tag-time {
            background-color: rgba(0, 102, 255, 0.08);
            color: var(--brand-blue);
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: 600;
        }

        .tag-pay {
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 6px;
        }

        /* 底部懸浮欄 */
        .bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 76px;
            background-color: var(--blur-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 90;
        }

        .status-msg {
            font-size: 12px;
            color: var(--text-muted);
            max-width: 240px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--text-muted);
            flex-shrink: 0;
        }

        .status-indicator.active {
            background-color: var(--brand-green);
            box-shadow: 0 0 8px var(--brand-green);
        }

        .cart-status-btn {
            background-color: var(--brand-blue);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            box-shadow: var(--shadow-sm);
        }

        /* 半透明燈箱彈窗 */
        .lightbox-modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-card {
            background-color: var(--bg-container);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            width: 100%;
            max-width: 320px;
            padding: 24px;
            box-shadow: var(--shadow-md);
            text-align: center;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .modal-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-main);
        }

        .modal-btn.google {
            background-color: #FFFFFF;
            color: #111111;
            border-color: #E2E8F0;
        }

        .modal-btn.phone {
            background-color: var(--brand-blue);
            color: white;
            border: none;
        }

        .modal-close {
            font-size: 12px;
            color: var(--text-muted);
            cursor: pointer;
            margin-top: 12px;
            display: inline-block;
        }
    </style>

</head>
<body>

    <div class="phone-wrapper">
        <!-- 頂部大字留白區 -->
        <header class="header">
            <div class="brand-title-area">
                <h1>PACE 派思</h1>
                <div class="brand-subtitle">店內價預約外帶自取 / 內用點單系統</div>
            </div>
            
            <div class="control-panel">
                <!-- 膚色切換鈕 -->
                <button class="theme-toggle" id="themeToggleBtn">🌓</button>
                
                <!-- 未登入狀態 -->
                <button class="login-btn" id="loginTriggerBtn">Google 登入 / 註冊</button>
                
                <!-- 登入後狀態 -->
                <button class="user-avatar-btn" id="avatarMenuBtn">
                    <span>🧑‍💼 帳號狀態</span>
                </button>
                
                <!-- 下拉選單面板 -->
                <div class="dropdown-menu" id="userDropdown">
                    <a href="orders.html" class="nav-fast">🛒 我的訂單</a>
                    <a href="history.html" class="nav-fast">⏳ 歷史訂單</a>
                    <a href="register.html" class="nav-fast">💼 月費開店(暫不收費)</a>
                    
                    <!-- 賣家解封路徑區 -->
                    <div class="seller-unlock" id="sellerMenuBlock">
                        <div class="menu-divider"></div>
                        <a href="seller.html" class="nav-fast">🧑‍🍳 接單管理</a>
                        <a href="manage.html" class="nav-fast">⚙️ 後台管理</a>
                        <a href="#" class="nav-fast" data-target="pay">💵 繳費</a>
                    </div>
                    
                    <div class="menu-divider"></div>
                    <button id="logoutBtn">🚪 登出</button>
                </div>
            </div>
        </header>

        <!-- Google / 電子郵件 登入燈箱彈窗 -->
        <div class="lightbox-modal" id="loginLightbox">
            <div class="modal-card">
                <div class="modal-title" style="font-weight: 700; margin-bottom: 25px; color: #1f2937; text-align: center;">加入PACE 派思</div>
                
                <!-- 1. 官方原廠：Google 彩虹四色一鍵登入按鈕 -->
                <button class="modal-btn google" id="googleLoginAction" style="display: flex; align-items: center; justify-content: center; width: 90%; margin-left: auto; margin-right: auto; background-color: white !important; border: 1px solid #e5e7eb !important; border-radius: 8px !important; padding: 12px; font-size: 14px; font-weight: 500; color: #374151 !important; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
                    <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right:12px; flex-shrink: 0;">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    Google 一鍵登入
                </button>

                <!-- 2. 完全對稱：電子郵件登入按鈕 -->
                <button id="toggleEmailFormBtn" style="display: flex; align-items: center; justify-content: center; width: 90%; margin-left: auto; margin-right: auto; background-color: white; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 500; color: #374151; margin-top: 14px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.05); transition: all 0.2s;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:12px; flex-shrink: 0;">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    使用電子郵件登入
                </button>

                <!-- 3. 精修展開表單 -->
                <div id="emailFormSection" style="display: none; margin-top: 20px; text-align: left; width: 90%; margin-left: auto; margin-right: auto;">
                    <div style="margin-bottom: 12px;">
                        <label style="display:block; margin-bottom:6px; font-size:13px; color:#6b7280; font-weight:500;">電子郵件</label>
                        <input type="email" id="loginEmail" placeholder="請輸入 Email" style="width:100%; padding:10px 14px; border:1px solid #e5e7eb; border-radius:8px; box-sizing:border-box; font-size:14px; background-color:#f9fafb;">
                    </div>
                    <div style="margin-bottom: 20px;">
                        <label style="display:block; margin-bottom:6px; font-size:13px; color:#6b7280; font-weight:500;">密碼</label>
                        <input type="password" id="loginPassword" placeholder="請輸入密碼" style="width:100%; padding:10px 14px; border:1px solid #e5e7eb; border-radius:8px; box-sizing:border-box; font-size:14px; background-color:#f9fafb;">
                    </div>
                    <button id="emailLoginAction" style="background-color: #059669; color: white; border: none; width:100%; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 2px 4px rgba(5, 150, 105, 0.15); transition: background 0.2s;">電子郵件登入 / 註冊</button>
                </div>

                <span class="modal-close" id="customReturnBtn" style="margin-top: 20px; display: inline-block; cursor: pointer; color: #6b7280; font-size: 14px; text-decoration: underline;">暫時返回</span>
            </div>
        </div>
    </div>

    <!-- 🧠 大腦區：沒有任何垃圾外掛，回歸純粹、最標準的網頁技術 -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://gstatic.com";

        // 雲端大腦金鑰
        const firebaseConfig = {
            apiKey: "AIzaSyCkAiZCJ6L950KfYJEqubWGi1M8D03OuJI",
            authDomain: "://firebaseapp.com",
            projectId: "pacetake-c6e1e",
            storageBucket: "pacetake-c6e1e.firebasestorage.app",
            messagingSenderId: "1052980235056",
            appId: "1:1052980235056:web:6a06e4ac9b48f1e74896f5",
            measurementId: "G-888XL8JTHW",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

                // 抓取畫面上所有的控制按鈕
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const loginTriggerBtn = document.getElementById('loginTriggerBtn');
        const userAvatarBtn = document.getElementById('avatarMenuBtn');
        const userDropdown = document.getElementById('userDropdown');
        const loginLightbox = document.getElementById('loginLightbox');
        const googleLoginAction = document.getElementById('googleLoginAction');
        const logoutBtn = document.getElementById('logoutBtn');
        
        const toggleEmailFormBtn = document.getElementById('toggleEmailFormBtn');
        const emailFormSection = document.getElementById('emailFormSection');
        const customReturnBtn = document.getElementById('customReturnBtn');
        const loginEmailInput = document.getElementById('loginEmail');
        const loginPasswordInput = document.getElementById('loginPassword');
        const emailLoginAction = document.getElementById('emailLoginAction');

        // 🌗 1. 膚色切換控制
        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('pacetake-theme', newTheme);
            });
        }
        // 初始化膚色
        document.documentElement.setAttribute('data-theme', localStorage.getItem('pacetake-theme') || 'light');

        // 🚪 2. 登入視窗顯示 / 隱藏 / 還原狀態控制
        function resetAndCloseLightbox() {
            googleLoginAction.style.display = 'flex';
            toggleEmailFormBtn.style.display = 'flex';
            emailFormSection.style.display = 'none';
            loginLightbox.style.display = 'none';
        }

        if (loginTriggerBtn) {
            loginTriggerBtn.addEventListener('click', () => { loginLightbox.style.display = 'flex'; });
        }
        if (customReturnBtn) {
            customReturnBtn.addEventListener('click', resetAndCloseLightbox);
        }

        // 點擊「使用電子郵件登入」展開欄位
        if (toggleEmailFormBtn) {
            toggleEmailFormBtn.addEventListener('click', () => {
                googleLoginAction.style.display = 'none';
                toggleEmailFormBtn.style.display = 'none';
                emailFormSection.style.display = 'block';
            });
        }

        // 🧑‍💻 3. 真‧Google 一鍵登入功能
        if (googleLoginAction) {
            googleLoginAction.addEventListener('click', () => {
                signInWithPopup(auth, provider)
                    .then((result) => {
                        resetAndCloseLightbox();
                    })
                    .catch((error) => {
                        console.warn("Google登入取消或提示：", error.message);
                    });
            });
        }

        // ✉️ 4. 真‧電子郵件登入與就地自動註冊功能
        if (emailLoginAction) {
            emailLoginAction.addEventListener('click', () => {
                const emailValue = loginEmailInput ? loginEmailInput.value.trim() : '';
                const passwordValue = loginPasswordInput ? loginPasswordInput.value : '';

                if (!emailValue || !passwordValue) {
                    alert("請將電子郵件和密碼都填寫完整喔！");
                    return;
                }
                if (passwordValue.length < 6) {
                    alert("為了安全，密碼必須至少要 6 個字喔！");
                    return;
                }

                signInWithEmailAndPassword(auth, emailValue, passwordValue)
                    .then((result) => {
                        resetAndCloseLightbox();
                    })
                    .catch((error) => {
                        if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                            createUserWithEmailAndPassword(auth, emailValue, passwordValue)
                                .then((result) => {
                                    alert("歡迎新朋友！已成功為您註冊並登入！");
                                    resetAndCloseLightbox();
                                })
                                .catch((regError) => {
                                    alert("註冊失敗，請確認信箱格式正確！");
                                });
                        } else {
                            alert("密碼錯誤或登入失敗，請再確認一次喔！");
                        }
                    });
            });
        }

        // 🚪 5. 登出功能
        if (logoutBtn) {
            logoutBtn.addEventListener('click', () => {
                signOut(auth).then(() => {
                    userDropdown.style.display = 'none';
                });
            });
        }

        // 📡 6. 全局實時監聽登入狀態
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginTriggerBtn.style.display = 'none';
                userAvatarBtn.style.display = 'flex';
            } else {
                loginTriggerBtn.style.display = 'block';
                userAvatarBtn.style.display = 'none';
            }
        });

        // 帳號選單下拉控制
        if (userAvatarBtn) {
            userAvatarBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                userDropdown.style.display = userDropdown.style.display === 'block' ? 'none' : 'block';
            });
        }
        document.addEventListener('click', () => { if(userDropdown) userDropdown.style.display = 'none'; });
    </script>
</body>
</html>
