<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PACE 派思 pacetake.tw - 買家首頁</title>
<!-- 1. 給電腦版、手機版 Chrome 瀏覽器標籤頁使用的標準圖示 -->
<link rel="icon" type="image/png" sizes="32x32" href="logo.png">
<link rel="icon" type="image/png" sizes="16x16" href="logo.png">
<!-- 2. 給 Apple iOS 系統（Safari/Chrome）加入主畫面與我的最愛使用的圖示 -->
<link rel="apple-touch-icon" sizes="180x180" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<style>
/* 👑 頂部全區常駐吸附天花板 (Sticky) */
.sticky-top-group {
    display: flex;
    flex-direction: column;
    justify-content: flex-end; 
    height: 28%;                /* 稍微增加一點高度，讓空間更舒服 */
    width: 100%;
    border-bottom: 1px solid var(--border-color);
    padding: 0.5rem 0.5rem 0.25rem 0.5rem;
    gap: 0.25rem;
    box-sizing: border-box;
    /* 💡 關鍵三：使用 sticky，讓它在正常狀態下死死釘在最頂端，中層滾動時它不動 */
    position: sticky;
}

.location-bar {
    display: flex;
    flex-direction: row;
    justify-content: center; 
    align-items: center; 
    gap: 0.3rem;
}

.gps-trigger-btn {
    display: flex;
    flex-direction: column;
    justify-content: center; 
    align-items: center; 
    font-size: 0.75rem;
    color: var(--brand-blue);
    background-color: var(--card-bg);
    border: 1px solid var(--border-color);
    padding: 0.125rem 0.5rem;
    border-radius: 1.25rem;
    cursor: pointer;     /* 滑鼠變成「手指」圖示 */
    white-space: nowrap; /* 文字強制不換行 */
    box-shadow: var(--shadow-sm);
}

.location-select-group {
    display: flex;
    gap: 0.3rem;
    justify-content: flex-end;
}

.nav-select {
    border-radius: 0.75rem;
    border: 1px solid var(--border-color);
    background-color: var(--bg-global);
    color: var(--text-main);
    font-size: 0.75rem;
    outline: none;            /* 消除點擊時的藍色/黑色外框 */
    cursor: pointer;          /* 滑鼠變成「手指」圖示 */
}

.search-box {
    display: flex;
    flex-direction: row;
    justify-content: flex-start; 
    align-items: center;
    background-color: var(--bg-global);
    border: 1px solid var(--border-color);
    border-radius: 0.8rem;
    padding: 0.125rem 0.5rem;
}

.search-box input {
    border: none;       /* 消除邊框 */
    background: none;   /* 消除背景色 / 變透明 */
    font-size: 0.75rem;
    color: var(--text-main);
    outline: none;
    flex: 1;  
}

select {
    width: 100%;
    height: 1.5rem;
    padding: 0 0.5rem;    /* 只給左右內距，上下給 0，絕不頂開高度 */
    font-size: 0.75rem;   /* 配合整體導航欄的小巧比例 */
    line-height: 2rem; /* 讓 line-height 等於 height，文字就會完美垂直置中 */
    box-sizing: border-box;
}

/* ==========================================================================
   7. 店家列表 (Store List)
   ========================================================================== */
.store-list {
    height: 57%;
    width: 100%;
    overflow-y: auto;       
    box-sizing: border-box; 
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    padding: 0.25rem 0.5rem 0.25rem 1rem;
}

.store-card {
    display: flex;
    align-items: center;
    gap: 0.25rem;
    background-color: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 1rem;
    text-decoration: none;
    color: inherit;
    box-shadow: var(--shadow-sm);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    width: 100%; /* 強迫卡片指名服從手機大外框的限制，絕不擠破框架 */
    box-sizing: border-box; /* 新增：確保寬度計算包含 border 與 padding */
    padding: 0.125rem;
}


.store-card:hover {
    transform: translateY(-0.125rem);
    box-shadow: 0 0.375rem 2rem rgba(0,0,0,0.06);
}

.store-img {
    width: 3.5rem;
    height: 3.5rem;
    background-color: var(--bg-global);
    border-radius: 0.75rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.75rem;
}

.store-info {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 0.125rem;
}

.store-name {
    font-size: 1.25rem;
    font-weight: 600;
    color: var(--text-main);
}

.store-meta {
    font-size: 0.75rem;
    color: var(--text-muted);
}

.store-tags {
    display: flex;
    gap: 0.375rem;
    flex-wrap: wrap;     /* 換到下一行 */
}

.store-tags span {
    font-size: 0.75rem;
    font-weight: 600;
    padding: 0.125rem 0.5rem;
    border-radius: 0.375rem;
}

.tag-time {
    background-color: rgba(0, 98, 255, 0.08);
    color: var(--brand-blue);
}

.tag-pay {
    background-color: rgba(16, 185, 129, 0.08);
    color: var(--brand-green);
}

.tag-time.inactive,
.tag-pay.inactive {
    opacity: 0.25;          /* 變得很透明，看起來像灰色沒亮燈 */
    filter: grayscale(100%); /* 強制把裡面的顏色跟圖示變純灰色 */
    cursor: not-allowed;    /* 滑鼠移上去時，會顯示禁止符號 */
}

/* ==========================================================================
   8. 底部懸浮列 (Bottom Bar)
   ========================================================================== */
.bottom-bar {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
    box-sizing: border-box; 
    height: 15%;
    background-color: var(--blur-bg);
    border-top: 1px solid var(--border-color);
    padding:1rem;
    flex-shrink: 0;
    width: 100%;
}

.status-msg {
    font-size: 0.75rem;
    color: var(--text-muted);
    max-width: 12.5rem;
    display: flex;
    align-items: center;
    gap: 0.375rem;
    text-decoration: none;
}

footer .status-indicator {
    width: 0.375rem;
    height: 0.375rem;
    border-radius: 50%;
    background-color: #ff4d4f;
    box-shadow: 0 0 0.5rem #ff4d4f;
}

footer .status-indicator.active{
    background-color: #52c41a;
    box-shadow: 0 0 0.5rem #52c41a;
}


.order-badge-count {
    background-color: var(--brand-red);
    color: white;
    font-size: 0.75rem;
    font-weight: 600;
    min-width: 1rem;
    height: 1rem;
    border-radius: 0.5rem;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0 0.25rem;
    border: 1px solid var(--bg-container);
}

.cart-status-btn {
    background-color: var(--brand-blue);
    color: white;
    border: none;
    padding:0.75rem 1.5rem;
    border-radius: 1.25rem;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    flex-direction: row;
    justify-content: space-around;
    align-items: center;
    gap: 0.25rem;
    text-decoration: none;
    box-shadow: var(--shadow-sm);
    height: 2.25rem;             /* 新增：固定購物車按鈕的物理高度，防止變形 */
    box-sizing: border-box;   /* 新增：確保 padding 不會影響按鈕固定高度 */
}


</style>

            <input type="text" id="adminNewStorePhone" placeholder="聯絡電話 (*必填)" style="padding: 0.5rem; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 0.375rem;">
            <input type="text" id="adminNewStoreCity" placeholder="縣市 (如: 基隆市) (*必填)" style="padding: 0.5rem; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 0.375rem;">
