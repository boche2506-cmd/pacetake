<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PACE 派思 pacetake.tw - 買家首頁</title>
<!-- 1. 給電腦版、手機版 Chrome 瀏覽器標籤頁使用的標準圖示 -->
<link rel="icon" type="image/png" sizes="32x32" href="logo.png">
<link rel="icon" type="image/png" sizes="16x16" href="logo.png">
<!-- 2. 給 Apple iOS 系統（Safari/Chrome）加入主畫面與我的最愛使用的圖示 -->
<link rel="apple-touch-icon" sizes="180x180" href="logo.png">
<link rel="stylesheet" href="style.css">
<style>

/* 頂部群組 - 已調整為自動高度，像紙張一樣隨內容縮放 */
.sticky-top-group {
    height: 28%; 
    flex-shrink: 0;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    background-color: var(--bg-container);
    position: sticky; /* 確保它能固定在頂部 */
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow-sm); /* 增加一點陰影提升紙張層次感 */
}

/* 定位列 */
.location-bar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    width: 100%;
}

.gps-trigger-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 700;
    color: var(--brand-blue);
    background-color: var(--card-bg);
    border: 1px solid var(--border-color);
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: var(--shadow-sm);
    flex-shrink: 0; /* 防止按鈕被擠壓 */
}

.location-select-group {
    display: flex;
    gap: 4px;
}

.nav-select {
    border-radius: 0.5rem;
    border: 1px solid var(--border-color);
    background-color: var(--bg-global);
    color: var(--text-main);
    font-size: 0.875rem;
    padding: 0 0.5rem;
    outline: none;
}

/* 搜尋框 */
.search-container {
    width: 100%;
}

.search-box {
    display: flex;
    align-items: center;
    background-color: var(--bg-global);
    border: 1px solid var(--border-color);
    border-radius: 0.75rem;
    padding: 0 0.75rem;
    height: 2.5rem;
}

.search-box input {
    border: none;
    background: transparent;
    font-size: 1rem;
    color: var(--text-main);
    outline: none;
}

/* 店家列表 */
.store-list {
    height: 57%;
    flex-shrink: 0;
    overflow-y: auto;
    padding: 0.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    -webkit-overflow-scrolling: touch;
}

.store-card {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem;
    background-color: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 1rem;
    text-decoration: none;
    color: inherit;
    box-shadow: var(--shadow-sm);
    transition: transform 0.2s ease;
}

.store-card:hover {
    transform: translateY(-2px);
}

.store-img {
    width: 3.5rem;
    height: 3.5rem;
    background-color: var(--bg-global);
    border-radius: 0.75rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    flex-shrink: 0;
}

.store-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
}

.store-name {
    font-size: 1.125rem;
    font-weight: 700;
    color: var(--text-main);
}

.store-meta {
    font-size: 0.875rem;
    color: var(--text-muted);
}

.store-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

.store-tags span {
    font-size: 10px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
}

.tag-time {
    background-color: rgba(0, 98, 255, 0.08);
    color: var(--brand-blue);
}

.tag-pay {
    background-color: rgba(16, 185, 129, 0.08);
    color: var(--brand-green);
}

.tag-time.inactive,
.tag-pay.inactive {
    opacity: 0.25;          /* 變得很透明，看起來像灰色沒亮燈 */
    filter: grayscale(100%); /* 強制把裡面的顏色跟圖示變純灰色 */
    cursor: not-allowed;    /* 滑鼠移上去時，會顯示禁止符號 */
}

/* 底部列 */
.bottom-bar {
    height: 15%;
    padding: 0.5rem;
    border-top: 1px solid var(--border-color);
    background-color: var(--blur-bg);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0; /* 重要：防止底部被擠壓消失 */
}

.status-msg {
    font-size: 12px;
    color: var(--text-muted);
    max-width: 200px;
    display: flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    height: 36px;             /* 新增：固定狀態文字區域的高度 */
}

footer .status-indicator {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background-color: #ff4d4f;
    flex-shrink: 0;
}

footer .status-indicator.active{
    background-color: #52c41a;
    box-shadow: 0 0 8px #52c41a;
}


.order-badge-count {
    background-color: var(--brand-red);
    color: white;
    font-size: 10px;
    font-weight: 800;
    min-width: 15px;
    height: 15px;
    border-radius: 8px;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
    border: 1px solid var(--bg-container);
}

.cart-status-btn {
    background-color: var(--brand-blue);
    color: white;
    border: none;
    padding: 0.625rem 1.25rem;
    border-radius: 1.5rem;
    font-size: 0.875rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
}

/* 模態框 */
.lightbox-modal {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(4px);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 1rem;
}

.modal-card {
    background-color: var(--bg-container);
    border-radius: 1.5rem;
    width: 100%;
    max-width: 20rem;
    padding: 2rem;
    box-shadow: var(--shadow-md);
}

.modal-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
}

.modal-desc-address {
    font-size: 13px;
    color: var(--text-main);
    line-height: 1.5;
    margin-bottom: 20px;
    word-break: break-all;
    background-color: var(--bg-global);
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    text-align: left;
}

.modal-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 10px;
    border: 1px solid var(--border-color);
    background: var(--card-bg);
    color: var(--text-main);
}

.modal-btn.google {
    background-color: #FFFFFF;
    color: #374151;
    border-color: #E2E8F0;
}

.modal-close {
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
    margin-top: 12px;
    display: inline-block;
}

.loading-spinner {
    text-align: center;
    padding: 40px;
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 600;
}

select {
    width: 100%;       /* 寬度服從父層分配 */
    height: 32px;      /* 鐵律：鎖死高度（配合你原來的 nav-select 設定） */
    padding: 0 8px;    /* 只給左右內距，上下給 0，絕不頂開高度 */
    font-size: 12px;   /* 配合整體導航欄的小巧比例 */
    line-height: 32px; /* 讓 line-height 等於 height，文字就會完美垂直置中 */
    box-sizing: border-box; /* 保險線：確保 border 和 padding 全都算在這 32px 裡面 */
}

</style>
</head>
<body>
<div class="phone-wrapper">
<div id="buyerView" style="display: block;">
<div class="sticky-top-group">
<header id="header-container"></header>
            <div class="location-bar">
            <button class="gps-trigger-btn" id="gpsPinBtn">📍 (目前位置)</button>
            <div class="location-select-group">
            <select class="nav-select" id="citySelect">
                        <option value="">選擇縣市</option>
                        <option value="臺北市">臺北市</option>
                        <option value="新北市">新北市</option>
                        <option value="基隆市">基隆市</option>
                        <option value="桃園市">桃園市</option>
                        <option value="新竹市">新竹市</option>
                        <option value="新竹縣">新竹縣</option>
                        <option value="苗栗縣">苗栗縣</option>
                        <option value="台中市">台中市</option>
                        <option value="彰化縣">彰化縣</option>
                        <option value="南投縣">南投縣</option>
                        <option value="雲林縣">雲林縣</option>
                        <option value="嘉義市">嘉義市</option>
                        <option value="嘉義縣">嘉義縣</option>
                        <option value="台南市">台南市</option>
                        <option value="高雄市">高雄市</option>
                        <option value="屏東縣">屏東縣</option>
                        <option value="宜蘭縣">宜蘭縣</option>
                        <option value="花蓮縣">花蓮縣</option>
                        <option value="臺東縣">臺東縣</option>
                        <option value="澎湖縣">澎湖縣</option>
                        <option value="金門縣">金門縣</option>
                        <option value="連江縣">連江縣</option>
                    </select>
                    <select class="nav-select" id="districtSelect">
                        <option value="">選擇區域</option>
                    </select>
                 </div>
              </div>
        <div class="search-container">
            <div class="search-box">
                <span>🔍</span>
                <input type="text" id="globalSearchInput" placeholder="搜尋商圈美味小吃、店家名稱..." autocomplete="off">
          </div>
        </div>
      </div>
    <main class="store-list" id="store-container">
        <div class="loading-spinner" id="loading-Spinner">⚡ 正在連線雲端資料庫...</div>
    </main>
    <footer class="bottom-bar">
        <a href="orders.html" class="status-msg" >
            <div class="status-indicator active" id="statusDot"></div>
            <div class="order-badge-count" id="orderBadgeCount">0</div>
            <span id="statusText">您目前沒有進行中的訂單喔！</span>
        </a>
        <a href="cart.html" class="cart-status-btn nav-fast">
            <span>🛒 </span>
        </a>
    </footer>
  </div>
<!-- ========================================== -->
<!-- 🔮 派思核心控制台 (Admin 視圖) -->
<!-- ========================================== -->
<div id="adminView" style="display: none; padding: 30px; background: #121212; color: #e0e0e0; min-height: 100vh; font-family: sans-serif;">
    
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding-bottom: 15px; margin-bottom: 20px;">
        <h1 style="color: #4dadff; margin: 0; font-size: 28px;">🔮 派思最高意志控制台</h1>
        <button onclick="window.toggleView('buyer')" style="padding: 10px 20px; background: #ff4d4d; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s;">
            🧑‍💼 返回一般買家視圖
        </button>
    </div> <div style="background: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 25px; border: 1px solid #2d2d2d;">
        <h3 style="color: #ffca28; margin-top: 0;">➕ 新增全新店家</h3>
        <p style="color: #aaa; font-size: 13px; margin-bottom: 15px;">請輸入店家資訊，新增後將立即同步至 Firebase 雲端資料庫。</p>   
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px;">
            <input type="text" id="adminNewStoreName" placeholder="店家名稱 (*必填)" style="padding: 10px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 6px;">
            <input type="text" id="adminNewStorePhone" placeholder="聯絡電話 (*必填)" style="padding: 10px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 6px;">
            <input type="text" id="adminNewStoreCity" placeholder="縣市 (如: 基隆市) (*必填)" style="padding: 10px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 6px;">
            <input type="text" id="adminNewStoreDistrict" placeholder="區域 (如: 七堵區) (*必填)" style="padding: 10px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 6px;">
            <input type="text" id="adminNewStoreAddress" placeholder="詳細地址 (*必填)" style="padding: 10px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 6px; grid-column: span 2;">

        </div>
        <button id="adminSubmitStoreBtn" style="width: 100%; padding: 12px; background: #059669; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s;">✅ 確認新增店家至雲端</button>
    </div> <div style="background: #1e1e1e; padding: 20px; border-radius: 8px; border: 1px solid #2d2d2d; overflow-x: auto;">
        <h3 style="color: #4da5ff; margin-top: 0;"> 📋 目前雲端店家總覽</h3>
        <table style="width: 100%; border-collapse: collapse; margin-top: 15px; text-align: left; font-size: 14px;">
            <tr style="background: #2d2d2d; color: #fff;">
                <th style="padding: 12px; border: 1px solid #3a3a3a;">店家名稱</th>
                <th style="padding: 12px; border: 1px solid #3a3a3a;">詳細地址</th>
                <th style="padding: 12px; border: 1px solid #3a3a3a;">聯絡電話</th>
                <th style="padding: 12px; border: 1px solid #3a3a3a; text-align: center;">核心操作</th>
            </tr>
            <tbody id="adminStoreTableBody">
                <tr><td colspan="4" style="text-align: center; padding: 15px; color: #888;">正在載入雲端資料...</td></tr>
            </tbody>
        </table>
    </div> </div> <div class="lightbox-modal" id="loginLightbox" style="display: none;">
    <div class="modal-card">
        <div class="modal-title" style="font-weight: 700; margin-bottom: 25px; color: #1f2937;">加入PACE 派思</div>
        
        <button class="modal-btn google" id="googleLoginAction" style="box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
            <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right:12px; flex-shrink: 0;">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Google 登入
        </button>

        <button id="toggleEmailFormBtn" style="display: flex; align-items: center; justify-content: center; width: 100%; background-color: white; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 500; color: #374151; margin-top: 14px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:12px; flex-shrink: 0;">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            使用電子郵件登入

        <div id="emailFormSection" style="display: none; margin-top: 20px; text-align: left; width: 100%;">

                </div>
            </div> <button id="emailLoginAction" style="background-color: #059669; color: white; border: none; width:100%; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 2px 4px rgba(5, 150, 105, 0.15);">電子郵件登入 / 註冊</button>

        <div class="modal-title" style="color: var(--brand-blue); font-weight: 700;">📍 目前位置</div>

        <button class="close-modal-btn" id="closeAddressModalBtn" style="background-color: var(--brand-blue); color: white; border: none; width: 100%; height: 42px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;">確認</button>
    </div> </div> </div> <script type="module" src="app.js"></script>
</body>
