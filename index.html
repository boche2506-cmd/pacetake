<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PACE 派思 - 首頁</title>
    <style>
        body { background-color: #000; color: #fff; margin: 0; font-family: sans-serif; }
        .nav-bar { display: flex; gap: 15px; padding: 15px; background: #1a1a1a; border-bottom: 1px solid #333; overflow-x: auto; }
        .nav-bar a { color: #fff; text-decoration: none; font-size: 14px; white-space: nowrap; }
        #buyerView { padding: 20px; }
        .store-card { display: block; background: #1a1a1a; padding: 15px; margin-bottom: 15px; border-radius: 8px; text-decoration: none; color: #fff; }
        .store-name { font-size: 18px; font-weight: bold; }
        .store-meta { font-size: 14px; color: #aaa; margin-top: 5px; }
    </style>
</head>
<body>
    <nav class="nav-bar">
        <a href="index.html">🏠 首頁</a>
        <a href="cart.html">🛒 購物車</a>
        <a href="orders.html">📦 訂單</a>
        <a href="history.html">⏳ 歷史</a>
        <a href="register.html">💼 註冊</a>
        <a href="seller.html">🧑‍🍳 後台</a>
        <a href="manage.html">⚙️ 管理</a>
        <a href="store.html">🏪 店家</a>
    </nav>
    <div id="buyerView">正在連線雲端資料庫...</div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
        const firebaseConfig = { apiKey: "AIzaSyCkAiZCJ6L950KfYJEqubWGi1M8D03OuJI", authDomain: "pacetake-c6e1e.firebaseapp.com", projectId: "pacetake-c6e1e", storageBucket: "pacetake-c6e1e.firebasestorage.app", messagingSenderId: "1052980235056", appId: "1:1052980235056:web:6a06e4ac9b48f1e74896f5", measurementId: "G-888XL8JTHW" };
        const db = getFirestore(initializeApp(firebaseConfig));
        async function renderStores() {
            const container = document.getElementById('buyerView');
            try {
                const querySnapshot = await getDocs(collection(db, "stores"));
                container.innerHTML = '';
                if (querySnapshot.empty) { container.innerHTML = '目前暫無店家資料'; return; }
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const card = document.createElement('a');
                    card.className = 'store-card';
                    card.href = `store.html?id=${doc.id}`;
                    card.innerHTML = `<div class="store-name">${data.name || '未命名店家'}</div><div class="store-meta">📍 ${data.address || '無地址'}</div>`;
                    container.appendChild(card);
                });
            } catch (e) { container.innerHTML = '連線失敗，請檢查網路'; console.error(e); }
        }
        document.addEventListener('DOMContentLoaded', renderStores);
    </script>
</body>
</html>
