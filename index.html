<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PACE 派思 pacetake.tw - 買家首頁</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">

    <style>
        /* 全局變數與主題防線 - 完美呼應 Cyber Blue 品牌色 */
        :root {
            --bg-global: #F8FAFC;
            --bg-container: #FFFFFF;
            --border-color: #E2E8F0;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --brand-blue: #0062FF; 
            --brand-green: #10B981;
            --brand-red: #EF4444;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.05);
            --card-bg: #FFFFFF;
            --blur-bg: rgba(255, 255, 255, 0.95);
        }

        [data-theme="dark"] {
            --bg-global: #0A0A0A;
            --bg-container: #111111;
            --border-color: #262626;
            --text-main: #F5F5F5;
            --text-muted: #A3A3A3;
            --brand-blue: #2F80ED; 
            --brand-green: #34D399;
            --brand-red: #F87171;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.4);
            --card-bg: #1C1C1E;
            --blur-bg: rgba(17, 17, 17, 0.95);
        }

        /* 基礎重設 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-global);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            transition: background-color 0.15s ease;
        }

        /* 手機直屏精品大外框與細邊界 */
        .phone-wrapper {
    width: 100%;
    max-width: 430px;
    height: 100vh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background-color: var(--bg-container);
    
    /* 你提到的視覺效果 */
    border-left: 1px solid var(--border-color);
    border-right: 1px solid var(--border-color);
    box-shadow: var(--shadow-md);
    position: relative;
    padding-bottom: 90px; /* 給底部騰出空間 */
}

        /* 👑 頂部全區常駐吸附天花板 */
        .sticky-top-group {
            position: sticky;
            top: 0;
            z-index: 1000; 
            background-color: var(--blur-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            flex-shrink: 0;
        }

        /* 頂部高級大字留白區 */
        .header {
            padding: 24px 20px 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .brand-title-area {
            display: flex;
            flex-direction: column;
        }

        .brand-logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .brand-title-area h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .brand-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 500;
        }

        /* 右上角一體化控制台 */
        .control-panel {
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            font-size: 16px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            background-color: var(--card-bg);
        }

        .login-btn {
            background-color: var(--brand-blue);
            color: #FFFFFF;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            margin-top: -5px;
            margin-bottom: 5px;
        }

        .user-avatar-btn {
            display: none; 
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            align-items: center;
            gap: 4px;
        }

        /* 下拉選單面板 */
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 42px;
            right: 0;
            width: 200px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            z-index: 1100;
            padding: 6px;
        }

        .dropdown-menu a, .dropdown-menu button {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 10px 12px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 13px;
            border: none;
            background: none;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
        }

        .dropdown-menu a:hover, .dropdown-menu button:hover {
            background-color: var(--bg-global);
        }

        .menu-divider {
            height: 1px;
            background-color: var(--border-color);
            margin: 6px 0;
        }

        /* 👑 智慧選單分流區塊 */
        .seller-unlock { display: none; }
        .admin-unlock { display: none; }

        /* 精品 GPS 定位管理列 */
        .location-bar {
            padding: 4px 20px 8px 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .gps-trigger-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: 700;
            color: var(--brand-blue);
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: var(--shadow-sm);
        }

        .location-select-group {
            display: flex;
            gap: 4px;
            flex-grow: 1;
        }

        .nav-select {
            flex: 1;
            height: 32px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-global);
            color: var(--text-main);
            font-size: 12px;
            font-weight: 600;
            padding: 0 4px;
            outline: none;
            cursor: pointer;
        }

        /* 中間：搜尋欄 */
        .search-container {
            padding: 8px 20px 4px 20px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background-color: var(--bg-global);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0 14px;
            height: 46px;
        }

        .search-box input {
            border: none;
            background: none;
            width: 100%;
            height: 100%;
            margin-left: 8px;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
        }

        /* 下方：店家列表區樣式補強面防線 */
        .store-list {
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .store-card {
            display: flex;
            align-items: center;
            gap: 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px;
            text-decoration: none;
            color: inherit;
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
          /* 🌟 關鍵補強防線：強迫卡片指名服從手機大外框的 100% 寬度限制，絕對不准擠破框架！ */
            width: 100%; 
        }
        .store-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.06);
        }

        .store-img {
            width: 54px;
            height: 54px;
            background-color: var(--bg-global);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            flex-shrink: 0;
        }

        .store-info {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
            gap: 6px;
        }

        .store-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
        }

        .store-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .store-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .store-tags span {
            font-size: 10px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .tag-time {
            background-color: rgba(0, 98, 255, 0.08);
            color: var(--brand-blue);
        }

        .tag-pay {
            background-color: rgba(16, 185, 129, 0.08);
            color: var(--brand-green);
        }

        /* 底部常駐懸浮欄 */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            height: 76px;
            background-color: var(--blur-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px 10px 20px;
            z-index: 999;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.05);
            flex-shrink: 0;
        }

        .status-msg {
            font-size: 12px;
            color: var(--text-muted);
            max-width: 200px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--text-muted);
            flex-shrink: 0;
            position: relative;
        }

        .status-indicator.active {
            background-color: var(--brand-green);
            box-shadow: 0 0 8px var(--brand-green);
        }

        .order-badge-count {
            background-color: var(--brand-red);
            color: white;
            font-size: 10px;
            font-weight: 800;
            min-width: 15px;
            height: 15px;
            border-radius: 8px;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            border: 1px solid var(--bg-container);
        }

        .cart-status-btn {
            background-color: var(--brand-blue);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            box-shadow: var(--shadow-sm);
        }

        /* 燈箱樣式 */
        .lightbox-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-card {
            background-color: var(--bg-container);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            width: 100%;
            max-width: 320px;
            padding: 24px;
            box-shadow: var(--shadow-md);
            text-align: center;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .modal-desc-address {
            font-size: 13px;
            color: var(--text-main);
            line-height: 1.5;
            margin-bottom: 20px;
            word-break: break-all;
            background-color: var(--bg-global);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            text-align: left;
        }

        .modal-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-main);
        }

        .modal-btn.google {
            background-color: #FFFFFF !important;
            color: #374151 !important;
            border-color: #E2E8F0 !important;
        }

        .modal-close {
            font-size: 12px;
            color: var(--text-muted);
            cursor: pointer;
            margin-top: 12px;
            display: inline-block;
        }

        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
        }
        .scrollable-content {
    flex: 1;          /* 自動吃掉剩下的高度空間 */
    overflow-y: auto; /* 只有這裡會滾動 */
    padding: 16px;
         }
    </style>
</head>
<body>
    <div class="phone-wrapper">
        
        <div class="sticky-top-group">
            <header class="header">
                <div class="brand-title-area">
                    <div class="brand-logo-container">
                        <div>
                            <h1>PACE</h1>
                            <div class="brand-subtitle">店內價外帶自取/點餐系統</div>
                        </div>
                    </div>
                </div>

                <div class="control-panel">
                    <button class="user-avatar-btn" id="avatarBtn" style="display: none;">
                        <span class="avatar-icon">👤</span>
                        <span class="user-name" id="userNameDisplay">載入中...</span>
                    </button>
                    <button class="theme-toggle" id="themeToggleBtn" aria-label="切換主題">🌙</button>
                    <button class="login-btn" id="loginBtn">登入 / 註冊</button>
                    <div class="dropdown-menu" id="dropdownMenu"></div>
                </div>
            </header>

            <div class="location-bar">
                <button class="gps-trigger-btn" id="gpsPinBtn">📍 (目前位置)</button>
                <div class="location-select-group">
                    <select class="nav-select" id="citySelect">
                        <option value="">選擇縣市</option>
                        <option value="臺北市">臺北市</option>
                        <option value="新北市">新北市</option>
                        <option value="基隆市">基隆市</option>
                        </select>
                    <select class="nav-select" id="districtSelect">
                        <option value="">選擇區域</option>
                    </select>
                </div>
            </div>
                
            <div class="search-container">
                <div class="search-box">
                    <span>🔍</span>
                    <input type="text" id="globalSearchInput" placeholder="搜尋商圈美味小吃、店家名稱..." autocomplete="off">
                </div>
            </div>
        </div>

        <main class="scrollable-content" id="store-container">
            <div class="loading-spinner" id="loadingSpinner">⚡ 正在安全連線雲端資料庫...</div>
            </main>

        <footer class="bottom-bar">
            <a href="history.html" class="status-msg" id="bottomStatusMsg">
                <div class="status-indicator active" id="statusDot"></div>
                <div class="order-badge-count" id="orderBadgeCount">0</div>
                <span id="statusText">您目前沒有進行中的訂單喔！</span>
            </a>
            <a href="cart.html" class="cart-status-btn nav-fast">
                <span>🛒 購物車</span>
                <span id="cartCount">(0)</span>
            </a>
        </footer>

    </div><script type="module">
    initTheme();

    const loginBtn = document.getElementById('loginBtn');
    const avatarBtn = document.getElementById('avatarBtn');
    const dropdownMenu = document.getElementById('dropdownMenu');
    const userNameDisplay = document.getElementById('userNameDisplay');
    const storeContainer = document.getElementById('store-container');
    
    const loginLightbox = document.getElementById('loginLightbox');
    const googleLoginAction = document.getElementById('googleLoginAction');
    const toggleEmailFormBtn = document.getElementById('toggleEmailFormBtn');
    const emailFormSection = document.getElementById('emailFormSection');
    const customReturnBtn = document.getElementById('customReturnBtn');
    const loginEmailInput = document.getElementById('loginEmail');
    const loginPasswordInput = document.getElementById('loginPassword');
    const emailLoginAction = document.getElementById('emailLoginAction');

    const citySelect = document.getElementById('citySelect');
    const districtSelect = document.getElementById('districtSelect');
    const gpsPinBtn = document.getElementById('gpsPinBtn');
    const addressDetailLightbox = document.getElementById('addressDetailLightbox');
    const modalAddressText = document.getElementById('modalAddressText');
    const closeAddressModalBtn = document.getElementById('closeAddressModalBtn');
    const globalSearchInput = document.getElementById('globalSearchInput');

    // 下拉選單點擊開關
    avatarBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdownMenu.style.display = dropdownMenu.style.display === 'block' ? 'none' : 'block';
    });
    document.addEventListener('click', (e) => { 
        if (!avatarBtn.contains(e.target) && !dropdownMenu.contains(e.target)) {
            dropdownMenu.style.display = 'none'; 
        }
    });

    loginBtn.addEventListener('click', () => { loginLightbox.style.display = 'flex'; });
    customReturnBtn.addEventListener('click', () => { loginLightbox.style.display = 'none'; });
    toggleEmailFormBtn.addEventListener('click', () => {
        emailFormSection.style.display = emailFormSection.style.display === 'none' ? 'block' : 'none';
    });

    document.getElementById('togglePasswordVisibility').addEventListener('click', function() {
        const type = loginPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        loginPasswordInput.setAttribute('type', type);
        this.textContent = type === 'password' ? '👁️' : '🙈';
    });

    gpsPinBtn.addEventListener('click', () => {
        modalAddressText.innerText = currentBuyerAddress;
        addressDetailLightbox.style.display = 'flex';
    });
    closeAddressModalBtn.addEventListener('click', () => { addressDetailLightbox.style.display = 'none'; });

    citySelect.addEventListener('change', () => {
        const selectedCity = citySelect.value;
        districtSelect.innerHTML = '<option value="">選擇區域</option>';
        if (areaData[selectedCity]) {
            areaData[selectedCity].forEach(dist => {
                const opt = document.createElement('option');
                opt.value = dist;
                opt.innerText = dist;
                districtSelect.appendChild(opt);
            });
        }
        filterAndRenderStores();
    });
    districtSelect.addEventListener('change', filterAndRenderStores);
    globalSearchInput.addEventListener('input', filterAndRenderStores);

    // 👑 渲染動態選單 (已將邀請碼功能綁定至 window.issuePromoCode)
    function renderDynamicMenu(role) {
        let menuHTML = `
            <a href="orders.html" class="nav-fast">🛒 我的訂單</a>
            <a href="history.html" class="nav-fast">⏳ 歷史訂單</a>
        `;

        if (role === 'buyer') {
            menuHTML += `<a href="register.html" class="nav-fast" style="color: var(--brand-blue); font-weight: 700;">💼 月費開店(暫不收費)</a>`;
        } 
        
        if (role === 'seller' || role === 'admin') {
            menuHTML += `
                <div class="menu-divider"></div>
                <a href="seller.html" class="nav-fast">🧑‍🍳 接單管理</a>
                <a href="manage.html" class="nav-fast">⚙️ 後台管理</a>
                <a href="#" class="nav-fast" data-target="pay">💵 繳費</a>
            `;
        }

        if (role === 'admin') {
            menuHTML += `
                <div class="menu-divider"></div>
                <a href="javascript:void(0)" onclick="window.toggleView('admin')" style="color: var(--brand-blue); font-weight: bold;">🔮 派思控制台</a>
                <a href="javascript:void(0)" onclick="window.issuePromoCode()" style="color: var(--brand-green); font-weight: bold;">🎟️ 邀請碼發行</a>
                <a href="register.html" class="nav-fast" style="color: var(--brand-blue); font-weight: 700;">💼 月費開店(暫不收費)</a>
            `;
        }

        menuHTML += `
            <div class="menu-divider"></div>
            <button id="logoutBtn" style="color: var(--brand-red);">🚪 登出</button>
        `;

        dropdownMenu.innerHTML = menuHTML;
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await signOut(auth);
            location.reload();
        });
    }

    async function handleUserSyncAndRoleRouting(user) {
        if (!user) return;
        currentUserId = user.uid;

        const userDocRef = doc(db, "users", user.uid);
        const userDocSnap = await getDoc(userDocRef);
        let currentRole = "buyer"; 

        if (userDocSnap.exists()) {
            const data = userDocSnap.data();
            currentRole = data.role || "buyer";
            await updateDoc(userDocRef, {
                lastLogin: new Date().toISOString(),
                email: user.email || data.email,
                displayName: user.displayName || data.displayName || "PACE用戶"
            });
        } else {
            await setDoc(userDocRef, {
                uid: user.uid,
                email: user.email || "",
                displayName: user.displayName || "PACE用戶",
                role: "buyer",
                createdAt: new Date().toISOString(),
                lastLogin: new Date().toISOString()
            });
        }

        loginBtn.style.display = 'none';
        avatarBtn.style.display = 'flex';
        loginLightbox.style.display = 'none';

        if (currentRole === "admin") {
            userNameDisplay.innerHTML = `👑 總管：${user.displayName || '天神'}`;
        } else if (currentRole === "seller") {
            userNameDisplay.innerHTML = `🏪 店家老闆`;
        } else {
            userNameDisplay.innerHTML = `🧑‍💼 一般買家`;
        }
        renderDynamicMenu(currentRole);
    }

    googleLoginAction.addEventListener('click', async () => {
        try {
            const result = await signInWithPopup(auth, provider);
            await handleUserSyncAndRoleRouting(result.user);
        } catch (error) {
            console.error("Google 登入失敗：", error);
            alert("連線失敗，請檢查網路防線！");
        }
    });

    emailLoginAction.addEventListener('click', async () => {
        const email = loginEmailInput.value.trim();
        const password = loginPasswordInput.value;
        if (!email || !password) {
            alert("密碼或 Email 欄位不可為空！");
            return;
        }

        try {
            const result = await signInWithEmailAndPassword(auth, email, password);
            await handleUserSyncAndRoleRouting(result.user);
        } catch (loginError) {
            if (loginError.code === "auth/user-not-found" || loginError.code === "auth/invalid-credential") {
                try {
                    const result = await createUserWithEmailAndPassword(auth, email, password);
                    await handleUserSyncAndRoleRouting(result.user);
                } catch (regError) {
                    alert("註冊密碼強度不足，或帳號已被佔用！");
                }
            } else {
                alert("登入密碼有誤，請再確認一次！");
            }
        }
    });

    onAuthStateChanged(auth, (user) => {
        if (user) {
            handleUserSyncAndRoleRouting(user);
        } else {
            loginBtn.style.display = 'block';
            avatarBtn.style.display = 'none';
            dropdownMenu.style.display = 'none';
            dropdownMenu.innerHTML = '';
        }
    });

    // 📥 讀取雲端店家 (買家列表 & 後台列表 同時更新)
    async function fetchStoresFromFirebase() {
        try {
            const querySnapshot = await getDocs(collection(db, "stores"));
            allStores = [];
            querySnapshot.forEach((doc) => {
                allStores.push({ id: doc.id, ...doc.data() });
            });
            filterAndRenderStores();
            renderAdminTable(); // 🚀 同步更新後台的店家表格
        } catch (error) {
            console.error("讀取店家失敗：", error);
            storeContainer.innerHTML = '<div class="loading-spinner" style="color:var(--brand-red);">❌ 無法取得雲端店家資料</div>';
        }
    }

    function filterAndRenderStores() {
        const selectedCity = citySelect.value;
        const selectedDist = districtSelect.value;
        const searchKeyword = globalSearchInput.value.toLowerCase().trim();

        const filtered = allStores.filter(store => {
            const matchCity = !selectedCity || store.city === selectedCity;
            const matchDist = !selectedDist || store.district === selectedDist;
            const matchKeyword = !searchKeyword || 
                                 (store.name && store.name.toLowerCase().includes(searchKeyword)) ||
                                 (store.shopName && store.shopName.toLowerCase().includes(searchKeyword)) ||
                                 (store.category && store.category.toLowerCase().includes(searchKeyword));
            return matchCity && matchDist && matchKeyword;
        });

        if (filtered.length === 0) {
            storeContainer.innerHTML = '<div class="loading-spinner">🍃 此商圈目前尚無合作店家進駐喔！</div>';
            return;
        }

        storeContainer.innerHTML = "";
        filtered.forEach(store => {
            const finalName = store.shopName || store.name || '未命名店家';
            const finalAddress = store.shopAddress || store.address || '';
            const finalCity = store.city || '';
            const finalDistrict = store.district || '';
            const finalCategory = store.category || '美食';

            const card = document.createElement('a');
            card.href = `menu.html?storeId=${store.id}`;
            card.className = 'store-card';
            card.innerHTML = `
                <div class="store-img">${store.emoji || '🏪'}</div>
                <div class="store-info">
                    <div>
                        <div class="store-name">${finalName}</div>
                        <div class="store-meta">📍 ${finalCity}${finalDistrict} ${finalAddress} · ${finalCategory}</div>
                    </div>
                    <div class="store-tags">
                        <span class="tag-time">⏱️ 店內價外帶</span>
                        <span class="tag-pay">💳 支援線上支付</span>
                    </div>
                </div>
            `;
            storeContainer.appendChild(card);
        });
    }

    function getBrowserLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    buyerLat = position.coords.latitude;
                    buyerLng = position.coords.longitude;
                    currentBuyerAddress = `經度: ${buyerLng.toFixed(4)}, 緯度: ${buyerLat.toFixed(4)} (GPS 衛星精準定位)`;
                    gpsPinBtn.innerText = "📍 已獲取核心定位";
                },
                (error) => {
                    currentBuyerAddress = "瀏覽器定位遭拒，請手動選擇下方下拉選單縣市。";
                    gpsPinBtn.innerText = "📍 定位受阻";
                }
            );
        } else {
            currentBuyerAddress = "您的裝置不支援 GPS 定位裝置。";
        }
    }

    // 啟動資料庫與定位抓取
    fetchStoresFromFirebase();
    getBrowserLocation();

    // ==========================================
    // 🔥 後台控制台專屬功能區 (新增/刪除店家、發行邀請碼)
    // ==========================================

    // 1. 後台渲染店家表格
    function renderAdminTable() {
        const tbody = document.getElementById('adminStoreTableBody');
        if(!tbody) return;
        
        tbody.innerHTML = '';
        if(allStores.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:15px; color:#aaa;">目前雲端尚無店家資料</td></tr>';
            return;
        }

        allStores.forEach(store => {
            const finalName = store.shopName || store.name || '未命名店家';
            const finalAddress = store.shopAddress || store.address || '';
            const phone = store.phone || '無資料';
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="padding: 12px; border: 1px solid #3a3a3a; color: #ffca28; font-weight: bold;">${finalName}</td>
                <td style="padding: 12px; border: 1px solid #3a3a3a; color: #bbb;">${store.city || ''}${store.district || ''} ${finalAddress}</td>
                <td style="padding: 12px; border: 1px solid #3a3a3a; color: #bbb;">${phone}</td>
                <td style="padding: 12px; border: 1px solid #3a3a3a; text-align: center;">
                    <button onclick="window.deleteStore('${store.id}')" style="padding: 6px 12px; background: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">刪除</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 2. 雲端新增店家邏輯
    const adminSubmitStoreBtn = document.getElementById('adminSubmitStoreBtn');
    if (adminSubmitStoreBtn) {
        adminSubmitStoreBtn.addEventListener('click', async () => {
            const name = document.getElementById('adminNewStoreName').value.trim();
            const phone = document.getElementById('adminNewStorePhone').value.trim();
            const city = document.getElementById('adminNewStoreCity').value;
            const district = document.getElementById('adminNewStoreDistrict').value.trim();
            const address = document.getElementById('adminNewStoreAddress').value.trim();
            const category = document.getElementById('adminNewStoreCategory').value.trim();

            if (!name || !district || !address) {
                alert("⚠️ 店名、區域、詳細地址為必填項目！");
                return;
            }

            adminSubmitStoreBtn.innerText = "⏳ 正在同步至雲端...";
            try {
                // 將資料寫入 Firebase 的 stores 集合
                await addDoc(collection(db, "stores"), {
                    name: name,
                    shopName: name, // 兼容前端不同寫法
                    phone: phone,
                    city: city,
                    district: district,
                    address: address,
                    shopAddress: address, // 兼容寫法
                    category: category,
                    createdAt: new Date().toISOString()
                });
                
                alert("✅ 店家已成功新增至雲端！");
                
                // 清空輸入框
                document.getElementById('adminNewStoreName').value = '';
                document.getElementById('adminNewStorePhone').value = '';
                document.getElementById('adminNewStoreDistrict').value = '';
                document.getElementById('adminNewStoreAddress').value = '';
                document.getElementById('adminNewStoreCategory').value = '';
                
                // 重新讀取 Firebase 更新畫面
                fetchStoresFromFirebase();
            } catch (error) {
                console.error("新增店家失敗:", error);
                alert("新增失敗，請檢查網路或資料庫權限！");
            } finally {
                adminSubmitStoreBtn.innerText = "✅ 確認新增店家至雲端";
            }
        });
    }

    // 3. 雲端刪除店家邏輯 (掛載到 window 供 HTML 呼叫)
    window.deleteStore = async function(storeId) {
        if (confirm("⚠️ 確定要從 Firebase 徹底刪除這個店家嗎？(刪除後無法恢復)")) {
            try {
                await deleteDoc(doc(db, "stores", storeId));
                alert("🗑️ 店家已成功刪除！");
                fetchStoresFromFirebase(); // 重新讀取畫面
            } catch (error) {
                console.error("刪除失敗:", error);
                alert("刪除失敗，請確認你的 Admin 權限！");
            }
        }
    };

    // 4. 邀請碼寫入 Firebase 邏輯
    window.issuePromoCode = async function() {
        const code = prompt('請輸入要發行的 VIP 邀請碼 (例如: PACE2026):');
        if (!code || code.trim() === "") return;
        
        try {
            // 在 promoCodes 集合中建立一份新文件，ID 就是邀請碼本身
            await setDoc(doc(db, "promoCodes", code.trim()), {
                code: code.trim(),
                createdBy: currentUserId,
                createdAt: new Date().toISOString(),
                isActive: true,
                usedBy: null // 預留給未來記錄誰使用了這個碼
            });
            alert(`🎟️ 邀請碼「${code}」已成功寫入 Firebase！買家現在可以使用它了。`);
        } catch (error) {
            console.error("邀請碼發行失敗:", error);
            alert("發行失敗，請檢查您的系統權限配置！");
        }
    };

    // 5. 視圖切換
    window.toggleView = function(viewRole) {
        const adminEl = document.getElementById('adminView');
        const buyerEl = document.getElementById('buyerView');
        if (viewRole === 'admin') {
            if (adminEl) adminEl.style.display = 'block';
            if (buyerEl) buyerEl.style.display = 'none';
            window.scrollTo(0, 0);
        } else {
            if (adminEl) adminEl.style.display = 'none';
            if (buyerEl) buyerEl.style.display = 'block';
        }
    };

    document.addEventListener("DOMContentLoaded", () => {
        const buyerView = document.getElementById('buyerView');
        if (buyerView) buyerView.style.display = 'block';
    });
</script>
</body>
</html>
