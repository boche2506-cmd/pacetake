<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>快拿自取街 pacetake.tw - 店內價預約外帶自取系統</title>
    
    <!-- 🎯 終極修復防線：改用全球最穩定、絕對不衝突的 Tailwind CSS 標準版大幹線 -->
    <link href="https://cloudflare.com" rel="stylesheet">
    <!-- FontAwesome 全球標準圖標 -->
    <link rel="stylesheet" href="https://cloudflare.com">

    <!-- 大廠級免圖檔「精品藍色便當」我的最愛 Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 24 24' fill='%230066FF'%3E%3Cpath d='M2 9h20v2H2V9zm1 4h18v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-6zm3-8a3 3 0 0 1 6 0h2a3 3 0 0 1 6 0v2H2V5h1zm3 0a1 1 0 0 0-2 0v2h2V5zm8 0a1 1 0 0 0-2 0v2h2V5z'/%3E%3C/svg%3E">

    <style>
        .smooth-transition { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        /* 🤫 下拉選單純原生強制封印與定位，100% 絕對隱藏 */
        .custom-dropdown { display: none; position: absolute; top: 56px; right: 0; background: white; border: 2px solid #E2E8F0; border-radius: 16px; width: 220px; box-shadow: 0 12px 30px rgba(0,0,0,0.15); z-index: 999; overflow: hidden; }
        .custom-dropdown.active { display: block !important; }
        /* 📱 RWD 高奢全螢幕精品大外框 + 精緻邊框 */
        .app-container { width: 100%; max-width: 500px; margin: 0 auto; background: white; min-height: 100vh; position: relative; border-left: 1px solid #E2E8F0; border-right: 1px solid #E2E8F0; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15); }
        @media (min-width: 640px) { .app-container { min-height: 92vh; margin-top: 24px; border-radius: 32px; border: 2px solid #CBD5E1; } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen pb-28 md:py-6">

    <!-- 精緻大外框容器包覆 -->
    <div class="app-container flex flex-col justify-between">
        
        <div>
            <!-- 頂部導覽列 -->
            <header class="bg-white border-b border-gray-100 sticky top-0 z-40 bg-opacity-95 backdrop-filter backdrop-blur-md px-5 h-16 flex items-center justify-between">
                <div class="flex flex-col">
                    <span class="text-xl font-black tracking-wider text-blue-600">PACE 派思</span>
                    <span class="text-[9px] text-gray-400 font-bold -mt-0.5">店內價預約外帶自取/內用點單系統</span>
                </div>
                
                <div class="relative flex items-center">
                    <!-- 狀態一：未登入按鈕 -->
                    <button onclick="simulateGoogleLogin()" id="googleLoginBtn" class="smooth-transition text-xs font-black text-white bg-blue-600 hover:bg-blue-700 px-4 py-2.5 rounded-xl shadow-md transform active:scale-95">
                        <i class="fa-brands fa-google mr-1"></i> Google 登入 / 註冊
                    </button>

                    <!-- 狀態二：登入後的圓形用戶頭像 (內嵌便當圖案) -->
                    <div onclick="toggleDropdown(event)" id="userAvatar" class="w-10 h-10 rounded-full border-2 border-blue-600 bg-blue-50 flex items-center justify-center cursor-pointer transform active:scale-95 smooth-transition hidden shadow-md">
                        <svg class="w-5 h-5 text-blue-600" xmlns="http://w3.org" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M2 9h20v2H2V9zm1 4h18v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-6zm3-8a3 3 0 0 1 6 0h2a3 3 0 0 1 6 0v2H2V5h1zm3 0a1 1 0 0 0-2 0v2h2V5zm8 0a1 1 0 0 0-2 0v2h2V5z"/>
                        </svg>
                    </div>

                    <!-- 🤫 依照筆記整合：下拉選單控制台 -->
                    <div class="custom-dropdown" id="avatarDropdown">
                        <!-- 頂部模擬身分切換面板 -->
                        <div class="flex border-b border-gray-200 bg-gray-50">
                            <button onclick="switchRole('buyer', event)" id="btnRoleBuyer" class="flex-1 text-[10px] font-black py-2 text-center border-none cursor-pointer bg-blue-600 text-white">模擬買家</button>
                            <button onclick="switchRole('seller', event)" id="btnRoleSeller" class="flex-1 text-[10px] font-bold py-2 text-center border-none cursor-pointer bg-transparent text-gray-500">模擬月費賣家</button>
                        </div>
                        
                        
                            身分狀態：一般買家
                        </div>
                        <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:text-blue-600 hover:bg-gray-50 font-bold text-xs no-underline border-b border-gray-100"><i class="fa-solid fa-basket-shopping text-gray-400"></i> 我的訂單</a>
                        <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:text-blue-600 hover:bg-gray-50 font-bold text-xs no-underline border-b border-gray-100"><i class="fa-solid fa-clock-rotate-left text-gray-400"></i> 歷史訂單</a>
                        
                        <!-- 🔵 一般買家專屬 -->
                        <a href="register.html" id="menuBuyerOpenStore" class="flex items-center gap-3 px-4 py-3 text-blue-600 hover:bg-blue-50 font-black text-xs no-underline border-b border-gray-100">
                            <i class="fa-solid fa-store text-blue-600"></i> 月費開店
                        </a>
                        
                        <!-- 🍳 月費賣家解封路徑 -->
                        <a href="seller.html" id="menuSeller接單" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:text-blue-600 hover:bg-gray-50 font-bold text-xs no-underline border-b border-gray-100" style="display: none;">
                            <i class="fa-solid fa-fire-burner text-green-500"></i> 接單管理 >> 畫面二
                        </a>
                        <a href="manage.html" id="menuSeller後台" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:text-blue-600 hover:bg-gray-50 font-bold text-xs no-underline border-b border-gray-100" style="display: none;">
                            <i class="fa-solid fa-sliders text-blue-600"></i> 後台管理 >> 新增/帳務
                        </a>
                        <a href="#" id="menuSeller繳費" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:text-blue-600 hover:bg-gray-50 font-bold text-xs no-underline border-b border-gray-100" style="display: none;">
                            <i class="fa-solid fa-credit-card text-yellow-500"></i> 繳費
                        </a>
                        
                        <!-- 🚪 登出 -->
                        <div onclick="simulateLogout()" class="flex items-center gap-3 px-4 py-3 text-red-500 hover:bg-red-50 font-black text-xs cursor-pointer">
                            <i class="fa-solid fa-right-from-bracket"></i> 登出帳號
                        </div>
                    </div>
                </div>
            </header>

            <!-- 主內文工作區 -->
            <main class="p-5 flex flex-col gap-5">
                <!-- 加寬搜尋欄 -->
                <div class="relative shadow-sm rounded-2xl overflow-hidden border border-gray-200">
                    <input type="text" class="w-full bg-white px-5 py-4 pl-12 text-sm font-bold focus:outline-none" placeholder="搜尋美食、甜點、店家名稱...">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 text-base"></i>
                </div>

                <p class="text-[11px] font-black text-gray-400 -mb-2 uppercase tracking-wider"><i class="fa-solid fa-location-dot text-blue-600 mr-0.5"></i> 附近營業中 (GPS 依距離排序)</p>

                <!-- 店家列表區 -->
                <section class="flex flex-col gap-3.5">
                    <!-- 店家 1 -->
                    <div class="bg-white rounded-3xl p-4 flex gap-4 border border-gray-200 shadow-sm hover:shadow-md smooth-transition cursor-pointer">
                        <div class="w-20 h-20 rounded-2xl overflow-hidden bg-gray-100 flex-shrink-0 border border-gray-100">
                            <img src="https://unsplash.com" alt="司機推薦爆肉糯米飯" class="w-full h-full object-cover">
                        </div>
                        <div class="flex-1 flex flex-col justify-between py-0.5">
                            <h2 class="font-black text-gray-800 text-base tracking-wide">司機推薦爆肉糯米飯</h2>
                            <p class="text-[11px] font-bold text-gray-400">中式美食 · 距離 50m</p>
                            <div class="flex items-center gap-1.5 flex-wrap">
                                <span class="bg-gray-100 text-gray-700 text-[9px] font-black px-1.5 py-0.5 rounded border border-gray-200">約 5 分鐘出餐</span>
                                <span class="text-blue-600 border border-blue-200 bg-blue-50 text-[9px] font-black px-1.5 py-0.5 rounded">A 支援線上刷卡/LINE Pay</span>
                            </div>
                        </div>
                    </div>

                    <!-- 店家 2 -->
                    <div class="bg-white rounded-3xl p-4 flex gap-4 border border-gray-200 shadow-sm hover:shadow-md smooth-transition cursor-pointer">
                        <div class="w-20 h-20 rounded-2xl overflow-hidden bg-gray-100 flex-shrink-0 border border-gray-100">
                            <img src="https://unsplash.com" alt="黑糖波霸鮮奶茶" class="w-full h-full object-cover">
                        </div>
                        <div class="flex-1 flex flex-col justify-between py-0.5">
                            <h2 class="font-black text-gray-800 text-base tracking-wide">黑糖波霸鮮奶茶</h2>
                            <p class="text-[11px] font-bold text-gray-400">珍奶 · 距離 120m</p>
                            <div class="flex items-center gap-1.5 flex-wrap">
                                <span class="bg-gray-100 text-gray-700 text-[9px] font-black px-1.5 py-0.5 rounded border border-gray-200">約 3 分鐘出餐</span>
                                <span class="text-gray-500 border border-gray-200 bg-gray-50 text-[9px] font-bold px-1.5 py-0.5 rounded">💵 僅限現場付現</span>
                            </div>
                        </div>
                    </div>
                </section>
            </main>
        </div>

        <!-- 🎯 底部半透明磨砂玻璃懸浮欄 (拿掉手機開店，預設顯示無訂單狀態) -->
        <div class="p-4 bg-white">
            <div class="w-full bg-white bg-opacity-80 backdrop-filter backdrop-blur-lg border border-gray-200 rounded-2xl px-5 py-4 flex items-center justify-between shadow-xl">
                <div class="flex items-center gap-3">
                    <div class="w-2.5 h-2.5 bg-green-500 rounded-full relative" id="orderPulseLight" style="display: none;">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75 top-0 left-0"></span>
                    </div>
                    <div>
                        <p class="text-xs font-black text-gray-800" id="orderMainTitle">您目前沒有訂單</p>
                        <p class="text-[10px] text-gray-400 font-bold mt-0.5" id="orderSubTitle">快去上方搜尋商圈美味小吃吧！</p>
                    </div>
                </div>
                <button class="bg-blue-600 text-white text-xs font-black px-4 py-2.5 rounded-xl shadow-md border-none flex items-center gap-1">
                    <i class="fa-solid fa-basket-shopping"></i> 購物車 (0)
                </button>
            </div>
        </div>

    </div>

    <script>
        // 🚀 0秒預載閃轉外掛與模擬登入
        document.addEventListener('DOMContentLoaded', () => {
            const status = localStorage.getItem('userStatus') || 'loggedOut';
            const role = localStorage.getItem('userRole') || 'buyer';
            
            if(status !== 'loggedOut') {
                showLoggedInState(role);
            }

            // 觸碰即秒轉，不給一丁點延遲時間
            const links = [
                { id: "menuBuyerOpenStore", url: "register.html" },
                { id: "menuSeller接單", url: "seller.html" },
                { id: "menuSeller後台", url: "manage.html" }
            ];
            links.forEach(item => {
                const el = document.getElementById(item.id);
                if(el) {
                    const fast = (e) => { e.preventDefault(); window.location.href = item.url; };
                    el.addEventListener('touchstart', fast);
                    el.addEventListener('mousedown', fast);
                }
            });
        });

        function simulateGoogleLogin() {
            alert("Google 帳號連結成功！");
            localStorage.setItem('userStatus', 'loggedIn');
            localStorage.setItem('userRole', 'buyer');
            showLoggedInState('buyer');
            simulateActiveOrder(); // 模擬登入後帶入一筆測試中訂單
        }

        function switchRole(role, e) {
            e.stopPropagation();
            localStorage.setItem('userRole', role);
            showLoggedInState(role);
        }

        function simulateActiveOrder() {
            document.getElementById('orderPulseLight').style.display = 'block';
            document.getElementById('orderMainTitle').innerText = "您的訂單 #023 製作中...";
            document.getElementById('orderSubTitle').innerText = "預計 12:30 準時可外帶自取";
        }

        function simulateLogout() {
            localStorage.removeItem('userStatus');
            localStorage.removeItem('userRole');
            document.getElementById('googleLoginBtn').style.display = 'inline-flex';
            document.getElementById('userAvatar').style.display = 'none';
            document.getElementById('avatarDropdown').classList.remove('active');
            
            document.getElementById('orderPulseLight').style.display = 'none';
            document.getElementById('orderMainTitle').innerText = "您目前沒有訂單";
            document.getElementById('orderSubTitle').innerText = "快去上方搜尋商圈美味小吃吧！";
            alert("已登出帳號。");
        }

        function showLoggedInState(role) {
            document.getElementById('googleLoginBtn').style.display = 'none';
            document.getElementById('userAvatar').style.display = 'flex';
            
            const btnRoleBuyer = document.getElementById('btnRoleBuyer');
            const btnRoleSeller = document.getElementById('btnRoleSeller');
            const idText = document.getElementById('userIdentityText');
            
            const buyerOpenStore = document.getElementById('menuBuyerOpenStore');
            const seller接單 = document.getElementById('menuSeller接單');
            const seller後台 = document.getElementById('menuSeller後台');
            const seller繳費 = document.getElementById('menuSeller繳費');

            if(role === 'seller') {
                btnRoleBuyer.className = "flex-1 text-[10px] font-bold py-2 text-center border-none cursor-pointer bg-transparent text-gray-500";
                btnRoleSeller.className = "flex-1 text-[10px] font-black py-2 text-center border-none cursor-pointer bg-blue-600 text-white";
                
                idText.innerText = "身分狀態：👑 尊貴月費賣家";
                idText.style.color = "#2563EB";
                
                buyerOpenStore.style.display = 'none';
                seller接單.style.display = 'flex';
                seller後台.style.display = 'flex';
                seller繳費.style.display = 'flex';
                simulateActiveOrder();
            } else {
                btnRoleBuyer.className = "flex-1 text-[10px] font-black py-2 text-center border-none cursor-pointer bg-blue-600 text-white";
                btnRoleSeller.className = "flex-1 text-[10px] font-bold py-2 text-center border-none cursor-pointer bg-transparent text-gray-500";
                
                idText.innerText = "身分狀態：一般買家";
                idText.style.color = "#94A3B8";
                
                buyerOpenStore.style.display = 'flex';
                seller接單.style.display = 'none';
                seller後台.style.display = 'none';
                seller繳費.style.display = 'none';
            }
        }

        function toggleDropdown(e) {
            e.stopPropagation();
            document.getElementById('avatarDropdown').classList.toggle('active');
        }

        document.addEventListener('click', () => {
            document.getElementById('avatarDropdown').classList.remove('active');
        });
    </script>
</body>
</html>
