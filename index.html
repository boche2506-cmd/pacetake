<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PACE 派思 pacetake.tw - 買家首頁</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">

    <style>
        /* 全局變數與主題防線 - 完美呼應 Cyber Blue 品牌色 */
        :root {
            --bg-global: #F8FAFC;
            --bg-container: #FFFFFF;
            --border-color: #E2E8F0;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --brand-blue: #0062FF; 
            --brand-green: #10B981;
            --brand-red: #EF4444;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.05);
            --card-bg: #FFFFFF;
            --blur-bg: rgba(255, 255, 255, 0.95);
        }

        [data-theme="dark"] {
            --bg-global: #0A0A0A;
            --bg-container: #111111;
            --border-color: #262626;
            --text-main: #F5F5F5;
            --text-muted: #A3A3A3;
            --brand-blue: #2F80ED; 
            --brand-green: #34D399;
            --brand-red: #F87171;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.4);
            --card-bg: #1C1C1E;
            --blur-bg: rgba(17, 17, 17, 0.95);
        }

        /* 基礎重設 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

                body {
            background-color: var(--bg-global);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: stretch; /* 🌟 關鍵修正：強迫大盒子上下拉滿螢幕高度，不准縮水！ */
            min-height: 100vh;
            margin: 0;
            padding: 0;
            transition: background-color 0.15s ease;
        }

        /* 手機直屏精品大外框 - 已全面針對電腦寬螢幕浮動與高度進行優化對齊 */
        .phone-wrapper {
            width: 100%;
            max-width: 430px;
            height: 100vh;         /* 🌟 關鍵修正：在電腦上直接鎖定 100% 螢幕滿高度，不准被卡片壓扁！ */
            background-color: var(--bg-container);
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow-y: auto;      /* 🌟 關鍵修正：讓只有中間的店家可以像 App 一樣在裡面滾動，上下排死死卡住不动！ */
        }

        /* 👑 頂部全區常駐吸附天花板 */
        .sticky-top-group {
            position: sticky;
            top: 0;
            z-index: 1000; 
            background-color: var(--blur-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        /* 頂部高級大字留白區 */
        .header {
            padding: 24px 20px 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .brand-title-area {
            display: flex;
            flex-direction: column;
        }

        .brand-logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .brand-title-area h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .brand-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 500;
        }

        /* 右上角一體化控制台 */
        .control-panel {
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            font-size: 16px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            background-color: var(--card-bg);
        }

        .login-btn {
            background-color: var(--brand-blue);
            color: #FFFFFF;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
        }

        .user-avatar-btn {
            display: none; 
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            align-items: center;
            gap: 4px;
        }

        /* 下拉選單面板 */
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 42px;
            right: 0;
            width: 200px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            z-index: 1100;
            padding: 6px;
        }

        .dropdown-menu a, .dropdown-menu button {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 10px 12px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 13px;
            border: none;
            background: none;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
        }

        .dropdown-menu a:hover, .dropdown-menu button:hover {
            background-color: var(--bg-global);
        }

        .menu-divider {
            height: 1px;
            background-color: var(--border-color);
            margin: 6px 0;
        }

        /* 👑 智慧選單分流區塊 */
        .seller-unlock { display: none; }
        .admin-unlock { display: none; }

        /* 精品 GPS 定位管理列 */
        .location-bar {
            padding: 4px 20px 8px 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .gps-trigger-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: 700;
            color: var(--brand-blue);
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: var(--shadow-sm);
        }

        .location-select-group {
            display: flex;
            gap: 4px;
            flex-grow: 1;
        }

        .nav-select {
            flex: 1;
            height: 32px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-global);
            color: var(--text-main);
            font-size: 12px;
            font-weight: 600;
            padding: 0 4px;
            outline: none;
            cursor: pointer;
        }

        /* 中間：搜尋欄 */
        .search-container {
            padding: 8px 20px 4px 20px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background-color: var(--bg-global);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0 14px;
            height: 46px;
        }

        .search-box input {
            border: none;
            background: none;
            width: 100%;
            height: 100%;
            margin-left: 8px;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
        }

        /* 下方：店家列表區樣式補強面防線 */
        .store-list {
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .store-card {
            display: flex;
            align-items: center;
            gap: 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px;
            text-decoration: none;
            color: inherit;
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            
            /* 🌟 核心防線：強制限制卡片寬度，絕對不准擠歪大外框 */
            width: 100%; 
        }
        .store-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.06);
        }

        .store-img {
            width: 54px;
            height: 54px;
            background-color: var(--bg-global);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            flex-shrink: 0;
        }

        .store-info {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
            gap: 6px;
        }

        .store-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
        }

        .store-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .store-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .store-tags span {
            font-size: 10px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .tag-time {
            background-color: rgba(0, 98, 255, 0.08);
            color: var(--brand-blue);
        }

        .tag-pay {
            background-color: rgba(16, 185, 129, 0.08);
            color: var(--brand-green);
        }

        /* 底部常駐懸浮欄 */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            height: 76px;
            background-color: var(--blur-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px 10px 20px;
            z-index: 999;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.05);
        }

        .status-msg {
            font-size: 12px;
            color: var(--text-muted);
            max-width: 200px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--text-muted);
            flex-shrink: 0;
            position: relative;
        }

        .status-indicator.active {
            background-color: var(--brand-green);
            box-shadow: 0 0 8px var(--brand-green);
        }

        .order-badge-count {
            background-color: var(--brand-red);
            color: white;
            font-size: 10px;
            font-weight: 800;
            min-width: 15px;
            height: 15px;
            border-radius: 8px;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            border: 1px solid var(--bg-container);
        }

        .cart-status-btn {
            background-color: var(--brand-blue);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            box-shadow: var(--shadow-sm);
        }

        /* 燈箱樣式 */
                .lightbox-modal {
            display: none;
            position: fixed; /* 🌟 核心防線：死死鎖定在全螢幕，絕不跟開店頁打架 */
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-card {
            background-color: var(--bg-container);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            width: 100%;
            max-width: 320px;
            padding: 24px;
            box-shadow: var(--shadow-md);
            text-align: center;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .modal-desc-address {
            font-size: 13px;
            color: var(--text-main);
            line-height: 1.5;
            margin-bottom: 20px;
            word-break: break-all;
            background-color: var(--bg-global);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            text-align: left;
        }

        .modal-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-main);
        }

        .modal-btn.google {
            background-color: #FFFFFF !important;
            color: #374151 !important;
            border-color: #E2E8F0 !important;
        }

        .modal-close {
            font-size: 12px;
            color: var(--text-muted);
            cursor: pointer;
            margin-top: 12px;
            display: inline-block;
        }

        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
        }
    </style>
