    <title>快拿自取街 pacetake.tw - 買家首頁</title>

    <style>
        /* 全局變數與主題防線 */
        :root {
            --bg-global: #F8FAFC;
            --bg-container: #FFFFFF;
            --border-color: #E2E8F0;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --brand-blue: #0066FF;
            --brand-green: #10B981;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.05);
            --card-bg: #FFFFFF;
            --blur-bg: rgba(255, 255, 255, 0.85);
        }

        [data-theme="dark"] {
            --bg-global: #0A0A0A;
            --bg-container: #111111;
            --border-color: #262626;
            --text-main: #F5F5F5;
            --text-muted: #A3A3A3;
            --brand-blue: #3B82F6;
            --brand-green: #34D399;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.4);
            --card-bg: #1C1C1E;
            --blur-bg: rgba(17, 17, 17, 0.85);
        }

        /* 基礎重設 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-global);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            transition: background-color 0.15s ease;
        }

        /* 手機精品外框 */
        .phone-wrapper {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            background-color: var(--bg-container);
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            position: relative;
            padding-bottom: 90px;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 24px 20px 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .brand-title-area h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .brand-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 500;
        }

        .control-panel {
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            font-size: 16px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            background-color: var(--card-bg);
        }

        .login-btn {
            background-color: var(--brand-blue);
            color: #FFFFFF;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
        }

        .user-avatar-btn {
            display: none;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            align-items: center;
            gap: 4px;
        }

        /* 下拉選單 */
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 42px;
            right: 0;
            width: 200px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            z-index: 100;
            padding: 6px;
        }

        .dropdown-menu a, .dropdown-menu button {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 10px 12px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 13px;
            border: none;
            background: none;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
        }

        .dropdown-menu a:hover, .dropdown-menu button:hover {
            background-color: var(--bg-global);
        }

        .menu-divider {
            height: 1px;
            background-color: var(--border-color);
            margin: 6px 0;
        }

        .test-panel {
            background-color: var(--bg-global);
            padding: 8px;
            border-radius: 8px;
            margin-top: 4px;
        }

        .test-title {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: bold;
        }

        .test-btns {
            display: flex;
            gap: 4px;
        }

        .test-btns button {
            padding: 4px 6px;
            font-size: 11px;
            justify-content: center;
            background: var(--bg-container);
            border: 1px solid var(--border-color);
        }

        .test-btns button.active {
            background: var(--brand-blue);
            color: white;
            border-color: var(--brand-blue);
        }

        .seller-unlock { display: none; }

        .search-container { padding: 8px 20px; }

        .search-box {
            display: flex;
            align-items: center;
            background-color: var(--bg-global);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0 14px;
            height: 46px;
        }

        .search-box input {
            border: none;
            background: none;
            width: 100%;
            height: 100%;
            margin-left: 8px;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
        }

        .store-list {
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .store-card {
            display: flex;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px;
            gap: 12px;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            text-decoration: none;
        }

        .store-img {
            width: 85px;
            height: 85px;
            border-radius: 12px;
            background-color: var(--bg-global);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            flex-shrink: 0;
        }

        .store-info {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .store-name { font-size: 16px; font-weight: 700; color: var(--text-main); }
        .store-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .store-tags { display: flex; gap: 6px; margin-top: 4px; align-items: center; }

        .tag-time {
            background-color: rgba(0, 102, 255, 0.08);
            color: var(--brand-blue);
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: 600;
        }

        .tag-pay { border: 1px solid var(--border-color); color: var(--text-muted); font-size: 11px; padding: 2px 6px; border-radius: 6px; }

        .bottom-bar {
            position: absolute; bottom: 0; left: 0; right: 0; height: 76px;
            background-color: var(--blur-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 90;
        }

        .status-msg { font-size: 12px; color: var(--text-muted); max-width: 240px; display: flex; align-items: center; gap: 6px; }
        .status-indicator { width: 8px; height: 8px; border-radius: 50%; background-color: var(--text-muted); flex-shrink: 0; }
        .status-indicator.active { background-color: var(--brand-green); box-shadow: 0 0 8px var(--brand-green); }
