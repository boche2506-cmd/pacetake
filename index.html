<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PACE 派思 pacetake.tw - 買家首頁</title>
    <!-- PWA 配置 -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#ffffff">
    <!-- 一般網頁分頁圖示 -->
    <link rel="icon" type="image/png" href="png/logo192.png" sizes="192x192">
    <!-- iPhone 桌面圖示專用（已修改為 180x180 正方形） -->
    <link rel="apple-touch-icon" href="png/logo180.png">
    <link rel="stylesheet" href="style.css">
    <style>
        /* 👑 頂部全區常駐吸附天花板 (Sticky) */

        * {
            box-sizing: border-box;
        }

        .sticky-top-group {
            /* 這裡的高度與寬度原本是 15% 和 100%，我們用 cqw 重新定義它們的比例 */
            height: 10%;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            /* 改用 space-between 讓上下兩列自動均分上下空間 */
            align-items: stretch;
            box-sizing: border-box;
            border-bottom: 0.2cqw solid var(--border-color);
            padding: 0 1cqw 1cqw;
            /* 使用 cqw 控制外襯 padding */
        }

        /* 上層：位置列 */
        .location-bar {
            height: 55%;
            max-width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            gap: 2cqw;
            /* 元件間距改用 cqw */
        }

        /* 📍 目前位置按鈕 */
        .gps-trigger-btn {
            font-size: 4cqw;
            /* 字體改用 cqw */
            color: var(--brand-blue);
            background-color: var(--card-bg);
            border: 0.3cqw solid var(--border-color);
            /* 邊框粗細 cqw */
            border-radius: 5cqw;
            /* 圓角改用 cqw */
            cursor: pointer;
            white-space: nowrap;
            box-shadow: var(--shadow-sm);
            height: 80%;
            /* 讓它在 location-bar 裡自然撐高 */
            width: 34%;
            /* 給予固定的 cqw 寬度 */
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            line-height: 1;
            transition: transform 0.2s;
            /* 按下去會有一點點回饋感 */
        }

        .gps-trigger-btn:active {
            transform: scale(0.95);
            /* 按下去變小一點，模擬點擊感 */
        }

        .close-modal-btn {
            background-color: var(--brand-blue);
            color: white;
            margin-top: 5cqw;
            border: none;
            width: 50%;
            height: 30%;
            border-radius: 2cqw;
            font-size: 5cqw;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
            /* 按下去會有一點點回饋感 */
        }

        .close-modal-btn:active {
            transform: scale(0.95);
            /* 按下去變小一點，模擬點擊感 */
        }

        /* 下拉選單群組 (縣市 + 區域) */
        .location-select-group {
            height: 80%;
            width: 66%;
            /* 與 GPS 按鈕加起來剛好分配總寬度 */
            gap: 2cqw;
            /* 縣市和區域中間的間距 */
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        /* 縣市、區域下拉選單本體 */
        .nav-select {
            border-radius: 5cqw;
            /* 圓角改用 cqw */
            border: 0.3cqw solid var(--border-color);
            background-color: var(--bg-global);
            color: var(--text-main);
            font-size: 4cqw;
            /* 字體與按鈕對齊 */
            outline: none;
            height: 100%;
            width: 50%;
            padding: 0 2cqw;
            /* 讓裡面的文字不會太貼邊框 */
            box-sizing: border-box;
            line-height: 1.1;
            /* 隱藏 Firefox 的卷軸 */
            overflow-y: auto;
            scrollbar-width: none;
            /* 確保內容依然可以滑動 */
            -ms-overflow-style: none;
            cursor: grab;
            /* 隱藏 Chrome, Safari, Edge 的卷軸 */
        }

        .nav-select::-webkit-scrollbar {
            /* Chrome, Safari 隱藏軸線 */
            display: none;
        }

        /* 下層：搜尋列外殼 */
        .search {
            height: 45%;
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            line-height: 1.1;
        }

        /* 搜尋框大盒子 */
        .search-box {
            height: 100%;
            width: 95%;
            background-color: var(--bg-global);
            border: 0.3cqw solid var(--border-color);
            border-radius: 5cqw;
            /* 圓角改用 cqw */
            display: flex;
            align-items: center;
            padding: 0 3cqw;
            /* 左右內襯 */
            box-sizing: border-box;
            gap: 1.5cqw;
            /* 放大鏡圖示與輸入框的間距 */
        }

        /* 🔍 放大鏡 Emoji */
        .search-box span {
            font-size: 4cqw;
            /* 稍微放大一點比較好看 */
        }

        /* 輸入框文字本體 */
        .search-box input {
            width: 100%;
            /* 撐滿剩下的空間 */
            border: none;
            background: none;
            font-size: 5cqw;
            /* 字體改用 cqw */
            color: var(--text-main);
            outline: none;
            text-align: left;
            padding: 0;
        }

        /* ==========================================================================
   7. 店家列表 (Store List)
   ========================================================================== */
        /* 店家列表大容器（佔畫面高55%） */
        .store-list {
            height: 63%;
            max-width: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: start;
            gap: 0.5cqw;
            /* 卡片與卡片之間的間距改用 cqw */
            padding: 1cqw;
            /* 微調右邊 padding，留出空間給滾動條，卡片才不會黏在一起 */
            box-sizing: border-box;
            /* 隱藏 Firefox 的卷軸 */
            scrollbar-width: none;
            /* 確保內容依然可以滑動 */
            -ms-overflow-style: none;
            /* 隱藏 Chrome, Safari, Edge 的卷軸 */
        }

        .store-list::-webkit-scrollbar {
            /* Chrome, Safari 隱藏軸線 */
            display: none;
        }

        /* 店家單一卡片 */
        .store-card {
            height: 24cqw;
            width: 100%;
            display: flex;
            align-items: start;
            color: inherit;
            box-shadow: var(--shadow-sm);
            background-color: var(--card-bg);
            border: 0.3cqw solid var(--border-color);
            border-radius: 3cqw;
            gap: 0.5cqw;
            padding: 0.25cqw;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-sizing: border-box;
            /* 按下去會有一點點回饋感 */
        }

        .store-card:hover {
            transform: translateY(-0.5cqw);
            box-shadow: 0 1cqw 3cqw rgba(0, 0, 0, 0.06);
        }

        /* 左側店家圖示外殼 */
        .store-img {
            height: 100%;
            aspect-ratio: 1 / 1;
            display: block;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-global);
            border-radius: 3cqw;
            font-size: 5cqw;
            /* 裡面的 Emoji 大小 */
            flex-shrink: 0;
            object-fit: contain;
            box-sizing: border-box;
            position: relative;
        }

        .store-info {
            height: 100%;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-start;
            flex-grow: 1;
            overflow: hidden;
            gap: 0.25cqw;
        }

        /* 店家名稱 */
        .store-name {
            font-size: 6cqw;
            /* 字體改用 cqw */
            font-weight: 700;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            /* 💡 新增：隱藏超出部分 */
            text-overflow: ellipsis;
            /* 超出顯示 ... */
            line-height: 1.1;
        }

        /* 📍 店家地址/距離（你要的太長顯示...設定在這裡） */
        .store-meta {
            height: 45%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-start;
            font-size: 3.5cqw;
            /* 字體改用 cqw */
            color: var(--text-muted);
            white-space: nowrap;
            max-width: 100%;
            /* 💡 關鍵：限制最大寬度為父層的 100% */
            line-height: 1.5;
        }

        /* 標籤容器 (現金支付 / 支援行動支付) */
        .store-tags {
            display: flex;
            gap: 0.5cqw;
            flex-wrap: wrap;
            line-height: 1.1;
        }

        /* 標籤本體 */
        .store-tags span {
            font-size: 3.25cqw;
            /* 字體改用 cqw */
            font-weight: 500;
            padding: 0.25cqw 1cqw;
            /* 內襯改用 cqw */
            border-radius: 1.5cqw;
            /* 圓角改用 cqw */
            white-space: nowrap;
            /* 確保標籤內的字（如：現金支付）不會自己斷行 */
            line-height: 1.1;
        }

        .tag-seating {
            background-color: rgba(255, 145, 0, 0.08);
            color: var(--brand-orange);
            line-height: 1.1;
        }

        .tag-time {
            background-color: rgba(0, 98, 255, 0.08);
            color: var(--brand-blue);
            line-height: 1.1;
        }

        .tag-pay {
            background-color: rgba(16, 185, 129, 0.08);
            color: var(--brand-green);
            line-height: 1.1;
        }

        .tag-seating.inactive,
        .tag-time.inactive,
        .tag-pay.inactive {
            opacity: 0.25;
            filter: grayscale(100%);
            cursor: not-allowed;
        }

        /* ==========================================================================
   8. 底部懸浮列 (Bottom Bar)
   ========================================================================== */
        /* 底部大盒子 */
        .bottom-bar {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            height: 12%;
            /* 保留你原本佔外殼的 15% 高度比例 */
            max-width: 100%;
            background-color: var(--blur-bg);
            border-top: 0.3cqw solid var(--border-color);
            /* 邊框 cqw */
            padding: 1cqw 2cqw;
            /* 左右微調內襯，讓留白更好看 */
            box-sizing: border-box;
            flex-shrink: 0;
        }



        /* 右側：🛒 結帳按鈕 */
        .cart-status-btn {
            background-color: var(--brand-blue);
            color: white;
            border: none;
            border-radius: 5cqw;
            /* 膠囊形圓角改用 cqw */
            font-size: 5cqw;
            /* 按鈕字體大小調成跟上方 header 差不多 */
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            /* 內置內容垂直置中 */
            justify-content: center;
            align-items: center;
            text-decoration: none;
            box-shadow: var(--shadow-sm);
            height: 55%;
            max-width: 35%;
            padding: 0 2cqw;
            box-sizing: border-box;
            white-space: nowrap;
            /* 確保結帳文字絕對不折行 */
            transition: transform 0.2s;
            /* 按下去會有一點點回饋感 */
        }

        .cart-status-btn:active {
            transform: scale(0.95);
            /* 按下去變小一點，模擬點擊感 */
        }

        /* 順手幫你保留的 badge 設定（未來如果有泡泡通知顯示數字可以用） */
        .order-badge-count {
            font-size: 3.5cqw;
            /* 與「結 帳」字體等高 */
            font-weight: 600;
            /* 數字加粗比較好辨識 */
            margin-left: 1cqw;
            /* 與「帳」字保持一個舒服的小間距 */
            display: inline-block;
            /* 讓它像文字一樣乖乖排在後面 */
            transition: color 0.2s ease;
            /* 變色時有個淡淡的過渡感 */
        }

        /* 簡單的按鈕與提示框樣式 */
        .app-btn {
            display: none;
            /* 預設隱藏，由 JS 判斷後顯示 */
            padding: 3cqw;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 4cqw;
            cursor: pointer;
            box-shadow: 0 1cqw 1.5cqw rgba(0, 0, 0, 0.1);
        }

        /* iOS 專用彈出提示框 */
        .ios-modal {
            display: none;
            position: fixed;
            bottom: 5cqw;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 5cqw;
            border-radius: 4cqw;
            box-shadow: 0 1.25cqw 5cqw rgba(0, 0, 0, 0.3);
            width: 85%;
            max-width: 87.5cqw;
            z-index: 999;
            text-align: center;
        }

        .ios-modal button {
            margin-top: 2.5cqw;
            background: #eee;
            border: none;
            padding: 1.25cqw 3.75cqw;
            border-radius: 1.25cqw;
        }
    </style>
</head>

<body>
    <div class="phone-wrapper">
        <div id="buyerView" style="display: block;">
            <header class="header">
                <div class="pace-logo">
                    <a href="index.html" class="logo-link">
                        <img src="png/pace3.png" alt="派思 官方網站">
                    </a>
                    <!-- iOS 專用提示引導視窗 -->
                    <div id="iosPromptModal" class="ios-modal">
                        <p><strong>💡 如何將此網站加到桌面：</strong></p>
                        <p>1. 點選瀏覽器下方的「<strong>分享</strong>」按鈕（正方形加向上箭頭）</p>
                        <p>2. 往下滑動，選擇「<strong>加入主畫面</strong>」</p>
                        <button onclick="document.getElementById('iosPromptModal').style.display='none'">我知道了</button>
                    </div>
                    <div class="avatar-container" id="avatarPwaTrigger" style="cursor: pointer;">
                        <span id="defaultIcon">👤</span>
                        <img id="userAvatarImg" src=""
                            style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;"
                            onerror="this.style.display='none'; document.getElementById('defaultIcon').style.display='block';">
                    </div>
                </div>
                <div class="two">
                    <div class="pace">
                        <button class="theme-toggle" id="themeToggleBtn" aria-label="切換主題">🌙</button>
                        <span>店內價外帶自取/點餐系統</span>
                    </div>
                    <div class="avatarBtnMenu" data-action="avatarBtnMenu">
                        <span class="user-name" id="userNameDisplay"></span>
                        <div class="dropdown-menu" id="dropdownMenu"></div>
                    </div>
                </div>
            </header>
            <div class="sticky-top-group">
                <div class="location-bar">
                    <button class="gps-trigger-btn" data-action="gpsPinBtn" id="gpsPinBtn">📍 (目前位置)</button>
                    <div class="location-select-group">
                        <select class="nav-select" data-action-change="citySelect" id="citySelect">
                            <option value="">選擇縣市</option>
                            <option value="臺北市">臺北市</option>
                            <option value="新北市">新北市</option>
                            <option value="基隆市">基隆市</option>
                            <option value="桃園市">桃園市</option>
                            <option value="新竹市">新竹市</option>
                            <option value="新竹縣">新竹縣</option>
                            <option value="苗栗縣">苗栗縣</option>
                            <option value="台中市">台中市</option>
                            <option value="彰化縣">彰化縣</option>
                            <option value="南投縣">南投縣</option>
                            <option value="雲林縣">雲林縣</option>
                            <option value="嘉義市">嘉義市</option>
                            <option value="嘉義縣">嘉義縣</option>
                            <option value="台南市">台南市</option>
                            <option value="高雄市">高雄市</option>
                            <option value="屏東縣">屏東縣</option>
                            <option value="宜蘭縣">宜蘭縣</option>
                            <option value="花蓮縣">花蓮縣</option>
                            <option value="臺東縣">臺東縣</option>
                            <option value="澎湖縣">澎湖縣</option>
                            <option value="金門縣">金門縣</option>
                            <option value="連江縣">連江縣</option>
                        </select>
                        <select class="nav-select" data-action-change="districtSelect" id="districtSelect">
                            <option value="">選擇區域</option>
                        </select>
                    </div>
                </div>
                <div class="search">
                    <div class="search-box">
                        <span>🔍</span>
                        <input type="text" data-action-input="globalSearch" id="globalSearchInput"
                            placeholder="搜尋商圈美味小吃、店家名稱..." autocomplete="off">
                    </div>
                </div>
            </div>
            <main class="store-list" id="store-Container">
            </main>
            <footer class="bottom-bar">
                <div class="status-msg" id="statusmsg"></div>
                <a href="cart.html" class="cart-status-btn nav-fast">
                    <span>🛒結 帳<span class="order-badge-count">(0)</span></span>
                </a>
            </footer>
        </div>
        <div class="lightbox-modal" id="addressDetailLightbox" style="display: none;">
            <div class="modal-card">
                <div class="modal-title" style="color: var(--brand-blue); font-weight: 700;">📍 目前位置</div>
                <div class="modal-desc-address" id="modalAddressText"
                    style="margin-bottom: 0.5cqw; margin-top: 0.5cqw;">尚未獲取定位，請開啟 GPS。</div>
                <button class="close-modal-btn" data-action="closeAddressModalBtn">確認</button>
            </div>
        </div>
        <div class="lightbox-modal" id="loginLightbox" style="display: none;">
            <div class="modal-card">
                <div class="modal-title" style=" font-weight: 600; color: var(--text-main);">加入PACE 派思</div>
                <button class="modal-btn google" data-action="googleLogin"
                    style="box-shadow: 0 0.2cqw 0.125 rgba(0,0,0,0.05);">
                    <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right:0.5cqw;">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
                        <path fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
                    </svg>
                    Google 登入
                </button>
                <button data-action="toggleEmailFormBtn"
                    style="display: flex; align-items: center; justify-content: center; width: 100%; margin-bottom: 5cqw; background-color: white; border: 0.2cqw solid #e5e7eb; border-radius: 3cqw; padding: 3cqw 0; font-size: 5cqw; font-weight: 600; color: #374151; cursor: pointer; box-shadow: 0 0.5cqw 2cqw rgba(0,0,0,0.05);">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" style="margin-right:0.5cqw;">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    使用電子郵件登入
                </button>
                <div id="emailFormSection" class="email-form">
                    <div style="margin-bottom: 1cqw;">
                        <label for="loginEmail"
                            style="display:block; margin-bottom: 5cqw; font-size:5cqw; color:#6b7280; font-weight:700;">電子郵件</label>
                        <input type="email" id="loginEmail" placeholder="請輸入 Email" autocomplete="username"
                            style="width: 100%; box-sizing: border-box; padding: 2cqw; border:0.2cqw solid #e5e7eb; border-radius:3cqw; box-sizing:border-box; font-size:5cqw; background-color:#f9fafb; color: #111111;">
                    </div>
                    <div style="margin-bottom:10cqw;">
                        <label for="loginPassword"
                            style="display:block; margin-bottom:0.25cqw; font-size:5cqw; color:#6b7280; font-weight:500;">密碼</label>
                        <div style="position: relative; display: flex; align-items: center;">

        let currentBuyerAddress = "正在獲取定位中...";

        let targetStoreId = "";
        let currentDiningType = "TAKE_OUT";
        // 藍新店家動態金鑰配置（預設為空，動態由 Firebase 覆蓋）
        let currentStoreNewebpay = {
            MerchantID: "",
            HashKey: "",
            HashIV: ""
        };
        // 1. 註冊 Service Worker (PWA 必備，維持原樣)
        if ('serviceWorker' in navigator) {
            // 請確保這裡的路徑是指向您最外層的 sw.js 檔案
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('Service Worker 註冊成功'))
                .catch(err => console.log('註冊失敗，請確認 sw.js 檔案是否存在：', err));
        }

        // 2. 綁定頭像點擊事件
        let deferredPrompt;
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const avatarTrigger = document.getElementById('avatarPwaTrigger');

        // 【Android / Chrome 專用】捕捉系統安裝事件
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); // 阻止瀏覽器預設的底部大橫幅
            deferredPrompt = e;  // 把安裝事件存起來
        });

        // 監聽頭像點擊
        avatarTrigger.addEventListener('click', async () => {
            if (isIOS) {
                // 如果是 iPhone，點頭像跳出引導視窗
                document.getElementById('iosPromptModal').style.display = 'block';
            } else {
                // 如果是 Android，點頭像直接跳出原生的「新增至主畫面」詢問通知
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        console.log('使用者同意安裝');
                        deferredPrompt = null;
                    }
                } else {
                    // 如果已經安裝過，或瀏覽器還沒準備好，點擊就正常不反應（或您可在此自行加上原本頭像的功能）
                    console.log('目前環境不支援安裝或已安裝');
                }
            }
        });

    </script>
