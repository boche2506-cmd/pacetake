<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PACE 派思 pacetake.tw - 買家首頁</title>
<!-- 1. 給電腦版、手機版 Chrome 瀏覽器標籤頁使用的標準圖示 -->
<link rel="icon" type="image/png" sizes="32x32" href="logo.png">
<link rel="icon" type="image/png" sizes="16x16" href="logo.png">
<!-- 2. 給 Apple iOS 系統（Safari/Chrome）加入主畫面與我的最愛使用的圖示 -->
<link rel="apple-touch-icon" sizes="180x180" href="logo.png">

<style>
/* a==========================================================================
   1. 全局變數與主題防線 (Cyber Blue)
   ========================================================================== */
html {
    /* ⭕ 讓字體回歸正常的標準大小，在 9:16 手機殼內絕對不會暴走破圖 */
    font-size: 16px; 
}
   :root {
    --bg-global: #F8FAFC;
    --bg-container: #FFFFFF;
    --border-color: #E2E8F0;
    --text-main: #0F172A;
    --text-muted: #64748B;
    --brand-blue: #0062FF; 
    --brand-green: #10B981;
    --brand-red: #EF4444;
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
    --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.05);
    --card-bg: #FFFFFF;
    --blur-bg: rgba(255, 255, 255, 0.95);
    
    /* 預設防選取 */
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
}

[data-theme="dark"] {
    --bg-global: #0A0A0A;
    --bg-container: #111111;
    --border-color: #262626;
    --text-main: #F5F5F5;
    --text-muted: #A3A3A3;
    --brand-blue: #2F80ED; 
    --brand-green: #34D399;
    --brand-red: #F87171;
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
    --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.4);
    --card-bg: #1C1C1E;
    --blur-bg: rgba(17, 17, 17, 0.95);
}

/* ==========================================================================
   2. 基礎重設與全域元素 (Reset & Globals)
   ========================================================================== */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
}


body {
    background-color: var(--bg-global);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;     /* 強制裡面的手機盒子「上下絕對置中」 */
    min-height: 100vh;
    width: 100vw;
    transition: background-color 0.15s ease;
    background-color: var(--bg-main); 
}

input, textarea {
    -webkit-user-select: text;
    user-select: text; /* 解除輸入框鎖定，保證可正常打字與選取 */
}

img, .card {
    max-width: 100%; /* 圖片與卡片絕對不超過父容器寬度 */
    height: auto;
    box-sizing: border-box;
}

/* ==========================================================================
   3. 核心佈局架構 (Layout)
   ========================================================================== */
/* 手機直屏精品大外框 */
.phone-wrapper {
    /* 🔴 第一步：不管螢幕多大，強制鎖死 9:16 比例 */
    aspect-ratio: 9 / 16;

    /* 🔴 第二步：最核心！用這四行互相牽制。
       寬螢幕時，高度會卡住，左右自動留黑；
       長螢幕時，寬度會卡住，上下自動留黑！ */
    width: 100vw;
    height: 100vh;
    max-width: calc(100vh * 9 / 16);  /* 根據高度逆推最大寬度 */
    max-height: calc(100vw * 16 / 9); /* 根據寬度逆推最大高度 */

    /* 🔴 第三步：這三行神陣，保證不管是上下留黑還是左右留黑，永遠「絕對正中央」 */
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    /* 🔴 第四步：死不准滑動（你要求的鐵律） */
    overflow: hidden; 

    /* 🔴 第五步：立體手機殼裝飾（邊框與陰影） */
    background-color: var(--bg-container);
    border: 4px solid #222; /* 給它一個扎實的手機黑色外框 */
    border-radius: 20px;    /* 稍微帶點圓角更像手機 */
    box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.5); /* 超立體陰影 */
    
    /* 原本的設定保留 */
}

/* 內容滾動區 (自動填滿剩餘空間) */
.scrollable-content, 
.content-area-or-your-class {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
}

/* 👑 頂部全區常駐吸附天花板 (Sticky) */
.sticky-top-group {
    background-color: var(--blur-bg);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px); 
    border-bottom: 1px solid var(--border-color);
    flex-shrink: 0;
    margin: 10px 10px;     
}
/* ==========================================================================
   4. 頂部導航區塊 (Header & Brand)
   ========================================================================== */
.header {
    display: flex;
    justify-content: space-between; /* 讓左邊欄位和右邊控制面板各自靠兩端 */
    align-items: center;            /* 關鍵：讓左右兩邊的內容物「垂直居中」對齊 */
    margin-top: 5px;
}

/* ========================================================
   2. 左區塊（控制 PACE 與小字的垂直排列）
   ======================================================== */
.brand-left-column {
    display: flex;
    flex-direction: column;
    justify-content: flex-end; /* 關鍵：讓整塊內容（含副標題）往底部貼齊，跟右邊對齊 */
    height: 100%;             /* 確保高度有撐滿，才能順利置底 */
}

/* 設定 PACE 英文標題 */
.pace-logo {
    font-size: 32px;          /* 關鍵：單獨放大 PACE 英文的字體大小 */
    font-weight: bold;
    margin-bottom: 0px;        /* 讓英文加粗，看起來更大氣 */
    transform: translateY(5px);
}
.brand-logo-img {
    height: 48px;             /* 放大派思圖片的高度（原本可能較小，可自行調整數值） */
    width: auto;
}  
/* 設定副標題小字 */
.brand-subtitle {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 300;
    text-align: left;
    margin-bottom: 0px;
}

/* ==========================================================================
   5. 控制台與按鈕 (Controls & Buttons)
   ========================================================================== */
/* 右上角一體化控制台 */
.control-panel {
    display: flex;
    flex-direction: column; /* 關鍵：讓按鈕由上往下垂直排列 */
    align-items: flex-end;  /* 關鍵：讓兩顆按鈕都向右邊靠齊對齊 */
    gap: 5px;               /* 設定上下兩顆按鈕之間的間距（可依喜好調整） */
}


/* 通用按鈕基礎 */
.theme-toggle {
    display: flex;
    justify-content: center; /* 修改：讓月亮圖示「水平置中」 */
    align-items: center;     /* 新增：讓月亮圖示「垂直置中」 */
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    font-size: 12px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    cursor: pointer;
    color: var(--text-main);
}

.login-btn {
    display: flex;
    justify-content: flex-end;
    background-color: var(--brand-blue);
    color: #FFFFFF;
    border: none;
    padding: 6px 8px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    margin-top: 0px ; /* 強制將上方外距歸零，徹底取消黃色空間 */
    margin-bottom: 0px;
}

.user-avatar-btn {
    display: none; 
    background-color: var(--card-bg);
    border: 1px solid var(--border-color);
    padding: 6px 8px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-main);
    cursor: pointer;
    align-items: center;
    gap: 3px;
}

/* 下拉選單面板 */
.dropdown-menu {
    display: none;
    position: absolute;
    top: 42px;
    right: 0;
    width: 200px;
    background-color: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    box-shadow: var(--shadow-md);
    z-index: 1100;
    padding: 3px;
}

.dropdown-menu a, 
.dropdown-menu button {
    display: flex;
    align-items: center;
    width: 100%;
    padding: 10px 12px;
    color: var(--text-main);
    text-decoration: none;
    font-size: 13px;
    border: none;
    background: none;
    text-align: left;
    border-radius: 8px;
    cursor: pointer;
}

.dropdown-menu a:hover, 
.dropdown-menu button:hover {
    background-color: var(--bg-global);
}

.menu-divider {
    height: 1px;
    background-color: var(--border-color);
    margin: 6px 0;
}

/* 👑 智慧選單分流區塊 */
.seller-unlock, .admin-unlock { 
    display: none; 
}

/* ==========================================================================
   6. 搜尋與定位列 (Search & Location)
   ========================================================================== */
.search-container, .location-bar {
    margin-top: 0px; /* 這裡的 20px 可以根據你的需求放大或縮小 */
}

.location-bar {
    padding: 0px;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 5px;
}

.gps-trigger-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 700;
    color: var(--brand-blue);
    background-color: var(--card-bg);
    border: 1px solid var(--border-color);
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: var(--shadow-sm);
}

.location-select-group {
    display: flex;
    gap: 4px;
    flex-grow: 1;
}

.nav-select {
    flex: 1;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background-color: var(--bg-global);
    color: var(--text-main);
    font-size: 12px;
    font-weight: 600;
    padding: 0 4px;
    outline: none;
    cursor: pointer;
}

.search-container {
    padding: 8px 10px 4px;
    margin-top: 0px;
}

.search-box {
    display: flex;
    align-items: center;
    background-color: var(--bg-global);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 0 10px;
    height: 36px;
}

.search-box input {
    border: none;
    background: none;
    width: 100%;
    height: 100%;
    margin-left: 8px;
    font-size: 14px;
    color: var(--text-main);
    outline: none;
}

/* ==========================================================================
   7. 店家列表 (Store List)
   ========================================================================== */
.store-list {
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.store-card {
    display: flex;
    align-items: center;
    gap: 16px;
    background-color: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 14px;
    text-decoration: none;
    color: inherit;
    box-shadow: var(--shadow-sm);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    width: 100%; /* 強迫卡片指名服從手機大外框的限制，絕不擠破框架 */
}

.store-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.06);
}

.store-img {
    width: 54px;
    height: 54px;
    background-color: var(--bg-global);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    flex-shrink: 0;
}

.store-info {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    flex-grow: 1;
    gap: 6px;
}

.store-name {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-main);
}

.store-meta {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
}

.store-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

.store-tags span {
    font-size: 10px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
}

.tag-time {
    background-color: rgba(0, 98, 255, 0.08);
    color: var(--brand-blue);
}

.tag-pay {
    background-color: rgba(16, 185, 129, 0.08);
    color: var(--brand-green);
}

/* ==========================================================================
   8. 底部懸浮列 (Bottom Bar)
   ========================================================================== */
.bottom-bar {
    position: fixed;
    bottom: 20px; 
    left: 0;
    right: 0;
    margin: 0 auto;
    width: 90%;
    max-width: 430px;
    height: 76px;
    background-color: var(--blur-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 20px 10px 20px;
    z-index: 999;
    box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.05);
    flex-shrink: 0;
}

.status-msg {
    font-size: 12px;
    color: var(--text-muted);
    max-width: 200px;
    display: flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
}

footer .status-indicator {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background-color: #ff4d4f;
    flex-shrink: 0;
}

footer .status-indicator.active{
    background-color: #52c41a;
    box-shadow: 0 0 8px #52c41a;
}


.order-badge-count {
    background-color: var(--brand-red);
    color: white;
    font-size: 10px;
    font-weight: 800;
    min-width: 15px;
    height: 15px;
    border-radius: 8px;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
    border: 1px solid var(--bg-container);
}

.cart-status-btn {
    background-color: var(--brand-blue);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    text-decoration: none;
    box-shadow: var(--shadow-sm);
}

/* ==========================================================================
   9. 燈箱模態框與通用組件 (Modals & Utilities)
   ========================================================================== */
.lightbox-modal {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 2000;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.modal-card {
    background-color: var(--bg-container);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    width: 100%;
    max-width: 320px;
    padding: 24px;
    box-shadow: var(--shadow-md);
    text-align: center;
}

.modal-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
}

.modal-desc-address {
    font-size: 13px;
    color: var(--text-main);
    line-height: 1.5;
    margin-bottom: 20px;
    word-break: break-all;
    background-color: var(--bg-global);
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    text-align: left;
}

.modal-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 10px;
    border: 1px solid var(--border-color);
    background: var(--card-bg);
    color: var(--text-main);
}

.modal-btn.google {
    background-color: #FFFFFF;
    color: #374151;
    border-color: #E2E8F0;
}

.modal-close {
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
    margin-top: 12px;
    display: inline-block;
}

.loading-spinner {
    text-align: center;
    padding: 40px;
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 600;
}

select {
    height: auto;      /* 關鍵：拿掉固定高度，讓文字撐開框框 */
    padding: 8px 12px; /* 關鍵：給予上下左右內距，讓框框看起來舒適 */
    font-size: 16px;   /* 關鍵：調整字體大小，使其比例協調 */
    line-height: 1.5;  /* 讓文字垂直置中 */
}

</style>
</head>

<!-- ========================================== -->

<!-- ========================================== -->

                opt.innerText = dist;
                districtSelect.appendChild(opt);
            });
        }
        filterAndRenderStores();
    });
    districtSelect.addEventListener('change', filterAndRenderStores);
    globalSearchInput.addEventListener('input', filterAndRenderStores);

    // 👑 渲染動態選單 (已將邀請碼功能綁定至 window.issuePromoCode)
    function renderDynamicMenu(role) {
        let menuHTML = `
            <a href="orders.html" class="nav-fast">🛒 我的訂單</a>
            <a href="history.html" class="nav-fast">⏳ 歷史訂單</a>
        `;

        if (role === 'buyer' || role === 'admin') {
            menuHTML += `<a href="register.html" class="nav-fast" style="color: var(--brand-blue); font-weight: 700;">💼 月費開店(暫不收費)</a>`;
        } 
        
        if (role === 'seller' || role === 'admin') {
            menuHTML += `
                <div class="menu-divider"></div>
                <a href="seller.html" class="nav-fast">🧑‍🍳 接單管理</a>
                <a href="manage.html" class="nav-fast">⚙️ 後台管理</a>
                <a href="#" class="nav-fast" data-target="pay">💵 繳費</a>
            `;
        }

        if (role === 'admin') {
            menuHTML += `
                <div class="menu-divider"></div>
                <a href="javascript:void(0)" onclick="window.toggleView('admin')" style="color: var(--brand-blue); font-weight: bold;">🔮 派思核心控制台</a>
                <a href="javascript:void(0)" onclick="window.issuePromoCode()" style="color: var(--brand-green); font-weight: bold;">🎟️ 邀請碼發行</a>
            `;
        }

        menuHTML += `
            <div class="menu-divider"></div>
            <button id="logoutBtn" style="color: var(--brand-red);">🚪 登出</button>
        `;

        dropdownMenu.innerHTML = menuHTML;
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await signOut(auth);
            location.reload();
        });
    }

    async function handleUserSyncAndRoleRouting(user) {
        if (!user) return;
        currentUserId = user.uid;

        const userDocRef = doc(db, "users", user.uid);
        const userDocSnap = await getDoc(userDocRef);
        let currentRole = "buyer"; 

        if (userDocSnap.exists()) {
            const data = userDocSnap.data();
            currentRole = data.role || "buyer";
            await updateDoc(userDocRef, {
                lastLogin: new Date().toISOString(),
                email: user.email || data.email,
                displayName: user.displayName || data.displayName || "PACE用戶"
            });
        } else {
            await setDoc(userDocRef, {
                uid: user.uid,
                email: user.email || "",
                displayName: user.displayName || "PACE用戶",
                role: "buyer",
                createdAt: new Date().toISOString(),
                lastLogin: new Date().toISOString()
            });
        }

        loginBtn.style.display = 'none';
        avatarBtn.style.display = 'flex';
        loginLightbox.style.display = 'none';

        if (currentRole === "admin") {
            userNameDisplay.innerHTML = `👑 總管`;
        } else if (currentRole === "seller") {
            userNameDisplay.innerHTML = `🏪 老闆`;
        } else {
            userNameDisplay.innerHTML = `🧑‍💼 買家`;
        }
        renderDynamicMenu(currentRole);
    }

    googleLoginAction.addEventListener('click', async () => {
        try {
            const result = await signInWithPopup(auth, provider);
            await handleUserSyncAndRoleRouting(result.user);
        } catch (error) {
            console.error("Google 登入失敗：", error);
            alert("連線失敗，請檢查網路服務！");
        }
    });

    emailLoginAction.addEventListener('click', async () => {
        const email = loginEmailInput.value.trim();
        const password = loginPasswordInput.value;
        if (!email || !password) {
            alert("密碼或 Email 欄位不可為空！");
            return;
        }

        try {
            const result = await signInWithEmailAndPassword(auth, email, password);
            await handleUserSyncAndRoleRouting(result.user);
        } catch (loginError) {
            if (loginError.code === "auth/user-not-found" || loginError.code === "auth/invalid-credential") {
                try {
                    const result = await createUserWithEmailAndPassword(auth, email, password);
                    await handleUserSyncAndRoleRouting(result.user);
                } catch (regError) {
                    alert("註冊密碼強度不足，或帳號已被佔用！");
                }
            } else {
                alert("登入密碼有誤，請再確認一次！");
            }
        }
    });

onAuthStateChanged(auth, (user) => {
        if (user) {
            handleUserSyncAndRoleRouting(user);
            
            // === 【新增】登入成功：亮綠燈、顯示有訂單文字 ===
            document.getElementById('statusDot')?.classList.add('active');
            document.getElementById('statusText').innerText = `您好 ${user.displayName} ~\n目前沒有進行中的訂單喔！`;
            
        } else {
            loginBtn.style.display = 'block';
            avatarBtn.style.display = 'none';
            dropdownMenu.style.display = 'none';
            dropdownMenu.innerHTML = '';
            
            // === 【新增】登出/未登入：熄滅綠燈變紅燈、顯示提示登入文字 ===
            document.getElementById('statusDot')?.classList.remove('active');
            document.getElementById('statusText').innerText = "您尚未登入，請使用電子郵件或連結google帳號登入";
        }
    }); // 記得原本後面應該還有一個大括號和右括號喔！

    // 📥 讀取雲端店家 (買家列表 & 後台列表 同時更新)
    async function fetchStoresFromFirebase() {
        try {
            const querySnapshot = await getDocs(collection(db, "stores"));
            allStores = [];
            querySnapshot.forEach((doc) => {
                allStores.push({ id: doc.id, ...doc.data() });
            });
            filterAndRenderStores();
            renderAdminTable(); // 🚀 同步更新後台的店家表格
        } catch (error) {
            console.error("讀取店家失敗：", error);
            storeContainer.innerHTML = '<div class="loading-spinner" style="color:var(--brand-red);">❌ 無法取得雲端店家資料</div>';
        }
    }

    function filterAndRenderStores() {
        const selectedCity = citySelect.value;
        const selectedDist = districtSelect.value;
        const searchKeyword = globalSearchInput.value.toLowerCase().trim();

        const filtered = allStores.filter(store => {
            const matchCity = !selectedCity || store.city === selectedCity;
            const matchDist = !selectedDist || store.district === selectedDist;
            const matchKeyword = !searchKeyword || 
                                 (store.name && store.name.toLowerCase().includes(searchKeyword)) ||
                                 (store.shopName && store.shopName.toLowerCase().includes(searchKeyword)) ||
                                 (store.category && store.category.toLowerCase().includes(searchKeyword));
            return matchCity && matchDist && matchKeyword;
        });

        if (filtered.length === 0) {
            storeContainer.innerHTML = '<div class="loading-spinner">🍃 此商圈目前尚無合作店家進駐喔！</div>';
            return;
        }

        storeContainer.innerHTML = "";
        filtered.forEach(store => {
            const finalName = store.shopName || store.name || '未命名店家';
            const finalAddress = store.shopAddress || store.address || '';
            const finalCity = store.city || '';
            const finalDistrict = store.district || '';
            const finalCategory = store.category || '美食';

            const card = document.createElement('a');
            card.href = `menu.html?storeId=${store.id}`;
            card.className = 'store-card';
            card.innerHTML = `
                <div class="store-img">${store.emoji || '🏪'}</div>
                <div class="store-info">
                    <div>
                        <div class="store-name">${finalName}</div>
                        <div class="store-meta">📍 ${finalCity}${finalDistrict} ${finalAddress} · ${finalCategory}</div>
                    </div>
                    <div class="store-tags">
                        <span class="tag-time">⏱️ 店內價外帶</span>
                        <span class="tag-pay">💳 支援行動支付</span>
                    </div>
                </div>
            `;
            storeContainer.appendChild(card);
        });
    }

    function getBrowserLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    buyerLat = position.coords.latitude;
                    buyerLng = position.coords.longitude;
                    currentBuyerAddress = `經度: ${buyerLng.toFixed(4)}, 緯度: ${buyerLat.toFixed(4)} (GPS 衛星精準定位)`;
                    gpsPinBtn.innerText = "📍 已獲取定位";
                },
                (error) => {
                    currentBuyerAddress = "瀏覽器定位遭拒，請手動選擇下拉選單縣市。";
                    gpsPinBtn.innerText = "📍 無法定位";
                }
            );
        } else {
            currentBuyerAddress = "您的裝置不支援 GPS 定位裝置。";
        }
    }

    // 啟動資料庫與定位抓取
    fetchStoresFromFirebase();
    getBrowserLocation();

    // ==========================================
    // 🔥 後台控制台專屬功能區 (新增/刪除店家、發行邀請碼)
    // ==========================================

    // 1. 後台渲染店家表格
    function renderAdminTable() {
        const tbody = document.getElementById('adminStoreTableBody');
        if(!tbody) return;
        
        tbody.innerHTML = '';
        if(allStores.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:15px; color:#aaa;">目前雲端尚無店家資料</td></tr>';
            return;
        }

        allStores.forEach(store => {
            const finalName = store.shopName || store.name || '未命名店家';
            const finalAddress = store.shopAddress || store.address || '';
            const phone = store.phone || '無資料';
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="padding: 12px; border: 1px solid #3a3a3a; color: #ffca28; font-weight: bold;">${finalName}</td>
                <td style="padding: 12px; border: 1px solid #3a3a3a; color: #bbb;">${store.city || ''}${store.district || ''} ${finalAddress}</td>
                <td style="padding: 12px; border: 1px solid #3a3a3a; color: #bbb;">${phone}</td>
                <td style="padding: 12px; border: 1px solid #3a3a3a; text-align: center;">
                    <button onclick="window.deleteStore('${store.id}')" style="padding: 6px 12px; background: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">刪除</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 2. 雲端新增店家邏輯
    const adminSubmitStoreBtn = document.getElementById('adminSubmitStoreBtn');
    if (adminSubmitStoreBtn) {
        adminSubmitStoreBtn.addEventListener('click', async () => {
            const name = document.getElementById('adminNewStoreName').value.trim();
            const phone = document.getElementById('adminNewStorePhone').value.trim();
            const city = document.getElementById('adminNewStoreCity').value;
            const district = document.getElementById('adminNewStoreDistrict').value.trim();
            const address = document.getElementById('adminNewStoreAddress').value.trim();
            const category = document.getElementById('adminNewStoreCategory').value.trim();

            if (!name || !district || !address) {
                alert("⚠️ 店名、區域、詳細地址為必填項目！");
                return;
            }

            adminSubmitStoreBtn.innerText = "⏳ 正在同步至雲端...";
            try {
                // 將資料寫入 Firebase 的 stores 集合
                await addDoc(collection(db, "stores"), {
                    name: name,
                    shopName: name, // 兼容前端不同寫法
                    phone: phone,
                    city: city,
                    district: district,
                    address: address,
                    shopAddress: address, // 兼容寫法
                    category: category,
                    createdAt: new Date().toISOString()
                });
                
                alert("✅ 店家已成功新增至雲端！");
                
                // 清空輸入框
                document.getElementById('adminNewStoreName').value = '';
                document.getElementById('adminNewStorePhone').value = '';
                document.getElementById('adminNewStoreDistrict').value = '';
                document.getElementById('adminNewStoreAddress').value = '';
                document.getElementById('adminNewStoreCategory').value = '';
                
                // 重新讀取 Firebase 更新畫面
                fetchStoresFromFirebase();
            } catch (error) {
                console.error("新增店家失敗:", error);
                alert("新增失敗，請檢查網路或資料庫權限！");
            } finally {
                adminSubmitStoreBtn.innerText = "✅ 確認新增店家至雲端";
            }
        });
    }

    // 3. 雲端刪除店家邏輯 (掛載到 window 供 HTML 呼叫)
    window.deleteStore = async function(storeId) {
        if (confirm("⚠️ 確定要從 Firebase 徹底刪除這個店家嗎？(刪除後無法恢復)")) {
            try {
                await deleteDoc(doc(db, "stores", storeId));
                alert("🗑️ 店家已成功刪除！");
                fetchStoresFromFirebase(); // 重新讀取畫面
            } catch (error) {
                console.error("刪除失敗:", error);
                alert("刪除失敗，請確認你的 Admin 權限！");
            }
        }
    };

    // 4. 戰術邀請碼寫入 Firebase 邏輯
    window.issuePromoCode = async function() {
        const code = prompt('請輸入要發行的戰術 VIP 邀請碼 (例如: PACE2026):');
        if (!code || code.trim() === "") return;
        
        try {
            // 在 promoCodes 集合中建立一份新文件，ID 就是邀請碼本身
            await setDoc(doc(db, "promoCodes", code.trim()), {
                code: code.trim(),
                createdBy: currentUserId,
                createdAt: new Date().toISOString(),
                isActive: true,
                usedBy: null // 預留給未來記錄誰使用了這個碼
            });
            alert(`🎟️ 邀請碼「${code}」已成功寫入 Firebase！買家現在可以使用它了。`);
        } catch (error) {
            console.error("邀請碼發行失敗:", error);
            alert("發行失敗，請檢查您的系統權限配置！");
        }
    };

    // 5. 視圖切換
    window.toggleView = function(viewRole) {
        const adminEl = document.getElementById('adminView');
        const buyerEl = document.getElementById('buyerView');
        if (viewRole === 'admin') {
            if (adminEl) adminEl.style.display = 'block';
            if (buyerEl) buyerEl.style.display = 'none';
            window.scrollTo(0, 0);
        } else {
            if (adminEl) adminEl.style.display = 'none';
            if (buyerEl) buyerEl.style.display = 'block';
        }
    };

    document.addEventListener("DOMContentLoaded", () => {
        const buyerView = document.getElementById('buyerView');
        if (buyerView) buyerView.style.display = 'block';
    });
</script>
</body>
</html>
