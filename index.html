<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PACE 派思 pacetake.tw - 買家首頁</title>
    <!-- 精品藍色便當純代碼 SVG Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20x%3D%2210%22%20y%3D%2230%22%20width%3D%2280%22%20height%3D%2255%22%20rx%3D%2210%22%20fill%3D%22%230066FF%22%2F%3E%3Cpath%20d%3D%22M25%2030%20V15%20Q25%2010%2035%2010%20H65%20Q75%2010%2075%2015%20V30%22%20fill%3D%22none%22%20stroke%3D%22%230066FF%22%20stroke-width%3D%228%22%2F%3E%3Cline%20x1%3D%2210%22%20y1%3D%2255%22%20x2%3D%2290%22%20y2%3D%2255%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%224%22%2F%3E%3C%2Fsvg%3E">

    <style>
        /* 全局變數與主題防線 */
        :root {
            --bg-global: #F8FAFC;
            --bg-container: #FFFFFF;
            --border-color: #E2E8F0;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --brand-blue: #0066FF;
            --brand-green: #10B981;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.05);
            --card-bg: #FFFFFF;
            --blur-bg: rgba(255, 255, 255, 0.85);
        }

        [data-theme="dark"] {
            --bg-global: #0A0A0A;
            --bg-container: #111111;
            --border-color: #262626;
            --text-main: #F5F5F5;
            --text-muted: #A3A3A3;
            --brand-blue: #3B82F6;
            --brand-green: #34D399;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.4);
            --card-bg: #1C1C1E;
            --blur-bg: rgba(17, 17, 17, 0.85);
        }

        /* 基礎重設 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-global);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            transition: background-color 0.15s ease;
        }

        /* 手機直屏精品大外框與細邊界 */
        .phone-wrapper {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            background-color: var(--bg-container);
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            position: relative;
            padding-bottom: 90px; /* 留給底部懸浮欄 */
            display: flex;
            flex-direction: column;
        }

        /* 頂部高級大字留白區 */
        .header {
            padding: 24px 20px 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .brand-title-area h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .brand-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 500;
        }

        /* 右上角一體化控制台 */
        .control-panel {
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            font-size: 16px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            background-color: var(--card-bg);
        }

        .login-btn {
            background-color: var(--brand-blue);
            color: #FFFFFF;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
        }

        .user-avatar-btn {
            display: none; /* 初始未登入隱藏 */
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            align-items: center;
            gap: 4px;
        }

        /* 下拉選單選面 */
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 42px;
            right: 0;
            width: 200px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            z-index: 100;
            padding: 6px;
        }

        .dropdown-menu a, .dropdown-menu button {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 10px 12px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 13px;
            border: none;
            background: none;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
        }

        .dropdown-menu a:hover, .dropdown-menu button:hover {
            background-color: var(--bg-global);
        }

        .menu-divider {
            height: 1px;
            background-color: var(--border-color);
            margin: 6px 0;
        }

        .test-panel {
            background-color: var(--bg-global);
            padding: 8px;
            border-radius: 8px;
            margin-top: 4px;
        }

        .test-title {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: bold;
        }

        .test-btns {
            display: flex;
            gap: 4px;
        }

        .test-btns button {
            padding: 4px 6px;
            font-size: 11px;
            justify-content: center;
            background: var(--bg-container);
            border: 1px solid var(--border-color);
        }

        .test-btns button.active {
            background: var(--brand-blue);
            color: white;
            border-color: var(--brand-blue);
        }

        .seller-unlock {
            display: none; /* 賣家專屬功能初始隱藏 */
        }

        /* 中間：加寬搜尋欄 */
        .search-container {
            padding: 8px 20px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background-color: var(--bg-global);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0 14px;
            height: 46px;
        }

        .search-box input {
            border: none;
            background: none;
            width: 100%;
            height: 100%;
            margin-left: 8px;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
        }

        /* 橫向滑動圓角分類鈕 */
        .category-scroll {
            display: flex;
            overflow-x: auto;
            padding: 12px 20px;
            gap: 8px;
            scrollbar-width: none;
        }

        .category-scroll::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            flex-shrink: 0;
            background-color: var(--bg-global);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .cat-btn.active {
            background-color: var(--brand-blue);
            color: #FFFFFF;
            border-color: var(--brand-blue);
        }

        /* 下方：店家列表區 */
        .store-list {
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .store-card {
            display: flex;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px;
            gap: 12px;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            text-decoration: none;
        }

        .store-img {
            width: 85px;
            height: 85px;
            border-radius: 12px;
            background-color: var(--bg-global);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            flex-shrink: 0;
        }

        .store-info {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .store-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
        }

        .store-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .store-tags {
            display: flex;
            gap: 6px;
            margin-top: 4px;
            align-items: center;
        }

        .tag-time {
            background-color: rgba(0, 102, 255, 0.08);
            color: var(--brand-blue);
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: 600;
        }

        .tag-pay {
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 6px;
        }

        /* 底部懸浮欄 */
        .bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 76px;
            background-color: var(--blur-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 90;
        }

        .status-msg {
            font-size: 12px;
            color: var(--text-muted);
            max-width: 240px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--text-muted);
            flex-shrink: 0;
        }

        .status-indicator.active {
            background-color: var(--brand-green);
            box-shadow: 0 0 8px var(--brand-green);
        }

        .cart-status-btn {
            background-color: var(--brand-blue);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            box-shadow: var(--shadow-sm);
        }

        /* 半透明燈箱彈窗 */
        .lightbox-modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-card {
            background-color: var(--bg-container);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            width: 100%;
            max-width: 320px;
            padding: 24px;
            box-shadow: var(--shadow-md);
            text-align: center;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .modal-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-main);
        }

        .modal-btn.google {
            background-color: #FFFFFF;
            color: #111111;
            border-color: #E2E8F0;
        }

        .modal-btn.phone {
            background-color: var(--brand-blue);
            color: white;
            border: none;
        }

        .modal-close {
            font-size: 12px;
            color: var(--text-muted);
            cursor: pointer;
            margin-top: 12px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="phone-wrapper">
        <!-- 頂部大字留白區 -->
        <header class="header">
            <div class="brand-title-area">
                <h1>PACE 派思</h1>
                <div class="brand-subtitle">店內價預約外帶自取 / 內用點單系統</div>
            </div>
            
            <div class="control-panel">
                <!-- 膚色切換鈕 -->
                <button class="theme-toggle" id="themeToggleBtn">🌓</button>
                
                <!-- 未登入狀態 -->
                <button class="login-btn" id="loginTriggerBtn">Google 登入 / 註冊</button>
                
                <!-- 登入後狀態 -->
                <button class="user-avatar-btn" id="avatarMenuBtn">
                    <span>🧑‍💼 帳號狀態</span>
                </button>
                
                <!-- 下拉選單面板 -->
                <div class="dropdown-menu" id="userDropdown">
                    <a href="orders.html" class="nav-fast">🛒 我的訂單</a>
                    <a href="history.html" class="nav-fast">⏳ 歷史訂單</a>
                    <a href="register.html" class="nav-fast">💼 月費開店(暫不收費)</a>
                    
                    <!-- 賣家解封路徑區 -->
                    <div class="seller-unlock" id="sellerMenuBlock">
                        <div class="menu-divider"></div>
                        <a href="seller.html" class="nav-fast">🧑‍🍳 接單管理</a>
                        <a href="manage.html" class="nav-fast">⚙️ 後台管理</a>
                        <a href="#" class="nav-fast" data-target="pay">💵 繳費</a>
                    </div>
                    
                    <div class="menu-divider"></div>
                    <button id="logoutBtn">🚪 登出</button>
                </div>
            </div>
        </header>


        <!-- 中間搜尋欄 -->
        <div class="search-container">
            <div class="search-box">
                <span>🔍</span>
                <input type="text" placeholder="搜尋商圈美味小吃、店家名稱...">
            </div>
        </div>

        

        <!-- 店家列表 -->
        <main class="store-list" id="store-container">
            
        </main>

        <!-- 底部懸浮欄 -->
        <footer class="bottom-bar">
            <div class="status-msg" id="bottomStatusMsg">
                <div class="status-indicator" id="statusDot"></div>
                <span id="statusText">您目前沒有訂單（快去上方搜尋商圈美味小吃吧！）</span>
            </div>
            <a href="cart.html" class="cart-status-btn nav-fast">
                <span>🛒 購物車</span>
                <span id="cartCount">(0)</span>
            </a>
        </footer>

        <!-- Google 登入燈箱彈窗 -->
        <div class="lightbox-modal" id="loginLightbox">
            <div class="modal-card">
            <div class="modal-title" style="font-weight: 700; margin-bottom: 25px; color: #1f2937; text-align: center;">加入PACE 派思</div>
            
            <!-- 1. 強制覆蓋：官方原廠 Google 彩虹四色一鍵登入按鈕 -->
            <button class="modal-btn google" id="googleLoginAction" style="display: flex; align-items: center; justify-content: center; width: 90%; margin-left: auto; margin-right: auto; background-color: white !important; border: 1px solid #e5e7eb !important; border-radius: 8px !important; padding: 12px; font-size: 14px; font-weight: 500; color: #374151 !important; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
                <!-- 注入官方真實四色神經網格，不調用前任藍色 -->
                <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right:12px; flex-shrink: 0;">
                    <path fill="#EA4335" d="M12.24 10.285V14.4h6.887c-.275 1.565-1.88 4.604-6.887 4.604-4.33 0-7.866-3.577-7.866-8s3.536-8 7.866-8c2.46 0 4.105 1.025 5.047 1.926l3.227-3.111C18.29 1.845 15.54 0 12.24 0 5.58 0 0 5.37 0 12s5.58 12 12.24 12c6.96 0 11.57-4.854 11.57-11.79 0-.795-.085-1.4-.19-1.925H12.24z"/>
                </svg>
                Google 一鍵登入
            </button>

            <!-- 2. 高級設計：與 Google 規格完全對稱的「櫻花粉信封 Email 登入」按鈕 -->
            <button id="toggleEmailFormBtn" style="display: flex; align-items: center; justify-content: center; width: 90%; margin-left: auto; margin-right: auto; background-color: white; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 500; color: #374151; margin-top: 14px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.05); transition: all 0.2s;">
                <!-- 櫻花粉紅優雅信封圖標 -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF8A9A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:12px; flex-shrink: 0;">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
                使用電子郵件登入
            </button>

            <!-- 3. 精修展開表單：點擊上面信封後才會優雅現身 -->
            <div id="emailFormSection" style="display: none; margin-top: 20px; text-align: left; width: 90%; margin-left: auto; margin-right: auto;">
                <div style="margin-bottom: 12px;">
                    <label style="display:block; margin-bottom:6px; font-size:13px; color:#6b7280; font-weight:500;">電子郵件</label>
                    <input type="email" id="loginEmail" placeholder="請輸入 Email" style="width:100%; padding:10px 14px; border:1px solid #e5e7eb; border-radius:8px; box-sizing:border-box; font-size:14px; background-color:#f9fafb;">
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display:block; margin-bottom:6px; font-size:13px; color:#6b7280; font-weight:500;">密碼</label>
                    <input type="password" id="loginPassword" placeholder="請輸入密碼" style="width:100%; padding:10px 14px; border:1px solid #e5e7eb; border-radius:8px; box-sizing:border-box; font-size:14px; background-color:#f9fafb;">
                </div>
                <!-- 綠色確認登入按鈕 -->
                <button id="emailLoginAction" style="background-color: #059669; color: white; border: none; width:100%; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 2px 4px rgba(5, 150, 105, 0.15); transition: background 0.2s;">電子郵件登入 / 註冊</button>
            </div>

            <span class="modal-close" id="closeLightboxBtn" style="margin-top: 20px; display: inline-block;">暫時返回</span>


            </div>
        </div>
    </div>

        <!-- 引入 Firebase 9+ 大廠級官方模組模組 (不依賴本地檔案，安全穩定) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

        // 🧠 1. 硬核注入你開通的真實 Firebase 雲端大腦金鑰
        const firebaseConfig = {
            apiKey: "AIzaSyCkAiZCJ6L950KfYJEqubWGi1M8D03OuJI",
            authDomain: "pacetake-c6e1e.firebaseapp.com",
            projectId: "pacetake-c6e1e",
            storageBucket: "pacetake-c6e1e.firebasestorage.app",
            messagingSenderId: "1052980235056",
            appId: "1:1052980235056:web:6a06e4ac9b48f1e74896f5",
            measurementId: "G-888XL8JTHW",
        };

        // 初始化 Firebase 與 Auth 驗證系統防線
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // 🚀 2. 0秒無縫閃轉外掛與觸控手勢防線核心架構
        function bindFastClick(element, callback) {
            if (!element) return;
            let triggered = false;
            function trigger(e) {
                if (!triggered) {
                    triggered = true;
                    setTimeout(() => { triggered = false; }, 300);
                    callback(e);
                }
                e.preventDefault();
            }
            element.addEventListener('touchstart', trigger, { passive: false });
            element.addEventListener('mousedown', trigger);
        }

        // 🌓 系統最高膚色指揮官防線邏輯
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        function initTheme() {
            const savedTheme = localStorage.getItem('pacetake-theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        }
        bindFastClick(themeToggleBtn, () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('pacetake-theme', newTheme);
        });
        initTheme();

        // 🪪 3. 獲取前端畫面的所有控制台元素
        const loginTriggerBtn = document.getElementById('loginTriggerBtn');
        const userAvatarBtn = document.getElementById('avatarMenuBtn');
        const userDropdown = document.getElementById('userDropdown');
        const loginLightbox = document.getElementById('loginLightbox');
        const closeLightboxBtn = document.getElementById('closeLightboxBtn');
        const googleLoginAction = document.getElementById('googleLoginAction');
        const logoutBtn = document.getElementById('logoutBtn');
        const simBuyerBtn = document.getElementById('simBuyerBtn');
        const simSellerBtn = document.getElementById('simSellerBtn');
        const sellerMenuBlock = document.getElementById('sellerMenuBlock');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        // 控制燈箱彈窗開關
        bindFastClick(loginTriggerBtn, () => { loginLightbox.style.display = 'flex'; });
        bindFastClick(closeLightboxBtn, () => { loginLightbox.style.display = 'none'; });

        // 🧑‍💻 4. 打通「真‧Google 一鍵彈窗登入」核心
        bindFastClick(googleLoginAction, () => {
            signInWithPopup(auth, provider)
                .then((result) => {
                    loginLightbox.style.display = 'none';
                    console.log("真實登入成功，用戶資料：", result.user);
                })
                .catch((error) => {
                    console.error("Firebase 登入失敗防線拦截：", error.message);
                    alert("Google 登入失敗，請確認 Firebase 後台的 Authorized Domains 有加入您的網址！");
                });
        });

        // 🚪 登出按鈕真實功能對接
        bindFastClick(logoutBtn, () => {
            signOut(auth).then(() => {
                userDropdown.style.display = 'none';
            });
        });

        // 📡 5. 全局實時監聽買家登入狀態 (Firebase 最高指揮官監聽外掛)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // 🟢 狀態：已登入 (解鎖數位門面)
                loginTriggerBtn.style.display = 'none';
                userAvatarBtn.style.display = 'flex';
                statusDot.classList.add('active');
                statusText.innerText = `您的訂單 #023 製作中 (${user.displayName || '買家'} 已連線)`;
            } else {
                // 🔴 狀態：未登入 (強行鎖定安全防線)
                loginTriggerBtn.style.display = 'block';
                userAvatarBtn.style.display = 'none';
                statusDot.classList.remove('active');
                statusText.innerText = "您目前沒有訂單（快去點擊店家看菜單吧！）";
            }
        });

        // 展開與關閉控制台下拉選單
        bindFastClick(userAvatarBtn, (e) => {
            e.stopPropagation();
            const isOpen = userDropdown.style.display === 'block';
            userDropdown.style.display = isOpen ? 'none' : 'block';
        });

        document.addEventListener('mousedown', (e) => {
            if (!userDropdown.contains(e.target) && e.target !== userAvatarBtn) {
                userDropdown.style.display = 'none';
            }
        });

        // 身分測試切換面板 (保留前前端測試路徑)
        bindFastClick(simBuyerBtn, () => {
            simBuyerBtn.classList.add('active');
            simSellerBtn.classList.remove('active');
            sellerMenuBlock.style.display = 'none';
        });

        bindFastClick(simSellerBtn, () => {
            simSellerBtn.classList.add('active');
            simBuyerBtn.classList.remove('active');
            sellerMenuBlock.style.display = 'block';
        });

        // 🚀 6. 終極大廠級：滑動鎖定 0 誤觸跳轉外掛 (100% 完美保留不跑版)
        const navElements = document.querySelectorAll('.nav-fast');
        navElements.forEach(elem => {
            let touchStartX = 0;
            let touchStartY = 0;
            let isSwipe = false;

            elem.addEventListener('touchstart', (e) => {
                touchStartX = e.touches.clientX;
                touchStartY = e.touches.clientY;
                isSwipe = false;
            }, { passive: true });

            elem.addEventListener('touchmove', (e) => {
                let moveX = e.touches.clientX;
                let moveY = e.touches.clientY;
                if (Math.abs(moveX - touchStartX) > 15 || Math.abs(moveY - touchStartY) > 15) {
                    isSwipe = true;
                }
            }, { passive: true });

            elem.addEventListener('touchend', (e) => {
                if (isSwipe) { e.preventDefault(); return; }
                const dest = elem.getAttribute('href');
                if (dest && dest !== '#') { window.location.href = dest; }
            });

            elem.addEventListener('click', (e) => {
                if (isSwipe) return;
                const dest = elem.getAttribute('href');
                if (dest && dest !== '#') { window.location.href = dest; }
            });
        });
            // ==========================================================
    // 【核心空降外掛】新任 CTO 注入：真實店家動態撈取與搜尋連動防線
    // ==========================================================
    // ==========================================================
    // 【電子郵件登入核心外掛】新任 CTO 注入：實時切換與 Email 登入/註冊防線
    // ==========================================================
    (async function() {
        try {
            // 引入 Firebase 官方的 Email 登入與註冊模組
            const { signInWithEmailAndPassword, createUserWithEmailAndPassword } = await import("https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js");
            
            // 獲取 HTML 節點
            const toggleBtn = document.getElementById('toggleEmailFormBtn');
            const emailSection = document.getElementById('emailFormSection');
            const loginBtn = document.getElementById('emailLoginAction');
            const emailInput = document.getElementById('loginEmail');
            const passwordInput = document.getElementById('loginPassword');

            // 1. 點擊「使用電子郵件登入」按鈕，切換展開或隱藏輸入框
            if (toggleBtn && emailSection) {
                toggleBtn.addEventListener('click', () => {
                    if (emailSection.style.display === 'none') {
                        emailSection.style.display = 'block';
                        toggleBtn.textContent = '隱藏電子郵件登入';
                    } else {
                        emailSection.style.display = 'none';
                        toggleBtn.textContent = '使用電子郵件登入';
                    }
                });
            }

            // 2. 處理電子郵件 登入 / 註冊 核心邏輯
            if (loginBtn) {
                loginBtn.addEventListener('click', async () => {
                    const email = emailInput.value.trim();
                    const password = passwordInput.value.trim();

                    if (!email || !password) {
                        alert('請輸入完整電子郵件與密碼！');
                        return;
                    }
                    if (password.length < 6) {
                        alert('為了安全防線，密碼長度請至少填寫 6 碼以上！');
                        return;
                    }

                    loginBtn.disabled = true;
                    loginBtn.textContent = '正在驗證身分防線...';

                    try {
                        // 先嘗試直接登入
                        await signInWithEmailAndPassword(auth, email, password);
                        alert('登入成功！歡迎回來 PACE 派對！');
                        if (typeof closeLightboxBtn !== 'undefined' && closeLightboxBtn) closeLightboxBtn.click(); // 登入成功自動關彈窗
                    } catch (loginError) {
                        // 如果錯誤代碼是找不到使用者，代表是新用戶，立刻啟動「自動註冊防線」
                        if (loginError.code === 'auth/user-not-found') {
                            try {
                                await createUserWithEmailAndPassword(auth, email, password);
                                alert('偵測為新用戶，已成功為您創建帳號並登入！');
                                if (typeof closeLightboxBtn !== 'undefined' && closeLightboxBtn) closeLightboxBtn.click();
                            } catch (regError) {
                                console.error('註冊失敗:', regError);
                                alert('註冊帳號失敗：' + regError.message);
                            }
                        } else if (loginError.code === 'auth/wrong-password') {
                            alert('密碼輸入錯誤，請重新確認！');
                        } else {
                            console.error('登入出錯:', loginError);
                            alert('驗證失敗：' + loginError.message);
                        }
                    } finally {
                        loginBtn.disabled = false;
                        loginBtn.textContent = '電子郵件登入 / 註冊';
                    }
                });
            }
        } catch (e) {
            console.error("Email 登入模組加載失敗:", e);
        }
    })();

    (async function() {
        try {
            // 初始化 Firestore 資料庫（使用與你相同的 v9.23.0 語法）
            const { getFirestore, collection, getDocs } = await import("https://gstatic.com");
            const db = getFirestore(app);

            // 獲取前端動態容器（對接你剛剛加了 id="store-container" 的 main 標籤）
            const storeContainer = document.getElementById('store-container');
            
            // 終極盲測搜尋框：自動捕捉網頁中任何輸入框，不論前任有沒有寫 id
            const searchInput = document.getElementById('search-input') 
                               || document.querySelector('.search-bar input') 
                               || document.querySelector('input[type="text"]') 
                               || document.querySelector('input');

            let allStores = []; // 雲端實時店家緩存陣列

            if (!storeContainer) return;
            storeContainer.innerHTML = '<p style="padding: 20px; text-align: center; color: #888;">真實店家核心載入中...</p>';
            
            const querySnapshot = await getDocs(collection(db, "stores"));
            allStores = [];
            querySnapshot.forEach((doc) => {
                allStores.push({ id: doc.id, ...doc.data() });
            });

            // 完美貼合原廠 CSS 規格之動態渲染
            function renderStores(storesList) {
                if (storesList.length === 0) {
                    storeContainer.innerHTML = '<p style="padding: 20px; text-align: center; color: #aaa;">🔍 找不到任何相符的真實店家</p>';
                    return;
                }

                const cardsHTML = storesList.map(store => {
                    return `
                        <a href="store.html?id=${store.id}" class="store-card nav-fast" data-id="${store.id}">
                            <div class="store-img">${store.emoji || '🏪'}</div>
                            <div class="store-info">
                                <div class="store-name">${store.name || '未命名店家'}</div>
                                <div class="store-meta">${store.category || '未分類'} · 📍 ${store.distance || '0.00'} km</div>
                                <div class="store-tags">
                                    <span class="tag-time">⏱️ ${store.time || '10-15'} 分</span>
                                    <span class="tag-pay">${store.payMethod || '💵 現金支付'}</span>
                                </div>
                            </div>
                        </a>
                    `;
                }).join('');

                storeContainer.innerHTML = cardsHTML;
            }

            renderStores(allStores);

            // 實時監聽搜尋框輸入事件
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    const searchTerm = e.target.value.trim().toLowerCase();
                    const filteredStores = allStores.filter(store => {
                        const nameMatch = store.name ? store.name.toLowerCase().includes(searchTerm) : false;
                        const categoryMatch = store.category ? store.category.toLowerCase().includes(searchTerm) : false;
                        return nameMatch || categoryMatch;
                    });
                    renderStores(filteredStores);
                });
                console.log("【系統通知】搜尋框監聽防線已成功掛載！");
            } else {
                console.warn("【系統警告】畫面上找不到任何輸入框，搜尋功能暫時掛載失敗。");
            }
        } catch (error) {
            console.error("Firestore 核心運行出錯:", error);
        }
    })();

    </script>
