<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PACE 派思 pacetake.tw - 買家首頁</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20x%3D%2210%22%20y%3D%2230%22%20width%3D%2280%22%20height%3D%2255%22%20rx%3D%2210%22%20fill%3D%22%230066FF%22%2F%3E%3Cpath%20d%3D%22M25%2030%20V15%20Q25%2010%2035%2010%20H65%20Q75%2010%2075%2015%20V30%22%20fill%3D%22none%22%20stroke%3D%22%230066FF%22%20stroke-width%3D%228%22%2F%3E%3Cline%20x1%3D%2210%22%20y1%3D%2255%22%20x2%3D%2290%22%20y2%3D%2255%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%224%22%2F%3E%3C%2Fsvg%3E">

    <style>
                /* 全局變數與主題防線 - 完美呼應 Cyber Blue 品牌色 */
        :root {
            --bg-global: #F8FAFC;
            --bg-container: #FFFFFF;
            --border-color: #E2E8F0;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --brand-blue: #0062FF; /* 微調成更深邃、帶點微光科技感的精品藍 */
            --brand-green: #10B981;
            --brand-red: #EF4444;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.05);
            --card-bg: #FFFFFF;
            --blur-bg: rgba(255, 255, 255, 0.95);
        }

        [data-theme="dark"] {
            --bg-global: #0A0A0A;
            --bg-container: #111111;
            --border-color: #262626;
            --text-main: #F5F5F5;
            --text-muted: #A3A3A3;
            --brand-blue: #2F80ED; /* 暗黑模式下的極光青藍，完美匹配 Logo */
            --brand-green: #34D399;
            --brand-red: #F87171;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.4);
            --card-bg: #1C1C1E;
            --blur-bg: rgba(17, 17, 17, 0.95);
        }

        /* 基礎重設 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-global);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            transition: background-color 0.15s ease;
        }

        /* 手機直屏精品大外框與細邊界 */
        .phone-wrapper {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            background-color: var(--bg-container);
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            position: relative;
            padding-bottom: 90px; /* 留給底部懸浮欄 */
            display: flex;
            flex-direction: column;
        }

        /* 👑 核心優化：頂部全區常駐吸附天花板 */
        .sticky-top-group {
            position: sticky;
            top: 0;
            z-index: 1000; /* 確保在店家列表上方 */
            background-color: var(--blur-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        /* 頂部高級大字留白區 */
        .header {
            padding: 24px 20px 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .brand-title-area h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .brand-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 500;
        }

        /* 右上角一體化控制台 */
        .control-panel {
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            font-size: 16px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            background-color: var(--card-bg);
        }

        .login-btn {
            background-color: var(--brand-blue);
            color: #FFFFFF;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
        }

        .user-avatar-btn {
            display: none; /* 初始未登入隱藏 */
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            align-items: center;
            gap: 4px;
        }

        /* 下拉選單面板 */
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 42px;
            right: 0;
            width: 200px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            z-index: 1100;
            padding: 6px;
        }

        .dropdown-menu a, .dropdown-menu button {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 10px 12px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 13px;
            border: none;
            background: none;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
        }

        .dropdown-menu a:hover, .dropdown-menu button:hover {
            background-color: var(--bg-global);
        }

        .menu-divider {
            height: 1px;
            background-color: var(--border-color);
            margin: 6px 0;
        }

        .seller-unlock {
            display: none; /* 賣家專屬功能初始隱藏 */
        }

        /* 精品 GPS 定位管理列 */
        .location-bar {
            padding: 4px 20px 8px 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .gps-trigger-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: 700;
            color: var(--brand-blue);
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: var(--shadow-sm);
        }

        .location-select-group {
            display: flex;
            gap: 4px;
            flex-grow: 1;
        }

        .nav-select {
            flex: 1;
            height: 32px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-global);
            color: var(--text-main);
            font-size: 12px;
            font-weight: 600;
            padding: 0 4px;
            outline: none;
            cursor: pointer;
        }

        /* 中間：加寬搜尋欄 */
        .search-container {
            padding: 8px 20px 4px 20px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background-color: var(--bg-global);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0 14px;
            height: 46px;
        }

        .search-box input {
            border: none;
            background: none;
            width: 100%;
            height: 100%;
            margin-left: 8px;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
        }

        /* 下方：店家列表區 */
        .store-list {
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .store-card {
            display: flex;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px;
            gap: 12px;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            text-decoration: none;
            transition: transform 0.1s ease;
        }

        .store-card:active {
            transform: scale(0.98);
        }

        .store-img {
            width: 85px;
            height: 85px;
            border-radius: 12px;
            background-color: var(--bg-global);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            flex-shrink: 0;
            object-fit: cover;
        }

        .store-info {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .store-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
        }

        .store-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .store-tags {
            display: flex;
            gap: 6px;
            margin-top: 4px;
            align-items: center;
        }

        .tag-time {
            background-color: rgba(0, 102, 255, 0.08);
            color: var(--brand-blue);
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: 600;
        }

        .tag-pay {
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 6px;
        }

        /* 底部常駐懸浮欄（已鎖定底部防飄移） */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            height: 76px;
            background-color: var(--blur-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px 10px 20px;
            z-index: 999;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.05);
        }

        .status-msg {
            font-size: 12px;
            color: var(--text-muted);
            max-width: 200px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            text-decoration: none;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--text-muted);
            flex-shrink: 0;
            position: relative;
        }

        .status-indicator.active {
            background-color: var(--brand-green);
            box-shadow: 0 0 8px var(--brand-green);
        }

        .order-badge-count {
            background-color: var(--brand-red);
            color: white;
            font-size: 10px;
            font-weight: 800;
            min-width: 15px;
            height: 15px;
            border-radius: 8px;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            border: 1px solid var(--bg-container);
        }

        .cart-status-btn {
            background-color: var(--brand-blue);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            box-shadow: var(--shadow-sm);
        }

        /* 大頭針及登入共用全螢幕鎖定燈箱 */
        .lightbox-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-card {
            background-color: var(--bg-container);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            width: 100%;
            max-width: 320px;
            padding: 24px;
            box-shadow: var(--shadow-md);
            text-align: center;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .modal-desc-address {
            font-size: 13px;
            color: var(--text-main);
            line-height: 1.5;
            margin-bottom: 20px;
            word-break: break-all;
            background-color: var(--bg-global);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            text-align: left;
        }

        .modal-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-main);
        }

        .modal-btn.google {
            background-color: #FFFFFF !important;
            color: #374151 !important;
            border-color: #E2E8F0 !important;
        }

        .modal-close {
            font-size: 12px;
            color: var(--text-muted);
            cursor: pointer;
            margin-top: 12px;
            display: inline-block;
        }

        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="phone-wrapper">
        
        <div class="sticky-top-group">
            <header class="header">
                <div class="brand-title-area">
                    <h1>PACE 派思</h1>
                    <div class="brand-subtitle">店內價預約外帶自取 / 內用點單系統</div>
                </div>
                
                <div class="control-panel">
                    <button class="theme-toggle" id="themeToggleBtn">🌓</button>
                    <button class="login-btn" id="loginTriggerBtn">Google 登入 / 註冊</button>
                    <button class="user-avatar-btn" id="avatarMenuBtn">
                        <span>🧑‍💼 帳號狀態</span>
                    </button>
                    
                    <div class="dropdown-menu" id="userDropdown">
                        <a href="orders.html" class="nav-fast">🛒 我的訂單</a>
                        <a href="history.html" class="nav-fast">⏳ 歷史訂單</a>
                        <a href="register.html" class="nav-fast">💼 月費開店(暫不收費)</a>
                        
                        <div class="seller-unlock" id="sellerMenuBlock">
                            <div class="menu-divider"></div>
                            <a href="seller.html" class="nav-fast">🧑‍🍳 接單管理</a>
                            <a href="manage.html" class="nav-fast">⚙️ 後台管理</a>
                            <a href="#" class="nav-fast" data-target="pay">💵 繳費</a>
                        </div>
                        
                        <div class="menu-divider"></div>
                        <button id="logoutBtn">🚪 登出</button>
                    </div>
                </div>
            </header>

            <div class="location-bar">
                <button class="gps-trigger-btn" id="gpsPinBtn">📍 (目前位置)</button>
                <div class="location-select-group">
                                        <select class="nav-select" id="citySelect">
                        <option value="">選擇縣市</option>
                        <option value="臺北市">臺北市</option>
                        <option value="新北市">新北市</option>
                        <option value="基隆市">基隆市</option>
                        <option value="桃園市">桃園市</option>
                        <option value="新竹市">新竹市</option>
                        <option value="新竹縣">新竹縣</option>
                        <option value="苗栗縣">苗栗縣</option>
                        <option value="台中市">台中市</option>
                        <option value="彰化縣">彰化縣</option>
                        <option value="南投縣">南投縣</option>
                        <option value="雲林縣">雲林縣</option>
                        <option value="嘉義市">嘉義市</option>
                        <option value="嘉義縣">嘉義縣</option>
                        <option value="台南市">台南市</option>
                        <option value="高雄市">高雄市</option>
                        <option value="屏東縣">屏東縣</option>
                        <option value="宜蘭縣">宜蘭縣</option>
                        <option value="花蓮縣">花蓮縣</option>
                        <option value="臺東縣">臺東縣</option>
                        <option value="澎湖縣">澎湖縣</option>
                        <option value="金門縣">金門縣</option>
                        <option value="連江縣">連江縣</option>
                    </select>
                    <select class="nav-select" id="districtSelect">
                        <option value="">選擇區域</option>
                    </select>
                </div>
            </div>

            <div class="search-container">
                <div class="search-box">
                    <span>🔍</span>
                    <input type="text" id="globalSearchInput" placeholder="搜尋商圈美味小吃、店家名稱..." autocomplete="off">
                </div>
            </div>
        </div>

        <main class="store-list" id="store-container">
            <div class="loading-spinner">⚡ 正在安全連線雲端資料庫...</div>
        </main>

        <footer class="bottom-bar">
            <a href="history.html" class="status-msg" id="bottomStatusMsg">
                <div class="status-indicator" id="statusDot"></div>
                <div class="order-badge-count" id="orderBadgeCount">0</div>
                <span id="statusText">您目前沒有進行中的訂單喔！</span>
            </a>
            <a href="cart.html" class="cart-status-btn nav-fast">
                <span>🛒 購物車</span>
                <span id="cartCount">(0)</span>
            </a>
        </footer>

        <div class="lightbox-modal" id="loginLightbox">
            <div class="modal-card">
                <div class="modal-title" style="font-weight: 700; margin-bottom: 25px; color: #1f2937;">加入PACE 派思</div>
                <button class="modal-btn google" id="googleLoginAction" style="box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
                    <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right:12px; flex-shrink: 0;">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    Google 一鍵登入
                </button>

                <button id="toggleEmailFormBtn" style="display: flex; align-items: center; justify-content: center; width: 100%; background-color: white; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 500; color: #374151; margin-top: 14px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:12px; flex-shrink: 0;">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    使用電子郵件登入
                </button>

                <div id="emailFormSection" style="display: none; margin-top: 20px; text-align: left; width: 100%;">
                    <div style="margin-bottom: 12px;">
                        <label style="display:block; margin-bottom:6px; font-size:13px; color:#6b7280; font-weight:500;">電子郵件</label>
                        <input type="email" id="loginEmail" placeholder="請輸入 Email" autocomplete="username" style="width:100%; padding:10px 14px; border:1px solid #e5e7eb; border-radius:8px; box-sizing:border-box; font-size:14px; background-color:#f9fafb; color: #111111;">
                    </div>
                    <div style="margin-bottom: 20px; position: relative;">
                        <label style="display:block; margin-bottom:6px; font-size:13px; color:#6b7280; font-weight:500;">密碼</label>
                        <div style="position: relative; display: flex; align-items: center;">
                            <input type="password" id="loginPassword" placeholder="請輸入密碼" style="width:100%; padding:10px 40px 10px 14px; border:1px solid #e5e7eb; border-radius:8px; box-sizing:border-box; font-size:14px; background-color:#f9fafb; color: #111111;">
                            <button type="button" id="togglePasswordVisibility" style="position: absolute; right: 12px; background: none; border: none; cursor: pointer; font-size: 16px; padding: 0; color: #6b7280; z-index: 10;">👁️</button>

        // 📐 哈弗辛數學大圓公式
        function getDistanceKm(lat1, lon1, lat2, lon2) {
            if (!lat1 || !lon1 || !lat2 || !lon2) return null;
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // 👑 核心改裝：帶有 30 分鐘 localStorage 快取記憶體的智慧 GPS 定位系統
        function initLocation防線(forceRefresh = false) {
            const cacheKey = "pace-location-cache";
            const cachedData = localStorage.getItem(cacheKey);
            const now = Date.now();

            // 如果不是強制刷新，且有 30 分鐘內的存檔，直接秒讀記憶體
            if (!forceRefresh && cachedData) {
                try {
                    const parsed = JSON.parse(cachedData);
                    if (now - parsed.timestamp < 1800000) { // 30 分鐘 = 1800000 毫秒
                        buyerLat = parsed.lat;
                        buyerLng = parsed.lng;
                        currentBuyerAddress = parsed.address;
                        
                        // 同步選單狀態
                        applyAddressToSelects(parsed.city, parsed.district);
                        return;
                    }
                } catch(e) {
                    localStorage.removeItem(cacheKey);
                }
            }

            // 沒有快取或過期，啟動真實 GPS 探測
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (position) => {
                    buyerLat = position.coords.latitude;
                    buyerLng = position.coords.longitude;
                    
                    try {
                        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${buyerLat}&lon=${buyerLng}&accept-language=zh-TW`, {
                            headers: { 'User-Agent': 'pacetake_client_v1_contact_boche2506@gmail.com' }
                        });
                        const data = await response.json();
                        if (data && data.display_name) {
                            currentBuyerAddress = data.display_name;
                            
                            const addr = data.address;
                            let detectedCity = addr.city || addr.county || "";
                            let detectedDistrict = addr.suburb || addr.town || addr.district || "";
                            
                            if(detectedCity.includes("臺北") || detectedCity.includes("台北")) detectedCity = "臺北市";
                            if(detectedCity.includes("台中")) detectedCity = "台中市";

                            // 寫入快取防線
                            localStorage.setItem(cacheKey, JSON.stringify({
                                timestamp: now,
                                lat: buyerLat,
                                lng: buyerLng,
                                address: currentBuyerAddress,
                                city: detectedCity,
                                district: detectedDistrict
                            }));

                            applyAddressToSelects(detectedCity, detectedDistrict);
                        }
                    } catch (e) {
                        currentBuyerAddress = `定位成功！座標：(${buyerLat.toFixed(4)}, ${buyerLng.toFixed(4)})`;
                        filterAndRenderStores();
                    }
                }, (err) => {
                    currentBuyerAddress = "暫時無法取得您的 GPS 位置。可能原因：\n1. 尚未允許定位授權\n2. 手機系統的「隱私權 -> 定位服務」未開啟\n\n您可以先手動選擇上方的縣市區域進行瀏覽喔！";
                    filterAndRenderStores();
                }, { enableHighAccuracy: true, timeout: 6000 });
            } else {
                currentBuyerAddress = "您的瀏覽器不支援 GPS 定位，請使用手動選單。";
                filterAndRenderStores();
            }
        }

        // 輔助函式：將定位結果注入下拉選單並觸發渲染
        function applyAddressToSelects(city, district) {
            if (areaData[city]) {
                citySelect.value = city;
                citySelect.dispatchEvent(new Event('change'));
                setTimeout(() => {
                    if (areaData[city].includes(district)) {
                        districtSelect.value = district;
                    }
                    filterAndRenderStores();
                }, 150);
            } else {
                filterAndRenderStores();
            }
        }

        // 點擊大頭針時，買家通常是想手動更新位置，這時「強制清除快取重新定位」
        gpsPinBtn.addEventListener('click', () => {
            initLocation防線(true); // 傳入 true 強制重刷
        });

               // 📥 真實 Firestore 店家同步（已對齊欄位與安全防線）
        async function fetchStores() {
            try {
                if (typeof getDocs !== 'function') return;
                const snapshot = await getDocs(collection(db, "stores"));
                allStores = [];
                snapshot.forEach((docSnap) => {
                    allStores.push({ id: docSnap.id, ...docSnap.data() });
                });
                // 啟動位置偵測（加上安全防護，防止名稱不存在而卡死）
                if (typeof initLocation防線 === 'function') {
                    initLocation防線(false);
                } else {
                    filterAndRenderStores(); // 如果沒有防線函數，直接渲染店家
                }
            } catch (error) {
                const container = document.getElementById('store-container');
                if (container) {
                    container.innerHTML = `<div class="loading-spinner" style="color:var(--brand-red);">雲端連線失敗: ${error.message}</div>`;
                }
            }
        }

        // 🧠 智慧雙軌搜尋引擎（完美相容所有 CTO 的欄位格式，並修正坍塌與跑位）
        function filterAndRenderStores() {
            const searchInput = document.getElementById('globalSearchInput');
            const searchText = searchInput ? searchInput.value.trim().toLowerCase() : "";
            const selectedCity = citySelect ? citySelect.value : "";
            const selectedDistrict = districtSelect ? districtSelect.value : "";
            
            if (!allStores || allStores.length === 0) return;

            let scoredList = allStores.map(store => {
                let dist = null;
                // 兼容多種經緯度命名
                const lat = store.lat || store.latitude;
                const lng = store.lng || store.longitude;
                if (lat && lng && typeof buyerLat !== 'undefined' && typeof buyerLng !== 'undefined') {
                    dist = getDistanceKm(buyerLat, buyerLng, parseFloat(lat), parseFloat(lng));
                }
                
                let score = 0;
                // 兼容 shopAddress 與 address、city 等多種欄位指名
                const finalAddress = store.shopAddress || store.address || "";
                const finalCity = store.city || "";
                const finalDist = store.district || "";
                const finalName = store.shopName || store.name || "";

                if (selectedCity && (finalAddress.includes(selectedCity) || finalCity === selectedCity)) score += 50;
                if (selectedDistrict && (finalAddress.includes(selectedDistrict) || finalDist === selectedDistrict)) score += 50;

                if (searchText !== "") {
                    const tokens = searchText.split(/\s+/);
                    let matched = 0;
                    tokens.forEach(tk => {
                        let tokenMatch = false;
                        if (finalName.toLowerCase().includes(tk)) tokenMatch = true;
                        if (finalAddress.toLowerCase().includes(tk)) tokenMatch = true;
                        if (store.menuList && Array.isArray(store.menuList)) {
                            store.menuList.forEach(item => { if(item.name?.toLowerCase().includes(tk)) tokenMatch = true; });
                        }
                        if (tokenMatch) matched++;
                    });

                    if (matched === tokens.length) {
                        score += 500;
                    } else if (matched > 0) {
                        score += matched * 100;
                    } else {
                        score -= 200;
                    }
                }
                return { ...store, distance: dist, matchScore: score };
            });

            // 排序邏輯
            scoredList.sort((a, b) => {
                if (b.matchScore !== a.matchScore) return b.matchScore - a.matchScore;
                if (a.distance !== null && b.distance !== null) return a.distance - b.distance;
                return 0;
            });

            const container = document.getElementById('store-container');
            if (!container) return;
            container.innerHTML = "";

            let renderList = scoredList;
            if (searchText !== "") {
                renderList = scoredList.filter(s => s.matchScore > 0);
            }

            if (renderList.length === 0) {
                container.innerHTML = `<div class="loading-spinner">🔍 報告 CEO，全台目前沒有任何符合條件的店家喔。</div>`;
                return;
            }

            // 👑 補齊被截斷的畫卡片原始格式程式碼
            renderList.forEach((store) => {
                const finalName = store.shopName || store.name || "未命名店家";
                const finalAddress = store.shopAddress || store.address || "暫無地址資訊";
                const storeId = store.id;
                
                const cardHtml = `
                    <a href="menu.html?storeId=${storeId}" class="store-card">
                        <div class="store-img">🏪</div>
                        <div class="store-info">
                            <div class="store-name">${finalName}</div>
                            <div class="store-meta">${finalAddress}</div>
                            <div class="store-tags">
                                <span class="tag-time">外帶自取</span>
                                <span class="tag-pay">行動支付</span>
                            </div>
                        </div>
                    </a>
                `;
                container.innerHTML += cardHtml;
            });
        }


            renderList.forEach(store => {
                const card = document.createElement('a');
                card.href = `store.html?id=${store.id}`;
                card.className = "store-card";

                let imgHtml = `🏪`;
                if (store.menuList && store.menuList[0] && store.menuList[0].image) {
                    imgHtml = `<img src="${store.menuList[0].image}" class="store-img" alt="store">`;
                } else {
                    imgHtml = `<div class="store-img">🏪</div>`;
                }

                const distText = store.distance ? `📍 距離您 ${store.distance.toFixed(1)} km` : `📍 台灣自取街`;
                const prepText = store.prepareTime ? `⏱️ 現場取餐約 ${store.prepareTime} 分鐘` : `⏱️ 即時現做自取`;

                card.innerHTML = `
                    ${imgHtml}
                    <div class="store-info">
                        <div>
                            <div class="store-name">${store.shopName || '未命名店鋪'}</div>
                            <div class="store-meta">${store.shopAddress || '尚未填寫地址'}</div>
                        </div>
                        <div class="store-tags">
                            <span class="tag-time">${prepText}</span>
                            <span class="tag-pay" style="color:var(--brand-blue); font-weight:600;">${distText}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        document.getElementById('globalSearchInput').addEventListener('input', filterAndRenderStores);

        // 啟動地基
        fetchStores();
    </script>
</body>
</html>
