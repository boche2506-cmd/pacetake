<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PACE 派思 pacetake.tw - 買家首頁</title>
    <!-- Favicon & Apple Touch Icon -->
    <link rel="icon" type="image/png" href="png/logoapple.png" sizes="180x180">
    <link rel="apple-touch-icon" href="png/logoapple.png">
    <link rel="apple-touch-icon" sizes="180x180" href="png/logoapple.png">
    <link rel="apple-touch-icon-precomposed" href="png/logoapple.png">
    <link rel="stylesheet" href="style.css">
    <style>
        /* 全局變數與主題防線 */
        :root {
            --bg-global: #F8FAFC;
            --bg-Container: #FFFFFF;
            --border-color: #E2E8F0;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --brand-blue: #0066FF;
            --brand-red: #EF4444;
            --brand-green: #10B981;
            --card-bg: #FFFFFF;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.05);
            --highlight-bg: #E2E8F0;
        }

        [data-theme="dark"] {
            --bg-global: #0A0A0A;
            --bg-Container: #111111;
            --border-color: #262626;
            --text-main: #F5F5F5;
            --text-muted: #A3A3A3;
            --brand-blue: #3B82F6;
            --brand-red: #F87171;
            --brand-green: #34D399;
            --card-bg: #1C1C1E;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.4);
            --highlight-bg: #262626;
        }

        /* 基礎重設 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-global);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            transition: background-color 0.15s ease;
        }

        /* 手機直屏精品大外框與細邊界 */
        .phone-wrapper {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            background-color: var(--bg-Container);
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            position: relative;
            padding-bottom: 40px;
            display: flex;
            flex-direction: column;
        }

        /* 頂部導航 */
        .header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-left-group {
            display: flex;
            gap: 6px;
        }

        .back-btn {
            background: none;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            text-decoration: none;
            background-color: var(--card-bg);
        }

        .control-panel {
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            font-size: 14px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            background-color: var(--card-bg);
        }

        .avatar-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
        }

        /* 下拉選單與當前頁面高亮 */
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 38px;
            right: 0;
            width: 180px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            z-index: 100;
            padding: 4px;
        }

        .dropdown-menu a {
            display: block;
            width: 100%;
            padding: 10px 12px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 13px;
            border-radius: 8px;
        }

        /* 強制高亮反黑當前頁面 */
        .dropdown-menu a.current-page {
            background-color: var(--highlight-bg);
            font-weight: 800;
            border-left: 3px solid var(--brand-blue);
        }

        .menu-divider {
            height: 1px;
            background-color: var(--border-color);
            margin: 4px 0;
        }

        /* 帳務記帳本區塊 */
        .main-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .ledger-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow-sm);
        }

        .ledger-row-main {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .ledger-stat h3 {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .ledger-stat div {
            font-size: 26px;
            font-weight: 900;
            color: var(--text-main);
            margin-top: 4px;
        }

        .ledger-stat .revenue-num {
            color: var(--brand-blue);
        }

        .ledger-divider {
            height: 1px;
            background-color: var(--border-color);
            margin-bottom: 10px;
        }

        .ledger-row-sub {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* 菜單與售罄管理排版 */
        .menu-management-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .manage-food-card {
            display: flex;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px;
            gap: 12px;
            align-items: center;
            box-shadow: var(--shadow-sm);
            position: relative;
            animation: fadeIn 0.2s ease;
        }

        .food-img {
            width: 65px;
            height: 65px;
            border-radius: 12px;
            background-color: var(--bg-global);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            flex-shrink: 0;
            border: 1px solid var(--border-color);
        }

        .food-info-fields {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-grow: 1;
        }

        .food-name-txt {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
        }

        .food-price-txt {
            font-size: 14px;
            font-weight: 800;
            color: var(--brand-blue);
        }

        /* 動作控制右側 */
        .manage-actions {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            flex-shrink: 0;
        }

        /* 原生滑動開關器（售罄開關） */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--brand-green);
            /* 預設開關未啟動代表營業中（綠燈） */
            transition: .2s;
            border-radius: 22px;
        }

        .slider::before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .2s;
            border-radius: 50%;
        }

        /* 當開關被勾選時，代表啟用「售罄防線」（變紅燈） */
        input:checked+.slider {
            background-color: var(--brand-red);
        }

        input:checked+.slider::before {
            transform: translateX(22px);
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .delete-btn:hover {
            color: var(--brand-red);
        }

        /* 新增品項大按鈕 */
        .add-item-btn {
            background-color: var(--bg-global);
            border: 1px dashed var(--border-color);
            color: var(--brand-blue);
            height: 48px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            margin-top: 4px;
        }

        /* 地推專用 QR Code 貼紙區 */
        .qrcode-sticker-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow-sm);
            text-align: center;
        }

        .qrcode-url-display {
            background-color: var(--bg-global);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 12px;
            color: var(--brand-blue);
            font-weight: 700;
            margin: 8px 0 14px 0;
            word-break: break-all;
        }

        .download-sticker-btn {
            background-color: var(--brand-blue);
            color: white;
            border: none;
            width: 100%;
            height: 44px;
            border-radius: 22px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="phone-wrapper">
        <!-- 頂部導覽列 -->
        <div id="buyerView" style="display: block;">
            <header id="header">
                <div class="pace-logo">
                    <a href="index.html" class="logo-link">
                        <img src="png/pace3.png" alt="派思 官方網站">
                    </a>
                    <span id="defaultIcon" class="avatar-icon">👤</span>
                    <img id="userAvatarImg" src=""
                        style="font-weight: 500; display: none; border-radius: 50%;font-size: 4.25cqw; height: 75%; max-width: 30%; flex-direction: row; justify-content: flex-end; align-items: flex-end;">
                </div>
                <div class="two">
                    <div class="pace">
                        <button class="theme-toggle" id="themeToggleBtn" aria-label="切換主題">🌙</button>
                        <span>店內價外帶自取/點餐系統</span>
                    </div>
                    <button class="login-btn" id="loginBtn">登入/註冊</button>
                    <button class="user-avatar-btn" id="avatarBtn" style="display: none;">
                        <span class="user-name" id="userNameDisplay"></span></button>
                    <div class="dropdown-menu" id="dropdownMenu"></div>
                </div>
            </header>

            <main class="main-content">
                <!-- 帳務記帳本 -->
                <section>
                    <div class="section-title">今日帳務記帳本</div>
                    <div class="ledger-card">
                        <div class="ledger-row-main">
                            <div class="ledger-stat">
                                <h3>今日總接單量</h3>
                                <div>42 單</div>
                            </div>
                            <div class="ledger-stat" style="text-align: right;">
                                <h3>今日總營業額</h3>
                                <div class="revenue-num">$5,340</div>
                            </div>
                        </div>
                        <div class="ledger-divider"></div>
                        <div class="ledger-row-sub">
                            <span>💵 現場付現實收：$1,240</span>
                            <span>💳 藍線上支付：$4,100</span>
                        </div>
                    </div>
                </section>

                <!-- 菜單與售罄管理 -->
                <div class="section-title">菜單商品上架</div>
                <div class="menu-upload-list" id="menuUploadList">
                    <div class="menu-item-row">
                        <div class="menu-item">
                            <div class="img-upload-box" onclick="triggerUpload(this)">
                                <input type="file" class="image-input" accept="image/*" style="display: none;"
                                    onchange="previewImage(this)">
                                <img class="preview-img" src=""
                                    style="display: none; width: 100%; height: 100%; object-fit: cover; border-radius: 2cqw;">
                                <div class="upload-placeholder"
                                    style="font-size: 8cqw; width: 17cqw; height: 17cqw; border: 0.2cqw dashed var(--border-color); border-radius: 2cqw; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                                    📷<span>上傳照片</span></div>
                            </div>
                            <div class="item-fields" style="width: 100%; gap: 0.5cqw;">
                                <input type="text" class="input-style item-name-input"
                                    style="height:8cqw; width: 100%; padding: 0 2cqw;" placeholder="品項名稱" required>
                                <div class="price-input-wrapper">
                                    <span class="price-symbol">$</span>
                                    <input type="number" class="input-style price-input"
                                        style="height:8cqw; width: 100%;padding-left:5cqw;" placeholder="金額" min="0"
                                        required>
                                </div>
                            </div>
                            <div class="item-right-ctrls"
                                style="gap: 0.5cqw; display: flex; flex-direction: column; justify-content: center;">
                                <div class="drag-handle"
                                    style="width: 8cqw; height: 8cqw; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 3cqw; cursor: grab;">
                                    ☰</div>
                                <button type="button" class="del-row-btn" onclick="deleteRow(this)"
                                    style="width: 8cqw; height: 8cqw; display: flex; align-items: center; justify-content: center; font-size: 3cqw;">❌</button>
                            </div>
                        </div>
                        <div class="remark" style="width: 100%; gap: 0.5cqw">
                            <input type="text" class="input-style item-note-input" style="height: 8cqw; max-width: 95%;"
                                ; placeholder="備註">
                            <label class="toggle-switch">
                                <input type="checkbox" class="soldout-toggle">
                                <span class="slider"></span>
                            </label>

                        </div>
                    </div>
                </div>
                <button type="button" class="add-row-btn" id="addItemRowBtn" style="width: 100%; height: 10cqw;">＋
                    新增下一個品項</button>
                <div class="manage-actions">

                    <button class="delete-btn">🗑️ 刪除</button>
                </div>

                <!-- 地推專用 QR Code 貼紙區 (效能解放優化) -->
                <section>
                    <div class="section-title">地推專用數位門牌貼紙</div>
                    <div class="qrcode-sticker-card">
                        <div style="font-size:13px; font-weight:700;">您的專屬永久自取網址：</div>
                        <div class="qrcode-url-display">https://pacetake.tw</div>
                        <button class="download-sticker-btn" id="generateDownloadBtn">💾 生成並下載高解析度貼紙</button>
                    </div>
                </section>
            </main>
        </div>
    </div>
    <script src="js/cart-manager.js"></script>
    <script type="module" src="js/app.js"></script>
    <script>

        // 💾 QR Code 效能解放優化：即時高速原生 API 生成並下載 SVG
        const generateDownloadBtn = document.getElementById('generateDownloadBtn');
        bindFastClick(generateDownloadBtn, () => {
            // 使用原生純代碼拼裝極客風高解析度 SVG 數位門牌貼紙外框與矩陣模擬
            const svgString = `
                <svg xmlns="http://w3.org" viewBox="0 0 400 500" width="400" height="500">
                    <rect width="400" height="500" rx="30" fill="#0066FF"/>
                    <rect x="20" y="20" width="360" height="460" rx="20" fill="#ffffff"/>
                    <text x="200" y="70" font-family="sans-serif" font-size="28" font-weight="900" fill="#0066FF" text-anchor="middle">快拿自取街</text>
                    <text x="200" y="105" font-family="sans-serif" font-size="14" font-weight="700" fill="#64748B" text-anchor="middle">pacetake.tw 數位門牌</text>
                    <!-- 模擬高速 QR 矩陣核心邊框 -->
                    <rect x="80" y="140" width="240" height="240" rx="12" fill="none" stroke="#0066FF" stroke-width="6"/>
                    <rect x="105" y="165" width="50" height="50" fill="#111111"/>
                    <rect x="245" y="165" width="50" height="50" fill="#111111"/>
                    <rect x="105" y="305" width="50" height="50" fill="#111111"/>
                    <rect x="180" y="240" width="40" height="40" fill="#0066FF"/>
                    <!-- 裝飾微小點陣 -->
                    <rect x="170" y="170" width="20" height="20" fill="#111111"/><rect x="210" y="190" width="20" height="20" fill="#111111"/>
                    <rect x="170" y="320" width="30" height="20" fill="#111111"/><rect x="270" y="270" width="25" height="40" fill="#111111"/>
                    <text x="200" y="430" font-family="sans-serif" font-size="16" font-weight="800" fill="#111111" text-anchor="middle">手機掃碼 ‧ 免投 App 點單</text>
                    <text x="200" y="460" font-family="sans-serif" font-size="13" font-weight="600" fill="#0066FF" text-anchor="middle">店內價 0 平台抽成</text>
                </svg>
            `;

            // 轉換為 Blob URL 並觸發高解析度原生物件下載
            const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const blobUrl = URL.createObjectURL(blob);

            const downloadLink = document.createElement('a');
            downloadLink.href = blobUrl;
            downloadLink.download = 'pacetake-store-sticker.svg';
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
            URL.revokeObjectURL(blobUrl);
        });
    </script>
</body>

</html>
