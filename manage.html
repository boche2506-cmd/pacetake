<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PACE 派思 pacetake.tw - 買家首頁</title>
    <!-- PWA 配置 -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#ffffff">
    <!-- 一般網頁分頁圖示 -->
    <link rel="icon" type="image/png" href="png/logo192.png" sizes="192x192">
    <!-- iPhone 桌面圖示專用（已修改為 180x180 正方形） -->
    <link rel="apple-touch-icon" href="png/logo180.png">
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard-container {
            height: 73%;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            padding: 1cqw;
            gap: 1cqw;
            box-sizing: border-box;
        }

        /* 將所有區塊改成卡片式設計 */
        .chart-section,
        .time-settings,
        .finance-stats {
            max-width: 100%;
            color: var(--text-main);
            box-shadow: var(--shadow-sm);
            background-color: var(--card-bg);
            border: 0.3cqw solid var(--border-color);
            border: none;
            padding: 3cqw;
            border-radius: 5cqw;
            /* 大圓角更現代 */
            flex: 1;
            /* 平分空間 */
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2cqw;
        }

        .section-title {
            font-size: 4cqw;
            margin-top: 0;
        }

        .bottom-bar {
            height: 12%;
            width: 100%;
            /* 根據你的需求調整高度 */
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
            padding: 0 1cqw;
            color: var(--text-main);
            box-shadow: var(--shadow-sm);
            background-color: var(--card-bg);
            border: 0.2cqw solid var(--border-color);
            border-radius: 5cqw;
            gap: 1cqw;
            position: relative;
        }

        .btn {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            background-color: #007AFF;
            /* Apple 風格的藍色 */
            color: white;
            font-weight: 600;
            padding: 2cqw 4cqw;
            border-radius: 2cqw;
            transition: transform 0.2s;
            /* 按下去會有一點點回饋感 */
        }

        .btn:active {
            transform: scale(0.95);
            /* 按下去變小一點，模擬點擊感 */
        }

        #volumectrlbox {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            /* 預設隱藏，點擊時用 JS 切換顯示 */
            position: absolute;
            bottom: 100%;
            right: 10%;
            height: 45cqw;
            width: 15cqw;
            /* 圓角看起來比較現代 */
            z-index: 200;
            /* 確保一定在最上層 */
            /* 這是为了標示邊界 */
            text-align: center;
        }

        /* 2. 拉桿：讓它垂直站立 */
        #volumeslider {
            height: 80%;
            width: 50%;
            writing-mode: vertical-lr;
            direction: rtl;
            cursor: pointer;
        }

        /* 3. 對 Label 和 Span 進行微調 */
        #volumectrlbox label {
            height: 10%;
            width: 100%;
            font-weight: bold;
            color: var(--brand-red);
        }

        #volumevalue {
            height: 10%;
            width: 100%;
            color: var(--brand-red);
            font-size: 5cqw;
        }
    </style>
</head>

<body>
    <div class="phone-wrapper">
        <!-- 頂部導覽列 -->
        <div id="buyerView" style="display: block;">
            <header class="header">
                <div class="pace-logo">
                    <a href="index.html" class="logo-link">
                        <img src="png/pace3.png" alt="派思 官方網站">
                    </a>
                    <div class="avatar-container">
                        <span id="defaultIcon">👤</span>
                        <img id="userAvatarImg" src=""
                            style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;"
                            onerror="this.style.display='none'; document.getElementById('defaultIcon').style.display='block';">
                    </div>
                </div>
                <div class="two">
                    <div class="pace">
                        <button class="theme-toggle" id="themeToggleBtn" aria-label="切換主題">🌙</button>
                        <span>店內價外帶自取/點餐系統</span>
                    </div>
                    <div class="avatarBtnMenu" data-action="avatarBtnMenu">
                        <span class="user-name" id="userNameDisplay"></span>
                        <div class="dropdown-menu" id="dropdownMenu"></div>
                    </div>
                </div>
            </header>
            <main class="dashboard-container">
                <div class="chart-section">
                    <canvas id="incomeChart"></canvas>
                </div>
                <div class="finance-stats">
                    <h3 class="section-title">財務統計</h3>
                    <div class="stat-item"><span>接單數</span> <strong>55</strong></div>
                    <div class="stat-item"><span>線上收入</span> <strong>222</strong></div>
                    <div class="stat-item"><span>現金收入</span> <strong>1111</strong></div>
                    <hr>
                    <div class="stat-item"><span>合計</span> <strong>1333</strong></div>
                </div>
                <div class="info-section">
                    <div class="time-settings">
                        <h3 class="section-title">營業時間設定</h3>
                        <div id="timeRows">
                            <p>週一 ~ 週日 (00:00)~(00:00)</p>
                        </div>
                    </div>
                </div>
            </main>
            <footer class="bottom-bar">
                <button class="btn" data-action="manage-orders">訂單</button>
                <button class="btn" data-action="manage-orders">訂單</button>
                <button class="btn" data-action="storesettings">⚙️資料修改</button>
                <button class="btn" data-action="volumemenu" type="button">🎵 測試鈴聲</button>
                <!-- 預設隱藏的音量控制區塊 -->
                <div id="volumectrlbox">
                    <label for="volumeslider">音量</label>
                    <!-- range 拉桿 -->
                    <input type="range" id="volumeslider" min="0" max="1" step="0.1" value="0.5">
                    <span id="volumevalue">50%</span>
                    <audio id="orderbell" preload="auto">
                        <source src="audio/ringtone.mp3" type="audio/mpeg">
                    </audio>
                </div>
            </footer>
        </div>
        <div class="lightbox-modal" id="loginLightbox" style="display: none;">
            <div class="modal-card">
                <div class="modal-title" style=" font-weight: 600; color: var(--text-main);">加入PACE 派思</div>
                <button class="modal-btn google" data-action="googleLogin"
                    style="box-shadow: 0 0.2cqw 0.125 rgba(0,0,0,0.05);">
                    <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right:0.5cqw;">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
                        <path fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
                    </svg>
                    Google 登入
                </button>
                <button data-action="toggleEmailFormBtn"
                    style="display: flex; align-items: center; justify-content: center; width: 100%; margin-bottom: 5cqw; background-color: white; border: 0.2cqw solid #e5e7eb; border-radius: 3cqw; padding: 3cqw 0; font-size: 5cqw; font-weight: 600; color: #374151; cursor: pointer; box-shadow: 0 0.5cqw 2cqw rgba(0,0,0,0.05);">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" style="margin-right:0.5cqw;">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    使用電子郵件登入
                </button>
                <div id="emailFormSection" class="email-form">
                    <div style="margin-bottom: 1cqw;">
                        <label for="loginEmail"
                            style="display:block; margin-bottom: 5cqw; font-size:5cqw; color:#6b7280; font-weight:700;">電子郵件</label>
                        <input type="email" id="loginEmail" placeholder="請輸入 Email" autocomplete="username"
                            style="width: 100%; box-sizing: border-box; padding: 2cqw; border:0.2cqw solid #e5e7eb; border-radius:2cqw; box-sizing:border-box; font-size:5cqw; background-color:#f9fafb; color: #111111;">
                    </div>
                    <div style="margin-bottom:10cqw;">
                        <label for="loginPassword"
                            style="display:block; margin-bottom:0.25cqw; font-size:5cqw; color:#6b7280; font-weight:500;">密碼</label>
                        <div style="position: relative; display: flex; align-items: center;">
                            <input type="password" id="loginPassword" placeholder="請輸入密碼"
                                autocomplete="current-password"
                                style="width: 100%; padding:0.25cqw 0.75cqw; border:0.2cqw solid #e5e7eb; border-radius:2cqw; box-sizing:border-box; font-size:5cqw; background-color:#f9fafb; color: #111111;">
                            <button type="button" data-action="togglePasswordVisibility"
                                style="position: absolute; right: 5cqw; background: none; border: none; cursor: pointer; font-size: 5cqw; padding: 0; color: #6b7280; z-index: 10;">👁️</button>
                        </div>
                    </div> <button data-action="emailLogin"
                        style="background-color: #059669; color: white; border: none; width: 100%; padding: 0.25cqw; border-radius: 0.5cqw; font-size: 5cqw; font-weight: 700; cursor: pointer; box-shadow: 0 0.25cqw 0.5cqw rgba(255, 255, 255, 0.15);">電子郵件登入
                        / 註冊</button>
                </div><span class="modal-close" data-action="customReturnBtn"
                    style="margin-top: 0.5cqw; text-decoration: underline; cursor: pointer; display: block; text-align: center;">暫時返回</span>
            </div>
        </div>
    </div>
    <script type="module" src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module">

        import { authReady, app, auth, db, provider, currentStoreInfo, signInAnonymously, signInWithPopup, signOut, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, collection, getDocs, doc, onSnapshot, getDoc, setDoc, updateDoc, addDoc, deleteDoc, query, where, serverTimestamp, orderBy, limit } from './app.js';
        let allStores = [];
        let buyerLat = null;
        let buyerLng = null;
        let currentBuyerAddress = "正在獲取定位中...";
        let currentUserId = null;
        let activeDragItem = null;
        /*<script type="module" src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">*/

        const urlParams = new URLSearchParams(window.location.search);
        const storeId = urlParams.get('storeId');
        async function initPage() {
            // 這裡會暫停，直到 authReady 被 resolve，也就是 Firebase 說「好，我知道是誰了」
            const user = await authReady;
            if (!user) {
                alert("尚未登入，請先前往登入頁面。");
                window.location.href = "index.html";
                return;
            }
            console.log("網址抓到的 ID:", storeId);
            console.log("登入的 UID:", auth.currentUser.uid);
            /*if (!storeId || storeId !== user.uid) {
                  alert("存取權限不足！您無權管理此商店，將為您導回首頁。");
                  window.location.href = "index.html";
                  return; // 務必保留 return，斷開後續渲染
              }*/
            // 驗證完全過關，執行你的主程式
            console.log("驗證通過，開始載入管理介面...");
        }
        // 在 manage.html 的 JS 中加入：
        document.addEventListener('click', async (e) => {
            // 1. 判斷點擊的是不是我們設定的按鈕
            const target = e.target.closest('[data-action]');
            if (!target) return;
            const action = target.getAttribute('data-action');
            switch (action) {
                case 'storesettings': {
                    // 3. 執行跳轉，帶上 storeId
                    window.location.href = `register.html?storeId=${auth.currentUser.uid}`;
                    break;
                }
            }
        });
        // 💾 QR Code 效能解放優化：即時高速原生 API 生成並下載 SVG
        // 準備一個隱藏的容器
        function QRCode() {
            const qrContainer = document.createElement('div');
            qrContainer.style.display = 'none';
            document.body.appendChild(qrContainer);
            bindFastClick(generateDownloadBtn, async () => {
                // 1. 設定你的商店網址
                const storeUrl = `https://www.pacetake.tw/store.html?storeId=${storeId}`;
                // 2. 使用 QRCode.js 生成 SVG
                const qrcode = new QRCode(qrContainer, {
                    text: storeUrl,
                    width: 200,
                    height: 200,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
                // 3. 取得生成的 SVG 原始碼
                const qrSvg = qrContainer.querySelector('svg').outerHTML;
                // 4. 把這個 SVG 塞進你原本的模板外框裡
                const svgString = `
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
                    <rect width="400" height="500" rx="30" fill="#0066FF"/>
                    <rect x="20" y="20" width="360" height="460" rx="20" fill="#ffffff"/>
                    <text x="200" y="70" font-family="sans-serif" font-size="28" font-weight="900" fill="#0066FF" text-anchor="middle">快拿自取街</text>
                    <g transform="translate(100, 150)">
                        ${qrSvg}
                    </g>
                    <text x="200" y="430" font-family="sans-serif" font-size="16" font-weight="800" fill="#111111" text-anchor="middle">手機掃碼 ‧ 免投 App 點單</text>
                </svg>
                `;
                // 5. 下載流程 (維持不變)
                const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `pacetake-qr-${storeId}.svg`;
                link.click();
                URL.revokeObjectURL(url);
                // 清理一下生成的 QR Code
                qrContainer.innerHTML = '';
            });
        }
        function volumebox() {
            const orderBell = document.getElementById("orderbell");
            const volumeBox = document.getElementById("volumectrlbox");
            const volumeSlider = document.getElementById("volumeslider");
            const volumeValue = document.getElementById("volumevalue");
            // 【初始化】從快取讀取音量設定
            const savedVolume = localStorage.getItem("orderBellVolume") || 0.5;
            orderBell.volume = savedVolume;
            volumeSlider.value = savedVolume;
            volumeValue.textContent = Math.round(savedVolume * 100) + "%";
            // ==========================================
            // 1. 點擊事件委派 (處理按鈕點擊)
            // ==========================================
            document.addEventListener("click", (e) => {
                // 尋找帶有 data-action="volumemenu" 的按鈕
                const targetBtn = e.target.closest('[data-action="volumemenu"]');
                if (targetBtn) {
                    // A. 切換選單的顯示/隱藏
                    if (volumeBox.style.display === "none") {
                        volumeBox.style.display = "flex"; // 或 block，視你的排版而定
                    } else {
                        volumeBox.style.display = "none";
                    }
                    // B. 播放/重新播放鈴聲 (同時解鎖瀏覽器音訊限制)
                    if (!orderBell.paused) {
                        orderBell.currentTime = 0;
                    }
                    orderBell.play().catch(err => console.log("音訊播放被瀏覽器阻擋：", err));
                }
            });
            // ==========================================
            // 2. 輸入事件委派 (處理拉桿滑動)
            // ==========================================
            document.addEventListener("input", (e) => {
                // 判斷是不是音量拉桿在變動
                if (e.target && e.target.id === "volumeslider") {
                    const currentVolume = e.target.value;
                    // 變更音量與 UI
                    orderBell.volume = currentVolume;
                    volumeValue.textContent = Math.round(currentVolume * 100) + "%";
                    // 儲存到快取，以便 seller.html 同步
                    localStorage.setItem("orderBellVolume", currentVolume);
                }
            });
        }
        document.addEventListener('DOMContentLoaded', () => {
            initPage();
            volumebox();
            console.log("系統初始化完成");
        });
    </script>
</body>

</html>
