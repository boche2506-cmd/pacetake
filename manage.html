<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PACE 派思 店內價外帶自取/點餐系統</title>
    <!-- PWA 配置 -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#ffffff">
    <!-- 一般網頁分頁圖示 -->
    <link rel="icon" type="image/png" href="png/logo192.png" sizes="192x192">
    <!-- iPhone 桌面圖示專用（已修改為 180x180 正方形） -->
    <link rel="apple-touch-icon" href="png/logo180.png">
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard-container {
            height: 75%;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            padding: 1cqw;
            gap: 1cqw;
            box-sizing: border-box;
        }

        /* 將所有區塊改成卡片式設計 */
        #incomeChart {
            height: 30%;
            width: 100%;
            color: var(--text-main);
            /*box-shadow: var(--shadow-sm);*/
            /*background-color: var(--card-bg);*/
            /*border: 0.2cqw solid var(--border-color);*/
            border: none;
            border-radius: 5cqw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2cqw;
        }

        .finance-stats {
            height: 30%;
            width: 100%;
            color: var(--text-main);
            box-shadow: var(--shadow-sm);
            background-color: var(--card-bg);
            border: 0.2cqw solid var(--border-color);
            border: none;
            border-radius: 5cqw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1cqw 5cqw;

        }

        .section-title {
            height: 20%;
            width: 100%;
            font-size: 4cqw;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }

        #week-selector {
            border-radius: 5cqw;
            border: 0.3cqw solid var(--border-color);
            background-color: var(--bg-global);
            color: var(--text-main);
            font-size: 3.25cqw;
            text-align: center;
            outline: none;
            height: 100%;
            width: 40%;
            box-sizing: border-box;
            line-height: 1.1;
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            cursor: grab;
        }

        #week-selector::-webkit-scrollbar {
            /* Chrome, Safari 隱藏軸線 */
            display: none;
        }

        .stat-item {
            height: 20%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 3.5cqw;
            border-top: 0.3cqw solid var(--border-color);
        }

        .bottom-bar {
            height: 10%;
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
            padding: 1cqw;
            color: var(--text-main);
            border-top: 0.3cqw solid var(--border-color);
            position: relative;
        }

        .btn {
            height: 13cqw;
            width: 22cqw;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            background-color: #007AFF;
            /* Apple 風格的藍色 */
            color: white;
            font-weight: 600;
            font-size: 3.5cqw;
            padding: 2cqw 3cqw;
            border-radius: 2cqw;
            transition: transform 0.2s;
            /* 按下去會有一點點回饋感 */
        }

        .btn:active {
            transform: scale(0.95);
            /* 按下去變小一點，模擬點擊感 */
        }

        .modal {
            position: fixed;
            top: 0;
            aspect-ratio: 9 / 16;
            height: 100%;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            z-index: 999;
            padding: 8cqw 0;
        }

        .qrcodeinput {
            height: 25%;
            width: 90%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            border-radius: 4cqw;
            text-align: center;
            background-color: var(--card-bg);
            border: 0.2cqw solid var(--border-color);
            box-shadow: var(--shadow-sm);
            padding: 1cqw;
            font-size: 3.5cqw;
            color: var(--brand-red);
            letter-spacing: 1px;
            line-height: 1.1;
        }

        #overlayInput {
            height: 10cqw;
            width: 90%;
            /* 對應畫布文字的 Y 座標 */
            /* 背景透明 */
            color: var(--text-main);
            /* 文字顏色 */
            text-align: center;
            font: bold 6cqw sans-serif;
            /* 記得調整字體大小符合預覽比例 */
            background-color: var(--bg-Container);
        }

        #qrcode {
            height: auto;
            width: 90%;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 8cqw;
            right: 6cqw;
            font-size: 10cqw;
            cursor: pointer;
            z-index: 999;
        }

        .btn-download {
            padding: 2.5cqw 5cqw;
            background: #0066FF;
            color: white;
            border: none;
            border-radius: 1cqw;
            cursor: pointer;
        }

        /* 設定時間 */
        .info-section {
            height: 40%;
            width: 100%;
            color: var(--text-main);
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: start;
            padding: 1cqw;
        }

        .time-title {
            height: 100%;
            width: 75%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
        }

        .save-section {
            height: 100%;
            width: 25%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
        }

        .time-title span {
            height: 12.5%;
            width: 100%;
            font-weight: 600;
            font-size: 3.75cqw;
            text-align: center;
            line-height: 1.2;
        }

        .AutoMode {
            height: 12.5%;
            width: 100%;
            font-weight: 600;
            font-size: 3.75cqw;
            text-align: center;
            line-height: 1.2;
            color: var(--text-main);
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
        }

        .AutoMode span {
            height: 100%;
            width: 25%;
            font-weight: 600;
            font-size: 3.75cqw;
            text-align: center;
            line-height: 1.2;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }

        #AutoMode-text {
            height: 100%;
            width: 55%;
            font-weight: 600;
            font-size: 3.75cqw;
            text-align: center;
            line-height: 1.2;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }

        #timeRows {
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-size: 3.5cqw;
            line-height: 1.2;
        }

        /* 2. 設定每一行 */
        .day-row {
            height: 12.5%;
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            font-size: 3.5cqw;
            line-height: 1.2;
        }

        .day-row span {
            height: 100%;
            width: 5%;
            font-weight: 600;
            font-size: 3.75cqw;
            text-align: center;
            line-height: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* 3. 星期標籤樣式 */
        .day-row label {
            height: 100%;
            width: 16%;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            /* 佔容器寬度的 15% */
            font-weight: 500;
            color: #333;
            font-size: 3.5cqw;
            color: var(--text-main);
        }

        .day-row input {
            height: 100%;
            width: 36%;
            border: 0.2cqw solid var(--border-color);
            border-radius: 10cqw;
            background-color: var(--bg-global);
            color: var(--text-main);
            line-height: 1.2;
            box-sizing: border-box;
            object-fit: contain;
            user-select: text;
            cursor: text;
            background-color: #f0f0f0;
            /* 你原本的灰色 */
            transition: background-color 0.3s ease;
            /* 讓顏色變換有平滑的過場效果 */
            font-size: 3.5cqw;
        }

        .day-row input::-webkit-calendar-picker-indicator {
            padding: 0;
            margin: 0;
            /* 讓它保持原始圖示寬度，避免消失 */
            color: var(--text-main);
        }

        .day-row input:not(:placeholder-shown) {
            background-color: var(--bg-Container);
            color: var(--text-main);
        }

        .save-section span {
            height: 20%;
            width: 100%;
            font-weight: 600;
            font-size: 3.75cqw;
            text-align: center;
            line-height: 1.2;
        }

        .save-section button {
            height: 25%;
            width: 90%;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            background-color: #007AFF;
            /* Apple 風格的藍色 */
            color: white;
            font-weight: 600;
            font-size: 3.5cqw;
            padding: 1cqw 2cqw;
            border-radius: 2cqw;
            transition: transform 0.2s;
            /* 按下去會有一點點回饋感 */
        }

        .status-container {
            height: 55%;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            text-align: center;
            line-height: 1.2;
        }

        .status-container span {
            height: 40%;
            width: 100%;
            font-weight: 600;
            font-size: 3.75cqw;
            text-align: center;
            line-height: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            letter-spacing: 0.5cqw;
            white-space: pre-wrap;
        }

        /* 5. 簡單的視覺優化 */
        .status-container label {
            position: relative;
            display: inline-block;
            height: 20%;
            width: 70%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .AutoMode label {
            position: relative;
            display: inline-block;
            height: 95%;
            width: 20%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .status-container label input,
        .AutoMode label input {
            display: none;
        }

        .status-container label span {
            position: absolute;
            height: 100%;
            width: 100%;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ff4d4f;
            /* 綠色 */
            border-radius: 7cqw;
            transition: 0.4s;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3.5cqw;
            font-weight: bold;
        }

        .AutoMode label span {
            position: absolute;
            height: 100%;
            width: 100%;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ff4d4f;
            /* 綠色 */
            border-radius: 7cqw;
            transition: 0.4s;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3.25cqw;
            font-weight: bold;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 5cqw;
            width: 5cqw;
            right: 0.75cqw;
            /* 圓圈初始在左邊 */
            background-color: white;
            border-radius: 50%;
            transition: 0.4s;
        }

        input:checked+.slider {
            background-color: #52c41a;
        }

        input:checked+.slider:before {
            transform: translateX(-10cqw);
        }

        .AutoMode input:checked+.slider:before {
            transform: translateX(-7.75cqw);
        }
    </style>
</head>

<body>
    <div class="phone-wrapper">
        <!-- 頂部導覽列 -->
        <div id="buyerView" style="display: block;">
            <header class="header">
                <div class="pace-logo">
                    <a href="index.html" class="logo-link">
                        <img src="png/pace3.png" alt="派思 官方網站">
                    </a>
                    <div class="avatar-container">
                        <span id="defaultIcon">👤</span>
                        <img id="userAvatarImg" src=""
                            style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;"
                            onerror="this.style.display='none'; document.getElementById('defaultIcon').style.display='block';">
                    </div>
                </div>
                <div class="two">
                    <div class="pace">
                        <button class="theme-toggle" id="themeToggleBtn" aria-label="切換主題">🌙</button>
                        <span>店內價外帶自取/點餐系統</span>
                    </div>
                    <div class="avatarBtnMenu" data-action="avatarBtnMenu">
                        <span class="user-name" id="userNameDisplay"></span>
                        <div class="dropdown-menu" id="dropdownMenu"></div>
                    </div>
                </div>
            </header>
            <main class="dashboard-container">
                <canvas id="incomeChart"></canvas>
                <div class="finance-stats" id="stats-container">
                    <h3 class="section-title">
                        財務統計區間：
                        <select id="week-selector">
                            <!-- 選項會透過 JS 自動生成 -->
                        </select>
                    </h3>
                    <div class="stat-item"><span>接單數</span> <strong id="stat-orders">讀取中...</strong></div>
                    <div class="stat-item"><span>線上收入</span> <strong id="stat-online">讀取中...</strong></div>
                    <div class="stat-item"><span>現金收入</span> <strong id="stat-cash">讀取中...</strong></div>
                    <div class="stat-item"><span>合計</span> <strong id="stat-total">讀取中...</strong></div>
                </div>
                <div class="info-section">
                    <div class="time-title">
                        <div class="AutoMode"><span>排程開關</span>
                            <label class="switch">
                                <input type="checkbox" id="AutoModetoggle" data-action="AutoModetoggle">
                                <span class="slider"></span>
                            </label>
                            <span id="AutoMode-text">自動排程：讀取中...</span>
                        </div>
                        <div class="day-row" id="timeRows"></div>
                    </div>
                    <div class="save-section"><span>營業<br>時間設定</span>
                        <button class="btn" data-action=saveBusinessHours>儲存<br>時間設定</button>
                        <div class="status-container"><span>上下線<br>總開關</span>
                            <label class="switch">
                                <input type="checkbox" id="status-toggle" data-action="toggle-status">
                                <span class="slider"></span>
                            </label>
                            <span id="status-text">目前狀態：<br>讀取中...</span>
                        </div>
                    </div>
                </div>
            </main>
            <footer class="bottom-bar">
                <button class="btn" data-action="manage-orders">🧑‍🍳<br>前往接單</button>
                <button class="btn" data-action="QRCode">💾<br>QRCode</button>
                <div id="qrModal" class="modal" style="display: none;">
                    <div class="qrcodeinput"><span>此QR Code為您的商店專屬，<br>掃描後會連結至您在派思的商店頁。<br>請在下方輸入你的標題，<br>會覆蓋在QR
                            Code上方藍色區域顯示。<br>下載後至7-11以「按原尺寸列印」或<br>「不縮放」列印較為方便使用。</span><input type="text"
                            id="overlayInput" placeholder="輸入標題...Sample text ✨">
                    </div>
                    <div id="qrcode"></div>
                    <span class="close-btn" data-action="closeModal">&times;</span>
                    <button id="downloadBtn" class="btn-download">💾 下載 QR Code</button>
                </div>
                <button class="btn" data-action="storesettings">⚙️<br>資料修改</button>
            </footer>
        </div>
        <div class="lightbox-modal" id="loginLightbox" style="display: none;">
            <div class="modal-card">
                <div class="modal-title" style=" font-weight: 600; color: var(--text-main);">加入PACE 派思</div>
                <button class="modal-btn google" data-action="googleLogin"
                    style="box-shadow: 0 0.2cqw 0.125 rgba(0,0,0,0.05);">
                    <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right:0.5cqw;">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
                        <path fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
                    </svg>
                    Google 登入
                </button>
                <button data-action="toggleEmailFormBtn"
                    style="display: flex; align-items: center; justify-content: center; width: 100%; margin-bottom: 5cqw; background-color: white; border: 0.2cqw solid #e5e7eb; border-radius: 3cqw; padding: 3cqw 0; font-size: 5cqw; font-weight: 600; color: #374151; cursor: pointer; box-shadow: 0 0.5cqw 2cqw rgba(0,0,0,0.05);">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" style="margin-right:0.5cqw;">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    使用電子郵件登入
                </button>
                <div id="emailFormSection" class="email-form">
                    <div style="margin-bottom: 1cqw;">
                        <label for="loginEmail"
                            style="display:block; margin-bottom: 5cqw; font-size:5cqw; color:#6b7280; font-weight:700;">電子郵件</label>
                        <input type="email" id="loginEmail" placeholder="請輸入 Email" autocomplete="username"
                            style="width: 100%; box-sizing: border-box; padding: 2cqw; border:0.2cqw solid #e5e7eb; border-radius:2cqw; box-sizing:border-box; font-size:5cqw; background-color:#f9fafb; color: #111111;">
                    </div>
                    <div style="margin-bottom:10cqw;">
                        <label for="loginPassword"
                            style="display:block; margin-bottom:0.25cqw; font-size:5cqw; color:#6b7280; font-weight:500;">密碼</label>
                        <div style="position: relative; display: flex; align-items: center;">
                            <input type="password" id="loginPassword" placeholder="請輸入密碼"
                                autocomplete="current-password"
                                style="width: 100%; padding:0.25cqw 0.75cqw; border:0.2cqw solid #e5e7eb; border-radius:2cqw; box-sizing:border-box; font-size:5cqw; background-color:#f9fafb; color: #111111;">
                            <button type="button" data-action="togglePasswordVisibility"
                                style="position: absolute; right: 5cqw; background: none; border: none; cursor: pointer; font-size: 5cqw; padding: 0; color: #6b7280; z-index: 10;">👁️</button>
                        </div>
                    </div> <button data-action="emailLogin"
                        style="background-color: #059669; color: white; border: none; width: 100%; padding: 0.25cqw; border-radius: 0.5cqw; font-size: 5cqw; font-weight: 700; cursor: pointer; box-shadow: 0 0.25cqw 0.5cqw rgba(255, 255, 255, 0.15);">電子郵件登入
                        / 註冊</button>
                </div><span class="modal-close" data-action="customReturnBtn"
                    style="margin-top: 0.5cqw; text-decoration: underline; cursor: pointer; display: block; text-align: center;">暫時返回</span>
            </div>
        </div>
    </div>
    <script type="importmap"> { "imports": { "qr-code-styling": "https://esm.sh/qr-code-styling@1.6.0" }  }</script>
    <script type="module" src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module">
        import { authReady, app, auth, db, provider, currentStoreInfo, signInAnonymously, signInWithPopup, signOut, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, collection, getDocs, doc, onSnapshot, getDoc, setDoc, updateDoc, addDoc, deleteDoc, query, where, serverTimestamp, orderBy, limit } from './app.js';
        // 在你的 app.js 或 <script type="module"> 裡面修改為：
        import QRCodeStyling from 'qr-code-styling';
        let allStores = [];
        let buyerLat = null;
        let buyerLng = null;
        let currentUserId = null;
        let activeDragItem = null;
        let cachedQrCanvas = null;
        let myChart = null;
        const IS_DEBUG_MODE = true;// 🚩 開發時設為 true，上線前請務必改回 false！
        const MOCK_USER_ID = "56TND0b1QBaj994IUmB9gwtYAWF2";// 🚩 開發時設為 true，上線前請務必改回 false！
        // 取得網址參數 (記得在網址手動加上 ?storeId=你的ID)
        const modal = document.getElementById('qrModal');
        const urlParams = new URLSearchParams(window.location.search);
        const storeId = urlParams.get('storeId') || MOCK_USER_ID;
        function checkSubscriptionStatus(sub) {
            if (!sub || !sub.expiryDate) {
                alert("請聯絡管理員設定您的訂閱方案。");
                return false;
            }
            const now = new Date();
            const expiry = new Date(sub.expiryDate);
            const threeDaysInMs = 3 * 24 * 60 * 60 * 1000;
            // 1. 已過期：完全鎖住並導向首頁
            if (now > expiry) {
                alert("您的服務已過期，無法使用管理後台。請盡速繳費！");
                window.location.href = "index.html";
                return false;
            }
            // 2. 快到期 (3天內)：跳出提示
            if ((expiry - now) < threeDaysInMs) {
                showDynamicSubscriptionWarning(expiry);
            }
            return true;
        }
        // 動態建立提示視窗，不影響你的 qrModal
        function showDynamicSubscriptionWarning(expiryDate) {
            // 建立一個覆蓋全螢幕的容器
            const overlay = document.createElement('div');
            overlay.style.position = 'fixed';
            overlay.style.top = '0';
            overlay.style.left = '0';
            overlay.style.width = '100%';
            overlay.style.height = '100%';
            overlay.style.backgroundColor = 'rgba(0,0,0,0.5)';
            overlay.style.zIndex = '9999'; // 確保在最上層
            overlay.style.display = 'flex';
            overlay.style.justifyContent = 'center';
            overlay.style.alignItems = 'center';
            // 建立內容區塊
            const modalContent = document.createElement('div');
            modalContent.style.backgroundColor = 'white';
            modalContent.style.padding = '20px';
            modalContent.style.borderRadius = '10px';
            modalContent.style.boxShadow = '0 2px 10px rgba(0,0,0,0.3)';
            modalContent.style.textAlign = 'center';
            modalContent.style.maxWidth = '300px';
            modalContent.innerHTML = `
                    <h3>⚠️ 提醒：服務即將到期</h3>
                    <p>到期日：${expiryDate.toLocaleDateString()}</p>
                    <p>為了避免中斷，請前往 <a href="#" class="nav-fast" data-target="pay" style="color: blue; text-decoration: underline;">💵 繳費</a></p>
                    <button id="closeWarningBtn" style="margin-top:10px; padding: 5px 15px;">我知道了</button>
                `;
            overlay.appendChild(modalContent);
            document.body.appendChild(overlay);
            // 綁定關閉按鈕事件
            document.getElementById('closeWarningBtn').onclick = () => {
                document.body.removeChild(overlay);
            };
            // 如果你有全域的 nav-fast 點擊邏輯，這段連結點下去應該會觸發你原本的頁面切換
            // 確保這裡的 class="nav-fast" 跟你的其他 UI 邏輯有對應上
        }
        async function initPage() {
            let user;
            if (IS_DEBUG_MODE) {
                console.warn("⚠️ 目前處於開發模式，已自動模擬登入");
                user = { uid: MOCK_USER_ID }; // 偽造一個使用者物件
            } else {
                user = await authReady; // 真實登入檢查
                if (!user) {
                    alert("尚未登入，請先前往登入頁面。");
                    window.location.href = "index.html";
                    return;
                }
            }
            // 權限檢查 (開發模式下我們可以直接跳過，或者也讓他跑)
            if (!IS_DEBUG_MODE && storeId !== user.uid) {
                alert("存取權限不足！");
                window.location.href = "index.html";
                return;
            }
            // --- 【新增：取得商店資料並檢查訂閱狀態】 ---
            try {
                const storeRef = doc(db, "stores", storeId);
                const storeSnap = await getDoc(storeRef);
                if (!storeSnap.exists()) {
                    alert("找不到商店資料");
                    return;
                }
                const storeData = storeSnap.data();
                const sub = storeData.subscription;
                // 檢查訂閱邏輯
                if (!checkSubscriptionStatus(sub)) {
                    return; // 訂閱已過期，中斷執行，不進入後台
                }
                // 訂閱檢查通過，繼續執行主程式
                console.log("驗證通過，開始載入管理介面...");
                await initStatus(storeId);
                fetchAndRenderChart(user.uid);
            } catch (error) {
                console.error("檢查訂閱失敗:", error);
                alert("系統檢查發生錯誤，請稍後再試。");
            }
            // 這裡會暫停，直到 authReady 被 resolve，也就是 Firebase 說「好，我知道是誰了」
            /*const user = await authReady;
            if (!user) {
                alert("尚未登入，請先前往登入頁面。");
                window.location.href = "index.html";
                return;
            }
            console.log("網址抓到的 ID:", storeId);
            console.log("登入的 UID:", auth.currentUser.uid);*/
            /*if (!storeId) {
                alert("找不到商店 ID，請確認網址是否正確。");
                window.location.href = "index.html";
                return;
            }
            // 權限檢查：登入的 UID 必須跟網址的 storeId 一致
            if (storeId !== user.uid) {
                alert("存取權限不足！您無權管理此商店。");
                window.location.href = "index.html";
                return;
            }*/
            // 驗證完全過關，執行你的主程式
            if (user) {
                // 使用者已經登入！
                // 從 user 物件中取出 uid
                const sellerUid = user.uid;
                // 【關鍵】在這裡呼叫你的函數，並把 sellerUid 餵給它
                console.log("驗證通過，開始載入管理介面...");
                await initStatus(storeId);
                fetchAndRenderChart(sellerUid);
            }
        }
        async function initStatus(storeId) {
            try {
                const docRef = doc(db, "stores", storeId);
                const storeDoc = await getDoc(docRef);
                if (storeDoc.exists()) {
                    const data = storeDoc.data();
                    const statusToggle = document.getElementById('status-toggle');
                    const statusText = document.getElementById('status-text');
                    const AutoModetoggle = document.getElementById('AutoModetoggle');
                    const AutoModetext = document.getElementById('AutoMode-text');
                    // 根據資料庫的狀態更新開關
                    const isOnline = data.status === true;
                    if (statusToggle) {
                        statusToggle.checked = isOnline;
                        statusText.innerText = isOnline ? "目前狀態：\n營業中" : "目前狀態：\n休息中";
                    }
                    const isAutoMode = data.isAutoMode === true;
                    if (AutoModetoggle) {
                        AutoModetoggle.checked = isAutoMode;
                        AutoModetext.innerText = isAutoMode ? "自動排程：開" : "自動排程：關";
                    }
                    renderTimeInputs(data.businessHours || {});
                }
            } catch (error) {
                console.error("載入狀態失敗:", error);
            }
        }
        // 2. 點擊開關時：立即更新 Firebase
        async function toggleStatus(event) {
            const isChecked = event.target.checked;
            const newStatus = isChecked;
            try {
                await updateDoc(doc(db, "stores", storeId), {
                    status: newStatus
                });
                // 更新文字提示
                document.getElementById('status-text').innerText = isChecked ? "目前狀態：\n營業中" : "目前狀態：\n休息中";
                console.log("狀態已更新為:", newStatus);
            } catch (error) {
                console.error("更新失敗:", error);
                // 失敗時把開關切回來
                event.target.checked = !isChecked;
                alert("更新失敗，請檢查網路");
            }
        }
        async function AutoModetoggle(event) {
            const isChecked = event.target.checked;
            const newMode = isChecked;
            try {
                await updateDoc(doc(db, "stores", storeId), {
                    isAutoMode: newMode
                });
                // 更新文字提示
                document.getElementById('AutoMode-text').innerText = isChecked ? "自動排程：開" : "自動排程：關";
                console.log("自動模式已更新為:", newMode);
            } catch (error) {
                console.error("更新失敗:", error);
                event.target.checked = !isChecked;
                alert("更新失敗，請檢查網路");
            }
        }
        document.addEventListener('click', (e) => {
            // 2. 先抓目標
            const target = e.target.closest('[data-action]');
            if (modal && e.target === modal) {
                closeQrModal();
                return;
            }
            // 6. 處理其他按鈕
            else if (!target) return;
            const action = target.dataset.action; // 使用 dataset 簡寫
            if (action === 'storesettings') {
                window.location.href = `register.html?storeId=${auth.currentUser.uid}`;
            } else if (action === 'QRCode') {
                showQrModal(storeId);
            } else if (action === 'closeModal') {
                closeQrModal();
            } else if (action === 'saveBusinessHours') {
                saveBusinessHours();
            } else if (action === 'toggle-status') {
                toggleStatus(event);
            } else if (action === 'AutoModetoggle') {
                AutoModetoggle(event);
            } else if (action === 'manage-orders') {
                window.location.href = `seller.html?storeId=${storeId}`;
            }
        });
        // 1. 打開燈箱並生成 QR
        async function showQrModal(storeId) {
            const modal = document.getElementById('qrModal');
            const qrContainer = document.getElementById('qrcode');
            const input = document.getElementById('overlayInput'); // 確保這 ID 正確
            if (!modal || !qrContainer) return;
            modal.style.display = 'flex';
            qrContainer.innerHTML = "";
            // 1. 先產生 QR Code (隱藏在背景產生)
            const tempQrDiv = document.createElement('div');
            const qrCodeStyling = new QRCodeStyling({
                width: 850,       // 自動適應容器寬度
                height: 850,      // 自動適應容器高度
                type: "canvas",
                data: "https://www.pacetake.tw/store.html?storeId=" + storeId,
                dotsOptions: {
                    color: "#0047FF", // 藍色碼體
                    type: "rounded"   // 圓滑資料點
                },
                backgroundOptions: {
                    color: "#E2E5E9"  // 灰白色內底色
                },
                cornersSquareOptions: {
                    color: "#0047FF",
                    type: "extra-rounded" // 定位點大圓角外框
                },
                cornersDotOptions: {
                    color: "#0047FF",
                    type: "dot"           // 定位點圓角心
                }
            });
            qrCodeStyling.append(tempQrDiv);
            // 等待 QR Code 渲染完成
            await new Promise(resolve => setTimeout(resolve, 300));
            const rawQrCanvas = tempQrDiv.querySelector('canvas');
            // 2. 建立最終合成的 Canvas (設定好 1024x1150)
            const finalCanvas = document.createElement('canvas');
            finalCanvas.width = 1024;
            finalCanvas.height = 1150;
            const ctx = finalCanvas.getContext('2d');
            /* A. 繪製最外層的漸層藍色大圓角卡片 */
            // 建立垂直漸層
            const gradient = ctx.createLinearGradient(0, 0, 0, finalCanvas.height);
            gradient.addColorStop(0, '#3A7BD5'); // 亮藍
            gradient.addColorStop(1, '#0047FF'); // 深藍
            ctx.fillStyle = gradient;
            // 繪製大圓角矩形外框
            const radius = 80; // 外框圓角半徑
            ctx.beginPath();
            ctx.roundRect(0, 0, finalCanvas.width, finalCanvas.height, radius);
            ctx.fill();
            /* C. 繪製灰白色的內圓角底座 */
            const innerMarginX = 50;  // 左右留白
            const innerMarginY = 200; // 避開頂部文字的上方留白
            const innerWidth = finalCanvas.width - (innerMarginX * 2);
            const innerHeight = finalCanvas.height - innerMarginY - 50; // 下方留白 50px
            const innerRadius = 60;   // 內底座圓角
            ctx.fillStyle = "#E2E5E9"; // 灰白色背景
            ctx.beginPath();
            ctx.roundRect(innerMarginX, innerMarginY, innerWidth, innerHeight, innerRadius);
            ctx.fill();
            /* D. 把產出的 QR Code 本體疊加進來 */
            // 取得 qr-code-styling 產出的原始畫布物件
            if (rawQrCanvas) {
                // 計算 QR Code 置中在內底座的位置
                const qrX = innerMarginX + (innerWidth - 850) / 2;
                const qrY = innerMarginY + (innerHeight - 850) / 2;
                // 將 QR 繪製到最終畫布上
                ctx.drawImage(rawQrCanvas, qrX, qrY, 850, 850);
            }
            // 3. 把最終 Canvas 放進 HTML
            finalCanvas.style.maxWidth = "100%";
            finalCanvas.style.height = "auto";
            qrContainer.appendChild(finalCanvas);
            // 4. 下載按鈕邏輯：直接利用已經畫好的 finalCanvas
            const downloadBtn = document.getElementById('downloadBtn');
            document.getElementById('downloadBtn').onclick = () => {
                // 抓取目前的輸入文字
                const userText = input.value || "Sample text ✨";
                // 重新繪製文字
                ctx.fillStyle = "#FFFFFF";
                ctx.font = "bold 96px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(userText, 1024 / 2, 100);
                // 執行下載
                const dataUrl = finalCanvas.toDataURL('image/png');
                const link = document.createElement('a');
                link.href = dataUrl;
                link.download = `pacetake-${storeId}.png`;
                link.click();
            };
        }
        // 關閉燈箱
        function closeQrModal() {
            document.getElementById('qrModal').style.display = 'none';
        }
        const days = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
        const dayNames = ['週一', '週二', '週三', '週四', '週五', '週六', '週日'];
        // 1. 初始化頁面：產生 UI
        function renderTimeInputs(data = {}) {
            const container = document.getElementById('timeRows');
            container.innerHTML = "";
            days.forEach((day, index) => {
                const dayData = data[day] || { isOpen: false, open: "09:00", close: "18:00" };
                const row = document.createElement('div');
                row.className = 'day-row';
                row.innerHTML = `
                        <label>
                            <input type="checkbox" id="${day}-check" ${dayData.isOpen ? 'checked' : ''}>
                            ${dayNames[index]}
                        </label>
                        <input type="time" id="${day}-open" value="${dayData.open}">
                        <span>至</span>
                        <input type="time" id="${day}-close" value="${dayData.close}">`;
                container.appendChild(row);
            });
        }
        // 2. 儲存邏輯
        async function saveBusinessHours() {
            let businessHours = {};
            days.forEach(day => {
                businessHours[day] = {
                    isOpen: document.getElementById(`${day}-check`).checked,
                    open: document.getElementById(`${day}-open`).value,
                    close: document.getElementById(`${day}-close`).value
                };
            });
            // 寫入 Firebase
            await updateDoc(doc(db, "stores", storeId), { businessHours });
            alert("已儲存時間設定！(自動排程為每十分鐘更新一次)");
        }
        function initWeekSelector() {
            const selector = document.getElementById('week-selector');
            const now = new Date();
            // 從本週開始往回推 8 週
            for (let i = 0; i < 26; i++) {
                // 計算該週的起始日期 (週一)
                const dayOfWeek = now.getDay() === 0 ? 6 : now.getDay() - 1;
                const startOfWeek = new Date(now);
                startOfWeek.setDate(now.getDate() - dayOfWeek - (i * 7));
                startOfWeek.setHours(0, 0, 0, 0);
                const endOfWeek = new Date(startOfWeek);
                endOfWeek.setDate(startOfWeek.getDate() + 6);
                endOfWeek.setHours(23, 59, 59, 999);
                // 格式化顯示字串: 2026/7/13 ~ 7/19
                const label = `${startOfWeek.getFullYear()}/${startOfWeek.getMonth() + 1}/${startOfWeek.getDate()} ~ ${endOfWeek.getMonth() + 1}/${endOfWeek.getDate()}`;
                // 將起始時間存入 value (使用 ISO 格式方便轉回日期物件)
                const option = document.createElement('option');
                option.value = startOfWeek.toISOString();
                option.text = label;
                selector.appendChild(option);
            }
            // 監聽選單改變事件
            selector.addEventListener('change', (e) => {
                const startDate = new Date(e.target.value);
                fetchAndRenderChart(storeId, startDate);
            });
        }
        async function fetchAndRenderChart(storeId, startDate = null) {
            // 1. 計算該週的範圍
            let startOfWeek, endOfWeek;
            if (startDate) {
                startOfWeek = startDate;
            } else {
                // 如果沒指定，預設本週一
                const today = new Date();
                const dayOfWeek = today.getDay() === 0 ? 6 : today.getDay() - 1;
                startOfWeek = new Date(today);
                startOfWeek.setDate(today.getDate() - dayOfWeek);
                startOfWeek.setHours(0, 0, 0, 0);
            }
            endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(startOfWeek.getDate() + 6);
            endOfWeek.setHours(23, 59, 59, 999);
            // 2. 準備該週的 7 天資料容器 (這部分保持不變)
            let weeklyData = Array.from({ length: 7 }, (_, i) => {
                const d = new Date(startOfWeek);
                d.setDate(d.getDate() + i);
                return {
                    fullDate: d,
                    label: `${d.getMonth() + 1}/${d.getDate()}`,
                    orders: 0, online: 0, cash: 0
                };
            });
            // 3. 查詢 Firebase
            const q = query(
                collection(db, "orders"),
                where("storeId", "==", storeId),
                where("createdAt", ">=", startOfWeek),
                where("createdAt", "<=", endOfWeek)
            );
            const snapshot = await getDocs(q);
            // 4. 統計資料 (統計邏輯維持你原本寫好的，不用動)
            snapshot.forEach((doc) => {
                const order = doc.data();
                if (order.status !== 'COMPLETED' || order.paymentStatus !== 'PAID') return;
                const orderDate = order.createdAt.toDate();
                orderDate.setHours(0, 0, 0, 0);
                const index = weeklyData.findIndex(item =>
                    item.fullDate.getTime() === orderDate.getTime()
                );
                if (index !== -1) {
                    const amount = parseFloat(order.totalAmount || order.amount || 0);
                    const method = (order.paymentMethod || '').toUpperCase();
                    weeklyData[index].orders += 1;
                    if (method === 'CASH') weeklyData[index].cash += amount;
                    else if (method === 'CREDIT' || method === 'ONLINE') weeklyData[index].online += amount;
                }
            });
            updateChart(weeklyData);
        }
        function updateChart(data) {
            const ctx = document.getElementById('incomeChart').getContext('2d');
            // 準備資料
            const labels = data.map(d => d.label);
            const chartValues = data.map(d => d.online + d.cash);
            if (myChart) {
                myChart.data.labels = labels;
                myChart.data.datasets[0].data = chartValues;
                myChart.update();
            } else {
                // 如果還沒有圖表，才創建一個新的
                myChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels, // 這裡確保是用上面的 labels
                        datasets: [{
                            label: '每日總收入',
                            data: chartValues,
                            backgroundColor: '#3498db'
                        }]
                    },
                    options: {
                        responsive: true,
                        onClick: (event, elements) => {
                            // 這裡改用外部的 data 變數，不需要擔心作用域問題
                            if (elements.length > 0) {
                                updateStats(data[elements[0].index]);
                            } else {
                                // 重新計算總和
                                const totalStats = data.reduce((acc, curr) => ({
                                    orders: acc.orders + curr.orders,
                                    online: acc.online + curr.online,
                                    cash: acc.cash + curr.cash,
                                    total: acc.total + (curr.online + curr.cash)
                                }), { orders: 0, online: 0, cash: 0, total: 0 });
                                updateStats(totalStats, true);
                            }
                        }
                    }
                });
            }
            // 計算初始總和並顯示 (放在 updateChart 最後)
            const totalStats = data.reduce((acc, curr) => ({
                orders: acc.orders + curr.orders,
                online: acc.online + curr.online,
                cash: acc.cash + curr.cash,
                total: acc.total + (curr.online + curr.cash)
            }), { orders: 0, online: 0, cash: 0, total: 0 });
            updateStats(totalStats, true);
        }
        // 更新 UI 的函式
        function updateStats(data, isTotal = false) {
            document.getElementById('stat-orders').innerText = data.orders;
            document.getElementById('stat-online').innerText = data.online;
            document.getElementById('stat-cash').innerText = data.cash;
            document.getElementById('stat-total').innerText = isTotal ? data.total : (data.online + data.cash);
        }
        document.addEventListener('DOMContentLoaded', () => {
            initPage();
            initWeekSelector(); // 生成選單
            console.log("系統初始化完成");
        });
    </script>
