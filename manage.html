<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PACE 派思 pacetake.tw - 買家首頁</title>
    <!-- Favicon & Apple Touch Icon -->
    <link rel="icon" type="image/png" href="png/logoapple.png" sizes="180x180">
    <link rel="apple-touch-icon" href="png/logoapple.png">
    <link rel="apple-touch-icon" sizes="180x180" href="png/logoapple.png">
    <link rel="apple-touch-icon-precomposed" href="png/logoapple.png">
    <link rel="stylesheet" href="style.css">
    <style>
        /* 帳務記帳本區塊 */
        .main-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .ledger-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow-sm);
        }

        .ledger-row-main {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .ledger-stat h3 {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .ledger-stat div {
            font-size: 26px;
            font-weight: 900;
            color: var(--text-main);
            margin-top: 4px;
        }

        .ledger-stat .revenue-num {
            color: var(--brand-blue);
        }

        .ledger-divider {
            height: 1px;
            background-color: var(--border-color);
            margin-bottom: 10px;
        }

        .ledger-row-sub {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* 菜單與售罄管理排版 */
        .menu-management-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .manage-food-card {
            display: flex;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px;
            gap: 12px;
            align-items: center;
            box-shadow: var(--shadow-sm);
            position: relative;
            animation: fadeIn 0.2s ease;
        }

        .food-img {
            width: 65px;
            height: 65px;
            border-radius: 12px;
            background-color: var(--bg-global);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            flex-shrink: 0;
            border: 1px solid var(--border-color);
        }

        .food-info-fields {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-grow: 1;
        }

        .food-name-txt {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
        }

        .food-price-txt {
            font-size: 14px;
            font-weight: 800;
            color: var(--brand-blue);
        }

        /* 動作控制右側 */
        .manage-actions {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            flex-shrink: 0;
        }

        /* 原生滑動開關器（售罄開關） */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--brand-green);
            /* 預設開關未啟動代表營業中（綠燈） */
            transition: .2s;
            border-radius: 22px;
        }

        .slider::before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .2s;
            border-radius: 50%;
        }

        /* 當開關被勾選時，代表啟用「售罄防線」（變紅燈） */
        input:checked+.slider {
            background-color: var(--brand-red);
        }

        input:checked+.slider::before {
            transform: translateX(22px);
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .delete-btn:hover {
            color: var(--brand-red);
        }

        /* 新增品項大按鈕 */
        .add-item-btn {
            background-color: var(--bg-global);
            border: 1px dashed var(--border-color);
            color: var(--brand-blue);
            height: 48px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            margin-top: 4px;
        }

        /* 地推專用 QR Code 貼紙區 */
        .qrcode-sticker-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow-sm);
            text-align: center;
        }

        .qrcode-url-display {
            background-color: var(--bg-global);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 12px;
            color: var(--brand-blue);
            font-weight: 700;
            margin: 8px 0 14px 0;
            word-break: break-all;
        }

        .download-sticker-btn {
            background-color: var(--brand-blue);
            color: white;
            border: none;
            width: 100%;
            height: 44px;
            border-radius: 22px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="phone-wrapper">
        <!-- 頂部導覽列 -->
        <div id="buyerView" style="display: block;">
            <header class="header">
                <div class="pace-logo">
                    <a href="index.html" class="logo-link">
                        <img src="png/pace3.png" alt="派思 官方網站">
                    </a>
                    <div class="pace-avatar-icon">
                        <span id="defaultIcon" class="avatar-icon">👤</span>
                        <img id="userAvatarImg" src=""
                            style="display: none; border-radius: 50%;height: 13cqw; width: 13cqw;">
                    </div>
                </div>
                <div class="two">
                    <div class="pace">
                        <button class="theme-toggle" id="themeToggleBtn" aria-label="切換主題">🌙</button>
                        <span>店內價外帶自取/點餐系統</span>
                    </div>
                    <button class="login-btn" id="loginBtn">登入/註冊</button>
                    <button class="user-avatar-btn" id="avatarBtn" style="display: none;">
                        <span class="user-name" id="userNameDisplay"></span></button>
                    <div class="dropdown-menu" id="dropdownMenu"></div>
                </div>
            </header>

            <main class="main-content">
                <!-- 帳務記帳本 -->
                <section>
                    <div class="section-title">今日帳務記帳本</div>
                    <div class="ledger-card">
                        <div class="ledger-row-main">
                            <div class="ledger-stat">
                                <h3>今日總接單量</h3>
                                <div>42 單</div>
                            </div>
                            <div class="ledger-stat" style="text-align: right;">
                                <h3>今日總營業額</h3>
                                <div class="revenue-num">$5,340</div>
                            </div>
                        </div>
                        <div class="ledger-divider"></div>
                        <div class="ledger-row-sub">
                            <span>💵 現場付現實收：$1,240</span>
                            <span>💳 藍線上支付：$4,100</span>
                        </div>
                    </div>
                </section>

                <!-- 菜單與售罄管理 -->
                <div class="section-title">菜單商品上架</div>
                <div class="menu-upload-list" id="menuUploadList">
                    <div class="menu-item-row">
                        <div class="menu-item">
                            <div class="img-upload-box" onclick="triggerUpload(this)">
                                <input type="file" class="image-input" accept="image/*" style="display: none;"
                                    onchange="previewImage(this)">
                                <img class="preview-img" src=""
                                    style="display: none; width: 100%; height: 100%; object-fit: cover; border-radius: 2cqw;">
                                <div class="upload-placeholder"
                                    style="font-size: 8cqw; width: 17cqw; height: 17cqw; border: 0.2cqw dashed var(--border-color); border-radius: 2cqw; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                                    📷<span>上傳照片</span></div>
                            </div>
                            <div class="item-fields" style="width: 100%; gap: 0.5cqw;">
                                <input type="text" class="input-style item-name-input"
                                    style="height:8cqw; width: 100%; padding: 0 2cqw;" placeholder="品項名稱" required>
                                <div class="price-input-wrapper">
                                    <span class="price-symbol">$</span>
                                    <input type="number" class="input-style price-input"
                                        style="height:8cqw; width: 100%;padding-left:5cqw;" placeholder="金額" min="0"
                                        required>
                                </div>
                            </div>
                            <div class="item-right-ctrls"
                                style="gap: 0.5cqw; display: flex; flex-direction: column; justify-content: center;">
                                <div class="drag-handle"
                                    style="width: 8cqw; height: 8cqw; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 3cqw; cursor: grab;">
                                    ☰</div>
                                <button type="button" class="del-row-btn" onclick="deleteRow(this)"
                                    style="width: 8cqw; height: 8cqw; display: flex; align-items: center; justify-content: center; font-size: 3cqw;">❌</button>
                            </div>
                        </div>
                        <div class="remark" style="width: 100%; gap: 0.5cqw">
                            <input type="text" class="input-style item-note-input" style="height: 8cqw; max-width: 95%;"
                                ; placeholder="備註">
                            <label class="toggle-switch">
                                <input type="checkbox" class="soldout-toggle">
                                <span class="slider"></span>
                            </label>

                        </div>
                    </div>
                </div>
                <button type="button" class="add-row-btn" id="addItemRowBtn" style="width: 100%; height: 10cqw;">＋
                    新增下一個品項</button>
                <div class="manage-actions">

                    <button class="delete-btn">🗑️ 刪除</button>
                </div>

                <!-- 地推專用 QR Code 貼紙區 (效能解放優化) -->
                <section>
                    <div class="section-title">地推專用數位門牌貼紙</div>
                    <div class="qrcode-sticker-card">
                        <div style="font-size:13px; font-weight:700;">您的專屬永久自取網址：</div>
                        <div class="qrcode-url-display">https://pacetake.tw</div>
                        <button class="download-sticker-btn" id="generateDownloadBtn">💾 生成並下載高解析度貼紙</button>
                    </div>
                </section>
            </main>
        </div>
        <div class="lightbox-modal" id="loginLightbox" style="display: none;">
            <div class="modal-card">
                <div class="modal-title" style=" font-weight: 600; color: var(--text-main);">加入PACE 派思</div>
                <button class="modal-btn google" data-action="googleLoginAction"
                    style="box-shadow: 0 0.2cqw 0.125 rgba(0,0,0,0.05);">
                    <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right:0.5cqw;">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
                        <path fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
                    </svg>
                    Google 登入
                </button>
                <button id="toggleEmailFormBtn"
                    style="display: flex; align-items: center; justify-content: center; width: 100%; margin-bottom: 5cqw; background-color: white; border: 0.2cqw solid #e5e7eb; border-radius: 2cqw; padding: 3cqw 0; font-size: 5cqw; font-weight: 600; color: #374151; cursor: pointer; box-shadow: 0 0.5cqw 2cqw rgba(0,0,0,0.05);">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" style="margin-right:0.5cqw;">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    使用電子郵件登入
                </button>
                <div id="emailFormSection"
                    style="display: none; margin-top: 5cqw; text-align: left; height: 100%; box-sizing: border-box; background-color: var(--bg-Container); border: 0.2cqw solid var(--border-color); ">
                    <div style="margin-bottom: 1cqw;">
                        <label for="loginEmail"
                            style="display:block; margin-bottom: 5cqw; font-size:5cqw; color:#6b7280; font-weight:700;">電子郵件</label>
                        <input type="email" id="loginEmail" placeholder="請輸入 Email" autocomplete="username"
                            style="width: 100%; box-sizing: border-box; padding: 2cqw; border:0.2cqw solid #e5e7eb; border-radius:2cqw; box-sizing:border-box; font-size:5cqw; background-color:#f9fafb; color: #111111;">
                    </div>
                    <div style="margin-bottom:10cqw;">
                        <label for="loginPassword"
                            style="display:block; margin-bottom:0.25cqw; font-size:5cqw; color:#6b7280; font-weight:500;">密碼</label>
                        <div style="position: relative; display: flex; align-items: center;">
                            <input type="password" id="loginPassword" placeholder="請輸入密碼"
                                autocomplete="current-password"
                                style="width: 100%; padding:0.25cqw 0.75cqw; border:0.2cqw solid #e5e7eb; border-radius:2cqw; box-sizing:border-box; font-size:5cqw; background-color:#f9fafb; color: #111111;">
                            <button type="button" id="togglePasswordVisibility"
                                style="position: absolute; right: 5cqw; background: none; border: none; cursor: pointer; font-size: 5cqw; padding: 0; color: #6b7280; z-index: 10;">👁️</button>
                        </div>
                    </div> <button id="emailLoginAction"
                        style="background-color: #059669; color: white; border: none; width: 100%; padding: 0.25cqw; border-radius: 0.5cqw; font-size: 5cqw; font-weight: 700; cursor: pointer; box-shadow: 0 0.25cqw 0.5cqw rgba(255, 255, 255, 0.15);">電子郵件登入
                        / 註冊</button>
                </div><span class="modal-close" id="customReturnBtn"
                    style="margin-top: 0.5cqw; text-decoration: underline; cursor: pointer; display: block; text-align: center;">暫時返回</span>
            </div>
        </div>
    </div>
    <script type="module" src="app.js"></script>
    <script type="module">
        // 💾 QR Code 效能解放優化：即時高速原生 API 生成並下載 SVG
        const generateDownloadBtn = document.getElementById('generateDownloadBtn');
        bindFastClick(generateDownloadBtn, () => {
            // 使用原生純代碼拼裝極客風高解析度 SVG 數位門牌貼紙外框與矩陣模擬
            const svgString = `
                <svg xmlns="http://w3.org" viewBox="0 0 400 500" width="400" height="500">
                    <rect width="400" height="500" rx="30" fill="#0066FF"/>
                    <rect x="20" y="20" width="360" height="460" rx="20" fill="#ffffff"/>
                    <text x="200" y="70" font-family="sans-serif" font-size="28" font-weight="900" fill="#0066FF" text-anchor="middle">快拿自取街</text>
                    <text x="200" y="105" font-family="sans-serif" font-size="14" font-weight="700" fill="#64748B" text-anchor="middle">pacetake.tw 數位門牌</text>
                    <!-- 模擬高速 QR 矩陣核心邊框 -->
                    <rect x="80" y="140" width="240" height="240" rx="12" fill="none" stroke="#0066FF" stroke-width="6"/>
                    <rect x="105" y="165" width="50" height="50" fill="#111111"/>
                    <rect x="245" y="165" width="50" height="50" fill="#111111"/>
                    <rect x="105" y="305" width="50" height="50" fill="#111111"/>
                    <rect x="180" y="240" width="40" height="40" fill="#0066FF"/>
                    <!-- 裝飾微小點陣 -->
                    <rect x="170" y="170" width="20" height="20" fill="#111111"/><rect x="210" y="190" width="20" height="20" fill="#111111"/>
                    <rect x="170" y="320" width="30" height="20" fill="#111111"/><rect x="270" y="270" width="25" height="40" fill="#111111"/>
                    <text x="200" y="430" font-family="sans-serif" font-size="16" font-weight="800" fill="#111111" text-anchor="middle">手機掃碼 ‧ 免投 App 點單</text>
                    <text x="200" y="460" font-family="sans-serif" font-size="13" font-weight="600" fill="#0066FF" text-anchor="middle">店內價 0 平台抽成</text>
                </svg>
            `;

            // 轉換為 Blob URL 並觸發高解析度原生物件下載
            const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const blobUrl = URL.createObjectURL(blob);

            const downloadLink = document.createElement('a');
            downloadLink.href = blobUrl;
            downloadLink.download = 'pacetake-store-sticker.svg';
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
            URL.revokeObjectURL(blobUrl);
        });
    </script>
</body>

</html>
