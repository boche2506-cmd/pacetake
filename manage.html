<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PACE 派思 店內價外帶自取/點餐系統</title>
    <!-- PWA 配置 -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#ffffff">
    <!-- 一般網頁分頁圖示 -->
    <link rel="icon" type="image/png" href="png/logo192.png" sizes="192x192">
    <!-- iPhone 桌面圖示專用（已修改為 180x180 正方形） -->
    <link rel="apple-touch-icon" href="png/logo180.png">
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard-container {
            height: 75%;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            padding: 1cqw;
            gap: 1cqw;
            box-sizing: border-box;
        }

        /* 將所有區塊改成卡片式設計 */
        .chart-section {
            height: 30%;
            width: 100%;
            color: var(--text-main);
            box-shadow: var(--shadow-sm);
            background-color: var(--card-bg);
            border: 0.2cqw solid var(--border-color);
            border: none;
            border-radius: 5cqw;
        }

        .finance-stats {
            height: 30%;
            width: 100%;
            color: var(--text-main);
            box-shadow: var(--shadow-sm);
            background-color: var(--card-bg);
            border: 0.2cqw solid var(--border-color);
            border: none;
            border-radius: 5cqw;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2cqw;
        }

        .section-title {
            font-size: 4cqw;
            margin-top: 0;
        }

        .bottom-bar {
            height: 10%;
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
            padding: 1cqw;
            color: var(--text-main);
            border-top: 0.3cqw solid var(--border-color);
            position: relative;
        }

        .btn {
            height: 13cqw;
            width: 22cqw;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            background-color: #007AFF;
            /* Apple 風格的藍色 */
            color: white;
            font-weight: 600;
            font-size: 3.5cqw;
            padding: 2cqw 3cqw;
            border-radius: 2cqw;
            transition: transform 0.2s;
            /* 按下去會有一點點回饋感 */
        }

        .btn:active {
            transform: scale(0.95);
            /* 按下去變小一點，模擬點擊感 */
        }

        .modal {
            position: fixed;
            top: 0;
            aspect-ratio: 9 / 16;
            height: 100%;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            z-index: 999;
            padding: 8cqw 0;
        }

        .qrcodeinput {
            height: 25%;
            width: 90%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            border-radius: 4cqw;
            text-align: center;
            background-color: var(--card-bg);
            border: 0.2cqw solid var(--border-color);
            box-shadow: var(--shadow-sm);
            padding: 1cqw;
            font-size: 3.5cqw;
            color: var(--brand-red);
            letter-spacing: 1px;
            line-height: 1.1;
        }

        #overlayInput {
            height: 10cqw;
            width: 90%;
            /* 對應畫布文字的 Y 座標 */
            /* 背景透明 */
            color: var(--text-main);
            /* 文字顏色 */
            text-align: center;
            font: bold 6cqw sans-serif;
            /* 記得調整字體大小符合預覽比例 */
            background-color: var(--bg-Container);
        }

        #qrcode {
            height: auto;
            width: 90%;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 8cqw;
            right: 6cqw;
            font-size: 10cqw;
            cursor: pointer;
            z-index: 999;
        }

        .btn-download {
            padding: 2.5cqw 5cqw;
            background: #0066FF;
            color: white;
            border: none;
            border-radius: 1cqw;
            cursor: pointer;
        }

        /* 設定時間 */
        .info-section {
            height: 40%;
            width: 100%;
            color: var(--text-main);
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: start;
            padding: 1cqw;
        }

        .time-title {
            height: 100%;
            width: 75%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
        }

        .save-section {
            height: 100%;
            width: 25%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
        }

        .time-title span {
            height: 12.5%;
            width: 100%;
            font-weight: 600;
            font-size: 3.75cqw;
            text-align: center;
            line-height: 1.2;
        }

        .AutoMode {
            height: 12.5%;
            width: 100%;
            font-weight: 600;
            font-size: 3.75cqw;
            text-align: center;
            line-height: 1.2;
            color: var(--text-main);
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
        }

        .AutoMode span {
            height: 100%;
            width: 25%;
            font-weight: 600;
            font-size: 3.75cqw;
            text-align: center;
            line-height: 1.2;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }

        #AutoMode-text {
            height: 100%;
            width: 55%;
            font-weight: 600;
            font-size: 3.75cqw;
            text-align: center;
            line-height: 1.2;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }

        #timeRows {
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-size: 3.5cqw;
            line-height: 1.2;
        }

        /* 2. 設定每一行 */
        .day-row {
            height: 12.5%;
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            font-size: 3.5cqw;
            line-height: 1.2;
        }

        .day-row span {
            height: 100%;
            width: 5%;
            font-weight: 600;
            font-size: 3.75cqw;
            text-align: center;
            line-height: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* 3. 星期標籤樣式 */
        .day-row label {
            height: 100%;
            width: 16%;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            /* 佔容器寬度的 15% */
            font-weight: 500;
            color: #333;
            font-size: 3.5cqw;
            color: var(--text-main);
        }

        .day-row input {
            height: 100%;
            width: 36%;
            border: 0.2cqw solid var(--border-color);
            border-radius: 10cqw;
            background-color: var(--bg-global);
            color: var(--text-main);
            line-height: 1.2;
            box-sizing: border-box;
            object-fit: contain;
            user-select: text;
            cursor: text;
            background-color: #f0f0f0;
            /* 你原本的灰色 */
            transition: background-color 0.3s ease;
            /* 讓顏色變換有平滑的過場效果 */
            font-size: 3.5cqw;
        }

        .day-row input::-webkit-calendar-picker-indicator {
            padding: 0;
            margin: 0;
            /* 讓它保持原始圖示寬度，避免消失 */
            color: var(--text-main);
        }

        .day-row input:not(:placeholder-shown) {
            background-color: var(--bg-Container);
            color: var(--text-main);
        }

        .save-section span {
            height: 20%;
            width: 100%;
            font-weight: 600;
            font-size: 3.75cqw;
            text-align: center;
            line-height: 1.2;
        }

        .save-section button {
            height: 25%;
            width: 90%;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            background-color: #007AFF;
            /* Apple 風格的藍色 */
            color: white;
            font-weight: 600;
            font-size: 3.5cqw;
            padding: 1cqw 2cqw;
            border-radius: 2cqw;
            transition: transform 0.2s;
            /* 按下去會有一點點回饋感 */
        }

        .status-container {
            height: 55%;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            text-align: center;
            line-height: 1.2;
        }

        .status-container span {
            height: 40%;
            width: 100%;
            font-weight: 600;
            font-size: 3.75cqw;
            text-align: center;
            line-height: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            letter-spacing: 0.5cqw;
            white-space: pre-wrap;
        }

        /* 5. 簡單的視覺優化 */
        .status-container label {
            position: relative;
            display: inline-block;
            height: 20%;
            width: 70%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .AutoMode label {
            position: relative;
            display: inline-block;
            height: 95%;
            width: 20%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .status-container label input,
        .AutoMode label input {
            display: none;
        }

        .status-container label span {
            position: absolute;
            height: 100%;
            width: 100%;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ff4d4f;
            /* 綠色 */
            border-radius: 7cqw;
            transition: 0.4s;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3.5cqw;
            font-weight: bold;
        }

        .AutoMode label span {
            position: absolute;
            height: 100%;
            width: 100%;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ff4d4f;
            /* 綠色 */
            border-radius: 7cqw;
            transition: 0.4s;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3.25cqw;
            font-weight: bold;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 5cqw;
            width: 5cqw;
            right: 0.75cqw;
            /* 圓圈初始在左邊 */
            background-color: white;
            border-radius: 50%;
            transition: 0.4s;
        }

        input:checked+.slider {
            background-color: #52c41a;
        }

        input:checked+.slider:before {
            transform: translateX(-10cqw);
        }

        .AutoMode input:checked+.slider:before {
            transform: translateX(-7.75cqw);
        }
    </style>
</head>

<body>
    <div class="phone-wrapper">
        <!-- 頂部導覽列 -->
        <div id="buyerView" style="display: block;">
            <header class="header">
                <div class="pace-logo">

                    <div class="avatar-container">

        </div>

        async function initStatus(storeId) {
            try {
                const docRef = doc(db, "stores", storeId);
                const storeDoc = await getDoc(docRef);
                if (storeDoc.exists()) {
                    const data = storeDoc.data();
                    const statusToggle = document.getElementById('status-toggle');
                    const statusText = document.getElementById('status-text');
                    const AutoModetoggle = document.getElementById('AutoModetoggle');
                    const AutoModetext = document.getElementById('AutoMode-text');
                    // 根據資料庫的狀態更新開關
                    const isOnline = data.status === true;
                    if (statusToggle) {
                        statusToggle.checked = isOnline;
                        statusText.innerText = isOnline ? "目前狀態：\n營業中" : "目前狀態：\n休息中";
                    }
                    const isAutoMode = data.isAutoMode === true;
                    if (AutoModetoggle) {
                        AutoModetoggle.checked = isAutoMode;
                        AutoModetext.innerText = isAutoMode ? "自動排程：開" : "自動排程：關";
                    }
                    renderTimeInputs(data.businessHours || {});
                }
            } catch (error) {
                console.error("載入狀態失敗:", error);
            }
        }
        // 2. 點擊開關時：立即更新 Firebase
        async function toggleStatus(event) {
            const isChecked = event.target.checked;
            const newStatus = isChecked;
            try {
                await updateDoc(doc(db, "stores", storeId), {
                    status: newStatus
                });
                // 更新文字提示
                document.getElementById('status-text').innerText = isChecked ? "目前狀態：\n營業中" : "目前狀態：\n休息中";
                console.log("狀態已更新為:", newStatus);
            } catch (error) {
                console.error("更新失敗:", error);
                // 失敗時把開關切回來
                event.target.checked = !isChecked;
                alert("更新失敗，請檢查網路");
            }
        }
        async function AutoModetoggle(event) {
            const isChecked = event.target.checked;
            const newMode = isChecked;
            try {
                await updateDoc(doc(db, "stores", storeId), {
                    isAutoMode: newMode
                });
                // 更新文字提示
                document.getElementById('AutoMode-text').innerText = isChecked ? "自動排程：開" : "自動排程：關";
                console.log("自動模式已更新為:", newMode);
            } catch (error) {
                console.error("更新失敗:", error);
                event.target.checked = !isChecked;
                alert("更新失敗，請檢查網路");
            }
        }
        document.addEventListener('click', (e) => {
            // 2. 先抓目標
            const target = e.target.closest('[data-action]');
            if (modal && e.target === modal) {
                closeQrModal();
                return;
            }
            // 6. 處理其他按鈕
            else if (!target) return;
            const action = target.dataset.action; // 使用 dataset 簡寫
            if (action === 'storesettings') {
                window.location.href = `register.html?storeId=${auth.currentUser.uid}`;
            } else if (action === 'QRCode') {
                showQrModal(storeId);
            } else if (action === 'closeModal') {
                closeQrModal();
            } else if (action === 'saveBusinessHours') {
                saveBusinessHours();
            } else if (action === 'toggle-status') {
                toggleStatus(event);
            } else if (action === 'AutoModetoggle') {
                AutoModetoggle(event);
            } else if (action === 'manage-orders') {
                window.location.href = `seller.html?storeId=${storeId}`;
            }
        });
        // 1. 打開燈箱並生成 QR
        async function showQrModal(storeId) {
            const modal = document.getElementById('qrModal');
            const qrContainer = document.getElementById('qrcode');
            const input = document.getElementById('overlayInput'); // 確保這 ID 正確
            if (!modal || !qrContainer) return;
            modal.style.display = 'flex';
            qrContainer.innerHTML = "";
            // 1. 先產生 QR Code (隱藏在背景產生)
            const tempQrDiv = document.createElement('div');
            const qrCodeStyling = new QRCodeStyling({
                width: 850,       // 自動適應容器寬度
                height: 850,      // 自動適應容器高度
                type: "canvas",
                data: "https://www.pacetake.tw/store.html?storeId=" + storeId,
                dotsOptions: {
                    color: "#0047FF", // 藍色碼體
                    type: "rounded"   // 圓滑資料點
                },
                backgroundOptions: {
                    color: "#E2E5E9"  // 灰白色內底色
                },
                cornersSquareOptions: {
                    color: "#0047FF",
                    type: "extra-rounded" // 定位點大圓角外框
                },
                cornersDotOptions: {
                    color: "#0047FF",
                    type: "dot"           // 定位點圓角心
                }
            });
            qrCodeStyling.append(tempQrDiv);
            // 等待 QR Code 渲染完成
            await new Promise(resolve => setTimeout(resolve, 300));
            const rawQrCanvas = tempQrDiv.querySelector('canvas');
            // 2. 建立最終合成的 Canvas (設定好 1024x1150)
            const finalCanvas = document.createElement('canvas');
            finalCanvas.width = 1024;
            finalCanvas.height = 1150;
            const ctx = finalCanvas.getContext('2d');
            /* A. 繪製最外層的漸層藍色大圓角卡片 */
            // 建立垂直漸層
            const gradient = ctx.createLinearGradient(0, 0, 0, finalCanvas.height);
            gradient.addColorStop(0, '#3A7BD5'); // 亮藍
            gradient.addColorStop(1, '#0047FF'); // 深藍
            ctx.fillStyle = gradient;
            // 繪製大圓角矩形外框
            const radius = 80; // 外框圓角半徑
            ctx.beginPath();
            ctx.roundRect(0, 0, finalCanvas.width, finalCanvas.height, radius);
            ctx.fill();
            /* C. 繪製灰白色的內圓角底座 */
            const innerMarginX = 50;  // 左右留白
            const innerMarginY = 200; // 避開頂部文字的上方留白
            const innerWidth = finalCanvas.width - (innerMarginX * 2);
            const innerHeight = finalCanvas.height - innerMarginY - 50; // 下方留白 50px
            const innerRadius = 60;   // 內底座圓角
            ctx.fillStyle = "#E2E5E9"; // 灰白色背景
            ctx.beginPath();
            ctx.roundRect(innerMarginX, innerMarginY, innerWidth, innerHeight, innerRadius);
            ctx.fill();
            /* D. 把產出的 QR Code 本體疊加進來 */
            // 取得 qr-code-styling 產出的原始畫布物件
            if (rawQrCanvas) {
                // 計算 QR Code 置中在內底座的位置
                const qrX = innerMarginX + (innerWidth - 850) / 2;
                const qrY = innerMarginY + (innerHeight - 850) / 2;
                // 將 QR 繪製到最終畫布上
                ctx.drawImage(rawQrCanvas, qrX, qrY, 850, 850);
            }
            // 3. 把最終 Canvas 放進 HTML
            finalCanvas.style.maxWidth = "100%";
            finalCanvas.style.height = "auto";
            qrContainer.appendChild(finalCanvas);
            // 4. 下載按鈕邏輯：直接利用已經畫好的 finalCanvas
            const downloadBtn = document.getElementById('downloadBtn');
            document.getElementById('downloadBtn').onclick = () => {
                // 抓取目前的輸入文字
                const userText = input.value || "Sample text ✨";
                // 重新繪製文字
                ctx.fillStyle = "#FFFFFF";
                ctx.font = "bold 96px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(userText, 1024 / 2, 100);
                // 執行下載
                const dataUrl = finalCanvas.toDataURL('image/png');
                const link = document.createElement('a');
                link.href = dataUrl;
                link.download = `pacetake-${storeId}.png`;
                link.click();
            };
        }
        // 關閉燈箱
        function closeQrModal() {
            document.getElementById('qrModal').style.display = 'none';
        }
        const days = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
        const dayNames = ['週一', '週二', '週三', '週四', '週五', '週六', '週日'];
        // 1. 初始化頁面：產生 UI
        function renderTimeInputs(data = {}) {
            const container = document.getElementById('timeRows');
            container.innerHTML = "";
            days.forEach((day, index) => {
                const dayData = data[day] || { isOpen: false, open: "09:00", close: "18:00" };
                const row = document.createElement('div');
                row.className = 'day-row';
                row.innerHTML = `
            <label>
                <input type="checkbox" id="${day}-check" ${dayData.isOpen ? 'checked' : ''}>
                ${dayNames[index]}
            </label>
            <input type="time" id="${day}-open" value="${dayData.open}">
            <span>至</span>
            <input type="time" id="${day}-close" value="${dayData.close}">`;
                container.appendChild(row);
            });
        }
        // 2. 儲存邏輯
        async function saveBusinessHours() {
            let businessHours = {};
            days.forEach(day => {
                businessHours[day] = {
                    isOpen: document.getElementById(`${day}-check`).checked,
                    open: document.getElementById(`${day}-open`).value,
                    close: document.getElementById(`${day}-close`).value
                };
            });
            // 寫入 Firebase
            await updateDoc(doc(db, "stores", storeId), { businessHours });
            alert("已儲存時間設定！(自動排程為每十分鐘更新一次)");
        }
        const ctx = document.getElementById('incomeChart').getContext('2d');
        // 範例資料：一週七天
        const weeklyData = [
            { day: '週一', orders: 10, online: 50, cash: 200 },
            { day: '週二', orders: 5, online: 30, cash: 100 },
            // ... 填入七天資料
        ];
        // 計算總和 (預設顯示)
        const totalStats = weeklyData.reduce((acc, curr) => ({
            orders: acc.orders + curr.orders,
            online: acc.online + curr.online,
            cash: acc.cash + curr.cash,
            total: acc.total + (curr.online + curr.cash)
        }), { orders: 0, online: 0, cash: 0, total: 0 });
        const myChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: weeklyData.map(d => d.day),
                datasets: [{
                    label: '每日總收入',
                    data: weeklyData.map(d => d.online + d.cash),
                    backgroundColor: '#3498db'
                }]
            },
            options: {
                onClick: (event, elements) => {
                    if (elements.length > 0) {
                        const index = elements[0].index;
                        updateStats(weeklyData[index]); // 顯示該天
                    } else {
                        updateStats(totalStats, true); // 點擊空白處回到總和
                    }
                }
            }
        });
        // 更新 UI 的函式
        function updateStats(data, isTotal = false) {
            document.getElementById('stat-orders').innerText = data.orders;
            document.getElementById('stat-online').innerText = data.online;
            document.getElementById('stat-cash').innerText = data.cash;
            document.getElementById('stat-total').innerText = isTotal ? data.total : (data.online + data.cash);
        }
        document.addEventListener('DOMContentLoaded', () => {
            initPage();
            renderTimeInputs();
            console.log("系統初始化完成");
        });
    </script>
</body>
