<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PACE 派思 pacetake.tw - 買家首頁</title>
    <!-- PWA 配置 -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#ffffff">
    <!-- 一般網頁分頁圖示 -->
    <link rel="icon" type="image/png" href="png/logo192.png" sizes="192x192">
    <!-- iPhone 桌面圖示專用（已修改為 180x180 正方形） -->
    <link rel="apple-touch-icon" href="png/logo180.png">
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard-container {
            height: 73%;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            padding: 1cqw;
            gap: 1cqw;
            box-sizing: border-box;
        }

        /* 將所有區塊改成卡片式設計 */
        .chart-section,
        .finance-stats {
            height: 30%;
            width: 100%;
            color: var(--text-main);
            box-shadow: var(--shadow-sm);
            background-color: var(--card-bg);
            border: 0.2cqw solid var(--border-color);
            border: none;
            border-radius: 5cqw;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2cqw;
        }

        .section-title {
            font-size: 4cqw;
            margin-top: 0;
        }

        .bottom-bar {
            height: 12%;
            width: 100%;
            /* 根據你的需求調整高度 */
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
            padding: 1cqw;
            color: var(--text-main);
            border-radius: 5cqw;
            gap: 1cqw;
            position: relative;
        }

        .btn {
            height: 13cqw;
            width: 22cqw;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            background-color: #007AFF;
            /* Apple 風格的藍色 */
            color: white;
            font-weight: 600;
            font-size: 3.5cqw;
            padding: 2cqw 3cqw;
            border-radius: 2cqw;
            transition: transform 0.2s;
            /* 按下去會有一點點回饋感 */
        }

        .btn:active {
            transform: scale(0.95);
            /* 按下去變小一點，模擬點擊感 */
        }

        #volumectrlbox {
            display: none;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            /* 預設隱藏，點擊時用 JS 切換顯示 */
            position: absolute;
            bottom: 100%;
            right: 10%;
            height: 35cqw;
            width: 70cqw;
            /* 圓角看起來比較現代 */
            z-index: 200;
            /* 確保一定在最上層 */
            /* 這是为了標示邊界 */
            border-radius: 5cqw;
            padding: 2cqw;
            text-align: center;
            appearance: none;
            color: var(--text-main);
            background-color: var(--bg-global);
            user-select: none;
            font-size: 4cqw;
        }

        /* 2. 拉桿：讓它垂直站立 */
        #volumeslider {
            -webkit-appearance: none;
            /*去掉網頁原生樣式兩個一起用*/
            appearance: none;
            /*去掉網頁原生樣式兩個一起用*/
            height: 15%;
            width: 100%;
            background: #ddd;
            /* 1. 強制游標顯示為手指 (或 default，改成箭頭) */
            cursor: pointer;
            user-select: none;
            /* 標準寫法 */
        }

        #volumeslider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 5cqw;
            height: 5cqw;
            background: #007bff;
            border-radius: 50%;
        }

        #volumectrlbox label {
            height: 20%;
            width: 100%;
            font-weight: bold;
            color: var(--brand-red);
            text-align: center;
            letter-spacing: 2cqw;
            font-size: 6cqw;
        }

        #volumevalue {
            height: 20%;
            width: 100%;
            color: var(--brand-red);
            font-size: 6cqw;
            text-align: center;
        }

        .modal {
            position: fixed;
            top: 0;
            aspect-ratio: 9 / 16;
            height: 100%;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            z-index: 999;
        }

        .qrcodeinput {
            height: 25%;
            width: 90%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            border-radius: 4cqw;
            text-align: center;
            background-color: var(--card-bg);
            border: 0.2cqw solid var(--border-color);
            box-shadow: var(--shadow-sm);
            padding: 1cqw;
            font-size: 3.5cqw;
            color: var(--brand-red);
            letter-spacing: 1px;
            line-height: 1.1;
        }

        #overlayInput {
            height: 10cqw;
            width: 90%;
            /* 對應畫布文字的 Y 座標 */
            /* 背景透明 */
            color: var(--text-main);
            /* 文字顏色 */
            text-align: center;
            font: bold 6cqw sans-serif;
            /* 記得調整字體大小符合預覽比例 */
            background-color: var(--bg-Container);
        }

        #qrcode {
            height: auto;
            width: 90%;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 2.5cqw;
            right: 6cqw;
            font-size: 10cqw;
            cursor: pointer;
            z-index: 999;
        }

        .btn-download {
            padding: 2.5cqw 5cqw;
            background: #0066FF;
            color: white;
            border: none;
            border-radius: 1cqw;
            cursor: pointer;
        }

        /* 設定時間 */
        .info-section {
            height: 40%;
            width: 100%;
            color: var(--text-main);
            border-radius: 5cqw;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }

        .time-title {
            height: 100%;
            width: 75%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
        }

        .save-section {
            height: 100%;
            width: 25%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            padding: 1cqw;
            font-weight: 500;
            font-size: 3.5cqw;
        }

        #timeRows {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
        }

        /* 2. 設定每一行 */
        .day-row {
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            border-bottom: 0.2cqw solid #f0f0f0;
            flex: 1;
        }

        /* 去掉最後一行的底線 */
        .day-row:last-child {
            border-bottom: none;
        }

        .status-container {
            height: 45%;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
        }

        /* 3. 星期標籤樣式 */
        .day-label {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            width: 15cqw;
            /* 佔容器寬度的 15% */
            font-weight: 600;
            color: #333;
            font-size: 4cqw;
        }

        /* 4. 時間輸入框樣式 */
        .time-input {
            padding: 0.8cqw;
            border: 1px solid #ccc;
            border-radius: 1cqw;
            font-size: 3.5cqw;
            flex: 1;
            /* 自動填滿剩餘空間 */
            cursor: pointer;
        }
        #status-text {
            line-height: 1.2;  
        }

        /* 5. 簡單的視覺優化 */
        .toggle {
            width: 5cqw;
            height: 5cqw;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 90%;
            height: 8.5cqw;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #2196F3;
        }

        input:checked+.slider:before {
            transform: translateX(26px);
        }
    </style>
</head>

    <script type="module" src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module">
        import { authReady, app, auth, db, provider, currentStoreInfo, signInAnonymously, signInWithPopup, signOut, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, collection, getDocs, doc, onSnapshot, getDoc, setDoc, updateDoc, addDoc, deleteDoc, query, where, serverTimestamp, orderBy, limit } from './app.js';
        // 在你的 app.js 或 <script type="module"> 裡面修改為：
        import QRCodeStyling from 'qr-code-styling';
        let allStores = [];
        let buyerLat = null;
        let buyerLng = null;
        let currentBuyerAddress = "正在獲取定位中...";
        let currentUserId = null;
        let activeDragItem = null;
        let cachedQrCanvas = null;
        const orderBell = document.getElementById("orderbell");
        const volumeBox = document.getElementById("volumectrlbox");
        const modal = document.getElementById('qrModal');
        const urlParams = new URLSearchParams(window.location.search);
        const storeId = urlParams.get('storeId');
        async function initPage() {
            // 這裡會暫停，直到 authReady 被 resolve，也就是 Firebase 說「好，我知道是誰了」
            const user = await authReady;
            if (!user) {
                alert("尚未登入，請先前往登入頁面。");
                window.location.href = "index.html";
                return;
            }
            console.log("網址抓到的 ID:", storeId);
            console.log("登入的 UID:", auth.currentUser.uid);
            /*if (!storeId || storeId !== user.uid) {
                  alert("存取權限不足！您無權管理此商店，將為您導回首頁。");
                  window.location.href = "index.html";
                  return; // 務必保留 return，斷開後續渲染
              }*/
            // 驗證完全過關，執行你的主程式
            console.log("驗證通過，開始載入管理介面...");
            await initStatus(storeId);
        }
        async function initStatus(storeId) {
            try {
                const docRef = doc(db, "stores", storeId);
                const storeDoc = await getDoc(docRef);

                if (storeDoc.exists()) {
                    const data = storeDoc.data();
                    const statusToggle = document.getElementById('status-toggle');
                    const statusText = document.getElementById('status-text');

                    // 根據資料庫的狀態更新開關
                    const isOnline = data.status === 'online';
                    if (statusToggle) {
                        statusToggle.checked = isOnline;
                        statusText.innerText = isOnline ? "目前狀態：營業中" : "目前狀態：休息中";
                    }
                }
            } catch (error) {
                console.error("載入狀態失敗:", error);
            }
        }
        // 2. 點擊開關時：立即更新 Firebase
        async function toggleStatus(event) {
            const isChecked = event.target.checked;
            const newStatus = isChecked ? 'online' : 'offline';

            try {
                await updateDoc(doc(db, "stores", storeId), {
                    status: newStatus
                });

                // 更新文字提示
                document.getElementById('status-text').innerText = isChecked ? "目前狀態：營業中" : "目前狀態：休息中";
                console.log("狀態已更新為:", newStatus);
            } catch (error) {
                console.error("更新失敗:", error);
                // 失敗時把開關切回來
                event.target.checked = !isChecked;
                alert("更新失敗，請檢查網路");
            }
        }
        document.addEventListener('click', (e) => {
            // 2. 先抓目標
            const volumeBtn = e.target.closest('[data-action="volumemenu"]');
            const isInsideVolumeBox = e.target.closest('#volumectrlbox');
            const target = e.target.closest('[data-action]');
            // 3. 處理「音量選單」邏輯
            if (volumeBtn) {
                if (!volumeBox) return; // 防呆
                const isHidden = window.getComputedStyle(volumeBox).display === "none";
                if (isHidden) {
                    volumeBox.style.display = "flex";
                    orderBell.currentTime = 0;
                    orderBell.play().catch(e => console.log("播放被阻擋", e));
                } else {
                    volumeBox.style.display = "none";
                    orderBell.pause();
                    orderBell.currentTime = 0;
                }
                return; // 處理完立刻離開
            }
            // 4. 處理「點選單外關閉」
            else if (!isInsideVolumeBox && volumeBox && window.getComputedStyle(volumeBox).display !== "none") {
                volumeBox.style.display = "none";
                orderBell.pause();
                orderBell.currentTime = 0;
            }
            // 5. 處理「關閉燈箱背景」(檢查 modal 是否存在才執行)
            else if (modal && e.target === modal) {
                closeQrModal();
                return;
            }
            // 6. 處理其他按鈕
            else if (!target) return;
            const action = target.dataset.action; // 使用 dataset 簡寫
            if (action === 'storesettings') {
                window.location.href = `register.html?storeId=${auth.currentUser.uid}`;
            } else if (action === 'QRCode') {
                showQrModal(storeId);
            } else if (action === 'closeModal') {
                closeQrModal();
            } else if (action === 'saveBusinessHours') {
                saveBusinessHours();
            } else if (action === 'toggle-status') {
                toggleStatus(event);
            }
        });
        // 1. 打開燈箱並生成 QR
        async function showQrModal(storeId) {
            const modal = document.getElementById('qrModal');
            const qrContainer = document.getElementById('qrcode');
            const input = document.getElementById('overlayInput'); // 確保這 ID 正確
            if (!modal || !qrContainer) return;
            modal.style.display = 'flex';
            qrContainer.innerHTML = "";
            // 1. 先產生 QR Code (隱藏在背景產生)
            const tempQrDiv = document.createElement('div');
            const qrCodeStyling = new QRCodeStyling({
                width: 850,       // 自動適應容器寬度
                height: 850,      // 自動適應容器高度
                type: "canvas",
                data: "https://www.pacetake.tw/store.html?storeId=" + storeId,
                dotsOptions: {
                    color: "#0047FF", // 藍色碼體
                    type: "rounded"   // 圓滑資料點
                },
                backgroundOptions: {
                    color: "#E2E5E9"  // 灰白色內底色
                },
                cornersSquareOptions: {
                    color: "#0047FF",
                    type: "extra-rounded" // 定位點大圓角外框
                },
                cornersDotOptions: {
                    color: "#0047FF",
                    type: "dot"           // 定位點圓角心
                }
            });
            qrCodeStyling.append(tempQrDiv);
            // 等待 QR Code 渲染完成
            await new Promise(resolve => setTimeout(resolve, 300));
            const rawQrCanvas = tempQrDiv.querySelector('canvas');
            // 2. 建立最終合成的 Canvas (設定好 1024x1150)
            const finalCanvas = document.createElement('canvas');
            finalCanvas.width = 1024;
            finalCanvas.height = 1150;
            const ctx = finalCanvas.getContext('2d');
            /* A. 繪製最外層的漸層藍色大圓角卡片 */
            // 建立垂直漸層
            const gradient = ctx.createLinearGradient(0, 0, 0, finalCanvas.height);
            gradient.addColorStop(0, '#3A7BD5'); // 亮藍
            gradient.addColorStop(1, '#0047FF'); // 深藍
            ctx.fillStyle = gradient;
            // 繪製大圓角矩形外框
            const radius = 80; // 外框圓角半徑
            ctx.beginPath();
            ctx.roundRect(0, 0, finalCanvas.width, finalCanvas.height, radius);
            ctx.fill();
            /* C. 繪製灰白色的內圓角底座 */
            const innerMarginX = 50;  // 左右留白
            const innerMarginY = 200; // 避開頂部文字的上方留白
            const innerWidth = finalCanvas.width - (innerMarginX * 2);
            const innerHeight = finalCanvas.height - innerMarginY - 50; // 下方留白 50px
            const innerRadius = 60;   // 內底座圓角
            ctx.fillStyle = "#E2E5E9"; // 灰白色背景
            ctx.beginPath();
            ctx.roundRect(innerMarginX, innerMarginY, innerWidth, innerHeight, innerRadius);
            ctx.fill();
            /* D. 把產出的 QR Code 本體疊加進來 */
            // 取得 qr-code-styling 產出的原始畫布物件
            if (rawQrCanvas) {
                // 計算 QR Code 置中在內底座的位置
                const qrX = innerMarginX + (innerWidth - 850) / 2;
                const qrY = innerMarginY + (innerHeight - 850) / 2;
                // 將 QR 繪製到最終畫布上
                ctx.drawImage(rawQrCanvas, qrX, qrY, 850, 850);
            }
            // 3. 把最終 Canvas 放進 HTML
            finalCanvas.style.maxWidth = "100%";
            finalCanvas.style.height = "auto";
            qrContainer.appendChild(finalCanvas);
            // 4. 下載按鈕邏輯：直接利用已經畫好的 finalCanvas
            const downloadBtn = document.getElementById('downloadBtn');
            document.getElementById('downloadBtn').onclick = () => {
                // 抓取目前的輸入文字
                const userText = input.value || "Sample text ✨";
                // 重新繪製文字
                ctx.fillStyle = "#FFFFFF";
                ctx.font = "bold 24cqw sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(userText, 1024 / 2, 100);
                // 執行下載
                const dataUrl = finalCanvas.toDataURL('image/png');
                const link = document.createElement('a');
                link.href = dataUrl;
                link.download = `pacetake-${storeId}.png`;
                link.click();
            };
        }
        // 關閉燈箱
        function closeQrModal() {
            document.getElementById('qrModal').style.display = 'none';
        }
        function volumebox() {
            const volumeSlider = document.getElementById("volumeslider");
            const volumeValue = document.getElementById("volumevalue");
            orderBell.load();
            // 輔助函式：負責更新顏色填滿
            const updateBackground = (val) => {
                // 這裡將滑桿填滿顏色與底色寫入 background
                // val 是 0 到 1 之間的數字，乘上 100 變成百分比
                volumeSlider.style.background = `linear-gradient(to right, #007bff ${val * 100}%, #ddd ${val * 100}%)`;
            };
            // 【初始化設定】
            const savedVolume = parseFloat(localStorage.getItem("orderBellVolume")) || 0.5; console.log("從 LocalStorage 讀到的音量是：", savedVolume); // 看看這裡印出來什麼
            orderBell.volume = savedVolume;
            volumeSlider.value = savedVolume;
            volumeValue.textContent = Math.round(savedVolume * 100) + "%";
            // 初始化時就先更新一次顏色
            updateBackground(savedVolume);
            // 輸入事件委派 (處理拉桿滑動)
            // ==========================================
            volumeSlider.addEventListener("input", (e) => {
                const val = parseFloat(e.target.value);
                // 1. 同步更新音量
                orderBell.volume = val;
                // 2. 更新畫面文字
                volumeValue.textContent = Math.round(val * 100) + "%";
                // 3. 儲存設定
                localStorage.setItem("orderBellVolume", val);
                // 4. 【重點】更新顏色填滿
                updateBackground(val);
                // 5. 【重要】在手機上，強制觸發一次強制重繪，讓瀏覽器感知到變化
                volumeSlider.blur();
                volumeSlider.focus();
            });
        }
        const days = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
        const dayNames = ['週一', '週二', '週三', '週四', '週五', '週六', '週日'];

        // 1. 初始化頁面：產生 UI
        function renderTimeInputs(data = {}) {
            const container = document.getElementById('timeRows');
            container.innerHTML = "";

            days.forEach((day, index) => {
                const dayData = data[day] || { isOpen: false, open: "09:00", close: "18:00" };

                const row = document.createElement('div');
                row.className = 'day-row';
                row.innerHTML = `
            <label>
                <input type="checkbox" id="${day}-check" ${dayData.isOpen ? 'checked' : ''}>
                ${dayNames[index]}
            </label>
            <input type="time" id="${day}-open" value="${dayData.open}">
            <span>至</span>
            <input type="time" id="${day}-close" value="${dayData.close}">
        `;
                container.appendChild(row);
            });
        }

        // 2. 儲存邏輯
        async function saveBusinessHours() {
            let businessHours = {};
            days.forEach(day => {
                businessHours[day] = {
                    isOpen: document.getElementById(`${day}-check`).checked,
                    open: document.getElementById(`${day}-open`).value,
                    close: document.getElementById(`${day}-close`).value
                };
            });

            // 寫入 Firebase
            await updateDoc(doc(db, "stores", storeId), { businessHours });
            alert("已儲存時間設定！");
        }
        document.addEventListener('DOMContentLoaded', () => {
            initPage();
            volumebox();
            renderTimeInputs();
            console.log("系統初始化完成");
        });
    </script>
