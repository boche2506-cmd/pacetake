<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>快拿自取街 pacetake.tw - 賣家管理後台</title>

    <style>
        /* 全局變數與主題防線 */
        :root {
            --bg-global: #F8FAFC;
            --bg-container: #FFFFFF;
            --border-color: #E2E8F0;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --brand-blue: #0066FF;
            --brand-red: #EF4444;
            --brand-green: #10B981;
            --card-bg: #FFFFFF;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.05);
            --highlight-bg: #E2E8F0;
        }

        [data-theme="dark"] {
            --bg-global: #0A0A0A;
            --bg-container: #111111;
            --border-color: #262626;
            --text-main: #F5F5F5;
            --text-muted: #A3A3A3;
            --brand-blue: #3B82F6;
            --brand-red: #F87171;
            --brand-green: #34D399;
            --card-bg: #1C1C1E;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.4);
            --highlight-bg: #262626;
        }

        /* 基礎重設 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-global);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            transition: background-color 0.15s ease;
        }

        /* 手機直屏精品大外框與細邊界 */
        .phone-wrapper {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            background-color: var(--bg-container);
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            position: relative;
            padding-bottom: 40px;
            display: flex;
            flex-direction: column;
        }

        /* 頂部導航 */
        .header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-left-group {
            display: flex;
            gap: 6px;
        }

        .back-btn {
            background: none;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            text-decoration: none;
            background-color: var(--card-bg);
        }

        .control-panel {
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            font-size: 14px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            background-color: var(--card-bg);
        }

        .avatar-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
        }

        /* 下拉選單 */
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 38px;
            right: 0;
            width: 180px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            z-index: 100;
            padding: 4px;
        }

        .dropdown-menu a {
            display: block;
            width: 100%;
            padding: 10px 12px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 13px;
            border-radius: 8px;
        }

        .dropdown-menu a.current-page {
            background-color: var(--highlight-bg);
            font-weight: 800;
            border-left: 3px solid var(--brand-blue);
        }

        .menu-divider {
            height: 1px;
            background-color: var(--border-color);
            margin: 4px 0;
        }

        .main-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .ledger-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow-sm);
        }

        .ledger-row-main {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .ledger-stat h3 {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .ledger-stat div {
            font-size: 26px;
            font-weight: 900;
            color: var(--text-main);
            margin-top: 4px;
        }

        .ledger-stat .revenue-num {
            color: var(--brand-blue);
        }

        .ledger-divider {
            height: 1px;
            background-color: var(--border-color);
            margin-bottom: 10px;
        }

        .ledger-row-sub {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* 營業時間自訂輸入框樣式 */
        .input-style {
            width: 100%;
            height: 38px;
            background-color: var(--bg-global);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 0 10px;
            font-size: 13px;
            color: var(--text-main);
            outline: none;
        }

        /* 菜單增刪管理排版 */
        .menu-management-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .manage-food-card {
            display: flex;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px;
            gap: 12px;
            align-items: center;
            box-shadow: var(--shadow-sm);
            position: relative;
            animation: fadeIn 0.2s ease;
        }

        .food-img {
            width: 65px;
            height: 65px;
            border-radius: 12px;
            background-color: var(--bg-global);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            flex-shrink: 0;
            border: 1px solid var(--border-color);
        }

        .food-info-fields {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-grow: 1;
        }

        .food-name-txt {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
        }

        .food-price-txt {
            font-size: 14px;
            font-weight: 800;
            color: var(--brand-blue);
        }

        .manage-actions {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            flex-shrink: 0;
        }

        /* 原生滑動開關器（售罄開關） */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }

        .toggle-switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--brand-green);
            transition: .2s; border-radius: 22px;
        }

        .slider::before {
            position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
            background-color: white; transition: .2s; border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--brand-red); }
        input:checked + .slider::before { transform: translateX(22px); }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
