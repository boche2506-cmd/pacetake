<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PACE 派思 店內價外帶自取/點餐系統</title>
    <!-- PWA 配置 -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#ffffff">
    <!-- 一般網頁分頁圖示 -->
    <link rel="icon" type="image/png" href="png/logo192.png" sizes="192x192">
    <!-- iPhone 桌面圖示專用（已修改為 180x180 正方形） -->
    <link rel="apple-touch-icon" href="png/logo180.png">
    <link rel="stylesheet" href="style.css">
    <style>
        .statuscard {
            height: 17%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        /* 狀態進度燈號 */
        .status-card {
            height: 95%;
            width: 95%;
            padding: 1cqw;
            box-sizing: border-box;
            border-radius: 4cqw;
            text-align: center;
            background-color: var(--card-bg);
            border: 0.2cqw solid var(--border-color);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
        }

        .status-title {
            font-size: 7cqw;
            font-weight: 700;
            color: var(--text-main);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .status-desc {
            font-size: 4cqw;
            color: var(--text-muted);
            font-weight: 500;
        }

        .numberplate {
            height: 15%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        /* 巨型自取號碼牌 */
        .number-plate {
            height: 95%;
            width: 95%;
            padding: 2cqw;
            box-sizing: border-box;
            border-radius: 4cqw;
            background-color: rgba(0, 102, 255, 0.05);
            border: 0.2cqw dashed var(--brand-blue);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
        }

        .number-label {
            font-size: 6cqw;
            font-weight: 600;
            color: var(--brand-blue);
            letter-spacing: 0.2cqw;
            text-transform: uppercase;
        }

        .number-code {
            font-size: 10cqw;
            font-weight: 800;
            color: var(--brand-red);
            letter-spacing: 0.2cqw;
        }

        .billcardall {
            height: 43%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .billcard {
            height: 98%;
            width: 95%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            padding: 2cqw;
            box-sizing: border-box;
            background-color: var(--card-bg);
            border: 0.2cqw solid var(--border-color);
            box-shadow: var(--shadow-sm);
            border-radius: 4cqw;
        }

        .billcardspan {
            height: 8%;
            width: 100%;
            font-size: 5cqw;
            color: var(--text-muted);
            font-weight: 500;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            line-height: 1.1;
            box-sizing: border-box;
        }

        .bill-card {
            height: 77%;
            width: 100%;
            padding: 1cqw;
            overflow-y: auto;
            scrollbar-width: none;
            /* 確保內容依然可以滑動 */
            -ms-overflow-style: none;
            /* 隱藏 Chrome, Safari, Edge 的卷軸 */
            box-sizing: border-box;
        }

        .bill-card::-webkit-scrollbar {
            /* Chrome, Safari 隱藏軸線 */
            display: none;
        }

        .Remark {
            height: 15%;
            width: 100%;
            font-size: 5cqw;
            color: var(--text-muted);
            font-weight: 500;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            line-height: 1.1;
            box-sizing: border-box;
        }

        .navbtn {
            height: 10%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .nav-btn {
            height: 85%;
            width: 85%;
            padding: 1cqw;
            box-sizing: border-box;
            border-radius: 4cqw;
            background-color: var(--brand-blue);
            color: white;
            border: none;
            /*清除邊框*/
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 1cqw 3cqw rgba(0, 102, 255, 0.2);
        }
    </style>
</head>

<body>
    <div class="phone-wrapper">
        <div id="buyerView" style="display: block;">
            <header class="header">
                <div class="pace-logo">
                    <a href="index.html" class="logo-link">
                        <img src="png/pace3.png" alt="派思 官方網站">
                    </a>
                    <div class="avatar-container">
                        <span id="defaultIcon">👤</span>
                        <img id="userAvatarImg" src=""
                            style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;"
                            onerror="this.style.display='none'; document.getElementById('defaultIcon').style.display='block';">
                    </div>
                </div>
                <div class="two">
                    <div class="pace">
                        <button class="theme-toggle" id="themeToggleBtn" aria-label="切換主題">🌙</button>
                        <span>店內價外帶自取/點餐系統</span>
                    </div>
                    <div class="avatarBtnMenu" data-action="avatarBtnMenu">
                        <span class="user-name" id="userNameDisplay"></span>
                        <div class="dropdown-menu" id="dropdownMenu"></div>
                    </div>
                </div>
            </header>

            <!-- 狀態進度 -->
            <div class="statuscard">
                <div class="status-card">
                    <div class="status-title" id="orderStatusTitle">⏱️ 讀取中...</div>
                    <div class="status-desc" id="orderStatusDesc">請稍候，正在同步您的訂單狀態...</div>
                </div>
            </div>
            <!-- 巨型自取號碼牌 -->
            <div class="numberplate">
                <div class="number-plate">
                    <div class="number-label">自取核對代碼</div>
                    <div class="number-code" id="orderPickupNo">#---</div>
                </div>
            </div>
            <!-- 明細與備註展示 -->
            <div class="billcardall">
                <div class="billcard">
                    <div class="billcardspan"><span>🛍️ 點餐明細</span></div>
                    <div class="bill-card" id="cartItemsContainer"></div>
                    <div class="Remark" id="orderRemarkDisplay"></div>
                </div>
            </div>
            <!-- GPS 導航自取大鈕 -->
            <div class="navbtn">
                <a class="nav-btn" id="navbtn">📍 準備導航中...</a>
            </div>
        </div>
        <div id="phone-request-modal"
            style="display: none; position: fixed; top: 30%; left: 10%; width: 80%; background: white; padding: 20px; border: 1px solid #ccc; z-index: 1000;">
            <h3>商家請求與您聯繫</h3>
            <p>商家希望能取得您的電話號碼以便聯繫，是否同意？</p>
            <button data-action="btn-acceptYes">同意分享</button>
            <button data-action="btn-acceptNo">稍後再說</button>
        </div>
        <div class="lightbox-modal" id="loginLightbox" style="display: none;">
            <div class="modal-card">
                <div class="modal-title" style=" font-weight: 600; color: var(--text-main);">加入PACE 派思</div>
                <button class="modal-btn google" data-action="googleLogin"
                    style="box-shadow: 0 0.2cqw 0.125 rgba(0,0,0,0.05);">
                    <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right:0.5cqw;">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
                        <path fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
                    </svg>
                    Google 登入
                </button>
                <button data-action="toggleEmailFormBtn"
                    style="display: flex; align-items: center; justify-content: center; width: 100%; margin-bottom: 5cqw; background-color: white; border: 0.2cqw solid #e5e7eb; border-radius: 3cqw; padding: 3cqw 0; font-size: 5cqw; font-weight: 600; color: #374151; cursor: pointer; box-shadow: 0 0.5cqw 2cqw rgba(0,0,0,0.05);">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" style="margin-right:0.5cqw;">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    使用電子郵件登入
                </button>
                <div id="emailFormSection" class="email-form">
                    <div style="margin-bottom: 1cqw;">
                        <label for="loginEmail"
                            style="display:block; margin-bottom: 5cqw; font-size:5cqw; color:#6b7280; font-weight:700;">電子郵件</label>
                        <input type="email" id="loginEmail" placeholder="請輸入 Email" autocomplete="username"
                            style="width: 100%; box-sizing: border-box; padding: 2cqw; border:0.2cqw solid #e5e7eb; border-radius:2cqw; box-sizing:border-box; font-size:5cqw; background-color:#f9fafb; color: #111111;">
                    </div>
                    <div style="margin-bottom:10cqw;">
                        <label for="loginPassword"
                            style="display:block; margin-bottom:0.25cqw; font-size:5cqw; color:#6b7280; font-weight:500;">密碼</label>
                        <div style="position: relative; display: flex; align-items: center;">
                            <input type="password" id="loginPassword" placeholder="請輸入密碼"
                                autocomplete="current-password"
                                style="width: 100%; padding:0.25cqw 0.75cqw; border:0.2cqw solid #e5e7eb; border-radius:2cqw; box-sizing:border-box; font-size:5cqw; background-color:#f9fafb; color: #111111;">
                            <button type="button" data-action="togglePasswordVisibility"
                                style="position: absolute; right: 5cqw; background: none; border: none; cursor: pointer; font-size: 5cqw; padding: 0; color: #6b7280; z-index: 10;">👁️</button>
                        </div>
                    </div> <button data-action="emailLogin"
                        style="background-color: #059669; color: white; border: none; width: 100%; padding: 0.25cqw; border-radius: 0.5cqw; font-size: 5cqw; font-weight: 700; cursor: pointer; box-shadow: 0 0.25cqw 0.5cqw rgba(255, 255, 255, 0.15);">電子郵件登入
                        / 註冊</button>
                </div><span class="modal-close" data-action="customReturnBtn"
                    style="margin-top: 0.5cqw; text-decoration: underline; cursor: pointer; display: block; text-align: center;">暫時返回</span>
            </div>
        </div>
    </div>
    <script type="module" src="app.js"></script>
    <script type="module">
        import { getCartData, modifyCartItemQty, areaData, authReady, app, auth, db, provider, currentStoreInfo, signInAnonymously, signInWithPopup, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword, collection, getDocs, doc, onSnapshot, getDoc, setDoc, updateDoc, addDoc, deleteDoc, query, where, serverTimestamp, orderBy, limit } from './app.js';
        let allStores = [];
        let buyerLat = null;
        let buyerLng = null;
        let currentBuyerAddress = "正在獲取定位中...";
        let finalTotalAmount = 0;
        let cartData = [];
        let currentPayType = "";
        let targetStoreId = "";
        let currentDiningType = "TAKE_OUT";
        // 藍新店家動態金鑰配置（預設為空，動態由 Firebase 覆蓋）
        let currentStoreNewebpay = {
            MerchantID: "",
            HashKey: "",
            HashIV: ""
        };
        let orders = [];// 存儲從 Firebase 撈回的訂單
        let activeOrderId = null; // 全域變數
        let currentOrderData = null;
        // 假設你已經有 auth 和 db 的設定
        const user = await authReady;
        if (user) {
            // 監聽該用戶的最新一筆訂單
            const q = query(
                collection(db, "orders"),
                where("buyerUid", "==", user.uid),
                orderBy("createdAt", "desc"),
                limit(1)
            );
            onSnapshot(q, (snapshot) => {
                if (snapshot.empty) return;
                const doc = snapshot.docs[0];
                currentOrderData = { id: doc.id, ...doc.data() };
                const order = { id: doc.id, ...doc.data() };
                renderOrder(order);
                const modal = document.getElementById('phone-request-modal');
                if (order.phoneAccessStatus === 'requested') {
                    modal.style.display = 'block'; // 彈出燈箱
                } else {
                    modal.style.display = 'none';  // 隱藏燈箱
                }
            });
        }
        function renderOrder(order) {
            // 1. 更新號碼牌
            document.getElementById('orderPickupNo').textContent = `#${order.pickupNo}`;
            // 2. 更新狀態文字 (根據 status 邏輯)
            const statusEl = document.getElementById('orderStatusTitle');
            const descEl = document.getElementById('orderStatusDesc');
            if (order.status === "PREPARING") {
                statusEl.textContent = "⏱️ 餐點製作中...";
                descEl.textContent = "店家已接單，正在為您準備餐點。";
            } else if (order.status === "COMPLETED") {
                statusEl.textContent = "✅ 餐點已完成！";
                descEl.textContent = "請到櫃檯憑號碼領取。";
            }
            const storeLinkHtml = `
                       <div id="storeLinkBtnContainer" style="text-align: center;">
                           <a href="store.html?storeId=${order.storeId}" 
                              style="display: inline-flex; align-items: center; gap: 1cqw; padding: 1.25cqw 4cqw; background: var(--theme-color, #ff6b6b); color: white; text-decoration: none; border-radius: 5cqw; font-size: 4cqw; font-weight: bold; box-shadow: 0 0.5cqw 1.25cqw rgba(0,0,0,0.1);">
                              🏪 返回店家繼續選購
                           </a>
                       </div>`;
            // 3. 檢查按鈕是否已經存在，如果不存在，就插入到 statusTitle 的後面
            if (!document.getElementById('storeLinkBtnContainer')) {
                // 使用 insertAdjacentHTML，將按鈕插入在 title 的 "afterend" (即 title 結束後，desc 之前)
                statusEl.insertAdjacentHTML('afterend', storeLinkHtml);
            }
            // 3. 渲染商品明細與總計
            const container = document.getElementById('cartItemsContainer');
            let html = '';
            let total = 0;
            order.items.forEach(item => {
                const itemPrice = parseInt(item.price) || 0;
                const itemQty = parseInt(item.quantity || item.qty) || 1;
                const subtotal = itemPrice * itemQty;
                total += subtotal;
                html += `
            <div class="bill-item" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 0.2cqw solid #eee; padding: 0.5cqw 0;">
                <div style="flex: 1;">
                    <div class="item-name" style="font-weight: bold; font-size: 4cqw; color: var(--text-main);">${item.name}</div>
                </div>
                <div class="quantity-control-panel" style="display: flex; align-items: center; gap: 2cqw; flex-shrink: 0;">
                    <span class="item-qty" style="min-width: 10cqw; text-align: center; font-weight: bold; font-size: 4cqw; color: var(--text-muted);">x ${itemQty}</span>
                </div>
                <div style="width: 17.5cqw; text-align: right; font-weight: bold; color: #ff6b6b;">
                    $${subtotal}
                </div>
            </div>`;
            });
            // 加入總計金額行
            const paymentStatus = order.paymentStatus === "PAID" ? "✅ 已付款" : "⏳ 待付款 (請於取餐時付款)";
            const statusColor = order.paymentStatus === "PAID" ? "#2ecc71" : "#e67e22";
            html += `
                    <div class="bill-total-row" style="border-top: 0.5cqw solid #333; display: flex; justify-content: space-between; align-items: center; padding: 2cqw 0; color: var(--text-main);">
                        <span class="total-label" style="font-size: 5cqw; font-weight: 800; color: var(--text-main);">總計金額</span>
                        <span class="total-amount" id="totalAmountText" style="font-size: 5cqw; color: #ff6b6b; font-weight: 800;">$${total}</span>
                    </div>
                    <div class="payment-status-row" style="text-align: right; margin-top: 1cqw;">
                        <span style="font-size: 3.5cqw; color: ${statusColor}; font-weight: bold;">
                        付款狀態：${paymentStatus}
                        </span>
                    </div>`;
            container.innerHTML = html;
            // 4. 更新備註
            document.getElementById('orderRemarkDisplay').textContent = order.remark ? `備註：${order.remark}` : "無特別備註";
            initNavigationButton(order);
        }
        function initNavigationButton(order) {
            if (!order) return;
            // 1. 抓出店家座標並轉換為數字
            const sLat = parseFloat(order.shopLat || order.lat);
            const sLng = parseFloat(order.shopLng || order.lng);
            const shopName = order.shopName || order.name || '未知店家';
            // 2. 抓取網頁上的按鈕元素 (✅ 修正 1：加上 # 號)
            const navBtn = document.querySelector('#navbtn');
            // ✅ 修正 2：統一使用大寫的 B (navBtn)
            if (!navBtn) {
                console.warn(`[PACE DEBUG] 找不到導航按鈕元素`);
                return;
            }
            // 3. 拼裝出 Google Maps 導航連結 (✅ 修正 3：補上 $ 符號，並使用官方推薦的導航網址格式)
            let mapUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(shopName)}`;
            if (!isNaN(sLat) && !isNaN(sLng)) {
                // 使用經緯度直接開啟導航
                mapUrl = `https://www.google.com/maps/dir/?api=1&destination=${sLat},${sLng}`;
            }
            // 4. 一氣呵成帶入 HTML
            navBtn.href = mapUrl;
            navBtn.target = "_blank";
            navBtn.rel = "noopener noreferrer";
            navBtn.innerText = `📍 導航前往：${shopName}`;
            console.log(`[PACE DEBUG] 導航按鈕初始化成功！目標：${shopName}, 網址：${mapUrl}`);
        }
        document.addEventListener('click', (e) => {
            const target = e.target.closest('[data-action]');
            if (!target) return;
            const action = target.getAttribute('data-action');
            if (action === 'btn-acceptYes') {
                if (currentOrderData) {
                    btnacceptYes(currentOrderData); // 把剛剛存好的全域資料傳進去
                } else {
                    console.error("目前沒有訂單資料");
                }
            }
            else if (action === 'btn-acceptNo') {
                if (currentOrderData) {
                    btnacceptNo(currentOrderData);
                }
            }
        });
        async function btnacceptYes(order) {
            const orderRef = doc(db, "orders", order.id);
            try {
                await updateDoc(orderRef, {
                    phoneAccessStatus: 'granted',
                });
                // 成功才關閉燈箱
                document.getElementById('phone-request-modal').style.display = 'none';
                alert("已授權商家撥打電話！");
            } catch (error) {
                console.error("更新失敗", error);
                alert("操作失敗，請檢查網路後再試一次");
            }
        }
        async function btnacceptNo(order) {
            const orderRef = doc(db, "orders", order.id);
            try {
                await updateDoc(orderRef, {
                    phoneAccessStatus: 'wait',
                });
                document.getElementById('phone-request-modal').style.display = 'none';
                // 💡 修正這裡：改為拒絕的提示訊息
                alert("已拒絕授權顯示電話號碼。");
            } catch (error) {
                console.error("更新失敗", error);
                alert("操作失敗，請檢查網路後再試一次");
            }
        }
    </script>
</body>

</html>
