<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PACE 派思 pacetake.tw - 買家首頁</title>
    <!-- Favicon & Apple Touch Icon -->
    <link rel="icon" type="image/png" href="png/logoapple.png" sizes="180x180">
    <link rel="apple-touch-icon" href="png/logoapple.png">
    <link rel="apple-touch-icon" sizes="180x180" href="png/logoapple.png">
    <link rel="apple-touch-icon-precomposed" href="png/logoapple.png">
    <link rel="stylesheet" href="style.css">
    <style>
        .content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 狀態進度燈號 */
        .status-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: var(--shadow-sm);
        }

        .status-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--brand-amber);
            margin-bottom: 6px;
        }

        .status-desc {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* 巨型自取號碼牌 */
        .number-plate {
            background-color: rgba(0, 102, 255, 0.05);
            border: 2px dashed var(--brand-blue);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            margin: 10px 0;
        }

        .number-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--brand-blue);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .number-code {
            font-size: 54px;
            font-weight: 900;
            color: var(--brand-blue);
            margin-top: 4px;
            letter-spacing: -1px;
        }

        .detail-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .detail-name {
            font-weight: 600;
            color: var(--text-main);
        }

        .detail-qty {
            color: var(--text-muted);
            font-weight: bold;
        }

        .detail-price {
            font-weight: 700;
            color: var(--text-main);
        }

        .divider {
            height: 1px;
            background-color: var(--border-color);
        }

        /* 買家自由手打備註欄展示防線 */
        .note-box {
            background-color: var(--bg-global);
            border-radius: 10px;
            padding: 12px;
            font-size: 13px;
            color: var(--text-main);
            border-left: 4px solid var(--brand-blue);
            font-weight: 500;
        }

        .note-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .nav-btn {
            background-color: var(--brand-blue);
            color: white;
            border: none;
            width: 100%;
            height: 48px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(0, 102, 255, 0.2);
        }
    </style>
</head>

<body>
    <div class="phone-wrapper">
        <div id="buyerView" style="display: block;">
            <header class="header">
                <div class="pace-logo">
                    <a href="index.html" class="logo-link">
                        <img src="png/pace3.png" alt="派思 官方網站">
                    </a>
                    <div class="pace-avatar-icon">
                        <span id="defaultIcon" class="avatar-icon">👤</span>
                        <img id="userAvatarImg" src=""
                            style="display: none; border-radius: 50%;height: 13cqw; width: 13cqw;">
                    </div>
                </div>
                <div class="two">
                    <div class="pace">
                        <button class="theme-toggle" id="themeToggleBtn" aria-label="切換主題">🌙</button>
                        <span>店內價外帶自取/點餐系統</span>
                    </div>
                    <button class="login-btn" id="loginBtn">登入/註冊</button>
                    <button class="user-avatar-btn" id="avatarBtn" style="display: none;">
                        <span class="user-name" id="userNameDisplay"></span></button>
                    <div class="dropdown-menu" id="dropdownMenu"></div>
                </div>
            </header>

            <main class="content">
                <!-- 狀態進度 -->
                <div class="status-card">
                    <div class="status-title">⏱️ 餐點製作中...</div>
                    <div class="status-desc">店家已接單，預估 12:30 準時出餐 (剩餘 15 分鐘)</div>
                </div>

                <!-- 巨型自取號碼牌 -->
                <div class="number-plate">
                    <div class="number-label">自取核對代碼</div>
                    <div class="number-code">#023</div>
                </div>

                <!-- 明細與備註展示 -->
                <div class="detail-card">
                    <div style="font-size: 13px; font-weight: 700; color:var(--text-muted);">明細核對</div>

                    <div class="detail-row">
                        <span class="detail-name">招牌木盒便當 <span class="detail-qty">x2</span></span>
                        <span class="detail-price">$240</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-name">酥炸大雞腿便當 <span class="detail-qty">x1</span></span>
                        <span class="detail-price">$135</span>
                    </div>

                    <div class="divider"></div>

                    <!-- 🎯 買家自由備註欄展示防線 -->
                    <div>
                        <div class="note-title">您的訂單備註：</div>
                        <div class="note-box">
                            飯多、大辣、雞腿跟便當分開裝。飲料請幫我做去冰微糖，謝謝老闆！
                        </div>
                    </div>

                    <div class="divider"></div>

                    <div class="detail-row" style="padding-top:4px;">
                        <span style="font-weight: 800; font-size: 15px;">實付金額 (線上已付)</span>
                        <span style="font-size: 20px; font-weight: 900; color: var(--brand-blue);">$375</span>
                    </div>
                </div>

                <!-- GPS 導航自取大鈕 -->
                <a href="https://google.com" class="nav-btn">📍 導航前往：池上木盒便當 - 信義店</a>
            </main>
        </div>
    </div>
    <script type="module" src="./app.js"></script>
    <script type="module" src="./cart-manager.js"></script>
</body>

</html>
