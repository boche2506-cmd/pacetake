    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20x%3D%2210%22%20y%3D%2230%22%20width%3D%2280%22%20height%3D%2255%22%20rx%3D%2210%22%20fill%3D%22%230066FF%22%2F%3E%3Cpath%20d%3D%22M25%2030%20V15%20Q25%2010%2035%2010%20H65%20Q75%2010%2075%2015%20V30%22%20fill%3D%22none%22%20stroke%3D%22%230066FF%22%20stroke-width%3D%228%22%2F%3E%3Cline%20x1%3D%2210%22%20y1%3D%2255%22%20x2%3D%2290%22%20y2%3D%2255%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%224%22%2F%3E%3C%2Fsvg%3E">

    <style>
        :root {
            --bg-global: #F8FAFC;
            --bg-container: #FFFFFF;
            --border-color: #E2E8F0;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --brand-blue: #0062FF;
            --brand-green: #10B981;
            --brand-red: #EF4444;
            --card-bg: #FFFFFF;
        }

        [data-theme="dark"] {
            --bg-global: #0A0A0A;
            --bg-container: #111111;
            --border-color: #262626;
            --text-main: #F5F5F5;
            --text-muted: #A3A3A3;
            --brand-blue: #2F80ED;
            --brand-green: #34D399;
            --brand-red: #F87171;
            --card-bg: #1C1C1E;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: var(--bg-global); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }
        
        .phone-wrapper {
            width: 100%;
            max-width: 430px;
            background-color: var(--bg-container);
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            padding: 24px 20px;
            position: relative;
        }

        .header-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
        .back-btn { background: none; border: none; font-size: 20px; color: var(--text-main); cursor: pointer; text-decoration: none; }
        .page-title { font-size: 22px; font-weight: 800; }

        .section-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .section-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; color: var(--brand-blue); display: flex; align-items: center; gap: 6px; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-main); }
        .form-control {
            width: 100%; height: 42px; border-radius: 10px; border: 1px solid var(--border-color);
            background-color: var(--bg-global); color: var(--text-main); padding: 0 12px; font-size: 14px; outline: none;
        }
        .form-control:focus { border-color: var(--brand-blue); }

        /* 👑 核心改裝：並排下拉選單 */
        .select-row { display: flex; gap: 8px; margin-bottom: 12px; }
        .select-row select { flex: 1; }

        /* 開關切換鈕 */
        .switch-group { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; }
        .switch-label { font-size: 14px; font-weight: 600; }
        .switch { position: relative; display: inline-block; width: 46px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #CBD5E1; transition: .2s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .2s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--brand-blue); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* 👑 核心改裝：可拖曳菜單品項樣式 */
        .menu-container { display: flex; flex-direction: column; gap: 8px; }
        .menu-item-row {
            display: flex; align-items: center; gap: 8px; background-color: var(--bg-global);
            border: 1px solid var(--border-color); padding: 10px; border-radius: 12px;
            cursor: grab; transition: background-color 0.2s, opacity 0.2s;
        }
        .menu-item-row:active { cursor: grabbing; }
        .menu-item-row.dragging { opacity: 0.4; background-color: rgba(0, 98, 255, 0.05); border-style: dashed; }
        
        .drag-handle { font-size: 16px; color: var(--text-muted); padding: 0 4px; user-select: none; }
        .menu-inputs { display: flex; gap: 6px; flex-grow: 1; }
        .menu-inputs .control-name { flex: 2; }
        .menu-inputs .control-price { flex: 1; }
        .del-item-btn { background: none; border: none; color: var(--brand-red); font-size: 16px; cursor: pointer; padding: 4px; }

        .add-item-btn {
            width: 100%; height: 38px; border-radius: 10px; border: 1px dashed var(--brand-blue);
            background: none; color: var(--brand-blue); font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 8px;
        }

        .submit-btn {
            width: 100%; height: 48px; background-color: var(--brand-blue); color: white;
            border: none; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 98, 255, 0.2); margin-top: 12px;
        }
        .submit-btn:active { transform: scale(0.99); }
    </style>
</head>
<body>

    <div class="phone-wrapper">
        <div class="header-nav">
            <a href="index.html" class="back-btn">⬅️</a>
            <div class="page-title">建立我的精品店鋪</div>

        <div class="section-card">

                <input type="text" id="shopName" class="form-control" placeholder="例如：派思精品大水餃">

            <div class="form-group">

                    </select>
                    <select id="shopDistrict" class="form-control">
                        <option value="">選擇區域</option>
                    </select>
                </div>
            </div>

            <div class="form-group">

                <input type="text" id="shopAddress" class="form-control" placeholder="例如：忠孝東路四段 1 號 1 樓">
            </div>
            <div class="form-group">
                <label>預估出餐時間 (分鐘)</label>
                <input type="number" id="prepareTime" class="form-control" placeholder="例如：15" value="15">

        </div>

        <div class="section-card">
            <div class="section-title">💵 收款結帳防線 (至少需開啟一種)</div>
            <div class="switch-group">
                <div class="switch-label">現場付款 (到店付現/刷卡)</div>
                <label class="switch">
                    <input type="checkbox" id="payLive" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="switch-group">
                <div class="switch-label">線上刷卡 (顧客下單先扣款)</div>
                <label class="switch">
                    <input type="checkbox" id="payOnline">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="section-card">
            <div class="section-title">🧑‍🍳 店家菜單品項 (可上下拖曳調整順序)</div>
            <div class="menu-container" id="menuWrapper">
                <div class="menu-item-row" draggable="true">
                    <div class="drag-handle">☰</div>
                    <div class="menu-inputs">
                        <input type="text" class="form-control control-name" placeholder="商品名稱，如：招牌紅燒牛肉麵">
                        <input type="number" class="form-control control-price" placeholder="金額">
                    </div>
                    <button class="del-item-btn" onclick="deleteRow(this)">❌</button>
                </div>
            </div>
            <button class="add-item-btn" id="addItemBtn">➕ 新增下一個菜單品項</button>
        </div>

        <button class="submit-btn" id="createShopActionBtn">🚀 建立店鋪並開張</button>
    </div>

        const shopDistrict = document.getElementById('shopDistrict');
        
        Object.keys(areaData).forEach(city => {
            const opt = document.createElement('option');
            opt.value = city;
            opt.innerText = city;
            shopCity.appendChild(opt);
        });

        shopCity.addEventListener('change', () => {
            const selectedCity = shopCity.value;
            shopDistrict.innerHTML = '<option value="">選擇區域</option>';
            if(areaData[selectedCity]) {
                areaData[selectedCity].forEach(dist => {
                    const opt = document.createElement('option');
                    opt.value = dist;
                    opt.innerText = dist;
                    shopDistrict.appendChild(opt);
                });
            }
        });

        // 驗證登入狀態
        onAuthStateChanged(auth, (user) => {
            if (user) { currentUid = user.uid; } 
            else { alert("請先回到首頁進行登入，才能開啟店鋪喔！"); window.location.href = "index.html"; }
        });

        // 👑 核心改裝：綁定拖曳監聽器的精品函式
        function initDragAndDrop(element) {
            element.addEventListener('dragstart', () => { element.classList.add('dragging'); });
            element.addEventListener('dragend', () => { element.classList.remove('dragging'); });
        }

        // 初始化現有的拖曳項目
        document.querySelectorAll('.menu-item-row').forEach(row => initDragAndDrop(row));

        // 處理拖曳中的容器排序邏輯
        const menuWrapper = document.getElementById('menuWrapper');
        menuWrapper.addEventListener('dragover', (e) => {
            e.preventDefault();
            const draggingItem = document.querySelector('.dragging');
            if(!draggingItem) return;
            
            // 算出現有項目中，滑鼠最接近哪一個品項
            const siblings = [...menuWrapper.querySelectorAll('.menu-item-row:not(.dragging)')];
            const nextSibling = siblings.find(sibling => {
                const box = sibling.getBoundingClientRect();
                return e.clientY <= box.top + box.height / 2;
            });
            
            // 動態插入到新位置
            if (nextSibling) {
                menuWrapper.insertBefore(draggingItem, nextSibling);
            } else {
                menuWrapper.appendChild(draggingItem);
            }
        });

        // 新增品項按鈕
        document.getElementById('addItemBtn').addEventListener('click', () => {
            const newRow = document.createElement('div');
            newRow.className = "menu-item-row";
            newRow.draggable = true;
            newRow.innerHTML = `
                <div class="drag-handle">☰</div>
                <div class="menu-inputs">
                    <input type="text" class="form-control control-name" placeholder="商品名稱，如：香濃起司蛋餅">
                    <input type="number" class="form-control control-price" placeholder="金額">
                </div>
                <button class="del-item-btn" onclick="deleteRow(this)">❌</button>
            `;
            menuWrapper.appendChild(newRow);
            initDragAndDrop(newRow); // 讓新長出來的品項也能拖曳
        });

        // 刪除品項（全域掛載）
        window.deleteRow = function(btn) {
            const rows = menuWrapper.querySelectorAll('.menu-item-row');
            if(rows.length <= 1) { alert("報告老闆，店裡至少要留一項商品才能開張喔！"); return; }
            btn.closest('.menu-item-row').remove();
        };

        // 🚀 建立店鋪按下事件
        document.getElementById('createShopActionBtn').addEventListener('click', async () => {
            if(!currentUid) { alert("未偵測到登入狀態，請先登入！"); return; }

            const shopName = document.getElementById('shopName').value.trim();
            const city = shopCity.value;
            const district = shopDistrict.value;
            const detailAddress = document.getElementById('shopAddress').value.trim();
            const prepareTime = document.getElementById('prepareTime').value.trim();
            
            const payLive = document.getElementById('payLive').checked;
            const payOnline = document.getElementById('payOnline').checked;

            // 👑 核心改裝：支付防線檢查（如果兩樣皆未開啟，顯示提示並攔截）
            if (!payLive && !payOnline) {
                alert("⚠️ 報告老闆！建立店鋪時「現場付款」與「線上刷卡」皆未開啟，請至少選擇一種支付方式才能開張喔！");
                return;
            }

            if (!shopName || !city || !district || !detailAddress) {
                alert("請完整填寫店鋪名稱、選擇縣市區域、並填寫詳細地址喔！");
                return;
            }

            // 👑 核心改裝：重新抓取「拖曳排序後」的菜單陣列順序
            const menuList = [];
            const itemRows = menuWrapper.querySelectorAll('.menu-item-row');
            
            let menuValid = true;
            itemRows.forEach(row => {
                const name = row.querySelector('.control-name').value.trim();
                const price = row.querySelector('.control-price').value.trim();
                if (name && price) {
                    menuList.push({ name: name, price: parseFloat(price) });
                } else if (name || price) {
                    menuValid = false; // 有填名字沒填錢，或有填錢沒填名字
                }
            });

            if (!menuValid || menuList.length === 0) {
                alert("請確認您的菜單品項名稱與金額都有完整填寫喔！");
                return;
            }

            // 組合完整地址存入資料庫
            const fullAddress = `${city}${district}${detailAddress}`;

            try {
                // 寫入 Firebase
                await setDoc(doc(db, "stores", currentUid), {
                    shopName: shopName,
                    city: city,
                    district: district,
                    shopAddress: fullAddress,
                    prepareTime: prepareTime,
                    payLive: payLive,
                    payOnline: payOnline,
                    menuList: menuList, // 這邊就是經過拖曳排好序的精準陣列！
                    uid: currentUid,
                    // 預設經緯度由買家定位距離去算，這邊先不硬寫
                    lat: "24.1475", 
                    lng: "120.6736"
                });

                alert("🎉 恭喜哥！店鋪成功同步上傳雲端，完美開張！");
                window.location.href = "index.html"; // 開張成功跳回首頁看成果
            } catch (error) {
                alert("上傳失敗，請檢查網路或設定: " + error.message);
            }
        });
    </script>
</body>
</html>
