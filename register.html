<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>快拿自取街 pacetake.tw - 商家手機開店</title>
    <!-- 🌟 精品藍色便當純代碼 SVG Favicon（全新安全完美版，消滅隱形惡魔） -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20x%3D%2210%22%20y%3D%2230%22%20width%3D%2280%22%20height%3D%2255%22%20rx%3D%2210%22%20fill%3D%22%230066FF%22%2F%3E%3Cpath%20d%3D%22M25%2030%20V15%20Q25%2010%2035%2010%20H65%20Q75%2010%2075%2015%20V30%22%20fill%3D%22none%22%20stroke%3D%22%230066FF%22%20stroke-width%3D%228%22%2F%3E%3Cline%20x1%3D%2210%22%20y1%3D%2255%22%20x2%3D%2290%22%20y2%3D%2255%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%224%22%2F%3E%3C%2Fsvg%3E">
    <style>
        /* 全局變數與主題防線 */
        :root {
            --bg-global: #F8FAFC;
            --bg-container: #FFFFFF;
            --border-color: #E2E8F0;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --brand-blue: #0066FF;
            --brand-red: #EF4444;
            --brand-green: #10B981;
            --card-bg: #FFFFFF;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg-global: #0A0A0A;
            --bg-container: #111111;
            --border-color: #262626;
            --text-main: #F5F5F5;
            --text-muted: #A3A3A3;
            --brand-blue: #3B82F6;
            --brand-red: #F87171;
            --brand-green: #34D399;
            --card-bg: #1C1C1E;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-global);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            transition: background-color 0.15s ease;
        }

        .phone-wrapper {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            background-color: var(--bg-container);
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            position: relative;
            padding-bottom: 100px;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 24px 20px 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            background: none;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            text-decoration: none;
            background-color: var(--card-bg);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            font-size: 16px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            background-color: var(--card-bg);
        }

        .form-container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
        }

        .input-style {
            width: 100%;
            height: 44px;
            background-color: var(--bg-global);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0 14px;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
        }

        .switch-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            box-shadow: var(--shadow-sm);
        }

        .switch-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .switch-title {
            font-size: 14px;
            font-weight: 700;
        }

        .switch-desc {
            font-size: 11px;
            color: var(--text-muted);
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }

        .toggle-switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #CBD5E1; transition: .2s; border-radius: 24px;
        }

        .slider::before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
            background-color: white; transition: .2s; border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--brand-blue); }
        input:checked + .slider::before { transform: translateX(22px); }

        .newebpay-box { display: block; animation: fadeIn 0.2s ease; }

        .menu-upload-list { display: flex; flex-direction: column; gap: 12px; }

        .menu-item-row {
            display: flex; background-color: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 14px; padding: 12px; gap: 12px; align-items: center;
            box-shadow: var(--shadow-sm); animation: fadeIn 0.2s ease;
        }

        .img-upload-box {
            width: 70px; height: 70px; border-radius: 12px; border: 2px dashed var(--border-color);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 18px; background-color: var(--bg-global); cursor: pointer; color: var(--text-muted);
        }

        .img-upload-box span { font-size: 10px; margin-top: 2px; }

        .item-fields { display: flex; flex-direction: column; gap: 6px; flex-grow: 1; }

        .price-input-wrapper { position: relative; display: flex; align-items: center; }

        .price-symbol { position: absolute; left: 12px; font-size: 14px; font-weight: 700; color: var(--text-muted); }

        .price-input { padding-left: 26px !important; }

        .add-row-btn {
            background-color: var(--bg-global); border: 1px solid var(--border-color);
            color: var(--brand-blue); height: 44px; border-radius: 12px; font-size: 14px;
            font-weight: 700; cursor: pointer; display: flex; align-items: center;
            justify-content: center; gap: 6px; transition: background-color 0.2s;
        }

        .footer-action {
            position: absolute; bottom: 0; left: 0; right: 0; padding: 16px 20px 24px 20px;
            background-color: var(--bg-container); border-top: 1px solid var(--border-color);
        }

        .submit-btn {
            background-color: var(--brand-blue); color: white; border: none; width: 100%;
            height: 52px; border-radius: 26px; font-size: 16px; font-weight: 800;
            cursor: pointer; box-shadow: 0 4px 14px rgba(0, 102, 255, 0.3);
        }

        .lightbox-modal {
            display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px); z-index: 200; justify-content: center;
            align-items: center; padding: 20px;
        }

        .modal-card {
            background-color: var(--bg-container); border: 1px solid var(--border-color);
            border-radius: 20px; width: 100%; max-width: 320px; padding: 24px;
            box-shadow: var(--shadow-md); text-align: center;
        }

        .modal-title { font-size: 16px; font-weight: 800; color: var(--brand-red); margin-bottom: 12px; }

        .modal-desc { font-size: 13px; color: var(--text-main); line-height: 1.6; margin-bottom: 20px; text-align: left; }

        .modal-action-btns { display: flex; gap: 10px; }

        .modal-action-btns button {
            flex: 1; height: 40px; border-radius: 10px; font-size: 13px; font-weight: 700;
            cursor: pointer; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main);
        }

        .modal-action-btns .confirm-btn { background-color: var(--brand-blue); color: white; border: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    </style>
