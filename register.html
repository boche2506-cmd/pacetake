<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PACE 派思 店內價外帶自取/點餐系統</title>
    <!-- PWA 配置 -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#ffffff">
    <!-- 一般網頁分頁圖示 -->
    <link rel="icon" type="image/png" href="png/logo192.png" sizes="192x192">
    <!-- iPhone 桌面圖示專用（已修改為 180x180 正方形） -->
    <link rel="apple-touch-icon" href="png/logo180.png">
    <link rel="stylesheet" href="style.css">
    <style>
        /* 填表區域 */
        .phone-wrapper {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden;
            overflow-y: auto;
            /* 隱藏 Firefox 的卷軸 */
            scrollbar-width: none;
            /* 確保內容依然可以滑動 */
            -ms-overflow-style: none;
            /* 隱藏 Chrome, Safari, Edge 的卷軸 */
        }

        .phone-wrapper::-webkit-scrollbar {
            /* Chrome, Safari 隱藏軸線 */
            display: none;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
            box-sizing: border-box;
        }

        .input-group label {
            font-size: 4cqw;
            font-weight: 600;
            color: var(--text-main);
            padding: 0.5cqw;
        }

        .input-style {
            width: 100%;
            height: 7cqw;
            color: var(--text-main);
            background-color: var(--bg-global);
            border: 0.2cqw solid var(--border-color);
            border-radius: 2cqw;
            padding: 0 2cqw;
            font-size: 4cqw;
            font-weight: 500;
            outline: none;
            box-sizing: border-box;
        }

        input:checked+.slider {
            background-color: var(--brand-blue);
        }

        input:checked+.slider::before {
            transform: translateX(5cqw);
        }

        .shop-logo-box,
        .img-upload-box {
            width: 15cqw;
            height: 15cqw;
            border-radius: 2cqw;
            border: 0.2cqw dashed var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 8cqw;
            background-color: var(--bg-global);
            cursor: pointer;
            color: var(--text-muted);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        .shop-logo-box span,
        .img-upload-box span {
            font-size: 3cqw;
            font-weight: 500;
            margin-top: 0.5cqw;
        }

        /* 👑 招牌圖片與店鋪名稱並排排版 */
        .shop-Phone-block {
            height: 15cqw;
            width: 100%;
            gap: 0.25cqw;
            display: flex;
            flex-direction: row;
            align-items: center;
        }

        .shop-Phone {
            height: 100%;
            max-width: 100%;
            gap: 0.25cqw;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: stretch;
            flex: 1;
        }

        /* 縣市區域並排選單 */
        .select-row {
            display: flex;
            gap: 0.25cqw;
        }

        .select-row select {
            flex: 1;
            overflow-y: auto;
            /* 隱藏 Firefox 的卷軸 */
            scrollbar-width: none;
            /* 確保內容依然可以滑動 */
            -ms-overflow-style: none;
            /* 隱藏 Chrome, Safari, Edge 的卷軸 */
        }

        .select-row select::-webkit-scrollbar {
            /* Chrome, Safari 隱藏軸線 */
            display: none;
        }

        .coords-row {
            display: flex;
            gap: 0.25cqw;
            align-items: flex-end;
        }

        .coords-row input {
            font-size: 2.5cqw;
        }

        .query-btn {
            height: 7cqw;
            padding: 0 2cqw;
            font-size: 3.5cqw;
            background: var(--brand-blue);
            color: white;
            border-radius: 2cqw;
            border: none;
            cursor: pointer;
            white-space: nowrap;
            transition: transform 0.2s;
            /* 按下去會有一點點回饋感 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .query-btn:active {
            transform: scale(0.95);
            /* 按下去變小一點，模擬點擊感 */
        }

        .form-section {
            display: flex;
            flex-direction: column;
        }

        .section-title {
            font-size: 4cqw;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 1cqw;
            text-transform: uppercase;
            padding: 0.5cqw;
            line-height: 1.1;
        }

        /* 金流切換防禦線排版 */
        .switch-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 2cqw;
            padding: 0.5cqw 2cqw;
            color: var(--text-muted);
            background-color: var(--bg-global);
            border: 0.2cqw solid var(--border-color);
            font-size: 4cqw;
            line-height: 1.1;
        }

        /* 藍新金流隱藏區塊 */
        .newebpay-box {
            display: none;
            animation: fadeIn 0.2s ease;
        }

        /* 原生滑動開關器 */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 11cqw;
            height: 6cqw;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #CBD5E1;
            transition: .2s;
            border-radius: 6cqw;
        }

        .slider::before {
            position: absolute;
            content: "";
            height: 4cqw;
            width: 4cqw;
            left: 1cqw;
            bottom: 1cqw;
            background-color: white;
            transition: .2s;
            border-radius: 50%;
        }

        .seatingtoggle-switch,
        .menu-soldout-switch {
            position: relative;
            display: inline-block;
            width: 18cqw;
            height: 7cqw;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
        }

        .seatingtoggle-switch input,
        .menu-soldout-switch input {
            display: none;
        }

        .menu-soldout-switch .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ff4d4f;
            /* 綠色 */
            border-radius: 7cqw;
            transition: 0.4s;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3.25cqw;
            font-weight: bold;
        }

        .menu-soldout-switch .toggle-slider::before {
            position: absolute;
            content: "";
            height: 5cqw;
            width: 5cqw;
            right: 1.25cqw;
            /* 圓圈初始在左邊 */
            bottom: 1cqw;
            background-color: white;
            border-radius: 50%;
            transition: 0.4s;
        }

        .seatingtoggle-switch .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ff4d4f;
            /* 綠色 */
            border-radius: 7cqw;
            transition: 0.4s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3.25cqw;
            font-weight: bold;
        }

        .seatingtoggle-switch .toggle-slider::before {
            position: absolute;
            content: "";
            height: 5cqw;
            width: 5cqw;
            right: 1.5cqw;
            /* 圓圈初始在左邊 */
            bottom: 1cqw;
            background-color: white;
            border-radius: 50%;
            transition: 0.4s;
        }

        .menu-soldout-switch .off-text {
            display: block;
            margin-right: 6cqw;
            /* 把字往右擠，閃開左邊的白圈圈 */
        }

        .seatingtoggle-switch .off-text {
            display: block;
            margin-right: 6cqw;
            /* 把字往右擠，閃開左邊的白圈圈 */
        }

        .seatingtoggle-switch .on-text,
        .menu-soldout-switch .on-text {
            display: none;
        }

        /* 6. 勾選狀態 (變綠色、圓圈右移、文字替換) */
        .seatingtoggle:checked+.toggle-slider,
        .menu-soldout-toggle:checked+.toggle-slider {
            background-color: #52c41a;
            /* 變成綠色 */
        }

        .seatingtoggle:checked+.toggle-slider::before,
        .menu-soldout-toggle:checked+.toggle-slider::before {
            transform: translateX(-10.5cqw);
            /* 把白圈圈推到最右邊 (75 - 22 - 8 = 45) */
        }

        .seatingtoggle:checked+.toggle-slider .off-text,
        .menu-soldout-toggle:checked+.toggle-slider .off-text {
            display: none;
            /* 隱藏販售中 */
        }

        .seatingtoggle:checked+.toggle-slider .on-text,
        .menu-soldout-toggle:checked+.toggle-slider .on-text {
            display: block;
            /* 顯示暫停 */
            margin-left: 6cqw;
            /* 把字往左擠，閃開右邊的白圈圈 */
        }

        .seating {
            width: 100%;
            height: 8cqw;
            display: flex;
            justify-content: flex-start;
            flex-direction: row;
            align-items: center;
            gap: 1cqw;
            color: var(--text-main);
            background-color: var(--bg-global);
            border: 0.2cqw solid var(--border-color);
            border-radius: 2cqw;
            font-size: 4cqw;
        }

        .category-header {
            width: 100%;
            height: 8cqw;
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            align-items: center;
            box-sizing: border-box;
            /* 防止輸入框爆開 */
            overflow-x: auto;
            /* 💡 卷軸開在這裡！讓超出範圍的按鈕可以滑動 */
            white-space: nowrap;
            /* 強制按鈕們絕對不能換行，一定要排成一條直線 */
            gap: 0.25cqw;
            line-height: 1.1;
            /* 隱藏 Firefox 的卷軸 */
            scrollbar-width: none;
            /* 確保內容依然可以滑動 */
            -ms-overflow-style: none;
            cursor: grab;
            /* 隱藏 Chrome, Safari, Edge 的卷軸 */
            touch-action: manipulation
        }

        .category-header::-webkit-scrollbar {
            /* Chrome, Safari 隱藏軸線 */
            display: none;
        }

        .add-category-btn,
        .add-category {
            font-size: 4cqw;
            /* 字體改用 cqw */
            color: var(--brand-blue);
            background-color: var(--card-bg);
            border: 0.3cqw solid var(--border-color);
            /* 邊框粗細 cqw */
            border-radius: 5cqw;
            /* 圓角改用 cqw */
            cursor: pointer;
            white-space: nowrap;
            box-shadow: var(--shadow-sm);
            height: 7cqw;
            /* 讓它在 location-bar 裡自然撐高 */
            max-width: 32cqw;
            /* 給予固定的 cqw 寬度 */
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            line-height: 1.1;
            transition: transform 0.2s;
            /* 按下去會有一點點回饋感 */
            flex-shrink: 0;
        }

        .add-category-btn:active,
        .add-category:active {
            transform: scale(0.95);
            /* 按下去變小一點，模擬點擊感 */
        }

        /* 菜單動態上架排版 */
        .menu-upload-list {
            min-height: 24cqw;
            width: 100%;
            display: grid;
            flex-direction: row;
            justify-content: space-around;
            align-items: stretch;
            box-sizing: border-box;
            grid-template-columns: 1fr 1fr;
            padding: 0.5cqw 1cqw;
            border-top: 0.2cqw solid var(--border-color);
        }

        /* 👑 菜單排版大魔改：單列橫向佈局 */
        .menu-item-row {
            height: 24cqw;
            width: 100%;
            display: flex;
            flex-direction: column;
            background-color: var(--card-bg);
            border: 0.2cqw solid var(--border-color);
            border-radius: 2cqw;
            padding: 0.125cqw;
            justify-content: center;
            align-items: center;
            box-shadow: var(--shadow-sm);
            position: relative;
            box-sizing: border-box;
        }

        .menu-item {
            height: 15cqw;
            width: 100%;
            display: flex;
            flex-direction: row;
            border-radius: 2cqw;
            padding: 0.125cqw;
            align-items: center;
            justify-content: space-around;
            align-items: stretch;
            box-sizing: border-box;
            flex: 1;
        }

        .item-fields {
            max-width: 100%;
            height: 15cqw;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: stretch;
            box-sizing: border-box;
            flex: 1;
            /* 防止輸入框爆開 */
        }

        .remark {
            width: 100%;
            height: 8cqw;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            flex: 1;
            /* 防止輸入框爆開 */
        }

        .remark-btn {
            max-width: 100%;
            height: 100%;
            display: flex;
            flex-direction: row;
            justify-content: flex-end;
            align-items: center;
            box-sizing: border-box;
            flex: 1;
            /* 防止輸入框爆開 */
        }

        .item-price {
            max-width: 100%;
            height: 8cqw;
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            align-items: center;
        }

        .item-name {
            max-width: 100%;
            height: 8cqw;
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            align-items: center;
        }

        .item-price input {
            padding-left: 5cqw;
        }

        .price-symbol {
            position: absolute;
            font-size: 4cqw;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            align-items: center;
            margin-left: 2cqw;
        }

        .del-row-btn {
            background-color: var(--bg-global);
            border: 0.2cqw solid var(--border-color);
            color: var(--brand-red);
            font-size: 3cqw;
            font-weight: 600;
            padding: 1.5cqw 2cqw;
            border-radius: 2cqw;
            cursor: pointer;
            white-space: nowrap;
            transition: transform 0.2s;
            /* 按下去會有一點點回饋感 */
        }

        .del-row-btn:active {
            transform: scale(0.95);
            /* 按下去變小一點，模擬點擊感 */
        }

        .drag-handle {
            font-size: 3cqw;
            font-weight: 600;
            color: var(--text-muted);
            background-color: var(--bg-global);
            border: 0.2cqw solid var(--border-color);
            padding: 1.5cqw 2cqw;
            border-radius: 2cqw;
            cursor: grab;
            white-space: nowrap;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        .add-row-btn {
            background-color: var(--bg-global);
            border: 0.2cqw solid var(--border-color);
            color: var(--brand-blue);
            height: 10cqw;
            border-radius: 2cqw;
            font-size: 4cqw;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
            /* 按下去會有一點點回饋感 */
        }

        .add-row-btn:active {
            background-color: var(--border-color);
            transform: scale(0.95);
        }

        .footer-action {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: stretch;
            gap: 1cqw;
            padding: 0.5cqw 1cqw;
            background-color: var(--bg-Container);
            border-top: 0.2cqw solid var(--border-color);
        }

        /* 底部註冊大鈕 */
        .submit-btn {
            background-color: var(--brand-blue);
            color: white;
            border: none;
            width: 100%;
            height: 12cqw;
            border-radius: 5cqw;
            font-size: 4cqw;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 1cqw 4cqw rgba(0, 102, 255, 0.3);
            transition: transform 0.2s;
            /* 按下去會有一點點回饋感 */
        }

        .submit-btn:active {
            transform: scale(0.95);
            /* 按下去變小一點，模擬點擊感 */
        }

        .submit-btn:disabled {
            background-color: var(--text-muted);
            box-shadow: none;
            cursor: not-allowed;
        }

        .modal-desc {
            font-size: 5cqw;
            color: var(--text-main);
            line-height: 1;
            word-break: break-all;
            background-color: var(--bg-global);
            padding: 1cqw;
            border-radius: 2cqw;
            border: 0.2cqw solid var(--border-color);
            text-align: left;
        }

        .modal-action-btns {
            display: flex;
            gap: 1cqw;
        }

        .modal-action-btns button {
            flex: 1;
            height: 10cqw;
            border-radius: 2cqw;
            font-size: 3cqw;
            font-weight: 600;
            cursor: pointer;
            border: 0.2cqw solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-main);
        }

        .modal-action-btns .confirm-btn {
            background-color: var(--brand-blue);
            color: white;
            border: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(1cqw);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="phone-wrapper">
        <div id="buyerView" style="display: block;">
            <header class="header">
                <div class="pace-logo">
                    <a href="index.html" class="logo-link">
                        <img src="png/pace3.png" alt="派思 官方網站">
                    </a>
                    <div class="avatar-container">
                        <span id="defaultIcon">👤</span>
                        <img id="userAvatarImg" src=""
                            style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;"
                            onerror="this.style.display='none'; document.getElementById('defaultIcon').style.display='block';">
                    </div>
                </div>
                <div class="two">
                    <div class="pace">
                        <button class="theme-toggle" id="themeToggleBtn" aria-label="切換主題">🌙</button>
                        <span>店內價外帶自取/點餐系統</span>
                    </div>
                    <div class="avatarBtnMenu" data-action="avatarBtnMenu">
                        <span class="user-name" id="userNameDisplay"></span>
                        <div class="dropdown-menu" id="dropdownMenu"></div>
                    </div>
                </div>
            </header>
            <div class="input-group">
                <label>店鋪名稱</label>
                <input type="text" id="shopName" class="input-style" placeholder="請輸入店鋪招牌名稱(必填)">
            </div>
            <div class="input-group">
                <label>店鋪招牌與聯絡電話(會裁切成1:1圖片)</label>
                <div class="shop-Phone-block">
                    <div class="shop-logo-box" id="shopLogoBox">
                        📸<span>上傳招牌</span>
                        <input type="file" id="shopLogoInput" class="image-input" accept="image/*"
                            style="display: none;">
                        <img id="shopLogoPreview" class="preview-img" src=""
                            style="display: none; width: 100%; height: 100%; object-fit: cover; border-radius: 2cqw; position: absolute;">
                    </div>
                    <div class="shop-Phone">
                        <input type="tel" id="shopPhone" class="input-style" placeholder="請輸入店鋪或老闆的手機號碼(必填)"
                            pattern="[0-9]{9,10}">

                        <div class="select-row">
                            <select id="citySelect" class="input-style" data-action-change="citySelect">
                                <option value="">選擇縣市</option>
                                <option value="臺北市">臺北市</option>
                                <option value="新北市">新北市</option>
                                <option value="基隆市">基隆市</option>
                                <option value="桃園市">桃園市</option>
                                <option value="新竹市">新竹市</option>
                                <option value="新竹縣">新竹縣</option>
                                <option value="苗栗縣">苗栗縣</option>
                                <option value="台中市">台中市</option>
                                <option value="彰化縣">彰化縣</option>
                                <option value="南投縣">南投縣</option>
                                <option value="雲林縣">雲林縣</option>
                                <option value="嘉義市">嘉義市</option>
                                <option value="嘉義縣">嘉義縣</option>
                                <option value="台南市">台南市</option>
                                <option value="高雄市">高雄市</option>
                                <option value="屏東縣">屏東縣</option>
                                <option value="宜蘭縣">宜蘭縣</option>
                                <option value="花蓮縣">花蓮縣</option>
                                <option value="臺東縣">臺東縣</option>
                                <option value="澎湖縣">澎湖縣</option>
                                <option value="金門縣">金門縣</option>
                                <option value="連江縣">連江縣</option>

    <script
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCHDVR703MLCYGLAi_TtFdDM1gaauKV8sQ&libraries=geocoding&language=zh-TW&loading=async"
        async defer>

    <script type="module" src="app.js"></script>
    <script type="module">
        import { areaData, authReady, app, auth, db, provider, currentStoreInfo, signInAnonymously, signInWithPopup, signOut, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, collection, getDocs, doc, onSnapshot, getDoc, setDoc, updateDoc, addDoc, deleteDoc, query, where, serverTimestamp, orderBy, limit } from './app.js';
        let allStores = [];
        let buyerLat = null;
        let buyerLng = null;
        let currentUserId = null;
        let activeDragItem = null;
        let activeDragTab = null;   // 🎯 新增：專門給標籤用的全域變數
        let dragStartX = 0;
        let dragStartY = 0;
        const submitBtn = document.getElementById('submitBtn');
        const newebpayContainer = document.getElementById('newebpayContainer');
        const toggleCash = document.getElementById('toggleCash');
        const cashWarningModal = document.getElementById('cashWarningModal');
        const warningConfirmBtn = document.getElementById('warningConfirmBtn');
        const warningCancelBtn = document.getElementById('warningCancelBtn');
        const toggleOnline = document.getElementById('toggleOnline');
        let categoryCounter = 0;
        // 確保只有在 register.html 才執行這段檢查
        async function initRegisterPage() {
            /*if (!window.location.pathname.includes('register.html')) return;*/
            const user = await authReady;
            /*if (user.isAnonymous) {
                alert("尚未登入，請先前往登入頁面。");
                window.location.href = "index.html";
                return;*/
            // . 頁面路徑安全檢查
            // 1. 從網址取得 storeId (例如: register.html?storeId=123)
            const urlParams = new URLSearchParams(window.location.search);
            const storeId = urlParams.get('storeId');
            console.log("[PACE] Initializing Register Page Logic...");// . 現金警告邏輯 (事件委派)
            if (newebpayContainer) {
                // 1. 渲染 HTML 內容
                newebpayContainer.innerHTML = `
                <label style="display:block; font-size:4cqw; font-weight:600;">🔒 藍新金流 API 開發參數設定</label>
                <div style="display:flex; flex-direction:column; gap:0.5cqw;">
                    <input type="text" id="merchantIdInput" class="input-style" style="height:8cqw;" placeholder="請輸入 商店代號 (MerchantID)">
                    <input type="text" id="hashKeyInput" class="input-style" style="height:8cqw;" placeholder="請輸入 HashKey">
                    <input type="text" id="hashIvInput" class="input-style" style="height:8cqw;" placeholder="請輸入 HashIV">
                </div>`;
                // 2. 綁定開關監聽器（因為在 if 裡面，這裡不需要再重複檢查 newebpayContainer 了）
                toggleOnline?.addEventListener('change', (e) => {
                    newebpayContainer.style.display = e.target.checked ? 'block' : 'none';
                });
                // 3. 【防呆同步】一進畫面時，自動根據開關目前的狀態決定要顯示還是隱藏
                newebpayContainer.style.display = toggleOnline?.checked ? 'block' : 'none';
            }
            if (storeId) {
                console.log("偵測到 storeId，進入編輯模式:", storeId);
                try {
                    // 2. 從 Firebase 讀取該店家的資料
                    // 1. 同時讀取「商店資料」與「菜單子集合」
                    const [storeDoc, menuSnapshot] = await Promise.all([
                        getDoc(doc(db, "stores", storeId)),
                        getDocs(collection(db, "stores", storeId, "menu"))
                    ]);
                    if (storeDoc.exists()) {
                        const storeData = storeDoc.data();
                        const citySelect = document.getElementById('citySelect');
                        citySelect.value = storeData.city;
                        updateDistrictOptions(storeData.city, storeData.district);
                        // 3. 監聽縣市切換（以後使用者自己手動改縣市時才會用到）
                        citySelect.addEventListener('change', (e) => {
                            updateDistrictOptions(e.target.value);
                        });
                        // --- 【關鍵修正】補上這段擁有者檢查 ---
                        // 檢查資料庫裡的 sellerUid 是不是當前登入者的 UID
                        // 注意：請確保你的資料庫 store 文件裡有存 sellerUid 欄位
                        if (storeData.sellerUid !== user.uid) {
                            alert("權限不足，您無法修改別人的商店資料！");
                            window.location.href = "index.html";
                            return;
                        }
                        fillShopFormData(storeDoc.data());// 這裡填入欄位
                        submitBtn.dataset.mode = 'edit';
                        submitBtn.dataset.storeId = storeId;
                        submitBtn.innerText = "儲存修改";
                    } else {
                        alert("找不到該店鋪資料！");
                        return;
                    }
                    // 3. 處理菜單資料 (這裡就是你要抓的 menu)
                    const menuItems = menuSnapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));
                    console.log("撈到的菜單資料:", menuItems);
                    // 這裡你需要一個函式把 menuItems 渲染到畫面上
                    if (menuItems.length > 0) {
                        renderMenuToUI(menuItems);
                    } else {
                        // 如果舊資料沒有菜單，給他一個空白的輸入列
                        createNewItemRow();
                    }
                } catch (error) {
                    console.error("編輯模式讀取失敗:", error);
                    alert("讀取資料失敗，請檢查網路連線。");
                }
            } else {
                console.log("未偵測到 storeId，進入新增模式");
                // 明確設定為 create
                submitBtn.dataset.mode = 'create';
                submitBtn.innerText = "建立店鋪";
            }
        }
        function renderMenuToUI(categories) {
            const header = document.querySelector('.category-header');
            const addCategoryBox = header.querySelector('.add-category');
            // 🧹 【步驟一：大掃除】 (維持不變)
            header.querySelectorAll('.category-tab-btn').forEach(btn => btn.remove());
            document.querySelectorAll('.menu-upload-list').forEach(list => {
                if (list.id !== 'menuUploadList') list.remove();
            });
            const defaultBlankList = document.getElementById('menuUploadList');
            if (defaultBlankList) {
                defaultBlankList.style.display = 'none';
                defaultBlankList.classList.remove('active');
            }
            // 🔥【關鍵修正】：在跑迴圈蓋樓前，先讓資料依照我們存進去的 sortIndex 由小到大排好隊！
            categories.sort((a, b) => {
                const indexA = a.sortIndex !== undefined ? a.sortIndex : 999;
                const indexB = b.sortIndex !== undefined ? b.sortIndex : 999;
                return indexA - indexB;
            });
            // 💡 關鍵變數：用來記錄「上一個蓋好的車廂（大盒子）」，一開始先設定成標頭 header
            let lastInsertedElement = header;
            // 🏗️ 【步驟二：重建時空】 (使用排序後的 categories)
            categories.forEach((catObj, index) => {
                // 🌟 【修正關鍵】：不要用全域變數一直加下去！
                // 既然目前已經是排序好的順序，我們直接用這次渲染的 index 作為它唯一的 DOM 身份證！
                const uniqueStoredId = `category-list-render-${index}`;

                const newTabBtn = document.createElement('button');
                newTabBtn.type = 'button';
                // 確保第一個排進來的人（index === 0）擁有高亮 active
                newTabBtn.className = index === 0 ? 'category-tab-btn active' : 'category-tab-btn';
                newTabBtn.setAttribute('data-action', 'switchcategory');
                newTabBtn.setAttribute('data-target', uniqueStoredId); // 🎯 精準對齊
                newTabBtn.innerHTML = `
            <span>${catObj.category}</span>
            <span class="tab-del-x" data-action="deletecategory" style="margin-left: 2cqw; cursor: pointer; color: #ff4d4d;">❌</span>
        `;
                if (addCategoryBox) {
                    header.insertBefore(newTabBtn, addCategoryBox);
                } else {
                    header.appendChild(newTabBtn);
                }
                // 讓回填的標籤擁有拖曳功能
                makeTabDraggable(newTabBtn);
                const newListContainer = document.createElement('div');
                newListContainer.className = index === 0 ? 'menu-upload-list active' : 'menu-upload-list';
                newListContainer.id = uniqueStoredId; // 🎯 精準對齊大盒子
                newListContainer.style.display = index === 0 ? 'grid' : 'none';
                // 正序車廂接龍
                lastInsertedElement.insertAdjacentElement('afterend', newListContainer);
                lastInsertedElement = newListContainer;
                if (catObj.items && Array.isArray(catObj.items)) {
                    catObj.items.forEach(item => {
                        createNewItemRow(item, newListContainer);
                    });
                }
            });
            // 🌟 【防呆同步】：把全域的計數器校正回目前最大的數量，避免之後老闆按「➕」新增全新分類時 ID 衝突
            categoryCounter = categories.length;
        }
        // 讓區域選單根據縣市「長出」選項
        // 確保 register.html 裡面有載入 areaData 的變數（如果沒有，要補上這行）
        // const areaData = { "基隆市": ["仁愛區", "信義區", ...], ... };
        document.getElementById('citySelect').addEventListener('change', (e) => {
            updateDistrictOptions(e.target.value);
        });
        function updateDistrictOptions(city, districtValue) {
            const districtSelect = document.getElementById('districtSelect');
            if (!districtSelect) return;
            // 1. 如果 areaData 不存在，先報警檢查
            if (typeof areaData === 'undefined') {
                console.error("錯誤：areaData 沒有定義！請檢查是否在 register.html 載入了縣市資料檔");
                return;
            }
            // 2. 清空並重建
            districtSelect.innerHTML = '<option value="">選擇區域</option>';
            if (areaData[city]) {
                areaData[city].forEach(dist => {
                    const opt = document.createElement('option');
                    opt.value = dist;
                    opt.innerText = dist;
                    districtSelect.appendChild(opt);
                });
            }
            // 3. 賦值
            if (districtValue) {
                districtSelect.value = districtValue;
            }
        }
        // 負責把資料填回表單
        async function fillShopFormData(data) {
            document.getElementById('shopName').value = data.shopName || '';
            document.getElementById('shopPhone').value = data.shopPhone || '';
            document.getElementById('citySelect').value = data.city || '';
            document.getElementById('districtSelect').value = data.district || '';
            document.getElementById('shopAddress').value = data.detailAddress || '';
            document.getElementById('shopLat').value = data.shopLat || '';
            document.getElementById('shopLng').value = data.shopLng || '';
            document.getElementById('zoneid').value = data.zoneid || '';
            document.getElementById('prepareTimeInput').value = data.prepareTime || 15;
            document.getElementById('merchantIdInput').value = data.MerchantID || '';
            document.getElementById('hashKeyInput').value = data.HashKey || '';
            document.getElementById('hashIvInput').value = data.HashIV || '';
            document.getElementById('toggleCash').checked = !!data.isCashPayEnabled;
            document.getElementById('toggleOnline').checked = !!data.isOnlinePayEnabled;
            document.getElementById('seatingtoggle').checked = !!data.hasSeating;
            if (data.shopLogo) {
                const logoPreview = document.getElementById('shopLogoPreview'); // 請確認您的 img ID 是否為這個
                if (logoPreview) {
                    logoPreview.src = data.shopLogo;
                    logoPreview.style.display = 'block';
                }
            }
            // 如果有開啟線上付款，要把金流設定的容器打開
            const newebpayContainer = document.getElementById('newebpayContainer');
            if (newebpayContainer && data.isOnlinePayEnabled) {
                newebpayContainer.style.display = 'block';
            }
        }
        // 每次被呼叫時，都抓取當下最新的一手資料
        function getShopFormData() {
            return {
                name: document.getElementById('shopName')?.value.trim(),

        // 監聽詳細地址輸入框，當離開欄位時自動查詢
        function setupAddressGeocoder() {
            // 1. 頁面路徑安全檢查
            if (!window.location.pathname.includes('register.html')) return;
            console.log("[PACE] Initializing Register Page Logic...");
            const addressInput = document.getElementById('shopAddress');
            addressInput?.addEventListener('blur', async () => {
                const city = document.getElementById('citySelect').value;
                const district = document.getElementById('districtSelect').value;
                const detail = document.getElementById('shopAddress').value.trim();
                if (!city || !district || !detail) return;
                const fullAddress = `${city}${district}${detail}`;
                console.log("[PACE] 使用 Google API 查詢：", fullAddress);
                // 初始化 Google Geocoder
                const geocoder = new google.maps.Geocoder();
                geocoder.geocode({ 'address': fullAddress }, (results, status) => {
                    if (status === 'OK') {
                        const location = results[0].geometry.location;
                        const lat = location.lat();
                        const lng = location.lng();
                        // 填入經緯度欄位
                        document.getElementById('shopLat').value = location.lat();
                        document.getElementById('shopLng').value = location.lng();
                        console.log("[PACE] Google 定位成功！");
                        // 2. 自動算出 zone_id 並填入！
                        const zid = getZoneId(lat, lng);
                        document.getElementById('zoneid').value = zid;
                        console.log("[PACE] 自動填入座標與區域 ID:", lat, lng, zid);
                    } else {
                        console.warn("[PACE] Google 定位失敗，狀態：" + status);
                    }
                });
            });
        }
        function getZoneId(lat, lng) {
            const LAT_MIN = 21.8, LAT_MAX = 25.7;
            const LNG_MIN = 119.3, LNG_MAX = 122.0;
            const ROW_COUNT = 78, COL_COUNT = 54;
            let row = Math.floor(((lat - LAT_MIN) / (LAT_MAX - LAT_MIN)) * ROW_COUNT);
            let col = Math.floor(((lng - LNG_MIN) / (LNG_MAX - LNG_MIN)) * COL_COUNT);
            row = Math.max(0, Math.min(ROW_COUNT - 1, row));
            col = Math.max(0, Math.min(COL_COUNT - 1, col));
            return `zone_${row}_${col}`;
        }

                        if (img) {

        // 拖曳菜單專屬函式區 新增菜單(賣家)

            handle.addEventListener('touchstart', (e) => startDrag(e, row), { passive: false });

        function startDrag(e, row) {
            if (e.cancelable) e.preventDefault();
            activeDragItem = row;
            row.style.transform = 'scale(1.02)'; // 微放大
            row.style.boxShadow = '0 2.5cqw 5cqw rgba(0,0,0,0.2)'; // 浮起來的陰影
            row.style.zIndex = '500';
            row.style.transition = 'transform 0.2s, box-shadow 0.2s'; // 平滑動畫
            row.style.border = '0.2cqw dashed var(--brand-blue)';
            if (e.type.startsWith('touch')) {
                window.addEventListener('touchmove', onDragMove, { passive: false });
                window.addEventListener('touchend', onDragEnd);
            } else {
                window.addEventListener('mousemove', onDragMove);
                window.addEventListener('mouseup', onDragEnd);
            }
        }
        function onDragMove(e) {
            if (!activeDragItem) return;
            if (e.cancelable) e.preventDefault();
            // 🎯 2. 精準導航：直接抓出「當前被拖曳的品項，究竟正踩在哪個分頁容器裡」
            const currentList = activeDragItem.closest('.menu-upload-list');
            if (!currentList) return; // 安全防呆
            const clientY = e.type.startsWith('touch') ? e.touches[0].clientY : e.clientY;
            requestAnimationFrame(() => {
                const siblings = [...currentList.querySelectorAll('.menu-item-row')].filter(el => el !== activeDragItem);
                const nextSibling = siblings.find(sibling => {
                    const box = sibling.getBoundingClientRect();
                    return clientY <= box.top + box.height / 2;
                });
                if (nextSibling && activeDragItem !== nextSibling) {
                    currentList.insertBefore(activeDragItem, nextSibling);
                } else if (!nextSibling && activeDragItem !== currentList.lastElementChild) {
                    currentList.appendChild(activeDragItem);
                }
            });
        }
        function onDragEnd() {
            if (!activeDragItem) return;

            activeDragItem.style.border = '0.2cqw solid var(--border-color)';

        // 🎯 初始化時，讓畫面上原本就存在的分類標籤（如果有的話）也能被拖曳

        // =======================================================
        // 🏷️ 專屬：分類標籤左右拖曳功能
        // =======================================================
        function makeTabDraggable(tabBtn) {
            // 讓整顆按鈕都可以當作把手，綁定滑鼠與觸控事件
            tabBtn.addEventListener('mousedown', (e) => startTabDrag(e, tabBtn));

        function startTabDrag(e, tabBtn) {
            // 1. 如果點到刪除按鈕，立刻結束
            if (e.target.closest('[data-action="deletecategory"]')) return;
            // 2. 記錄起點，暫時不要觸發拖曳視覺效果
            const clientX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.startsWith('touch') ? e.touches[0].clientY : e.clientY;
            dragStartX = clientX;
            dragStartY = clientY;
            activeDragTab = tabBtn; // 先存起來
            // 3. 綁定監測「是否真的在拖曳」的事件
            if (e.type.startsWith('touch')) {
                window.addEventListener('touchmove', checkIsDragging, { passive: false });
                window.addEventListener('touchend', endDragCheck);
            } else {
                window.addEventListener('mousemove', checkIsDragging);
                window.addEventListener('mouseup', endDragCheck);
            }
        }
        function checkIsDragging(e) {
            const clientX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.startsWith('touch') ? e.touches[0].clientY : e.clientY;
            // 如果移動距離超過 5px，正式啟動拖曳視覺與監聽
            if (Math.abs(clientX - dragStartX) > 5 || Math.abs(clientY - dragStartY) > 5) {
                // --- 正式啟動拖曳視覺 ---
                activeDragTab.style.transform = 'scale(1.05)';
                activeDragTab.style.opacity = '0.8';
                activeDragTab.style.zIndex = '500';
                activeDragTab.style.transition = 'transform 0.2s, opacity 0.2s';
                // 移除監測器，掛上真正的拖曳位移邏輯
                removeCheckListeners();
                if (e.type.startsWith('touch')) {
                    window.addEventListener('touchmove', onTabDragMove, { passive: false });
                    window.addEventListener('touchend', onTabDragEnd);
                } else {
                    window.addEventListener('mousemove', onTabDragMove);
                    window.addEventListener('mouseup', onTabDragEnd);
                }
            }
        }
        function endDragCheck() {
            // 如果滑鼠放開時還沒達到 5px 拖曳距離，就是一次正常的點擊
            removeCheckListeners();
            activeDragTab = null;
        }
        function removeCheckListeners() {
            window.removeEventListener('mousemove', checkIsDragging);
            window.removeEventListener('mouseup', endDragCheck);
            window.removeEventListener('touchmove', checkIsDragging);
            window.removeEventListener('touchend', endDragCheck);
        }
        function onTabDragMove(e) {

            // 🎯 抓取滑鼠或手指目前的 X 座標（因為標籤是左右排）
            const clientX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;
            requestAnimationFrame(() => {

                const siblings = [...header.querySelectorAll('.category-tab-btn')].filter(el => el !== activeDragTab);
                // 🎯 核心演算法：根據 X 軸位置，找出目前被拖曳的標籤應該插在誰的前面
                const nextSibling = siblings.find(sibling => {
                    const box = sibling.getBoundingClientRect();
                    // 如果目前的滑鼠 X 座標，小於該鄰居的中心點，就代表應該插在它左邊
                    return clientX <= box.left + box.width / 2;

                // 找到輸入框的外盒子，確保標籤不會被拖到輸入框的右邊去
                const addCategoryBox = header.querySelector('.add-category');

            else if (action === 'addcategorybtn') {
                const header = document.querySelector('.category-header');
                const input = header.querySelector('.add-category input');
                const categoryName = input.value.trim();
                // 防呆：沒填文字不給過
                if (!categoryName) {
                    alert('請先輸入分類名稱(必填)！');
                    return;
                }
                categoryCounter++;
                const uniqueStoredId = `category-list-${categoryCounter}`;
                // 1. 抓取當前正在編輯的 menuUploadList
                const currentWorkingList = document.getElementById('menuUploadList');
                if (currentWorkingList) {
                    // 變更 ID 為獨立標記（封存起來），並將它隱藏
                    currentWorkingList.id = uniqueStoredId;
                    currentWorkingList.style.display = 'none';
                    currentWorkingList.classList.remove('active');
                }
                // 2. 🧱 憑空生成新分頁按鈕
                const newTabBtn = document.createElement('button');
                newTabBtn.type = 'button';
                newTabBtn.className = 'category-tab-btn active'; // 新生成的分類直接高亮
                newTabBtn.setAttribute('data-action', 'switchcategory');
                newTabBtn.setAttribute('data-target', uniqueStoredId);
                // 🎯 關鍵修改：用一個 span 包住字，並在旁邊塞一個帶有 data-action="deletecategory" 的 ❌
                newTabBtn.innerHTML = `
                    <span>${categoryName}</span>
                    <span class="tab-del-x" data-action="deletecategory" style="margin-left: 2cqw; cursor: pointer; color: #ff4d4d;">❌</span>
                            `;
                // 🎯【核心改動】：不找 tabsWrapper 了！直接把按鈕塞進 header，且放在「輸入框」的前面
                const addCategoryBox = header.querySelector('.add-category'); // 抓到輸入框的外層盒子
                header.insertBefore(newTabBtn, addCategoryBox); // 意思：在 addCategoryBox 前面插入 newTabBtn
                makeTabDraggable(newTabBtn); // 🎯 補上這行，讓新標籤能被拖曳
                // 先把其他按鈕的 active 拔掉，確保只有剛生成的這顆在亮
                document.querySelectorAll('.category-tab-btn').forEach(btn => {
                    if (btn !== newTabBtn) btn.classList.remove('active');
                });
                // 3. 在 category-header 正下方插進全新空白容器，並接管 id="menuUploadList"
                const newListContainer = document.createElement('div');
                newListContainer.className = 'menu-upload-list active';
                newListContainer.id = 'menuUploadList'; // 接手成為最新的活動工作區
                // 完美還原你指定的初始品項列 HTML 結構
                newListContainer.innerHTML = `
                    <div class="menu-item-row">
                        <div class="menu-item">
                            <div class="img-upload-box" id="uploadBox">📷<span>上傳照片</span>
                                <input type="file" id="imageInput" class="image-input" accept="image/*"
                                    style="display: none;">
                                <img class="preview-img" src=""
                                    style="display: none; position: absolute; width: 100%; height: 100%; object-fit: cover; border-radius: 2cqw;">
                            </div>
                            <div class="item-fields">
                                <div class="item-name"><input type="text" class="input-style" placeholder="品項名稱(必填)"
                                        required></div>
                                <div class="item-price"><span class="price-symbol">$</span>
                                    <input type="number" class="input-style" placeholder="金額(必填)" min="0" required>
                                </div>
                            </div>
                        </div>
                        <div class="remark">
                            <label class="menu-soldout-switch"><input type="checkbox" class="menu-soldout-toggle"
                                    checked>
                                <span class="toggle-slider">
                                    <span class="on-text">販售中</span>
                                    <span class="off-text">暫停</span>
                                </span></label>
                            <div class="remark-btn">
                                <button type="button" class="del-row-btn" data-action="delRowBtn"
                                    style="width: 8cqw; height: 8cqw; display: flex; align-items: center; justify-content: center; font-size: 3cqw;">❌</button>
                                <div class="drag-handle"
                                    style="width: 8cqw; height: 8cqw; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 3cqw; cursor: grab;">
                                    ☰</div>
                            </div>
                        </div>
                    </div>`;
                // 🎯【正序接龍核心修改】：
                // 找出畫面上目前「最後一棟樓（最後一個大盒子）」
                const allCurrentLists = document.querySelectorAll('.menu-upload-list');
                if (allCurrentLists.length > 0) {
                    // 如果前面已經有盒子了，就乖乖排在最後一個盒子的正下方（afterend）
                    const lastList = allCurrentLists[allCurrentLists.length - 1];
                    lastList.insertAdjacentElement('afterend', newListContainer);
                } else {
                    // 如果這是第一個盒子（雖然通常預設就有一個），才塞在 header 下方
                    header.insertAdjacentElement('afterend', newListContainer);
                }
                // 4. 收尾：清空輸入框
                input.value = '';
            }
            // =======================================================
            // 🔀 動作三：點擊歷史分頁標籤按鈕
            // =======================================================
            else if (action === 'switchcategory') {
                const targetContainerId = target.getAttribute('data-target');

                // 1. 隱藏所有內容容器，並「全面拔掉 active 貼紙」
                document.querySelectorAll('.menu-upload-list').forEach(list => {
                    list.style.display = 'none';
                    list.classList.remove('active'); // 🎯 補上這行：舊的大盒子主角退場，交出貼紙
                });

                // 2. 顯示點擊按鈕所對應的封存歷史容器，並「貼上 active 貼紙」
                const targetList = document.getElementById(targetContainerId);
                if (targetList) {
                    targetList.style.display = 'grid';   // 保持你原本漂亮的 grid 佈局
                    targetList.classList.add('active'); // 🎯 補上這行：告訴 JS「現在這一頁才是老大」！
                }

                // 3. 更新按鈕的高亮樣式（這段你原本寫得非常漂亮，保留！）
                document.querySelectorAll('.category-tab-btn').forEach(btn => {
                    if (btn === target) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
            }
            // 🎯 登登登登！直接加在這裡！
            else if (action === 'deletecategory') {
                // 1. 🔥 超級關鍵：阻止事件冒泡！
                // 沒加這行的話，點 ❌ 的同時也會觸發外面按鈕的 switchcategory，網頁會噴錯迷路
                e.stopPropagation();
                // 2. 向上抓到這顆分類大按鈕，以及它對應的商品大盒子 ID
                const tabBtn = target.closest('.category-tab-btn');
                const targetListId = tabBtn.getAttribute('data-target');
                const categoryName = tabBtn.querySelector('span').textContent.trim();
                // 3. 安全防呆：問一下老闆是不是手滑
                if (!confirm(`確定要刪除整個「${categoryName}」分類，以及裡面的所有商品嗎？（按下儲存後才會真正從資料庫刪除）`)) {
                    return;
                }
                // 4. 開始拆房子：刪除對應的商品大盒子容器
                const contentList = document.getElementById(targetListId);
                if (contentList) {
                    contentList.remove();
                }
                // 5. 刪除這個分頁標籤按鈕本身
                tabBtn.remove();
                console.log(`已成功刪除 ${categoryName} 分類`);
                // 6. 🛠️ 【核心補丁：防滯留機制】
                // 萬一老闆刪除的是「當前正在看、亮著 active」的那一頁，畫面會變空白。
                // 我們必須貼心地幫他自動切換到別的分頁！
                if (tabBtn.classList.contains('active')) {
                    const remainingTabs = document.querySelectorAll('.category-tab-btn');
                    if (remainingTabs.length > 0) {
                        // 如果還有其他分類，就自動點擊第一個分類，幫老闆切過去
                        remainingTabs[0].click();
                    } else {
                        // 如果分類都被刪光光了，就讓原本那個最早的預設空白工作區重新復活
                        const defaultBlankList = document.getElementById('menuUploadList');
                        if (defaultBlankList) {
                            defaultBlankList.style.display = 'grid';
                            defaultBlankList.classList.add('active');
                        }
                    }
                }
            }
            else if (action === 'toggleCash') {
                toggleCash.checked = false;
                if (action === 'toggleCash') {
                    toggleCash.checked = false;
                    e.preventDefault();
                    if (cashWarningModal) cashWarningModal.style.display = 'flex';
                }
            }
            else if (e.target.id === 'warningConfirmBtn') {
                if (toggleCash) toggleCash.checked = true;
                if (cashWarningModal) cashWarningModal.style.display = 'none';
            } else if (e.target.id === 'warningCancelBtn') {
                if (toggleCash) toggleCash.checked = false;
                if (cashWarningModal) cashWarningModal.style.display = 'none';
            }
            // shopSubmitBtn 監聽與手動提交邏輯
            else if (action === 'shopSubmitBtn') {
                // 取得按鈕上的標籤來判斷要做什麼
                const btn = document.getElementById('submitBtn');
                // 🎯【新增：未按新增分類的攔截警告】
                const header = document.querySelector('.category-header');
                const pendingInput = header ? header.querySelector('.add-category input') : null;
                if (pendingInput && pendingInput.value.trim() !== '') {
                    const pendingValue = pendingInput.value.trim();
                    // 彈出確認視窗，如果按「取消」，就中斷儲存，讓老闆回去按 ➕
                    if (!confirm(`⚠️ 偵測到您在輸入框填了「${pendingValue}」，但尚未點擊「➕」按鈕建立分類！\n\n點擊「確定」將忽略此文字並繼續儲存。\n點擊「取消」回去補按 ➕ 新增分類。`)) {
                        pendingInput.focus(); // 自動幫他把游標點進輸入框
                        return; // 中斷儲存流程
                    }
                }
                const mode = btn.dataset.mode || 'create'; // 加上預設值，確保即使沒設也能跑新增
                const storeId = btn.dataset.storeId; // 只有編輯模式才會有值參數，新增用當前 UID
                const ShopFormData = getShopFormData();
                // 🎯【重大修改一】：改由「目前畫面上被拖曳排序好的分類標籤」當作火車頭！
                const allTabs = document.querySelectorAll('.category-tab-btn');
                const categorizedMenu = []; // 準備裝全部分類的大禮包
                // 🎯【重大修改二】：用標籤跑迴圈，此時的 index 就是完美的最新實體順序
                allTabs.forEach((tabBtn, index) => {
                    const targetListId = tabBtn.getAttribute('data-target');
                    const list = document.getElementById(targetListId);
                    if (!list) return;

                    const menuRows = list.querySelectorAll('.menu-item-row');

                    // 🧠 貼心修正：就算分類裡面暫時沒有商品，我們也該把這個「分類小火車」的順序記下來！
                    // 這樣才不會因為裡面沒商品，導致後面其他分類的 index 錯亂。
                    const textSpan = tabBtn.querySelector('span');
                    const categoryName = textSpan ? textSpan.textContent.trim() : tabBtn.textContent.trim();
                    const menuItems = [];

                    menuRows.forEach((row) => {
                        const toggle = row.querySelector('.menu-soldout-toggle');
                        const supply = toggle ? toggle.checked : true;
                        const nameVal = row.querySelector('.item-name input').value.trim();
                        if (!nameVal) return;

                        menuItems.push({
                            name: nameVal,
                            supply: supply,
                            image: row.querySelector('.preview-img').src,
                            price: parseInt(row.querySelector('.item-price input').value) || 0
                        });
                    });

                    // 🌟 不管裡面有沒有商品，只要這個「標籤」存在，它就配擁有自己當前的 sortIndex！
                    categorizedMenu.push({
                        category: categoryName,
                        items: menuItems, // 可能是空的陣列 []，沒關係，代表空分類
                        sortIndex: index  // 🎯 這樣就能 100% 保證 標籤1=0, 標籤2=1, 標籤3=2
                    });
                });
                // 🎯【精簡版防呆】：如果畫面剛開完全沒分類（完全空空的初始狀態下），為了保底防呆，直接塞進一個預設
                if (categorizedMenu.length === 0) {
                    const defaultList = document.getElementById('menuUploadList');
                    if (defaultList) {
                        const menuRows = defaultList.querySelectorAll('.menu-item-row');
                        const menuItems = [];
                        menuRows.forEach((row) => {
                            const nameVal = row.querySelector('.item-name input').value.trim();
                            if (!nameVal) return;
                            const toggle = row.querySelector('.menu-soldout-toggle');
                            menuItems.push({
                                name: nameVal,
                                supply: toggle ? toggle.checked : true,
                                image: row.querySelector('.preview-img').src,
                                price: parseInt(row.querySelector('.item-price input').value) || 0
                            });
                        });
                        if (menuItems.length > 0) {
                            categorizedMenu.push({
                                category: '最新工作區',
                                items: menuItems,
                                sortIndex: 0
                            });
                        }
                    }
                }
                // ──────────────────────────────────────────────────────────────
                // 🚂 以下完全對接你原本後面強大的經緯度、邀請碼、角色驗證與上傳邏輯（100% 保持原樣）
                // ──────────────────────────────────────────────────────────────
                const lat = document.getElementById('shopLat')?.value.trim();
                const lng = document.getElementById('shopLng')?.value.trim();
                if (!lat || !lng) {
                    alert("⚠️ 請先確認店鋪經緯度！若無法自動取得，請點擊「查詢座標」按鈕手動輸入，確保定位正確喔！");
                    document.getElementById('shopLat')?.focus();
                    return; // 直接中斷，不往下執行
                }
                const user = auth.currentUser;
                if (!user) {
                    alert("⚠️ 請先登入帳號！");
                    return;
                }
                // 先檢查該用戶是否已經是賣家，防止重複開鋪
                if (mode !== 'edit') {
                    try {
                        const userDocRef = doc(db, "users", user.uid);
                        const userDoc = await getDoc(userDocRef);
                        if (userDoc.exists() && userDoc.data().role === "seller") {
                            alert("您已經擁有店舖了，將為您前往賣家後台。");
                            window.location.href = "seller.html";
                            return;
                        }
                    } catch (err) {
                        console.error("權限檢查失敗:", err);
                        return;
                    }
                }
                // --- 2. 基本資訊與防呆 ---
                if (!ShopFormData.name || !ShopFormData.phone || !ShopFormData.city || !ShopFormData.district || !ShopFormData.detailAddress) {
                    alert("⚠️ 請填寫完整的店舖資訊！");
                    return;
                }
                const logoEl = document.getElementById('shopLogoPreview');
                const shopLogoData = (logoEl && logoEl.style.display !== 'none') ? logoEl.src : "";
                // --- 3. 邀請碼驗證 ---
                const inviteCode = document.getElementById('shopInviteCode')?.value.trim() || '';
                if (inviteCode) {
                    const promoQuery = query(collection(db, "promo_codes"), where("code", "==", inviteCode), where("isActive", "==", true));
                    const querySnapshot = await getDocs(promoQuery);
                    if (querySnapshot.empty) {
                        alert("❌ 無效的邀請碼或已被使用！");
                        return;
                    }
                    const promoDoc = querySnapshot.docs[0];
                    await updateDoc(promoDoc.ref, { isActive: false, usedBy: user.uid });
                }
                btn.disabled = true; // 這裡鎖定按鈕，防止使用者連按
                try {
                    if (mode === 'edit') {
                        // 模式 A：更新既有資料
                        const shopData = getShopDataForDatabase(ShopFormData, user.uid, inviteCode, shopLogoData, true);
                        await updateDoc(doc(db, "stores", storeId), shopData);
                    } else {
                        // 模式 B：新增
                        const shopData = getShopDataForDatabase(ShopFormData, user.uid, inviteCode, shopLogoData, false);
                        await setDoc(doc(db, "stores", user.uid), shopData);
                    }
                    // 1. 處理菜單資料 (這裡會將我們剛算好 sortIndex 的 categorizedMenu 餵進去)
                    const targetStoreId = (mode === 'edit') ? storeId : user.uid;
                    await refreshMenu(targetStoreId, categorizedMenu);
                    console.log("店家與菜單已成功儲存至子集合！");
                    // 2. 處理角色身分（只在非 admin 時更新）
                    const userRef = doc(db, "users", user.uid);
                    const userSnap = await getDoc(userRef);
                    const userData = userSnap.data();
                    // 只要不是 admin，就一律更新為 seller
                    if (userData?.role !== 'admin')
                        await updateDoc(userRef, { role: "seller" });
                    if (mode === 'edit') {
                        console.log("店家與菜單已成功更新！");
                        alert("✅ 資料已成功儲存！");
                    } else {
                        console.log("店家與菜單已成功新增！");
                        alert("🎉 恭喜，店鋪開張成功！");
                    }
                    window.location.href = "manage.html";
                } catch (dbError) {
                    console.error("提交錯誤:", dbError);
                    alert("系統錯誤：" + dbError.message);
                    btn.disabled = false; // 失敗時恢復按鈕
                }
            }
        });
        document.addEventListener('DOMContentLoaded', () => {
            initRegisterPage();
            setupAddressGeocoder();
            console.log("系統初始化完成");
        });
    </script>
</body>

</html>
