<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PACE 派思 pacetake.tw - 商家開店</title>
<!-- 1. 給電腦版、手機版 Chrome 瀏覽器標籤頁使用的標準圖示 -->
<link rel="icon" type="image/png" sizes="32x32" href="logo.png">
<link rel="icon" type="image/png" sizes="16x16" href="logo.png">
<!-- 2. 給 Apple iOS 系統（Safari/Chrome）加入主畫面與我的最愛使用的圖示 -->
<link rel="apple-touch-icon" sizes="180x180" href="logo.png">

    <style>
        /* 全局變數與主題防線 */
        :root {
            --bg-global: #F8FAFC;
            --bg-container: #FFFFFF;
            --border-color: #E2E8F0;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --brand-blue: #0066FF;
            --brand-red: #EF4444;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.05);
            --card-bg: #FFFFFF;
        }

        [data-theme="dark"] {
            --bg-global: #0A0A0A;
            --bg-container: #111111;
            --border-color: #262626;
            --text-main: #F5F5F5;
            --text-muted: #A3A3A3;
            --brand-blue: #3B82F6;
            --brand-red: #F87171;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.4);
            --card-bg: #1C1C1E;
        }

        /* 基礎重設 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-global);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            transition: background-color 0.15s ease;
        }

        /* 手機直屏精品大外框與細邊界 */
        .phone-wrapper {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            background-color: var(--bg-container);
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            position: relative;
            padding-bottom: 100px;
            display: flex;
            flex-direction: column;
        }

         /* 填表區域 */
        .form-container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
        }

        .input-style {
            width: 100%;
            height: 44px;
            background-color: var(--bg-global);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0 14px;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }

        /* 👑 招牌圖片與店鋪名稱並排排版 */
        .shop-name-block {
            display: flex;
            gap: 12px;
            align-items: center;
            width: 100%;
        }

        .shop-logo-box {
            width: 64px;
            height: 64px;
            border-radius: 14px;
            border: 2px dashed var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            background-color: var(--bg-global);
            cursor: pointer;
            color: var(--text-muted);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }
        .shop-logo-box span {
            font-size: 9px;
            margin-top: 2px;
            font-weight: 700;
        }

        /* 縣市區域並排選單 */
        .select-row {
            display: flex;
            gap: 8px;
        }
        .select-row select {
            flex: 1;
        }

        /* 金流切換防禦線排版 */
        .switch-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            box-shadow: var(--shadow-sm);
        }

        .switch-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .switch-title {
            font-size: 14px;
            font-weight: 700;
        }

        .switch-desc {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* 原生滑動開關器 */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #CBD5E1;
            transition: .2s;
            border-radius: 24px;
        }

        .slider::before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .2s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--brand-blue);
        }

        input:checked + .slider::before {
            transform: translateX(22px);
        }

        /* 藍新金流隱藏區塊 */
        .newebpay-box {
            display: none; 
            animation: fadeIn 0.2s ease;
        }

        /* 菜單動態上架排版 */
        .menu-upload-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 👑 菜單排版大魔改：單列橫向佈局 */
        .menu-item-row {
            display: flex;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px;
            gap: 10px;
            align-items: center;
            box-shadow: var(--shadow-sm);
            position: relative;
            touch-action: none; 
            user-select: none;
        }

        .img-upload-box {
            width: 64px;
            height: 64px;
            border-radius: 12px;
            border: 2px dashed var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            background-color: var(--bg-global);
            cursor: pointer;
            color: var(--text-muted);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .upload-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .img-upload-box span {
            font-size: 9px;
            margin-top: 2px;
        }

        .item-fields {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
            min-width: 0; /* 防止輸入框爆開 */
        }

        .price-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .price-symbol {
            position: absolute;
            left: 12px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .price-input {
            padding-left: 26px !important;
        }

        /* 👑 刪除與排序移到右側控制區 */
        .item-right-ctrls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .del-row-btn {
            background-color: var(--bg-global);
            border: 1px solid var(--border-color);
            color: var(--brand-red);
            font-size: 12px;
            font-weight: 700;
            padding: 6px 8px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }

        .drag-handle {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            background-color: var(--bg-global);
            border: 1px solid var(--border-color);
            padding: 6px 8px;
            border-radius: 8px;
            cursor: grab;
            white-space: nowrap;
        }
        .drag-handle:active {
            cursor: grabbing;
        }

        .add-row-btn {
            background-color: var(--bg-global);
            border: 1px solid var(--border-color);
            color: var(--brand-blue);
            height: 44px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background-color 0.2s;
        }

        .add-row-btn:active {
            background-color: var(--border-color);
        }

        /* 底部註冊大鈕 */
        .footer-action {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 20px 24px 20px;
            background-color: var(--bg-container);
            border-top: 1px solid var(--border-color);
        }

        .submit-btn {
            background-color: var(--brand-blue);
            color: white;
            border: none;
            width: 100%;
            height: 52px;
            border-radius: 26px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 102, 255, 0.3);
        }

        .submit-btn:disabled {
            background-color: var(--text-muted);
            box-shadow: none;
            cursor: not-allowed;
        }

        /* 半透明警語燈箱彈窗 */
        .lightbox-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-card {
            background-color: var(--bg-container);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            width: 100%;
            max-width: 320px;
            padding: 24px;
            box-shadow: var(--shadow-md);
            text-align: center;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--brand-red);
            margin-bottom: 12px;
        }

        .modal-desc {
            font-size: 13px;
            color: var(--text-main);
            line-height: 1.6;
            margin-bottom: 20px;
            text-align: left;
        }

        .modal-action-btns {
            display: flex;
            gap: 10px;
        }

        .modal-action-btns button {
            flex: 1;
            height: 40px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-main);
        }

        .modal-action-btns .confirm-btn {
            background-color: var(--brand-blue);
            color: white;
            border: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
     <div class="phone-wrapper">
        <div id="header-placeholder"></div>
          <form class="form-container" id="shopRegisterForm">
             <div class="form-section">
                <div class="section-title">基本資料設定</div>
                 <div class="input-group">
                    <label>店鋪聯絡電話</label>
                    <input type="tel" id="shopPhone" class="input-style" placeholder="請輸入店鋪或老闆的手機號碼" required pattern="[0-9]{9,10}">
                </div>
                
                <div class="input-group">
                    <label>店鋪招牌與名稱</label>
                    <div class="shop-name-block">
                        <div class="shop-logo-box" onclick="triggerUpload(this)">
                            <input type="file" id="shopLogoInput" class="image-input" accept="image/*" style="display: none;" onchange="previewImage(this)">
                            <img class="preview-img" id="shopLogoPreview" src="" style="display: none; width: 100%; height: 100%; object-fit: cover; border-radius: 10px;">
                            <div class="upload-placeholder">📸<span>上傳招牌</span></div>
                        </div>
                        <input type="text" id="shopName" class="input-style" placeholder="請輸入您的店鋪招牌名稱" required style="flex-grow:1;">
                    </div>
                </div>
                
                <div class="input-group">
                    <label>店鋪所在區域</label>
                    <div class="select-row">
                        <select id="shopCity" class="input-style" required>
                            <option value="">選擇縣市</option>
                        </select>
                        <select id="shopDistrict" class="input-style" required>
                            <option value="">選擇區域</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label>詳細地址 <span style="color:var(--brand-blue); font-size:11px;">(AI自動轉換經緯度)</span></label>
                    <input type="text" id="shopAddress" class="input-style" placeholder="請輸入巷弄門牌，不需重複寫縣市" required>
                </div>

                <div class="input-group">
                    <label>店家邀請碼 (選填)</label>
                    <input type="text" id="shopInviteCode" class="input-style" placeholder="若有專屬邀請碼請輸入">
                </div>

                <input type="hidden" id="shopStatus" value="online">

                <div class="input-group">
                    <label>平均餐點準備時間 (分鐘)</label>
                    <input type="number" id="prepareTimeInput" class="input-style" value="15" min="1" required>
                </div>
            </div>

            <div class="form-section">
                <div class="section-title">金流防棄單安全防禦線</div>
                
                <div class="switch-row">
                    <div class="switch-info">
                        <div class="switch-title">線上刷卡 / LINE Pay</div>
                        <div class="switch-desc">安全防護最高，買家先付款才接單</div>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="toggleOnline">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="input-group newebpay-box" id="newebpayContainer" style="display: none;"></div>

                <div class="switch-row">
                    <div class="switch-info">
                        <div class="switch-title">現場付現</div>
                        <div class="switch-desc">開啟現場付款，需自行承擔未取貨風險</div>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="toggleCash">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="form-section">
                <div class="section-title">菜單商品上架</div>
                <div class="menu-upload-list" id="menuUploadList">
                    
                    <div class="menu-item-row">
                        <div class="img-upload-box" onclick="triggerUpload(this)">
                            <input type="file" class="image-input" accept="image/*" style="display: none;" onchange="previewImage(this)">
                            <img class="preview-img" src="" style="display: none; width: 100%; height: 100%; object-fit: cover; border-radius: 8px;">
                            <div class="upload-placeholder">📷<span>上傳照片</span></div>
                        </div>
                        <div class="item-fields">
                            <input type="text" class="input-style item-name-input" style="height:32px; padding: 0 10px;" placeholder="品項名稱 (如：肉絲炒飯)" required>
                            <div class="price-input-wrapper">
                                <span class="price-symbol">$</span>
                                <input type="number" class="input-style price-input" style="height:32px; padding-left:22px !important;" placeholder="金額" min="0" required>
                            </div>
                        </div>
                        <div class="item-right-ctrls" style="display: flex; flex-direction: column; gap: 6px; justify-content: center;">
                            <div class="drag-handle" style="width: 36px; height: 32px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: grab;">☰</div>
                            <button type="button" class="del-row-btn" onclick="deleteRow(this)" style="width: 36px; height: 32px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 14px;">❌</button>
                        </div>
                    </div>

                </div>
                <button type="button" class="add-row-btn" id="addItemRowBtn">＋ 新增下一個品項</button>
            </div>
        </form>

        <footer class="footer-action">
            <button class="submit-btn" id="shopSubmitBtn" form="shopRegisterForm" type="submit">建立店鋪</button>
        </footer>

        <div class="lightbox-modal" id="cashWarningModal" style="display: none;">
            <div class="modal-card">
                <div class="modal-title">⚠️ 開啟現場付現風險提示</div>
                <div class="modal-desc">
                    您正準備開啟「現場付現」功能。請注意，若遇到買家蓄意棄單、逾時未取，相關食材與營業損失需由店鋪自行全額吸收，平台恕不進行補償。請問是否同意此條款？
                </div>
                <div class="modal-action-btns">
                    <button class="cancel-btn" id="warningCancelBtn">不同意</button>
                    <button class="confirm-btn" id="warningConfirmBtn">我同意</button>
                </div>
            </div>
        </div>
    </div>

<script type="module">

        "花蓮縣": ["花蓮市", "鳳林鎮", "玉里鎮", "新城鄉", "吉安鄉", "壽豐鄉", "光復鄉", "豐濱鄉", "瑞穗鄉", "富里鄉", "秀林鄉", "萬榮鄉", "卓溪鄉"],
        "臺東縣": ["臺東市", "成功鎮", "關山鎮", "卑名鄉", "大武鄉", "太麻里鄉", "東河鄉", "長濱鄉", "鹿野鄉", "池上鄉", "綠島鄉", "延平鄉", "海端鄉", "達仁鄉", "金峰鄉", "蘭嶼鄉"],
        "澎湖縣": ["馬公市", "湖西鄉", "白沙鄉", "西嶼鄉", "望安鄉", "七美鄉"],
        "金門縣": ["金城鎮", "金湖鎮", "金沙鎮", "金寧鄉", "烈嶼鄉", "烏坵鄉"],

    const shopCity = document.getElementById('shopCity');
    const shopDistrict = document.getElementById('shopDistrict');

    Object.keys(areaData).forEach(city => {
        const opt = document.createElement('option');
        opt.value = city; opt.innerText = city; shopCity.appendChild(opt);
    });

    shopCity.addEventListener('change', () => {
        const selectedCity = shopCity.value;
        shopDistrict.innerHTML = '<option value="">選擇區域</option>';
        if(areaData[selectedCity]) {
            areaData[selectedCity].forEach(dist => {
                const opt = document.createElement('option');
                opt.value = dist; opt.innerText = dist; shopDistrict.appendChild(opt);
            });
        }
    });

    // 💳 2. 金流欄位處理
    const toggleOnline = document.getElementById('toggleOnline');
    const toggleCash = document.getElementById('toggleCash');
    const newebpayContainer = document.getElementById('newebpayContainer');
    const cashWarningModal = document.getElementById('cashWarningModal');
    const warningConfirmBtn = document.getElementById('warningConfirmBtn');
    const warningCancelBtn = document.getElementById('warningCancelBtn');

    if(newebpayContainer) {
        newebpayContainer.innerHTML = `
            <label style="margin-bottom:12px; display:block; font-size:13px; font-weight:700;">🔒 藍新金流 API 開發參數設定</label>
            <div style="display:flex; flex-direction:column; gap:8px;">
                <input type="text" id="merchantIdInput" class="input-style" style="height:38px;" placeholder="請輸入 商店代號 (MerchantID)">
                <input type="text" id="hashKeyInput" class="input-style" style="height:38px;" placeholder="請輸入 HashKey">
                <input type="text" id="hashIvInput" class="input-style" style="height:38px;" placeholder="請輸入 HashIV">
            </div>
        `;
    }

    if(toggleOnline) {
        toggleOnline.addEventListener('change', () => {
            const inputs = newebpayContainer.querySelectorAll('input');
            if(toggleOnline.checked) {
                newebpayContainer.style.display = 'block';
                inputs.forEach(i => i.setAttribute('required', 'true'));
            } else {
                newebpayContainer.style.display = 'none';
                inputs.forEach(i => i.removeAttribute('required'));
            }
        });
    }

    if(toggleCash) {
        toggleCash.addEventListener('change', () => {
            if(toggleCash.checked) {
                toggleCash.checked = false;
                if(cashWarningModal) cashWarningModal.style.display = 'flex';
            }
        });
    }

    if(warningConfirmBtn) {
        warningConfirmBtn.addEventListener('click', () => {
            if(toggleCash) toggleCash.checked = true;
            if(cashWarningModal) cashWarningModal.style.display = 'none';
        });
    }

    if(warningCancelBtn) {
        warningCancelBtn.addEventListener('click', () => {
            if(toggleCash) toggleCash.checked = false;
            if(cashWarningModal) cashWarningModal.style.display = 'none';
        });
    }

    // ☰ 3. 菜單拖曳排序與操作核心
    const menuUploadList = document.getElementById('menuUploadList');
    let activeDragItem = null;

    function makeItemDraggable(row) {
        const handle = row.querySelector('.drag-handle');
        handle.addEventListener('mousedown', (e) => startDrag(e, row));
        handle.addEventListener('touchstart', (e) => startDrag(e, row), { passive: false });
    }

    function startDrag(e, row) {
        if (e.cancelable) e.preventDefault();
        activeDragItem = row;
        row.style.opacity = '0.5';
        row.style.border = '2px dashed var(--brand-blue)';
        
        const clientY = e.type.startsWith('touch') ? e.touches[0].clientY : e.clientY;
        if (e.type.startsWith('touch')) {
            window.addEventListener('touchmove', onDragMove, { passive: false });
            window.addEventListener('touchend', onDragEnd);
        } else {
            window.addEventListener('mousemove', onDragMove);
            window.addEventListener('mouseup', onDragEnd);
        }
    }

    function onDragMove(e) {
        if (!activeDragItem) return;
        if (e.cancelable) e.preventDefault();
        const currentY = e.type.startsWith('touch') ? e.touches[0].clientY : e.clientY;
        const siblings = [...menuUploadList.querySelectorAll('.menu-item-row:not([style*="dashed"])')];
        const nextSibling = siblings.find(sibling => {
            const box = sibling.getBoundingClientRect();
            return currentY <= box.top + box.height / 2;
        });
        nextSibling ? menuUploadList.insertBefore(activeDragItem, nextSibling) : menuUploadList.appendChild(activeDragItem);
    }

    function onDragEnd() {
        if (!activeDragItem) return;
        activeDragItem.style.opacity = '1';
        activeDragItem.style.border = '1px solid var(--border-color)';
        activeDragItem = null;
        window.removeEventListener('mousemove', onDragMove);
        window.removeEventListener('mouseup', onDragEnd);
        window.removeEventListener('touchmove', onDragMove);
        window.removeEventListener('touchend', onDragEnd);
    }

    document.querySelectorAll('.menu-item-row').forEach(row => makeItemDraggable(row));

    const addItemRowBtn = document.getElementById('addItemRowBtn');
    if(addItemRowBtn && menuUploadList) {
        addItemRowBtn.addEventListener('click', () => {
            const newRow = document.createElement('div');
            newRow.className = 'menu-item-row';
            newRow.innerHTML = `
                <div class="img-upload-box" onclick="triggerUpload(this)">
                    <input type="file" class="image-input" accept="image/*" style="display: none;" onchange="previewImage(this)">
                    <img class="preview-img" src="" style="display: none; width: 100%; height: 100%; object-fit: cover; border-radius: 8px;">
                    <div class="upload-placeholder">📷<span>上傳照片</span></div>
                </div>
                <div class="item-fields">
                    <input type="text" class="input-style item-name-input" style="height:32px; padding: 0 10px;" placeholder="品項名稱" required>
                    <div class="price-input-wrapper">
                        <span class="price-symbol">$</span>
                        <input type="number" class="input-style price-input" style="height:32px; padding-left:22px !important;" placeholder="金額" min="0" required>
                    </div>
                </div>
                <div class="item-right-ctrls" style="display: flex; flex-direction: column; gap: 6px; justify-content: center;">
                    <div class="drag-handle" style="width: 36px; height: 32px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: grab;">☰</div>
                    <button type="button" class="del-row-btn" onclick="deleteRow(this)" style="width: 36px; height: 32px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 14px;">❌</button>
                </div>
            `;
            menuUploadList.appendChild(newRow);
            makeItemDraggable(newRow); 
        });
    }

    window.deleteRow = function(btn) {
        const rows = menuUploadList.querySelectorAll('.menu-item-row');
        if(rows.length <= 1) { alert("報告老闆，店裡至少要留一項商品才能開張喔！"); return; }
        btn.closest('.menu-item-row').remove();
    };

    window.triggerUpload = function(box) {
        const fileInput = box.querySelector('.image-input');
        if (fileInput) fileInput.click();
    };

    window.previewImage = function(input) {
        const box = input.parentElement;
        const img = box.querySelector('.preview-img');
        const placeholder = box.querySelector('.upload-placeholder');
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                img.src = e.target.result;
                img.style.display = 'block';
                if (placeholder) placeholder.style.display = 'none';
            };
            reader.readAsDataURL(input.files[0]);
        }
    };

    // 🚀 4. 表單提交打包
    const form = document.getElementById('shopRegisterForm');
    if(form) {
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = auth.currentUser;
            if (!user) { alert("【PACE 提示】開鋪前請先登入帳號喔！"); return; }
            
            const isOnlinePayEnabled = toggleOnline ? toggleOnline.checked : false;
            const isCashPayEnabled = toggleCash ? toggleCash.checked : false;

            if (!isOnlinePayEnabled && !isCashPayEnabled) {
                alert("⚠️ 請至少選擇一種收款方式（線上刷卡或現場付現）才能順利開張喔！");
                return;
            }

            const name = document.getElementById('shopName')?.value.trim() || '';
            const phone = document.getElementById('shopPhone')?.value.trim() || '';
            const city = shopCity.value;
            const district = shopDistrict.value;
            const detailAddress = document.getElementById('shopAddress')?.value.trim() || '';
            const inviteCode = document.getElementById('shopInviteCode')?.value.trim() || '';
            const status = document.getElementById('shopStatus')?.value || 'online';
            const prepareTime = parseInt(document.getElementById('prepareTimeInput')?.value) || 15;
            const logoEl = document.getElementById('shopLogoPreview');
            const shopLogoData = (logoEl && logoEl.style.display !== 'none') ? logoEl.src : "";
            const merchantIdValue = document.getElementById('merchantIdInput')?.value.trim() || '';
            const hashKeyValue = document.getElementById('hashKeyInput')?.value.trim() || '';
            const hashIvValue = document.getElementById('hashIvInput')?.value.trim() || '';
            
            const menuRows = document.querySelectorAll('.menu-item-row');
            const menuItems = [];
            menuRows.forEach(row => {
                const nameField = row.querySelector('.item-name-input');
                const priceField = row.querySelector('.price-input');
                const nameVal = nameField ? nameField.value.trim() : '';
                const priceVal = priceField ? parseInt(priceField.value) || 0 : 0;
                const imgEl = row.querySelector('.preview-img');
                const imgData = (imgEl && imgEl.style.display !== 'none') ? imgEl.src : "";
                if (nameVal) menuItems.push({ name: nameVal, price: priceVal, image: imgData });
            });

            const shopData = {
                sellerUid: user.uid,
                shopName: name, shopPhone: phone, city: city, district: district,
                shopAddress: `${city}${district}${detailAddress}`,
                inviteCode: inviteCode, status: status, shopLogo: shopLogoData,
                prepareTime: prepareTime, isOnlinePayEnabled: isOnlinePayEnabled,
                isCashPayEnabled: isCashPayEnabled,
                newebpayConfig: { MerchantID: merchantIdValue, HashKey: hashKeyValue, HashIV: hashIvValue },
                menuList: menuItems, createdAt: new Date().toISOString()
            };

            const shopSubmitBtn = document.getElementById('shopSubmitBtn');
            shopSubmitBtn.innerText = "⚡ 正在打通雲端地基中...";
            shopSubmitBtn.disabled = true;

            try {
                await setDoc(doc(db, "stores", user.uid), shopData);
                alert("🎉 恭喜老闆！您的店鋪（" + name + "）已成功開張！");
                window.location.href = "seller.html";
            } catch (dbError) {
                alert("寫入失敗：" + dbError.message);
                shopSubmitBtn.innerText = "建立店鋪";
                shopSubmitBtn.disabled = false;
            }
        });
    }
</script>
