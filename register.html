<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>快拿自取街 pacetake.tw - 商家手機開店</title>
    <!-- 精品藍色便當純代碼 SVG Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20x%3D%2210%22%20y%3D%2230%22%20width%3D%2280%22%20height%3D%2255%22%20rx%3D%2210%22%20fill%3D%22%230066FF%22%2F%3E%3Cpath%20d%3D%22M25%2030%20V15%20Q25%2010%2035%2010%20H65%20Q75%2010%2075%2015%20V30%22%20fill%3D%22none%22%20stroke%3D%22%230066FF%22%20stroke-width%3D%228%22%2F%3E%3Cline%20x1%3D%2210%22%20y1%3D%2255%22%20x2%3D%2290%22%20y2%3D%2255%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%224%22%2F%3E%3C%2Fsvg%3E">

    <style>
        /* 全局變數與主題防線 */
        :root {
            --bg-global: #F8FAFC;
            --bg-container: #FFFFFF;
            --border-color: #E2E8F0;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --brand-blue: #0066FF;
            --brand-red: #EF4444;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.05);
            --card-bg: #FFFFFF;
        }

        [data-theme="dark"] {
            --bg-global: #0A0A0A;
            --bg-container: #111111;
            --border-color: #262626;
            --text-main: #F5F5F5;
            --text-muted: #A3A3A3;
            --brand-blue: #3B82F6;
            --brand-red: #F87171;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.4);
            --card-bg: #1C1C1E;
        }

        /* 基礎重設 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-global);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            transition: background-color 0.15s ease;
        }

        /* 手機直屏精品大外框與細邊界 */
        .phone-wrapper {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            background-color: var(--bg-container);
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            position: relative;
            padding-bottom: 100px;
            display: flex;
            flex-direction: column;
        }

        /* 頂部導航與大字留白 */
        .header {
            padding: 24px 20px 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            background: none;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            text-decoration: none;
            background-color: var(--card-bg);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            font-size: 16px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            background-color: var(--card-bg);
        }

        /* 填表區域 */
        .form-container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
        }

        .input-style {
            width: 100%;
            height: 44px;
            background-color: var(--bg-global);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0 14px;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
        }

        /* 金流切換防禦線排版 */
        .switch-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            box-shadow: var(--shadow-sm);
        }

        .switch-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .switch-title {
            font-size: 14px;
            font-weight: 700;
        }

        .switch-desc {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* 原生滑動開關器 */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #CBD5E1;
            transition: .2s;
            border-radius: 24px;
        }

        .slider::before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .2s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--brand-blue);
        }

        input:checked + .slider::before {
            transform: translateX(22px);
        }

        /* 藍新金流隱藏區塊 */
        .newebpay-box {
            display: block; /* 預設開啟 */
            animation: fadeIn 0.2s ease;
        }

        /* 菜單動態上架排版 */
        .menu-upload-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-item-row {
            display: flex;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px;
            gap: 12px;
            align-items: center;
            box-shadow: var(--shadow-sm);
            animation: fadeIn 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .img-upload-box {
            width: 70px;
            height: 70px;
            border-radius: 12px;
            border: 2px dashed var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background-color: var(--bg-global);
            cursor: pointer;
            color: var(--text-muted);
        }

        .img-upload-box span {
            font-size: 10px;
            margin-top: 2px;
        }

        .item-fields {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
        }

        .price-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .price-symbol {
            position: absolute;
            left: 12px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .price-input {
            padding-left: 26px !important;
        }

        .add-row-btn {
            background-color: var(--bg-global);
            border: 1px solid var(--border-color);
            color: var(--brand-blue);
            height: 44px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background-color 0.2s;
        }

        .add-row-btn:active {
            background-color: var(--border-color);
        }

        /* 底部註冊大鈕 */
        .footer-action {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 20px 24px 20px;
            background-color: var(--bg-container);
            border-top: 1px solid var(--border-color);
        }

        .submit-btn {
            background-color: var(--brand-blue);
            color: white;
            border: none;
            width: 100%;
            height: 52px;
            border-radius: 26px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 102, 255, 0.3);
        }

        /* 半透明警語燈箱彈窗 */
        .lightbox-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-card {
            background-color: var(--bg-container);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            width: 100%;
            max-width: 320px;
            padding: 24px;
            box-shadow: var(--shadow-md);
            text-align: center;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--brand-red);
            margin-bottom: 12px;
        }

        .modal-desc {
            font-size: 13px;
            color: var(--text-main);
            line-height: 1.6;
            margin-bottom: 20px;
            text-align: left;
        }

        .modal-action-btns {
            display: flex;
            gap: 10px;
        }

        .modal-action-btns button {
            flex: 1;
            height: 40px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-main);
        }

        .modal-action-btns .confirm-btn {
            background-color: var(--brand-blue);
            color: white;
            border: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="phone-wrapper">
        <!-- 頂部高亮 -->
        <header class="header">
            <a href="index.html" class="back-btn nav-fast">⬅️ 返回</a>
            <h1>3分鐘手機開店</h1>
            <button class="theme-toggle" id="themeToggleBtn">🌓</button>
        </header>

        <form class="form-container" id="shopRegisterForm" onsubmit="return false;">
            <!-- 基本資料欄位 -->
            <div class="form-section">
                <div class="section-title">基本資料設定</div>
                <div class="input-group">
                    <label>店鋪名稱</label>
                    <input type="text" class="input-style" placeholder="請輸入您的店鋪招牌名稱" required>
                </div>
                <div class="input-group">
                    <label>店鋪地址 <span style="color:var(--brand-blue); font-size:11px;">(AI自動轉換經緯度)</span></label>
                    <input type="text" class="input-style" placeholder="請輸入完整地址，以便計算GPS距離" required>
                </div>
                <div class="input-group">
                    <label>平均餐點準備時間 (分鐘)</label>
                    <input type="number" class="input-style" value="15" min="1" required>
                </div>
            </div>

            <!-- 金流防棄單防禦線 -->
            <div class="form-section">
                <div class="section-title">金流防棄單安全防禦線</div>
                
                <!-- 線上刷卡 (預設開啟) -->
                <div class="switch-row">
                    <div class="switch-info">
                        <div class="switch-title">線上刷卡 / LINE Pay</div>
                        <div class="switch-desc">安全防護最高，買家先付款才接單</div>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="toggleOnline" checked>
                        <span class="slider"></span>
                    </label>
                </div>

                <!-- 藍新網址輸入框 -->
                <div class="input-group newebpay-box" id="newebpayContainer">
                    <label>藍新金流專屬收款網址</label>
                    <input type="url" class="input-style" placeholder="https://newebpay.com..." id="newebpayUrlInput">
                </div>

                <!-- 現場付現 (預設關閉) -->
                <div class="switch-row">
                    <div class="switch-info">
                        <div class="switch-title">現場付現</div>
                        <div class="switch-desc">開啟現場付款，需自行承擔未取貨風險</div>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="toggleCash">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <!-- 菜單上架排版 -->
            <div class="form-section">
                <div class="section-title">菜單商品上架</div>
                <div class="menu-upload-list" id="menuUploadList">
                    
                    <!-- 初始品項列 -->
                    <div class="menu-item-row">
                        <div class="img-upload-box">
                            📷<span>上傳照片</span>
                        </div>
                        <div class="item-fields">
                            <input type="text" class="input-style" style="height:34px;" placeholder="品項名稱 (如：肉絲炒飯)" required>
                            <div class="price-input-wrapper">
                                <span class="price-symbol">$</span>
                                <input type="number" class="input-style price-input" style="height:34px;" placeholder="店內價金額" min="0" required>
                            </div>
                        </div>
                    </div>

                </div>
                <button type="button" class="add-row-btn" id="addItemRowBtn">＋ 新增下一個品項</button>
            </div>
                              </form>

        <!-- 底部註冊確認大鈕 -->
        <footer class="footer-action">
            <button class="submit-btn" id="createShopBtn" form="shopRegisterForm" type="submit">建立店鋪</button>
        </footer>

        <!-- 現場付現高質感半透明警語彈窗 -->
        <div class="lightbox-modal" id="cashWarningModal" style="display: none;">
            <div class="modal-card">
                <div class="modal-title">⚠️ 開啟現場付現風險提示</div>
                <div class="modal-desc">
                    您正準備開啟「現場付現」功能。請注意，若遇到買家蓄意棄單、逾時未取，相關食材與營業損失需由店鋪自行全額吸收，平台恕不進行補償。請問是否同意此條款？
                </div>
                <div class="modal-action-btns">
                    <button class="cancel-btn" id="warningCancelBtn">不同意</button>
                    <button class="confirm-btn" id="warningConfirmBtn">我同意</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 🧠 引入 Firebase 9+ 核心防線 (包含驗證 Auth 與雲端資料庫 Firestore) -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getAuth, createUserWithEmailAndPassword } from "https://gstatic.com";
        import { getFirestore, doc, setDoc } from "https://gstatic.com";

        const firebaseConfig = {
            apiKey: "AIzaSyCkAiZCJ6L950KfYJEqubWGi1M8D03OuJI",
            authDomain: "://firebaseapp.com",
            projectId: "pacetake-c6e1e",
            storageBucket: "pacetake-c6e1e.firebasestorage.app",
            messagingSenderId: "1052980235056",
            appId: "1:1052980235056:web:de847652d41c53594896f5",
            measurementId: "G-GSF8FY1GEP"
        };

        // 初始化系統
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- 1. 動態插入「管理者帳密欄位」至基本資料區最上方 ---
        const formContainer = document.getElementById('shopRegisterForm');
        if (formContainer) {
            const authSection = document.createElement('div');
            authSection.className = 'form-section';
            authSection.innerHTML = `
                <div class="section-title">管理者帳號密碼 (登入後台使用)</div>
                <div class="input-group">
                    <label>電子郵件 (Email)</label>
                    <input type="email" class="input-style" id="fbEmail" placeholder="example@email.com" required>
                </div>
                <div class="input-group">
                    <label>設定密碼 (Password)</label>
                    <input type="password" class="input-style" id="fbPassword" placeholder="至少 6 位數密碼" required>
                </div>
            `;
            formContainer.insertBefore(authSection, formContainer.firstChild);
        }

        // --- 2. 處理表單提交 ---
        if (formContainer) {
            formContainer.addEventListener('submit', async (e) => {
                e.preventDefault(); // 阻擋網頁跳轉

                const email = document.getElementById('fbEmail').value;
                const password = document.getElementById('fbPassword').value;
                const createShopBtn = document.getElementById('createShopBtn');

                if (password.length < 6) {
                    alert('為了安全，密碼必須至少有 6 個字元喔！');
                    return;
                }

                createShopBtn.disabled = true;
                createShopBtn.innerText = '正在建立店鋪與雲端資料庫...';

                try {
                    // 核心步驟 A：建立帳號
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const uid = userCredential.user.uid;

                    // 核心步驟 B：精準收集欄位資料 (修正上一版陣列抓取錯誤)
                    const inputs = formContainer.querySelectorAll('.input-style');
                    // 因為我們動態插入了 2 個帳密欄位，所以原本的店鋪名稱會順延變成第 3 個欄位 (索引值為 2)
                    const shopName = inputs[2] ? inputs[2].value : '';
                    const shopAddress = inputs[3] ? inputs[3].value : '';
                    const prepTime = inputs[4] ? inputs[4].value : '15';
                    
                    const isOnlinePay = document.getElementById('toggleOnline').checked;
                    const newebpayUrl = document.getElementById('newebpayUrlInput').value;
                    const isCashPay = document.getElementById('toggleCash').checked;

                    // 收集菜單品項資料 (修正上一版 fields.value 錯誤)
                    const menuItems = [];
                    const rows = document.querySelectorAll('.menu-item-row');
                    rows.forEach(row => {
                        const fields = row.querySelectorAll('.input-style');
                        if (fields.length >= 2 && fields[0].value) {
                            menuItems.push({
                                itemName: fields[0].value,
                                price: Number(fields[1].value) || 0
                            });
                        }
                    });

                    // 核心步驟 C：完整寫入資料庫
                    await setDoc(doc(db, "shops", uid), {
                        uid: uid,
                        email: email,
                        shopName: shopName,
                        shopAddress: shopAddress,
                        prepTime: Number(prepTime),
                        paymentConfig: {
                            onlinePay: isOnlinePay,
                            newebpayUrl: newebpayUrl,
                            cashPay: isCashPay
                        },
                        menu: menuItems,
                        createdAt: new Date().toISOString()
                    });

                    alert('🎉 恭喜！店鋪帳號與雲端資料庫皆完美建立成功！');
                    window.location.href = 'seller.html';

                } catch (error) {
                    console.error("Firebase 發生錯誤：", error);
                    alert('❌ 串聯失敗，錯誤原因：' + error.message);
                } finally {
                    createShopBtn.disabled = false;
                    createShopBtn.innerText = '建立店鋪';
                }
            });
        }

        // --- 3. 保留前任 CTO 留下的所有原汁原味 UI 互動功能 ---
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        if(themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('pacetake-theme', newTheme);
            });
        }

        const toggleOnline = document.getElementById('toggleOnline');
        const newebpayContainer = document.getElementById('newebpayContainer');
        if(toggleOnline && newebpayContainer) {
            toggleOnline.addEventListener('change', () => {
                newebpayContainer.style.display = toggleOnline.checked ? 'block' : 'none';
            });
        }

        const toggleCash = document.getElementById('toggleCash');
        const cashWarningModal = document.getElementById('cashWarningModal');
        const warningCancelBtn = document.getElementById('warningCancelBtn');
        const warningConfirmBtn = document.getElementById('warningConfirmBtn');

        if(toggleCash && cashWarningModal) {
            toggleCash.addEventListener('change', () => {
                if(toggleCash.checked) cashWarningModal.style.display = 'flex';
            });
        }
        if(warningCancelBtn) {
            warningCancelBtn.addEventListener('click', () => {
                toggleCash.checked = false;
                cashWarningModal.style.display = 'none';
            });
        }
        if(warningConfirmBtn) {
            warningConfirmBtn.addEventListener('click', () => {
                cashWarningModal.style.display = 'none';
            });
        }
    </script>
</body>
</html>
