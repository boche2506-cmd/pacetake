<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PACE 派思 pacetake.tw - 買家首頁</title>
    <!-- Favicon & Apple Touch Icon -->
    <link rel="icon" type="image/png" href="png/logoapple.png" sizes="180x180">
    <link rel="apple-touch-icon" href="png/logoapple.png">
    <link rel="apple-touch-icon" sizes="180x180" href="png/logoapple.png">
    <link rel="apple-touch-icon-precomposed" href="png/logoapple.png">
    <link rel="stylesheet" href="style.css">
    <style>
        /* 填表區域 */
        .phone-wrapper {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden;
            overflow-y: auto;
        }

        .section {
            overflow-y: auto;
        }

        .form-section {
            display: flex;
            flex-direction: column;
        }

        .section-title {
            font-size: 4cqw;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 1cqw;
            text-transform: uppercase;
            padding: 0.5cqw;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 1cqw;
        }

        .input-group label {
            font-size: 4cqw;
            font-weight: 600;
            color: var(--text-main);
            padding: 0.5cqw;
        }

        .input-style {
            width: 100%;
            height: 8cqw;
            color: var(--text-main);
            background-color: var(--bg-global);
            border: 0.2cqw solid var(--border-color);
            border-radius: 2cqw;
            padding: 0 2cqw;
            font-size: 3.5cqw;
            outline: none;
        }

        /* 經緯度區塊 */

        .coords-row {
            display: flex;
            gap: 1cqw;
            align-items: flex-end;
        }

        .query-btn {
            height: 8cqw;
            padding: 0 2cqw;
            font-size: 3cqw;
            background: var(--brand-blue);
            color: white;
            border-radius: 2cqw;
            border: none;
            cursor: pointer;
            white-space: nowrap;
        }

        .footer-action {
            flex-shrink: 0;
            padding: 2cqw;
            border-top: 0.2cqw solid var(--border-color);
        }

        .submit-btn {
            background-color: var(--brand-blue);
            color: white;
            border: none;
            width: 100%;
            height: 12cqw;
            border-radius: 5cqw;
            font-size: 4cqw;
            font-weight: 700;
            cursor: pointer;
        }

        /* 👑 招牌圖片與店鋪名稱並排排版 */
        .shop-name-block {
            display: flex;
            gap: 1cqw;
            align-items: center;
            width: 100%;
        }

        .shop-logo-box {
            width: 17cqw;
            height: 17cqw;
            border-radius: 2cqw;
            border: 0.2cqw dashed var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 8cqw;
            background-color: var(--bg-global);
            cursor: pointer;
            color: var(--text-muted);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .shop-logo-box span {
            font-size: 4cqw;
            font-weight: 500;
            margin-top: 1cqw;
        }

        /* 縣市區域並排選單 */
        .select-row {
            display: flex;
            gap: 1cqw;
        }

        .select-row select {
            flex: 1;
        }

        /* 金流切換防禦線排版 */
        .switch-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 2cqw;
            padding: 2cqw;
            color: var(--text-muted);
            background-color: var(--bg-global);
            border: 0.2cqw solid var(--border-color);
            font-size: 4cqw;
        }

        .switch-info {
            display: flex;
            flex-direction: column;
            gap: 1cqw;
        }

        .switch-title {
            font-size: 4cqw;
            font-weight: 600;
        }

        .switch-desc {
            font-size: 3cqw;
            color: var(--text-muted);
        }

        /* 原生滑動開關器 */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 11cqw;
            height: 6cqw;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #CBD5E1;
            transition: .2s;
            border-radius: 6cqw;
        }

        .slider::before {
            position: absolute;
            content: "";
            height: 4cqw;
            width: 4cqw;
            left: 1cqw;
            bottom: 1cqw;
            background-color: white;
            transition: .2s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: var(--brand-blue);
        }

        input:checked+.slider::before {
            transform: translateX(5cqw);
        }

        /* 藍新金流隱藏區塊 */
        .newebpay-box {
            display: none;
            animation: fadeIn 0.2s ease;
        }

        /* 菜單動態上架排版 */
        .menu-upload-list {
            display: flex;
            flex-direction: column;
        }

        /* 👑 菜單排版大魔改：單列橫向佈局 */
        .menu-item-row {
            width: 100%;
            display: flex;
            flex-direction: column;
            background-color: var(--card-bg);
            border: 0.2cqw solid var(--border-color);
            border-radius: 2cqw;
            padding: 0.125cqw;
            align-items: center;
            box-shadow: var(--shadow-sm);
            position: relative;
            gap: 0.25cqw;
        }

        .menu-item {
            width: 100%;
            display: flex;
            border-radius: 2cqw;
            padding: 0.125cqw;
            align-items: center;
            gap: 0.5cqw;
        }

        .remark {
            width: 100%;
            display: flex;
            justify-content: space-between;
            flex-direction: row;
            border-radius: 2cqw;
            padding: 0.125cqw;
            align-items: center;
            gap: 0.5cqw;
        }

        .seating {
            width: 100%;
            height: 8cqw;
            display: flex;
            justify-content: flex-start;
            flex-direction: row;
            align-items: center;
            gap: 1cqw;
            color: var(--text-main);
            background-color: var(--bg-global);
            border: 0.2cqw solid var(--border-color);
            border-radius: 2cqw;
            padding: 0 2cqw;
            font-size: 4cqw;
        }

        .seatingtoggle-switch,
        .menu-soldout-switch {
            position: relative;
            display: inline-block;
            width: 20%;
            height: 7cqw;
        }

        .seatingtoggle-switch input,
        .menu-soldout-switch input {
            display: none;
        }

        .menu-soldout-switch .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ff4d4f;
            /* 綠色 */
            border-radius: 7cqw;
            transition: 0.4s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3.25cqw;
            font-weight: bold;
        }

        .menu-soldout-switch .toggle-slider::before {
            position: absolute;
            content: "";
            height: 5cqw;
            width: 5cqw;
            right: 1.375cqw;
            /* 圓圈初始在左邊 */
            bottom: 1cqw;
            background-color: white;
            border-radius: 50%;
            transition: 0.4s;
        }

        .seatingtoggle-switch .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ff4d4f;
            /* 綠色 */
            border-radius: 7cqw;
            transition: 0.4s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3.25cqw;
            font-weight: bold;
        }

        .seatingtoggle-switch .toggle-slider::before {
            position: absolute;
            content: "";
            height: 5cqw;
            width: 5cqw;
            right: 1.5cqw;
            /* 圓圈初始在左邊 */
            bottom: 1cqw;
            background-color: white;
            border-radius: 50%;
            transition: 0.4s;
        }

        .menu-soldout-switch .off-text {
            display: block;
            margin-right: 6cqw;
            /* 把字往右擠，閃開左邊的白圈圈 */
        }

        .seatingtoggle-switch .off-text {
            display: block;
            margin-right: 6cqw;
            /* 把字往右擠，閃開左邊的白圈圈 */
        }

        .seatingtoggle-switch .on-text,
        .menu-soldout-switch .on-text {
            display: none;
        }

        /* 6. 勾選狀態 (變綠色、圓圈右移、文字替換) */
        .seatingtoggle:checked+.toggle-slider,
        .menu-soldout-toggle:checked+.toggle-slider {
            background-color: #52c41a;
            /* 變成綠色 */
        }

        .seatingtoggle:checked+.toggle-slider::before,
        .menu-soldout-toggle:checked+.toggle-slider::before {
            transform: translateX(-10.5cqw);
            /* 把白圈圈推到最右邊 (75 - 22 - 8 = 45) */
        }

        .seatingtoggle:checked+.toggle-slider .off-text,
        .menu-soldout-toggle:checked+.toggle-slider .off-text {
            display: none;
            /* 隱藏販售中 */
        }

        .seatingtoggle:checked+.toggle-slider .on-text,
        .menu-soldout-toggle:checked+.toggle-slider .on-text {
            display: block;
            /* 顯示暫停 */
            margin-left: 6cqw;
            /* 把字往左擠，閃開右邊的白圈圈 */
        }

        .img-upload-box {
            width: 17cqw;
            height: 17cqw;
            border-radius: 2cqw;
            border: 0.2cqw dashed var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 8cqw;
            font-weight: 500;
            background-color: var(--bg-global);
            cursor: pointer;
            color: var(--text-muted);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .upload-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .img-upload-box span {
            font-size: 4cqw;
            font-weight: 500;
            margin-top: 1cqw;
        }

        .item-fields {
            display: flex;
            flex-direction: column;
            min-width: 0;
            /* 防止輸入框爆開 */
        }

        .price-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .price-symbol {
            position: absolute;
            left: 2cqw;
            font-size: 3cqw;
            font-weight: 600;
            color: var(--text-muted);
        }

        .price-input {
            padding-left: 5cqw;
        }

        .new-size {
            height: 17cqw;
            width: 8cqw;
            color: var(--text-muted);
            background-color: var(--bg-global);
            border: 0.2cqw solid var(--border-color);
            font-size: 3.5cqw;
            font-weight: 500;
            padding: 0.5cqw;
            border-radius: 2cqw;
            cursor: pointer;
            line-height: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;

        }

        /* 👑 刪除與排序移到右側控制區 */
        .item-right-ctrls {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .del-row-btn {
            background-color: var(--bg-global);
            border: 0.2cqw solid var(--border-color);
            color: var(--brand-red);
            font-size: 3cqw;
            font-weight: 600;
            padding: 1.5cqw 2cqw;
            border-radius: 2cqw;
            cursor: pointer;
            white-space: nowrap;
        }

        .drag-handle {
            font-size: 3cqw;
            font-weight: 600;
            color: var(--text-muted);
            background-color: var(--bg-global);
            border: 0.2cqw solid var(--border-color);
            padding: 1.5cqw 2cqw;
            border-radius: 2cqw;
            cursor: grab;
            white-space: nowrap;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        .add-row-btn {
            background-color: var(--bg-global);
            border: 0.2cqw solid var(--border-color);
            color: var(--brand-blue);
            height: 10cqw;
            border-radius: 2cqw;
            font-size: 4cqw;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
            margin-top: 1cqw;
        }

        .add-row-btn:active {
            background-color: var(--border-color);
        }

        /* 底部註冊大鈕 */
        .footer-action {
            bottom: 0;
            left: 0;
            right: 0;
            padding: 2cqw;
            background-color: var(--bg-Container);
            border-top: 0.2cqw solid var(--border-color);
        }

        .submit-btn {
            background-color: var(--brand-blue);
            color: white;
            border: none;
            width: 100%;
            height: 12cqw;
            border-radius: 5cqw;
            font-size: 4cqw;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 1cqw 4cqw rgba(0, 102, 255, 0.3);
        }

        .submit-btn:disabled {
            background-color: var(--text-muted);
            box-shadow: none;
            cursor: not-allowed;
        }

        /* 半透明警語燈箱彈窗 */
        .lightbox-modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(1cqw);
            -webkit-backdrop-filter: blur(1cqw);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 5cqw;
        }

        .modal-card {
            background-color: var(--bg-Container);
            border: 0.2cqw solid var(--border-color);
            border-radius: 5cqw;
            width: 100%;
            max-width: 100cqw;
            padding: 5cqw;
            box-shadow: var(--shadow-md);
            text-align: center;
        }

        .modal-title {
            font-size: 4cqw;
            font-weight: 700;
            color: var(--brand-red);
            margin-bottom: 3cqw;
        }

        .modal-desc {
            font-size: 3cqw;
            color: var(--text-main);
            line-height: 1;
            margin-bottom: 3cqw;
            text-align: left;
        }

        .modal-action-btns {
            display: flex;
            gap: 1cqw;
        }

        .modal-action-btns button {
            flex: 1;
            height: 10cqw;
            border-radius: 2cqw;
            font-size: 3cqw;
            font-weight: 600;
            cursor: pointer;
            border: 0.2cqw solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-main);
        }

        .modal-action-btns .confirm-btn {
            background-color: var(--brand-blue);
            color: white;
            border: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(1cqw);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="phone-wrapper">
        <div id="buyerView" style="display: block;">
            <header class="header">
                <div class="pace-logo">
                    <a href="index.html" class="logo-link">
                        <img src="png/pace3.png" alt="派思 官方網站">
                    </a>
                    <div class="pace-avatar-icon">
                        <span id="defaultIcon" class="avatar-icon">👤</span>
                        <img id="userAvatarImg" src=""
                            style="display: none; border-radius: 50%;height: 13cqw; width: 13cqw;">
                    </div>
                </div>
                <div class="two">
                    <div class="pace">
                        <button class="theme-toggle" id="themeToggleBtn" aria-label="切換主題">🌙</button>
                        <span>店內價外帶自取/點餐系統</span>
                    </div>
                    <button class="login-btn" id="loginBtn">登入/註冊</button>
                    <button class="user-avatar-btn" id="avatarBtn" style="display: none;">
                        <span class="user-name" id="userNameDisplay"></span></button>
                    <div class="dropdown-menu" id="dropdownMenu"></div>
                </div>
            </header>
            <div class="input-group">
                <label>店鋪聯絡電話</label>
                <input type="tel" id="shopPhone" class="input-style" placeholder="請輸入店鋪或老闆的手機號碼(必填)" pattern="[0-9]{9,10}">
            </div>
            <div class="input-group">
                <label>店鋪招牌與名稱</label>
                <div class="shop-name-block" style="display: flex; gap: 1cqw; align-items: center;">
                    <div class="shop-logo-box" id="shopLogoBox"
                        style="width: 17cqw; height: 17cqw; border: 0.2cqw dashed var(--border-color); border-radius: 2cqw; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                        <input type="file" id="shopLogoInput" class="image-input" accept="image/*"
                            style="display: none;">
                        <img id="shopLogoPreview" class="preview-img" src=""
                            style="display: none; width: 100%; height: 100%; object-fit: contain; border-radius: 2cqw; position: absolute;">
                        <div class="upload-placeholder">📸<span>上傳招牌</span></div>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 1cqw; flex-grow: 1;">
                        <input type="text" id="shopName" class="input-style" placeholder="請輸入店鋪招牌名稱(必填)">
                        <div style="display: flex; gap: 1cqw;">
                            <select id="citySelect" class="input-style" data-action-change="citySelect">
                                <option value="">選擇縣市</option>
                                <option value="臺北市">臺北市</option>
                                <option value="新北市">新北市</option>
                                <option value="基隆市">基隆市</option>
                                <option value="桃園市">桃園市</option>
                                <option value="新竹市">新竹市</option>
                                <option value="新竹縣">新竹縣</option>
                                <option value="苗栗縣">苗栗縣</option>
                                <option value="台中市">台中市</option>
                                <option value="彰化縣">彰化縣</option>
                                <option value="南投縣">南投縣</option>
                                <option value="雲林縣">雲林縣</option>
                                <option value="嘉義市">嘉義市</option>
                                <option value="嘉義縣">嘉義縣</option>
                                <option value="台南市">台南市</option>
                                <option value="高雄市">高雄市</option>
                                <option value="屏東縣">屏東縣</option>
                                <option value="宜蘭縣">宜蘭縣</option>
                                <option value="花蓮縣">花蓮縣</option>
                                <option value="臺東縣">臺東縣</option>
                                <option value="澎湖縣">澎湖縣</option>
                                <option value="金門縣">金門縣</option>
                                <option value="連江縣">連江縣</option>
                            </select>
                            <select id="districtSelect" class="input-style" data-action-change="districtSelect">
                                <option value="">選擇區域</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="input-group">
                <label>詳細地址</label>
                <input type="text" id="shopAddress" class="input-style" placeholder="請輸入巷弄門牌(必填)">
            </div>
            <div class="input-group">
                <label>如未自動轉換座標請手動查詢輸入</label>
                <div class="coords-row">
                    <button type="button" class="query-btn"
                        onclick="window.open('https://www.google.com.tw/maps')">查詢座標</button>
                    <input type="number" id="shopLat" class="input-style" placeholder="緯度 (Lat,25...)" step="any"
                        min="-90" max="90">
                    <input type="number" id="shopLng" class="input-style" placeholder="經度 (Lng,121...)" step="any"
                        min="-180" max="180">
                </div>
            </div>
            <div class="input-group">
                <label>店家邀請碼 (選填)</label>
                <input type="text" id="shopInviteCode" class="input-style" placeholder="若有專屬邀請碼請輸入">
            </div>
            <div class="input-group">
                <label>平均餐點準備時間 (預設為15分鐘)</label>
                <input type="number" id="prepareTimeInput" class="input-style" value="15" min="1">
            </div>
            <div class="form-section">
                <div class="section-title">支援藍新金流 API(每筆交易需支付藍新金流手續費，非平台收取)</div>
                <div class="switch-row">
                    <div>
                        <div>線上刷卡 / LINE Pay</div><small>安全防護最高，買家先付款才接單</small>
                    </div>
                    <label class="toggle-switch"><input type="checkbox" id="toggleOnline"><span
                            class="slider"></span></label>
                </div>
                <div class="input-group newebpay-box" id="newebpayContainer" style="display: none;"></div>
                <div class="switch-row">
                    <div>
                        <div>現場付現</div><small>開啟現場付款，需自行承擔未取貨風險</small>
                    </div>
                    <label class="toggle-switch"><input type="checkbox" id="toggleCash"><span
                            class="slider"></span></label>
                </div>
                <div class="seating">
                    <label class="seatingtoggle-switch"><input type="checkbox" class="seatingtoggle" id="seatingtoggle">
                        <span class="toggle-slider">
                            <span class="on-text">開放中</span>
                            <span class="off-text">無提供</span>
                        </span>
                    </label>
                    <span style="font-size: 4cqw; font-weight: 600; line-height: 1;">
                        是否有提供內用座位
                    </span>
                </div>
            </div>
            <div class="form-section">
                <div class="section-title">菜單商品上架</div>
                <div class="menu-upload-list" id="menuUploadList">
                    <div class="menu-item-row">
                        <div class="menu-item">
                            <div class="img-upload-box" id="uploadBox">
                                <input type="file" id="imageInput" class="image-input" accept="image/*"
                                    style="display: none;">
                                <img class="preview-img" src=""
                                    style="display: none; position: absolute; width: 100%; height: 100%; object-fit: contain; border-radius: 2cqw;">
                                <div class="upload-placeholder"
                                    style="font-size: 8cqw;  width: 17cqw; height: 17cqw; border: 0.2cqw dashed var(--border-color); border-radius: 2cqw; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                                    📷<span>上傳照片</span></div>
                            </div>
                            <div class="item-fields" style="width: 100%; gap: 0.5cqw;">
                                <input type="text" class="input-style item-name-input"
                                    style="height:8cqw; width: 100%; padding: 0 2cqw;" placeholder="品項名稱(必填)" required>
                                <div class="price-input-wrapper">
                                    <span class="price-symbol">$</span>
                                    <input type="number" class="input-style price-input"
                                        style="height:8cqw; width: 100%;padding-left:5cqw;" placeholder="金額(必填)" min="0"
                                        required>
                                </div>
                            </div>
                            <button type="button" class="new-size">如需規格</button>
                            <div class="item-right-ctrls"
                                style="gap: 0.5cqw; display: flex; flex-direction: column; justify-content: center;">
                                <div class="drag-handle"
                                    style="width: 8cqw; height: 8cqw; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 3cqw; cursor: grab;">
                                    ☰</div>
                                <button type="button" class="del-row-btn"
                                    style="width: 8cqw; height: 8cqw; display: flex; align-items: center; justify-content: center; font-size: 3cqw;">❌</button>
                            </div>
                        </div>
                        <div class="new-size-price"
                            style="display: none; height: 8cqw; width: 100%; flex-direction: row; justify-content: space-around; gap: 1cqw;">
                            <div class="price-input-wrapper">
                                <span class="price-symbol">大$</span>
                                <input type="number" class="input-style price-input-large"
                                    style="height:8cqw; flex: 1;padding-left:7cqw;" placeholder="金額(必填)" min="0"
                                    required>
                            </div>
                            <div class="price-input-wrapper">
                                <span class="price-symbol">中$</span>
                                <input type="number" class="input-style price-input-medium"
                                    style="height:8cqw; flex: 1;padding-left:7cqw;" placeholder="金額" min="0">
                            </div>
                            <div class="price-input-wrapper">
                                <span class="price-symbol">小$</span>
                                <input type="number" class="input-style price-input-small"
                                    style="height:8cqw; flex: 1;padding-left:7cqw;" placeholder="金額(必填)" min="0"
                                    required>
                            </div>
                        </div>
                        <div class="remark" style="width: 100%; gap: 1cqw">
                            <input type="text" class="input-style item-note-input" style="height: 8cqw; max-width: 80%;"
                                placeholder="備註">
                            <label class="menu-soldout-switch"><input type="checkbox" class="menu-soldout-toggle"
                                    id="menu-soldout-toggle" checked>
                                <span class="toggle-slider">
                                    <span class="on-text">販售中</span>
                                    <span class="off-text">暫停</span>
                                </span>
                            </label>
                        </div>
                    </div>
                </div>
                <button type="button" class="add-row-btn" id="addItemRowBtn" style="width: 100%; height: 10cqw;">＋
                    新增下一個品項</button>
                <footer class="footer-action">
                    <button class="submit-btn" data-action="shopSubmitBtn" id="shopSubmitBtn" type="submit">建立店鋪</button>
                </footer>
            </div>
            <div class="lightbox-modal" id="cashWarningModal" style="display: none;">
                <div class="modal-card">
                    <div class="modal-title">⚠️ 開啟現場付現風險提示</div>
                    <div class="modal-desc">
                        您正準備開啟「現場付現」功能。請注意，若遇到買家蓄意棄單、逾時未取，相關食材與營業損失需由店鋪自行全額吸收。請問是否同意此條款？
                    </div>
                    <div class="modal-action-btns">
                        <button class="cancel-btn" id="warningCancelBtn">不同意</button>
                        <button class="confirm-btn" id="warningConfirmBtn">我同意</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCHDVR703MLCYGLAi_TtFdDM1gaauKV8sQ&libraries=geocoding&language=zh-TW&loading=async"
        async defer>
        </script>
    <script type="module" src="app.js"></script>
</body>

</html>
