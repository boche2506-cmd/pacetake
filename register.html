<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PACE 派思 pacetake.tw - 買家首頁</title>
    <!-- Favicon & Apple Touch Icon -->
    <link rel="icon" type="image/png" href="png/logoapple.png" sizes="180x180">
    <link rel="apple-touch-icon" href="png/logoapple.png">
    <link rel="apple-touch-icon" sizes="180x180" href="png/logoapple.png">
    <link rel="apple-touch-icon-precomposed" href="png/logoapple.png">
    <link rel="stylesheet" href="style.css">
    <style>
        /* 填表區域 */
        .phone-wrapper {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden;
            overflow-y: auto;
        }

        .section {
            overflow-y: auto;
        }

        .form-section {
            display: flex;
            flex-direction: column;
        }

        .section-title {
            font-size: 4cqw;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 1cqw;
            text-transform: uppercase;
            padding: 0.5cqw;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 1cqw;
        }

        .input-group label {
            font-size: 4cqw;
            font-weight: 600;
            color: var(--text-main);
            padding: 0.5cqw;
        }

        .input-style {
            width: 100%;
            height: 8cqw;
            color: var(--text-main);
            background-color: var(--bg-global);
            border: 0.2cqw solid var(--border-color);
            border-radius: 2cqw;
            padding: 0 2cqw;
            font-size: 3.5cqw;
            outline: none;
        }

        /* 經緯度區塊 */

        .coords-row {
            display: flex;
            gap: 1cqw;
            align-items: flex-end;
        }

        .query-btn {
            height: 8cqw;
            padding: 0 2cqw;
            font-size: 3cqw;
            background: var(--brand-blue);
            color: white;
            border-radius: 2cqw;
            border: none;
            cursor: pointer;
            white-space: nowrap;
            transition: transform 0.2s;
            /* 按下去會有一點點回饋感 */
        }

        .query-btn:active {
            transform: scale(0.95);
            /* 按下去變小一點，模擬點擊感 */
        }

        /* 👑 招牌圖片與店鋪名稱並排排版 */
        .shop-name-block {
            display: flex;
            gap: 1cqw;
            align-items: center;
            width: 100%;
        }

        .shop-logo-box {
            width: 17cqw;
            height: 17cqw;
            border-radius: 2cqw;
            border: 0.2cqw dashed var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 8cqw;
            background-color: var(--bg-global);
            cursor: pointer;
            color: var(--text-muted);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .shop-logo-box span {
            font-size: 4cqw;
            font-weight: 500;
            margin-top: 1cqw;
        }

        /* 縣市區域並排選單 */
        .select-row {
            display: flex;
            gap: 1cqw;
        }

        .select-row select {
            flex: 1;
        }

        /* 金流切換防禦線排版 */
        .switch-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 2cqw;
            padding: 2cqw;
            color: var(--text-muted);
            background-color: var(--bg-global);
            border: 0.2cqw solid var(--border-color);
            font-size: 4cqw;
        }

        /* 原生滑動開關器 */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 11cqw;
            height: 6cqw;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #CBD5E1;
            transition: .2s;
            border-radius: 6cqw;
        }

        .slider::before {
            position: absolute;
            content: "";
            height: 4cqw;
            width: 4cqw;
            left: 1cqw;
            bottom: 1cqw;
            background-color: white;
            transition: .2s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: var(--brand-blue);
        }

        input:checked+.slider::before {
            transform: translateX(5cqw);
        }

        /* 藍新金流隱藏區塊 */
        .newebpay-box {
            display: none;
            animation: fadeIn 0.2s ease;
        }

        /* 菜單動態上架排版 */
        .menu-upload-list {
            display: flex;
            flex-direction: column;
        }

        /* 👑 菜單排版大魔改：單列橫向佈局 */
        .menu-item-row {
            width: 100%;
            display: flex;
            flex-direction: column;
            background-color: var(--card-bg);
            border: 0.2cqw solid var(--border-color);
            border-radius: 2cqw;
            padding: 0.125cqw;
            align-items: center;
            box-shadow: var(--shadow-sm);
            position: relative;
            gap: 0.25cqw;
        }

        .menu-item {
            width: 100%;
            display: flex;
            border-radius: 2cqw;
            padding: 0.125cqw;
            align-items: center;
            gap: 0.5cqw;
        }

        .remark {
            width: 100%;
            display: flex;
            justify-content: space-between;
            flex-direction: row;
            border-radius: 2cqw;
            padding: 0.125cqw;
            align-items: center;
            gap: 0.5cqw;
        }

        .seating {
            width: 100%;
            height: 8cqw;
            display: flex;
            justify-content: flex-start;
            flex-direction: row;
            align-items: center;
            gap: 1cqw;
            color: var(--text-main);
            background-color: var(--bg-global);
            border: 0.2cqw solid var(--border-color);
            border-radius: 2cqw;
            padding: 0 2cqw;
            font-size: 4cqw;
        }

        .seatingtoggle-switch,
        .menu-soldout-switch {
            position: relative;
            display: inline-block;
            width: 20%;
            height: 7cqw;
        }

        .seatingtoggle-switch input,
        .menu-soldout-switch input {
            display: none;
        }

        .menu-soldout-switch .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ff4d4f;
            /* 綠色 */
            border-radius: 7cqw;
            transition: 0.4s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3.25cqw;
            font-weight: bold;
        }

        .menu-soldout-switch .toggle-slider::before {
            position: absolute;
            content: "";
            height: 5cqw;
            width: 5cqw;
            right: 1.375cqw;
            /* 圓圈初始在左邊 */
            bottom: 1cqw;
            background-color: white;
            border-radius: 50%;
            transition: 0.4s;
        }

        .seatingtoggle-switch .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ff4d4f;
            /* 綠色 */
            border-radius: 7cqw;
            transition: 0.4s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3.25cqw;
            font-weight: bold;
        }

        .seatingtoggle-switch .toggle-slider::before {
            position: absolute;
            content: "";
            height: 5cqw;
            width: 5cqw;
            right: 1.5cqw;
            /* 圓圈初始在左邊 */
            bottom: 1cqw;
            background-color: white;
            border-radius: 50%;
            transition: 0.4s;
        }

        .menu-soldout-switch .off-text {
            display: block;
            margin-right: 6cqw;
            /* 把字往右擠，閃開左邊的白圈圈 */
        }

        .seatingtoggle-switch .off-text {
            display: block;
            margin-right: 6cqw;
            /* 把字往右擠，閃開左邊的白圈圈 */
        }

        .seatingtoggle-switch .on-text,
        .menu-soldout-switch .on-text {
            display: none;
        }

        /* 6. 勾選狀態 (變綠色、圓圈右移、文字替換) */
        .seatingtoggle:checked+.toggle-slider,
        .menu-soldout-toggle:checked+.toggle-slider {
            background-color: #52c41a;
            /* 變成綠色 */
        }

        .seatingtoggle:checked+.toggle-slider::before,
        .menu-soldout-toggle:checked+.toggle-slider::before {
            transform: translateX(-10.5cqw);
            /* 把白圈圈推到最右邊 (75 - 22 - 8 = 45) */
        }

        .seatingtoggle:checked+.toggle-slider .off-text,
        .menu-soldout-toggle:checked+.toggle-slider .off-text {
            display: none;
            /* 隱藏販售中 */
        }

        .seatingtoggle:checked+.toggle-slider .on-text,
        .menu-soldout-toggle:checked+.toggle-slider .on-text {
            display: block;
            /* 顯示暫停 */
            margin-left: 6cqw;
            /* 把字往左擠，閃開右邊的白圈圈 */
        }

        .img-upload-box {
            width: 17cqw;
            height: 17cqw;
            border-radius: 2cqw;
            border: 0.2cqw dashed var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 8cqw;
            font-weight: 500;
            background-color: var(--bg-global);
            cursor: pointer;
            color: var(--text-muted);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .upload-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .img-upload-box span {
            font-size: 4cqw;
            font-weight: 500;
            margin-top: 1cqw;
        }

        .item-fields {
            display: flex;
            flex-direction: column;
            min-width: 0;
            /* 防止輸入框爆開 */
        }

        .price-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .price-symbol {
            position: absolute;
            left: 2cqw;
            font-size: 3cqw;
            font-weight: 600;
            color: var(--text-muted);
        }

        .price-input {
            padding-left: 5cqw;
        }

        .new-size {
            height: 17cqw;
            width: 8cqw;
            color: var(--text-muted);
            background-color: var(--bg-global);
            border: 0.2cqw solid var(--border-color);
            font-size: 3.5cqw;
            font-weight: 500;
            padding: 0.5cqw;
            border-radius: 2cqw;
            cursor: pointer;
            line-height: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;

        }

        /* 👑 刪除與排序移到右側控制區 */
        .item-right-ctrls {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .del-row-btn {
            background-color: var(--bg-global);
            border: 0.2cqw solid var(--border-color);
            color: var(--brand-red);
            font-size: 3cqw;
            font-weight: 600;
            padding: 1.5cqw 2cqw;
            border-radius: 2cqw;
            cursor: pointer;
            white-space: nowrap;
            transition: transform 0.2s;
            /* 按下去會有一點點回饋感 */
        }

        .del-row-btn:active {
            transform: scale(0.95);
            /* 按下去變小一點，模擬點擊感 */
        }

        .drag-handle {
            font-size: 3cqw;
            font-weight: 600;
            color: var(--text-muted);
            background-color: var(--bg-global);
            border: 0.2cqw solid var(--border-color);
            padding: 1.5cqw 2cqw;
            border-radius: 2cqw;
            cursor: grab;
            white-space: nowrap;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        .add-row-btn {
            background-color: var(--bg-global);
            border: 0.2cqw solid var(--border-color);
            color: var(--brand-blue);
            height: 10cqw;
            border-radius: 2cqw;
            font-size: 4cqw;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 1cqw;
            transition: transform 0.2s;
            /* 按下去會有一點點回饋感 */
        }

        .add-row-btn:active {
            background-color: var(--border-color);
            transform: scale(0.95);
        }

        .footer-action {
            bottom: 0;
            left: 0;
            right: 0;
            padding: 2cqw;
            background-color: var(--bg-Container);
            border-top: 0.2cqw solid var(--border-color);
        }

        /* 底部註冊大鈕 */
        .submit-btn {
            background-color: var(--brand-blue);
            color: white;
            border: none;
            width: 100%;
            height: 12cqw;
            border-radius: 5cqw;
            font-size: 4cqw;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 1cqw 4cqw rgba(0, 102, 255, 0.3);
            transition: transform 0.2s;
            /* 按下去會有一點點回饋感 */
        }

        .submit-btn:active {
            transform: scale(0.95);
            /* 按下去變小一點，模擬點擊感 */
        }

        .submit-btn:disabled {
            background-color: var(--text-muted);
            box-shadow: none;
            cursor: not-allowed;
        }

        .modal-desc {
            font-size: 5cqw;
            color: var(--text-main);
            line-height: 1;
            word-break: break-all;
            background-color: var(--bg-global);
            padding: 1cqw;
            border-radius: 2cqw;
            border: 0.2cqw solid var(--border-color);
            text-align: left;
        }

        .modal-action-btns {
            display: flex;
            gap: 1cqw;
        }

        .modal-action-btns button {
            flex: 1;
            height: 10cqw;
            border-radius: 2cqw;
            font-size: 3cqw;
            font-weight: 600;
            cursor: pointer;
            border: 0.2cqw solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-main);
        }

        .modal-action-btns .confirm-btn {
            background-color: var(--brand-blue);
            color: white;
            border: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(1cqw);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="phone-wrapper">
        <div id="buyerView" style="display: block;">
            <header class="header">
                <div class="pace-logo">
                    <a href="index.html" class="logo-link">
                        <img src="png/pace3.png" alt="派思 官方網站">
                    </a>
                    <div class="avatar-container">
                        <span id="defaultIcon">👤</span>
                        <img id="userAvatarImg" src=""
                            style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;"
                            onerror="this.style.display='none'; document.getElementById('defaultIcon').style.display='block';">
                    </div>
                </div>
                <div class="two">
                    <div class="pace">
                        <button class="theme-toggle" id="themeToggleBtn" aria-label="切換主題">🌙</button>
                        <span>店內價外帶自取/點餐系統</span>
                    </div>
                    <div class="avatarBtnMenu" data-action="avatarBtnMenu">
                        <span class="user-name" id="userNameDisplay"></span>
                        <div class="dropdown-menu" id="dropdownMenu"></div>
                    </div>
                </div>
            </header>
            <div class="input-group">
                <label>店鋪聯絡電話</label>
                <input type="tel" id="shopPhone" class="input-style" placeholder="請輸入店鋪或老闆的手機號碼(必填)"
                    pattern="[0-9]{9,10}">
            </div>
            <div class="input-group">
                <label>店鋪招牌與名稱(請使用1:1圖片)</label>
                <div class="shop-name-block" style="display: flex; gap: 1cqw; align-items: center;">
                    <div class="shop-logo-box" id="shopLogoBox"
                        style="width: 17cqw; height: 17cqw; border: 0.2cqw dashed var(--border-color); border-radius: 2cqw; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                        <input type="file" id="shopLogoInput" class="image-input" accept="image/*"
                            style="display: none;">
                        <img id="shopLogoPreview" class="preview-img" src=""
                            style="display: none; width: 100%; height: 100%; object-fit: cover; border-radius: 2cqw; position: absolute;">
                        <div class="upload-placeholder">📸<span>上傳招牌</span></div>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 1cqw; flex-grow: 1;">
                        <input type="text" id="shopName" class="input-style" placeholder="請輸入店鋪招牌名稱(必填)">
                        <div style="display: flex; gap: 1cqw;">
                            <select id="citySelect" class="input-style" data-action-change="citySelect">
                                <option value="">選擇縣市</option>
                                <option value="臺北市">臺北市</option>
                                <option value="新北市">新北市</option>
                                <option value="基隆市">基隆市</option>
                                <option value="桃園市">桃園市</option>
                                <option value="新竹市">新竹市</option>
                                <option value="新竹縣">新竹縣</option>
                                <option value="苗栗縣">苗栗縣</option>
                                <option value="台中市">台中市</option>
                                <option value="彰化縣">彰化縣</option>
                                <option value="南投縣">南投縣</option>
                                <option value="雲林縣">雲林縣</option>
                                <option value="嘉義市">嘉義市</option>
                                <option value="嘉義縣">嘉義縣</option>
                                <option value="台南市">台南市</option>
                                <option value="高雄市">高雄市</option>
                                <option value="屏東縣">屏東縣</option>
                                <option value="宜蘭縣">宜蘭縣</option>
                                <option value="花蓮縣">花蓮縣</option>
                                <option value="臺東縣">臺東縣</option>
                                <option value="澎湖縣">澎湖縣</option>
                                <option value="金門縣">金門縣</option>
                                <option value="連江縣">連江縣</option>
                            </select>
                            <select id="districtSelect" class="input-style" data-action-change="districtSelect">
                                <option value="">選擇區域</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="input-group">
                <label>詳細地址</label>
                <input type="text" id="shopAddress" class="input-style" placeholder="請輸入巷弄門牌(必填)">
            </div>
            <div class="input-group">
                <label>如未自動轉換座標請手動查詢輸入</label>
                <div class="coords-row">
                    <button type="button" class="query-btn"
                        onclick="window.open('https://www.google.com.tw/maps')">查詢座標</button>
                    <input type="number" id="shopLat" class="input-style" placeholder="緯度 (Lat,25...)" step="any"
                        min="-90" max="90">
                    <input type="number" id="shopLng" class="input-style" placeholder="經度 (Lng,121...)" step="any"
                        min="-180" max="180">
                </div>
            </div>
            <div class="input-group">
                <label>店家邀請碼 (選填)</label>
                <input type="text" id="shopInviteCode" class="input-style" placeholder="若有專屬邀請碼請輸入">
            </div>
            <div class="input-group">
                <label>平均餐點準備時間 (預設為15分鐘)</label>
                <input type="number" id="prepareTimeInput" class="input-style" value="15" min="1">
            </div>
            <div class="form-section">
                <div class="section-title">支援藍新金流 API(每筆交易需支付藍新金流手續費，非平台收取)</div>
                <div class="switch-row">
                    <div>
                        <div>線上刷卡 / LINE Pay</div><small>安全防護最高，買家先付款才接單</small>
                    </div>
                    <label class="toggle-switch"><input type="checkbox" id="toggleOnline"><span
                            class="slider"></span></label>
                </div>
                <div class="input-group newebpay-box" id="newebpayContainer" style="display: none;"></div>
                <div class="switch-row">
                    <div>
                        <div>現場付現</div><small>開啟現場付款，需自行承擔未取貨風險</small>
                    </div>
                    <label class="toggle-switch"><input type="checkbox" id="toggleCash"><span
                            class="slider"></span></label>
                </div>
                <div class="seating">
                    <label class="seatingtoggle-switch"><input type="checkbox" class="seatingtoggle" id="seatingtoggle">
                        <span class="toggle-slider">
                            <span class="on-text">開放中</span>
                            <span class="off-text">無提供</span>
                        </span>
                    </label>
                    <span style="font-size: 4cqw; font-weight: 600; line-height: 1;">
                        是否有提供內用座位
                    </span>
                </div>
            </div>
            <div class="form-section">
                <div class="section-title">菜單商品上架(請使用1:1圖片)</div>
                <div class="menu-upload-list" id="menuUploadList">
                    <div class="menu-item-row">
                        <div class="menu-item">
                            <div class="img-upload-box" id="uploadBox">
                                <input type="file" id="imageInput" class="image-input" accept="image/*"
                                    style="display: none;">
                                <img class="preview-img" src=""

            const urlParams = new URLSearchParams(window.location.search);
            const storeId = urlParams.get('storeId');
            console.log("[PACE] Initializing Register Page Logic...");
            if (storeId) {
                console.log("偵測到 storeId，進入編輯模式:", storeId);
                try {
                    // 2. 從 Firebase 讀取該店家的資料
                    const storeDoc = await getDoc(doc(db, "stores", storeId));
                    if (storeDoc.exists()) {
                        fillShopFormData(storeDoc.data());
                        submitBtn.dataset.mode = 'edit';
                        submitBtn.dataset.storeId = storeId;
                        submitBtn.innerText = "儲存修改";
                    }
                } catch (error) {
                    console.error("編輯模式讀取失敗:", error);
                }

                console.log("未偵測到 storeId，進入新增模式");

                submitBtn.dataset.mode = 'create';

            document.getElementById('shopName').value = data.shopName || '';

            document.getElementById('districtSelect').value = data.district || '';
            document.getElementById('shopAddress').value = data.detailAddress || '';
            document.getElementById('shopLat').value = data.shopLat || '';
            document.getElementById('shopLng').value = data.shopLng || '';

            document.getElementById('toggleOnline').checked = !!data.isOnlinePayEnabled;
            document.getElementById('seatingtoggle').checked = !!data.hasSeating;
        }

        function getShopFormData() {
            return {
                name: document.getElementById('shopName')?.value.trim(),
                phone: document.getElementById('shopPhone')?.value.trim(),

                district: document.getElementById('districtSelect')?.value,

                lat: document.getElementById('shopLat')?.value.trim() || '',
                lng: document.getElementById('shopLng')?.value.trim() || '',

            };

        // 這個函式負責把表單資料變成要存入資料庫的格式
        function getShopDataForDatabase(ShopFormData, userUid, inviteCode, shopLogoData, isEditMode = false) {
            const data = {
                shopName: ShopFormData.name,
                shopPhone: ShopFormData.phone,
                city: ShopFormData.city,
                district: ShopFormData.district,
                detailAddress: ShopFormData.detailAddress,
                shopAddress: `${ShopFormData.city}${ShopFormData.district}${ShopFormData.detailAddress}`,
                shopLat: ShopFormData.lat,
                shopLng: ShopFormData.lng,
                inviteCode: inviteCode,
                status: ShopFormData.status,
                shopLogo: shopLogoData,
                prepareTime: ShopFormData.prepareTime,
                isOnlinePayEnabled: ShopFormData.isOnlinePayEnabled,
                isCashPayEnabled: ShopFormData.isCashPayEnabled,
                HashIV: ShopFormData.hashIvValue,
                HashKey: ShopFormData.hashKeyValue,
                MerchantID: ShopFormData.merchantIdValue,
                hasSeating: ShopFormData.hasSeating
            };
            // 只有在「新增」時才需要寫入這些欄位
            if (!isEditMode) {
                data.sellerUid = userUid;
                data.createdAt = new Date().toISOString();
            }
            return data;

        // 監聽詳細地址輸入框，當離開欄位時自動查詢

            if (!window.location.pathname.includes('register.html')) return;
            console.log("[PACE] Initializing Register Page Logic...");
            const addressInput = document.getElementById('shopAddress');
            addressInput?.addEventListener('blur', async () => {
                const city = document.getElementById('citySelect').value;
                const district = document.getElementById('districtSelect').value;
                const detail = document.getElementById('shopAddress').value.trim();
                if (!city || !district || !detail) return;
                const fullAddress = `${city}${district}${detail}`;
                console.log("[PACE] 使用 Google API 查詢：", fullAddress);
                // 初始化 Google Geocoder
                const geocoder = new google.maps.Geocoder();
                geocoder.geocode({ 'address': fullAddress }, (results, status) => {
                    if (status === 'OK') {
                        const location = results[0].geometry.location;
                        // 填入經緯度欄位
                        document.getElementById('shopLat').value = location.lat();
                        document.getElementById('shopLng').value = location.lng();
                        console.log("[PACE] Google 定位成功！");
                    } else {
                        console.warn("[PACE] Google 定位失敗，狀態：" + status);
                    }
                });
            });

            function makeItemDraggable(row) {

                if (!handle) return;
                handle.addEventListener('mousedown', (e) => startDrag(e, row));
                handle.addEventListener('touchstart', (e) => startDrag(e, row), { passive: false });
            }
            function startDrag(e, row) {
                if (e.cancelable) e.preventDefault();
                activeDragItem = row;
                row.style.transform = 'scale(1.02)'; // 微放大
                row.style.boxShadow = '0 10px 20px rgba(0,0,0,0.2)'; // 浮起來的陰影
                row.style.zIndex = '500';
                row.style.transition = 'transform 0.2s, box-shadow 0.2s'; // 平滑動畫
                row.style.border = '0.2cqw dashed var(--brand-blue)';
                if (e.type.startsWith('touch')) {
                    window.addEventListener('touchmove', onDragMove, { passive: false });
                    window.addEventListener('touchend', onDragEnd);
                } else {
                    window.addEventListener('mousemove', onDragMove);
                    window.addEventListener('mouseup', onDragEnd);
                }
            }
            function onDragMove(e) {
                if (!activeDragItem || !menuUploadList) return;
                if (e.cancelable) e.preventDefault();
                const clientY = e.type.startsWith('touch') ? e.touches[0].clientY : e.clientY;
                requestAnimationFrame(() => {
                    const siblings = [...menuUploadList.querySelectorAll('.menu-item-row')].filter(el => el !== activeDragItem);
                    const nextSibling = siblings.find(sibling => {
                        const box = sibling.getBoundingClientRect();
                        return clientY <= box.top + box.height / 2;
                    });
                    if (nextSibling && activeDragItem !== nextSibling) {
                        menuUploadList.insertBefore(activeDragItem, nextSibling);
                    } else if (!nextSibling && activeDragItem !== menuUploadList.lastElementChild) {
                        menuUploadList.appendChild(activeDragItem);
                    }
                });
            }
            function onDragEnd() {
                if (!activeDragItem) return;
                activeDragItem.style.transform = 'scale(1)';
                activeDragItem.style.boxShadow = 'none';
                activeDragItem.style.opacity = '1';
                activeDragItem.style.border = '0.2cqw solid var(--border-color)';
                activeDragItem = null;
                window.removeEventListener('mousemove', onDragMove);
                window.removeEventListener('mouseup', onDragEnd);
                window.removeEventListener('touchmove', onDragMove);
                window.removeEventListener('touchend', onDragEnd);
            }

                                <span class="price-symbol">中$</span>
                                <input type="number" class="input-style price-input-medium"
                                    style="height:8cqw; flex: 1;padding-left:7cqw;" placeholder="金額" min="0">
                            </div>
                            <div class="price-input-wrapper">
                                <span class="price-symbol">小$</span>
                                <input type="number" class="input-style price-input-small"
                                    style="height:8cqw; flex: 1;padding-left:7cqw;" placeholder="金額(必填)" min="0"
                                    required>
                            </div>
                        </div>
                        <div class="remark" style="width: 100%; gap: 1cqw">
                            <input type="text" class="input-style item-note-input" style="height: 8cqw; max-width: 80%;"
                                placeholder="備註">
                            <label class="menu-soldout-switch"><input type="checkbox" class="menu-soldout-toggle"
                                    checked>
                                <span class="toggle-slider">
                                    <span class="on-text">販售中</span>
                                    <span class="off-text">暫停</span>
                                </span>
                            </label>
                        </div>`;
                menuUploadList.appendChild(newRow);
                makeItemDraggable(newRow);
            });
        }
        // 菜單文件
        async function refreshMenu(storeId, menuItems) {
            const menuCollectionRef = collection(db, "stores", storeId, "menu");
            // 1. 取得該店目前的舊菜單文件
            const querySnapshot = await getDocs(menuCollectionRef);
            // 2. 建立刪除任務 (同時執行，速度很快)
            const deletePromises = querySnapshot.docs.map(docSnapshot => deleteDoc(docSnapshot.ref));
            await Promise.all(deletePromises);
            console.log("舊菜單已清空");
            // 3. 建立寫入任務 (將最新的 menuItems 寫入)
            const addPromises = menuItems.map(item => addDoc(menuCollectionRef, item));
            await Promise.all(addPromises);
            console.log("新菜單已同步");
        }
        // 直接在整個網頁範圍監聽 change
        document.addEventListener('change', (e) => {
            // 如果觸發的是 .image-input
            if (e.target.classList.contains('image-input')) {
                const input = e.target;
                const box = input.closest('.img-upload-box, .shop-logo-box');
                if (!box) return;
                const file = input.files[0];
                if (!file) return;
                const img = box.querySelector('.preview-img');
                const reader = new FileReader();
                reader.onload = (event) => {
                    const tempImg = new Image();
                    tempImg.src = event.target.result;
                    tempImg.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        const scaleSize = MAX_WIDTH / tempImg.width;
                        canvas.width = tempImg.width > MAX_WIDTH ? MAX_WIDTH : tempImg.width;
                        canvas.height = tempImg.width > MAX_WIDTH ? tempImg.height * scaleSize : tempImg.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(tempImg, 0, 0, canvas.width, canvas.height);
                        if (img) {
                            img.src = canvas.toDataURL('image/jpeg', 0.7);
                            img.style.display = 'block';
                        }
                    };
                };
                reader.readAsDataURL(file);
            }
        });
        // . 現金警告邏輯 (事件委派)
        const toggleCash = document.getElementById('toggleCash');
        const cashWarningModal = document.getElementById('cashWarningModal');
        const warningConfirmBtn = document.getElementById('warningConfirmBtn');
        const warningCancelBtn = document.getElementById('warningCancelBtn');
        const toggleOnline = document.getElementById('toggleOnline');
        const newebpayContainer = document.getElementById('newebpayContainer');
        if (toggleCash) {
            toggleCash.checked = false;
            toggleCash.addEventListener('click', (e) => {
                if (toggleCash.checked) {
                    toggleCash.checked = false;
                    e.preventDefault();
                    if (cashWarningModal) cashWarningModal.style.display = 'flex';
                }
            });
        }
        document.addEventListener('click', (e) => {
            if (e.target.id === 'warningConfirmBtn') {
                if (toggleCash) toggleCash.checked = true;
                if (cashWarningModal) cashWarningModal.style.display = 'none';
            } else if (e.target.id === 'warningCancelBtn') {
                if (toggleCash) toggleCash.checked = false;
                if (cashWarningModal) cashWarningModal.style.display = 'none';
            }
        });
        toggleOnline?.addEventListener('change', function () {
            if (newebpayContainer) newebpayContainer.style.display = this.checked ? 'block' : 'none';
        });
        if (newebpayContainer) {
            newebpayContainer.innerHTML = `
                    <label style="display:block; font-size:4cqw; font-weight:600;">🔒 藍新金流 API 開發參數設定</label>
                    <div style="display:flex; flex-direction:column; gap:0.5cqw;">
                        <input type="text" id="merchantIdInput" class="input-style" style="height:8cqw;" placeholder="請輸入 商店代號 (MerchantID)">
                        <input type="text" id="hashKeyInput" class="input-style" style="height:8cqw;" placeholder="請輸入 HashKey">
                        <input type="text" id="hashIvInput" class="input-style" style="height:8cqw;" placeholder="請輸入 HashIV">
                    </div>
                    `;
        }
        // Listener'click'
        document.addEventListener('click', async (e) => {
            const target = e.target.closest('[data-action]');
            if (!target) return;
            const action = target.getAttribute('data-action');
            // shopSubmitBtn 監聽與手動提交邏輯
            if (action === 'shopSubmitBtn') {
                // 取得按鈕上的標籤來判斷要做什麼
                const btn = document.getElementById('submitBtn');
                const mode = btn.dataset.mode || 'create'; // 加上預設值，確保即使沒設也能跑新增
                const storeId = btn.dataset.storeId; // 只有編輯模式才會有值參數，新增用當前 UID
                const ShopFormData = getShopFormData();
                // --- 菜單打包 ---
                const menuRows = document.querySelectorAll('.menu-item-row');
                const menuItems = [];
                menuRows.forEach((row) => {
                    const toggle = row.querySelector('.menu-soldout-toggle');
                    const supply = toggle ? toggle.checked : true; // 預設為 true (有貨)
                    const nameVal = row.querySelector('.item-name-input').value.trim();
                    if (!nameVal) return;
                    const isSizeMode = row.querySelector('.new-size-price').style.display === 'flex';
                    let itemObj = {
                        name: nameVal,
                        supply: supply,
                        note: row.querySelector('.item-note-input').value.trim(),
                        image: row.querySelector('.preview-img').src
                    };
                    if (isSizeMode) {
                        itemObj.priceType = 'multi';
                        itemObj.prices = {
                            large: row.querySelector('.price-input-large').value,
                            medium: row.querySelector('.price-input-medium').value,
                            small: row.querySelector('.price-input-small').value
                        };
                    } else {
                        itemObj.priceType = 'single';
                        itemObj.price = parseInt(row.querySelector('.price-input').value) || 0;
                    }
                    menuItems.push(itemObj);
                });
                const lat = document.getElementById('shopLat')?.value.trim();
                const lng = document.getElementById('shopLng')?.value.trim();
                if (!lat || !lng) {
                    alert("⚠️ 請先確認店鋪經緯度！若無法自動取得，請點擊「查詢座標」按鈕手動輸入，確保定位正確喔！");
                    document.getElementById('shopLat')?.focus();
                    return; // 直接中斷，不往下執行
                }
                const user = auth.currentUser;
                if (!user) {
                    alert("⚠️ 請先登入帳號！");
                    return;
                }
                // 先檢查該用戶是否已經是賣家，防止重複開鋪
                try {
                    const userDocRef = doc(db, "users", user.uid);
                    const userDoc = await getDoc(userDocRef);
                    if (userDoc.exists() && userDoc.data().role === "seller") {
                        alert("您已經擁有店舖了，將為您前往賣家後台。");
                        window.location.href = "seller.html";
                        return;
                    }
                } catch (err) {
                    console.error("權限檢查失敗:", err);
                    return;
                }
                // --- 2. 基本資訊與防呆 ---
                if (!ShopFormData.name || !ShopFormData.phone || !ShopFormData.city || !ShopFormData.district || !ShopFormData.detailAddress) {
                    alert("⚠️ 請填寫完整的店舖資訊！");
                    return;
                }
                const logoEl = document.getElementById('shopLogoPreview');
                const shopLogoData = (logoEl && logoEl.style.display !== 'none') ? logoEl.src : "";
                // --- 3. 邀請碼驗證 ---
                const inviteCode = document.getElementById('shopInviteCode')?.value.trim() || '';
                if (inviteCode) {
                    const promoQuery = query(collection(db, "promo_codes"), where("code", "==", inviteCode), where("isActive", "==", true));
                    const querySnapshot = await getDocs(promoQuery);
                    if (querySnapshot.empty) {
                        alert("❌ 無效的邀請碼或已被使用！");
                        return;
                    }
                    const promoDoc = querySnapshot.docs[0];
                    await updateDoc(promoDoc.ref, { isActive: false, usedBy: user.uid });
                }
                btn.disabled = true; // 這裡鎖定按鈕，防止使用者連按
                try {
                    if (mode === 'edit') {
                        // 模式 A：更新既有資料
                        const shopData = getShopDataForDatabase(ShopFormData, user.uid, inviteCode, shopLogoData, true);
                        await updateDoc(doc(db, "stores", storeId), shopData);
                    } else {
                        // 模式 B：新增
                        const shopData = getShopDataForDatabase(ShopFormData, user.uid, inviteCode, shopLogoData, false);
                        await setDoc(doc(db, "stores", user.uid), shopData);
                    }
                    // 1. 處理菜單資料
                    const targetStoreId = (mode === 'edit') ? storeId : user.uid;
                    await refreshMenu(targetStoreId, menuItems);
                    console.log("店家與菜單已成功儲存至子集合！");
                    // 2. 處理角色身分（只在非 admin 時更新）
                    const userRef = doc(db, "users", user.uid);
                    const userSnap = await getDoc(userRef);
                    const userData = userSnap.data();
                    // 只要不是 admin，就一律更新為 seller
                    if (userData?.role !== 'admin')
                        await updateDoc(userRef, { role: "seller" });
                    alert("🎉 開張成功！");
                    window.location.href = "seller.html";
                } catch (dbError) {
                    console.error("提交錯誤:", dbError);
                    alert("系統錯誤：" + dbError.message);
                    btn.disabled = false; // 失敗時恢復按鈕
                }
            }
        });
        document.addEventListener('DOMContentLoaded', () => {
            initRegisterPage();
            setupAddressGeocoder();
            setupMenuManager();
            console.log("系統初始化完成");
        });
    </script>
</body>
