<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PACE 派思 pacetake.tw - 買家首頁</title>
    <!-- PWA 配置 -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#ffffff">
    <!-- 一般網頁分頁圖示 -->
    <link rel="icon" type="image/png" href="png/logo192.png" sizes="192x192">
    <!-- iPhone 桌面圖示專用（已修改為 180x180 正方形） -->
    <link rel="apple-touch-icon" href="png/logo180.png">
    <link rel="stylesheet" href="style.css">
    <style>
        .tabs-container {
            height: 7%;
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: start;
            align-items: center;
            overflow-x: auto;
            color: var(--text-main);
            gap: 1cqw;
            cursor: pointer;
            white-space: nowrap;
            border-bottom: 0.3cqw solid var(--border-color);
        }

        .order-tab {
            display: flex;
            flex-direction: row;
            justify-content: start;
            align-items: center;
            color: var(--text-main);
            flex-shrink: 0;
            background-color: var(--card-bg);
            border: 0.2cqw solid var(--border-color);
            padding: 1cqw 3cqw;
            border-radius: 3cqw;
            font-size: 4cqw;
            font-weight: 600;
        }

        .order-tab.active {
            background-color: var(--brand-blue);
            border-color: var(--brand-blue);
            color: #FFFFFF;
        }

        /* 核心盲操主工作區 */
        .workspace-layout {
            height: 68%;
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: stretch;
        }

        /* 左側連動狀態亮燈區 */
        .lights-sidebar {
            height: 100%;
            width: 25%;
            border-right: 0.2cqw solid var(--border-color);
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
        }

        .light-indicator-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 4px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .light-title {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: bold;
        }

        .light-badge {
            font-size: 11px;
            font-weight: 800;
            padding: 4px 2px;
            border-radius: 6px;
            width: 90%;
            text-align: center;
        }

        /* 狀態色彩防線 (在明暗模式下皆保持高亮易讀) */
        .badge-red {
            background-color: var(--brand-red);
            color: white;
        }

        .badge-green {
            background-color: var(--brand-green);
            color: #FFFFFF;
        }

        [data-theme="light"] .badge-green {
            color: #111111;
        }

        .badge-amber {
            background-color: var(--brand-amber);
            color: white;
        }

        .badge-purple {
            background-color: var(--brand-purple);
            color: white;
        }

        .time-countdown {
            font-size: 10px;
            color: var(--brand-amber);
            font-weight: 700;
            margin-top: 2px;
        }

        /* 右側巨型廚房字體與手勢工作區 */
        .gesture-main-board {
            height: 100%;
            width: 75%;
            border-right: 0.2cqw solid var(--border-color);
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
        }

        /* 巨型廚房大字明細區 */
        .kitchen-bill-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .kitchen-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px dotted var(--border-color);
        }

        .kitchen-food-name {
            font-size: 42px;
            /* 字體放大 3 倍 */
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: -1px;
        }

        /* 品牌藍色大方框突顯數量 */
        .kitchen-food-qty {
            background-color: var(--brand-blue);
            color: #FFFFFF;
            font-size: 38px;
            font-weight: 900;
            padding: 4px 16px;
            border-radius: 12px;
            min-width: 65px;
            text-align: center;
        }

        /* 手勢操作提示底浮層 */
        .gesture-hint-footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 700;
            border-top: 1px solid var(--border-color);
            padding-top: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
        }

        /* 模擬資料滑動切換載體動畫 */
        .slide-animate {
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .slide-out {
            transform: translateX(-5cqw);
            opacity: 0;
        }

        .bottom-bar {
            height: 10%;
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
            background-color: var(--blur-bg);
            border-top: 0.3cqw solid var(--border-color);
            color: var(--text-main);
            box-sizing: border-box;
        }

        .time-display {
            color: var(--text-main);
            line-height: 1.2;
            font-size: 4cqw;
            font-weight: 700;
            text-align: center;   
        }

        .status-display {
            background-color: rgba(16, 185, 129, 0.1);
            border: 0.2cqw solid var(--brand-green);
            color: var(--brand-green);
            padding: 2cqw 3cqw;
            border-radius: 5cqw;
            font-size: 4cqw;
            font-weight: 800;
            transition: all 0.1s ease;
        }

        .status-display.close-shop {
            background-color: rgba(239, 68, 68, 0.1);
            border-color: var(--brand-red);
            color: var(--brand-red);
        }

        .btn {
            height: 13cqw;
            width: 22cqw;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            background-color: #007AFF;
            /* Apple 風格的藍色 */
            color: white;
            font-weight: 600;
            font-size: 3.5cqw;
            padding: 2cqw 3cqw;
            border-radius: 2cqw;
            transition: transform 0.2s;
            /* 按下去會有一點點回饋感 */
        }

        .btn:active {
            transform: scale(0.95);
            /* 按下去變小一點，模擬點擊感 */
        }

        #volumectrlbox {
            display: none;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            /* 預設隱藏，點擊時用 JS 切換顯示 */
            position: absolute;
            bottom: 100%;
            right: 10%;
            height: 35cqw;
            width: 70cqw;
            /* 圓角看起來比較現代 */
            z-index: 200;
            /* 確保一定在最上層 */
            /* 這是为了標示邊界 */
            border-radius: 5cqw;
            padding: 2cqw;
            text-align: center;
            appearance: none;
            color: var(--text-main);
            background-color: var(--bg-global);
            user-select: none;
            font-size: 4cqw;
        }

        /* 2. 拉桿：讓它垂直站立 */
        #volumeslider {
            -webkit-appearance: none;
            /*去掉網頁原生樣式兩個一起用*/
            appearance: none;
            /*去掉網頁原生樣式兩個一起用*/
            height: 15%;
            width: 100%;
            background: #ddd;
            /* 1. 強制游標顯示為手指 (或 default，改成箭頭) */
            cursor: pointer;
            user-select: none;
            /* 標準寫法 */
        }

        #volumeslider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 5cqw;
            height: 5cqw;
            background: #007bff;
            border-radius: 50%;
        }

        #volumectrlbox label {
            height: 20%;
            width: 100%;
            font-weight: bold;
            color: var(--brand-red);
            text-align: center;
            letter-spacing: 2cqw;
            font-size: 6cqw;
        }

        #volumevalue {
            height: 20%;
            width: 100%;
            color: var(--brand-red);
            font-size: 6cqw;
            text-align: center;
        }
    </style>
</head>

    <script type="module">
        import { authReady, app, auth, db, provider, currentStoreInfo, signInAnonymously, signInWithPopup, signOut, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, collection, getDocs, doc, onSnapshot, getDoc, setDoc, updateDoc, addDoc, deleteDoc, query, where, serverTimestamp, orderBy, limit } from './app.js';
        let allStores = [];
        let buyerLat = null;
        let buyerLng = null;
        let currentBuyerAddress = "正在獲取定位中...";
        let currentUserId = null;
        let activeDragItem = null;
        let cachedQrCanvas = null;
        let orders = []; // 存儲從 Firebase 撈回的訂單
        let currentIndex = 0; // 當前正在顯示的訂單索引
        const volumeBox = document.getElementById("volumectrlbox");
        const orderBell = document.getElementById("orderbell");
        // 🚩 開發時設為 true，上線前請務必改回 false！
        const IS_DEBUG_MODE = true;// 🚩 開發時設為 true，上線前請務必改回 false！
        const MOCK_USER_ID = "56TND0b1QBaj994IUmB9gwtYAWF2";// 🚩 開發時設為 true，上線前請務必改回 false！
        // 取得網址參數 (記得在網址手動加上 ?storeId=你的ID)
        const params = new URLSearchParams(window.location.search);
        const storeId = params.get('storeId') || MOCK_USER_ID;
        async function initPage() {
            let user;
            if (IS_DEBUG_MODE) {
                console.warn("⚠️ 目前處於開發模式，已自動模擬登入");
                user = { uid: MOCK_USER_ID }; // 偽造一個使用者物件
            } else {
                user = await authReady; // 真實登入檢查
                if (!user) {
                    alert("尚未登入，請先前往登入頁面。");
                    window.location.href = "index.html";
                    return;
                }
            }
            // 權限檢查 (開發模式下我們可以直接跳過，或者也讓他跑)
            if (!IS_DEBUG_MODE && storeId !== user.uid) {
                alert("存取權限不足！");
                window.location.href = "index.html";
                return;
            }
            console.log("驗證通過，開始載入...");
            listenToStoreStatus(storeId);
            initOrderListener(storeId);
            /*const user = await authReady;
            if (!user) {
                alert("尚未登入，請先前往登入頁面。");
                window.location.href = "index.html";
                return;
            }
            const params = new URLSearchParams(window.location.search);
            const storeId = params.get('storeId');
            // 權限檢查 (取消註解)
            if (storeId !== user.uid) {
                alert("存取權限不足！您無權管理此商店。");
                window.location.href = "index.html";
                return;
            }
            console.log("驗證通過，開始載入管理介面...");
            // 1. 初始化狀態監聽 (營業/休息)
            listenToStoreStatus(storeId);
            // 2. 初始化訂單監聽
            initOrderListener(storeId);*/
        }
        // 訂單監聽函數
        function listenToStoreStatus(storeId) {
            const statusRef = doc(db, "stores", storeId);
            // 直接監聽該商店文件的 status 欄位變化
            onSnapshot(statusRef, (doc) => {
                if (doc.exists()) {
                    const data = doc.data();
                    const statusDisplay = document.getElementById('shopStatusDisplay');
                    // 根據布林值更新 UI
                    // true -> 營業中, false -> 休息中
                    if (data.status === true) {
                        statusDisplay.innerText = '🟢 營業中';
                        statusDisplay.classList.remove('close-shop');
                    } else {
                        statusDisplay.innerText = '🔴 休息中';
                        statusDisplay.classList.add('close-shop');
                    }
                }
            });
        }
        function updateUI(index) {
            if (index < 0 || index >= orders.length) return; // 防呆機制
            currentIndex = index;
            // A. 重新渲染 Tab 列表 (為了亮起 active)
            renderTabs();
            // B. 重新渲染主區塊 (顯示該索引的訂單)
            renderOrderToWorkspace(orders[currentIndex]);
        }
        // 3. 訂單監聽 (資料變更時)
        function initOrderListener(storeId) {
            const q = query(
                collection(db, "orders"),
                where("storeId", "==", storeId),
                orderBy("createdAt", "desc")
            );
            onSnapshot(q, (snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        const newOrder = { id: change.doc.id, ...change.doc.data() };
                        orders.unshift(newOrder);
                        updateUI(0); // 有新訂單，自動跳轉到最新那筆 (第0筆)
                        AudioController.play();
                    }
                });
            });
        }
        // 4. 渲染 Tab (直接用全域的 orders 和 currentIndex)
        function renderTabs() {
            const container = document.getElementById('orderTabsContainer');
            container.innerHTML = '';
            orders.forEach((order, index) => {
                const tab = document.createElement('div');
                tab.className = `order-tab ${index === currentIndex ? 'active' : ''}`;
                tab.innerText = `#${order.orderId.slice(-3)}`;
                // 【修正重點】必須要把 index 綁在 HTML 標籤上，底下的事件委派才抓得到！
                tab.dataset.index = index;
                // 刪除原本的 tab.onclick，統一交給下方的事件委派處理
                container.appendChild(tab);
            });
        }
        // 1. 初始化 Tab 點擊監聽 (使用事件代理)
        document.getElementById('orderTabsContainer').addEventListener('click', (e) => {
            const tab = e.target.closest('.order-tab');
            if (!tab) return;
            // 現在這裡就能成功抓到剛才設定的 dataset.index 了
            const index = parseInt(tab.dataset.index);
            switchOrder(index);
        });
        // 2. 切換訂單的核心函式
        function switchOrder(index) {
            if (index < 0 || index >= orders.length) return;
            currentIndex = index;
            // 更新 Tab 樣式
            document.querySelectorAll('.order-tab').forEach((t, i) => {
                t.classList.toggle('active', i === index);
            });
            // 渲染資料進工作區
            renderOrderToWorkspace(orders[index]);
        }
        // 3. 渲染資料到畫面
        function renderOrderToWorkspace(order) {
            // 更新左側燈號
            document.getElementById('light_pay').innerText = order.paymentMethod === 'CREDIT' ? '線上已付' : '現場付現';
            document.getElementById('light_time').innerText = order.pickupTime;
            document.getElementById('light_type').innerText = order.diningType;
            // 更新右側主看板
            document.getElementById('kitchenOrderTotal').innerText = `$${order.totalAmount}`;
            // 渲染商品明細 (假設 order.items 是陣列)
            const billContainer = document.getElementById('kitchenBillContainer');
            billContainer.innerHTML = order.items.map(item => `
                    <div class="bill-item">
                        <span>${item.name} x ${item.quantity}</span>
                        <span>$${item.price * item.quantity}</span>
                    </div>  `).join('');
        }
        const gestureTouchBoard = document.getElementById('gestureTouchBoard');
        let touchStartX = 0;
        let touchEndX = 0;
        gestureTouchBoard.addEventListener('touchstart', (e) => {
            // 關鍵修正：必須加上 [0]
            touchStartX = e.changedTouches[0].clientX;
        }, { passive: true });
        gestureTouchBoard.addEventListener('touchend', (e) => {
            // 關鍵修正：必須加上 [0]
            touchEndX = e.changedTouches[0].clientX;
            handleSwipeGesture();
        }, { passive: true });
        function handleSwipeGesture() {
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) < 50) return;
            if (diff > 0) { // 左滑 -> 顯示下一筆 (index 加 1)
                updateUI(currentIndex + 1);
            } else {        // 右滑 -> 顯示上一筆 (index 減 1)
                updateUI(currentIndex - 1);
            }
        }
        // 初始渲染
        function updateClock() {
            const now = new Date();
            // 格式化時間 (顯示 時:分:秒)
            const timeString = now.toLocaleTimeString('zh-TW', { hour12: false });
            // 將時間填入剛剛定義的 span 中
            document.getElementById('clock').innerText = timeString;
        }
        const AudioController = {
            bell: document.getElementById('orderbell'),
            isMuted: localStorage.getItem("isMuted") === "true",
            init() {
                if (!this.bell) return; // 防呆
                // 恢復音量
                const savedVolume = parseFloat(localStorage.getItem("orderBellVolume")) || 0.5;
                this.bell.volume = savedVolume;
                // 恢復靜音狀態
                const muteBtn = document.getElementById('muteBtn');
                if (muteBtn) {
                    muteBtn.innerText = this.isMuted ? "🔇 已靜音" : "🔊 聲音開啟";
                }
            },
            play() {
                if (this.isMuted) {
                    console.log("目前靜音中，不播放通知音");
                    return;
                }
                this.bell.currentTime = 0;
                this.bell.play().catch(e => console.warn("自動播放被瀏覽器阻擋", e));
            },
            // 【修正 1】：補回 stop 函式，專門用來中斷測試音
            stop() {
                if (!this.bell) return;
                this.bell.pause();
                this.bell.currentTime = 0;
            },
            toggleMute() {
                this.isMuted = !this.isMuted;
                localStorage.setItem("isMuted", this.isMuted);
                const muteBtn = document.getElementById('muteBtn');
                if (muteBtn) {
                    muteBtn.innerText = this.isMuted ? "🔇 已靜音" : "🔊 聲音開啟";
                }
            }
        };
        // --- 綁定事件 ---
        document.getElementById('muteBtn').addEventListener('click', () => {
            AudioController.toggleMute();
        });
        const volumeSlider = document.getElementById("volumeslider");
        const volumeValue = document.getElementById("volumevalue");
        volumeSlider.addEventListener("input", (e) => {
            const val = parseFloat(e.target.value);
            AudioController.bell.volume = val;
            volumeValue.textContent = Math.round(val * 100) + "%";
            localStorage.setItem("orderBellVolume", val);
            // 滑動時自動解除靜音
            if (AudioController.isMuted) AudioController.toggleMute();
            // 更新背景顏色
            volumeSlider.style.background = `linear-gradient(to right, #007bff ${val * 100}%, #ddd ${val * 100}%)`;
        });
        document.addEventListener('click', (e) => {
            const volumeBtn = e.target.closest('[data-action="volumemenu"]');
            const isInsideVolumeBox = e.target.closest('#volumectrlbox');
            const target = e.target.closest('[data-action]');
            const volumeBox = document.getElementById('volumectrlbox');
            // 處理「音量選單」邏輯
            if (volumeBtn) {
                if (!volumeBox) return;
                const isHidden = window.getComputedStyle(volumeBox).display === "none";
                if (isHidden) {
                    volumeBox.style.display = "flex";
                    AudioController.play(); // 播放測試音
                } else {
                    volumeBox.style.display = "none";
                    // 【修正 3】：關閉選單是停止聲音 (stop)，不能用 toggleMute (靜音)
                    AudioController.stop();
                }
                return;
            }
            // 處理「點選單外關閉」
            else if (!isInsideVolumeBox && volumeBox && window.getComputedStyle(volumeBox).display !== "none") {
                volumeBox.style.display = "none";
                // 【修正 3】：點外面關閉也是停止聲音
                AudioController.stop();
            }
            // 處理其他按鈕
            else if (!target) return;
            const action = target.dataset.action;
            if (action === 'storemanage') {
                window.location.href = `manage.html?storeId=${storeId}`;
            }
        });
        document.addEventListener('DOMContentLoaded', () => {
            initPage();
            // 頁面載入時先執行一次
            updateClock();
            // 每 1000 毫秒（即 1 秒）執行一次更新
            setInterval(updateClock, 1000);
            handleSwipeGesture();
            AudioController.init();
            console.log("系統初始化完成");
        });
    </script>
</body>
