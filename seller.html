<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PACE 派思 pacetake.tw - 買家首頁</title>
    <!-- Favicon & Apple Touch Icon -->
    <link rel="icon" type="image/png" href="png/logoapple.png" sizes="180x180">
    <link rel="apple-touch-icon" href="png/logoapple.png">
    <link rel="apple-touch-icon" sizes="180x180" href="png/logoapple.png">
    <link rel="apple-touch-icon-precomposed" href="png/logoapple.png">
    <link rel="stylesheet" href="style.css">
    <style>
        /* 最左側：巨型盲操營業開關 */
        .status-toggle-btn {
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--brand-green);
            color: var(--brand-green);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .status-toggle-btn.close-shop {
            background-color: rgba(239, 68, 68, 0.1);
            border-color: var(--brand-red);
            color: var(--brand-red);
        }

        /* 中間與右側功能鈕與同步日夜切換 */
        .nav-right-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            font-size: 14px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            background-color: var(--card-bg);
        }

        /* 橫向滑動列訂單編號 */
        .order-tabs-scroll {
            display: flex;
            overflow-x: auto;
            background-color: var(--tab-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 16px;
            gap: 8px;
            scrollbar-width: none;
        }

        .order-tabs-scroll::-webkit-scrollbar {
            display: none;
        }

        .order-tab {
            flex-shrink: 0;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
        }

        .order-tab.active {
            background-color: var(--brand-blue);
            color: #FFFFFF;
            border-color: var(--brand-blue);
        }

        /* 核心盲操主工作區 */
        .workspace-layout {
            display: flex;
            flex-grow: 1;
            position: relative;
        }

        /* 左側連動狀態亮燈區 */
        .lights-sidebar {
            width: 100px;
            border-right: 1px solid var(--border-color);
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            padding: 12px 6px;
            gap: 12px;
        }

        .light-indicator-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 4px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .light-title {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: bold;
        }

        .light-badge {
            font-size: 11px;
            font-weight: 800;
            padding: 4px 2px;
            border-radius: 6px;
            width: 90%;
            text-align: center;
        }

        /* 狀態色彩防線 (在明暗模式下皆保持高亮易讀) */
        .badge-red {
            background-color: var(--brand-red);
            color: white;
        }

        .badge-green {
            background-color: var(--brand-green);
            color: #FFFFFF;
        }

        [data-theme="light"] .badge-green {
            color: #111111;
        }

        .badge-amber {
            background-color: var(--brand-amber);
            color: white;
        }

        .badge-purple {
            background-color: var(--brand-purple);
            color: white;
        }

        .time-countdown {
            font-size: 10px;
            color: var(--brand-amber);
            font-weight: 700;
            margin-top: 2px;
        }

        /* 右側巨型廚房字體與手勢工作區 */
        .gesture-main-board {
            flex-grow: 1;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-color: var(--bg-container);
            position: relative;
        }

        /* 巨型廚房大字明細區 */
        .kitchen-bill-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .kitchen-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px dotted var(--border-color);
        }

        .kitchen-food-name {
            font-size: 42px;
            /* 字體放大 3 倍 */
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: -1px;
        }

        /* 品牌藍色大方框突顯數量 */
        .kitchen-food-qty {
            background-color: var(--brand-blue);
            color: #FFFFFF;
            font-size: 38px;
            font-weight: 900;
            padding: 4px 16px;
            border-radius: 12px;
            min-width: 65px;
            text-align: center;
        }

        /* 手勢操作提示底浮層 */
        .gesture-hint-footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 700;
            border-top: 1px solid var(--border-color);
            padding-top: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
        }

        /* 模擬資料滑動切換載體動畫 */
        .slide-animate {
            animation: slideInEffect 0.15s ease-out;
        }

        @keyframes slideInEffect {
            from {
                opacity: 0;
                transform: scale(0.98);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>
    <div class="phone-wrapper">
        <!-- 頂部一體化導覽列 -->
        <div id="buyerView" style="display: block;">
            <header class="header">
                <div class="pace-logo">
                    <a href="index.html" class="logo-link">
                        <img src="png/pace3.png" alt="派思 官方網站">
                    </a>
                    <div class="avatar-container">
                        <span id="defaultIcon">👤</span>
                        <img id="userAvatarImg" src=""
                            style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;"
                            onerror="this.style.display='none'; document.getElementById('defaultIcon').style.display='block';">
                    </div>
                </div>
                <div class="two">
                    <div class="pace">
                        <button class="theme-toggle" id="themeToggleBtn" aria-label="切換主題">🌙</button>
                        <span>店內價外帶自取/點餐系統</span>
                    </div>
                    <div class="avatarBtnMenu" data-action="avatarBtnMenu">
                        <span class="user-name" id="userNameDisplay"></span>
                        <div class="dropdown-menu" id="dropdownMenu"></div>
                    </div>
                </div>
            </header>
            <button class="status-toggle-btn" id="shopStatusToggle">🟢 營業中</button>
            <!-- 橫向滑動列：訂單編號常亮 -->
            <div class="order-tabs-scroll" id="orderTabsContainer">
                <div class="order-tab active" id="tab_023">#023</div>
                <div class="order-tab" id="tab_022">#022</div>
                <div class="order-tab" id="tab_021">#021</div>
            </div>

            <!-- 核心工作區區塊 -->
            <div class="workspace-layout">

                <!-- 左側連動亮燈區 -->
                <aside class="lights-sidebar">
                    <!-- 金流狀態燈 -->
                    <div class="light-indicator-card">
                        <span class="light-title">金流防線</span>
                        <span class="light-badge badge-green" id="light_pay">線上已付</span>
                    </div>

                    <!-- 預約取餐時間燈 -->
                    <div class="light-indicator-card">
                        <span class="light-title">預約取餐</span>
                        <span class="light-badge badge-amber" id="light_time">12:30</span>
                        <span class="time-countdown" id="light_countdown">剩 20 分</span>
                    </div>

                    <!-- 用餐方式燈 -->
                    <div class="light-indicator-card">
                        <span class="light-title">用餐方式</span>
                        <span class="light-badge badge-purple" id="light_type">外帶自取</span>
                    </div>
                </aside>

                <!-- 右側巨型廚房大字明細與全螢幕手勢工作區 -->
                <main class="gesture-main-board" id="gestureTouchBoard">
                    <div>
                        <div class="kitchen-bill-area slide-animate" id="kitchenBillContainer">
                            <!-- 由 JS 依照訂單自動動態渲染商品、單價與數量 -->
                        </div>

                        <!-- 🎯 廚房一秒對帳：巨型實付總金額防線 -->
                        <div
                            style="margin-top: 24px; padding-top: 16px; border-top: 2px dashed var(--border-color); display: flex; justify-content: space-between; align-items: center;">
                            <span style="font-size: 16px; font-weight: 800; color: var(--text-muted);">本單實付合計</span>
                            <span style="font-size: 38px; font-weight: 900; color: var(--brand-blue);"
                                id="kitchenOrderTotal">$0</span>
                        </div>
                    </div>

                    <!-- 底部手勢手感提示 -->
                    <div class="gesture-hint-footer">
                        <span>👈 左滑下一單</span>
                        <span>•</span>
                        <span>右滑前一單 👉</span>
                    </div>
                </main>
            </div>
        </div>
        <div class="lightbox-modal" id="loginLightbox" style="display: none;">
            <div class="modal-card">
                <div class="modal-title" style=" font-weight: 600; color: var(--text-main);">加入PACE 派思</div>
                <button class="modal-btn google" data-action="googleLogin"
                    style="box-shadow: 0 0.2cqw 0.125 rgba(0,0,0,0.05);">
                    <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right:0.5cqw;">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
                        <path fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
                    </svg>
                    Google 登入
                </button>
                <button data-action="toggleEmailFormBtn"
                    style="display: flex; align-items: center; justify-content: center; width: 100%; margin-bottom: 5cqw; background-color: white; border: 0.2cqw solid #e5e7eb; border-radius: 3cqw; padding: 3cqw 0; font-size: 5cqw; font-weight: 600; color: #374151; cursor: pointer; box-shadow: 0 0.5cqw 2cqw rgba(0,0,0,0.05);">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" style="margin-right:0.5cqw;">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    使用電子郵件登入
                </button>
                <div id="emailFormSection" class="email-form">
                    <div style="margin-bottom: 1cqw;">
                        <label for="loginEmail"
                            style="display:block; margin-bottom: 5cqw; font-size:5cqw; color:#6b7280; font-weight:700;">電子郵件</label>
                        <input type="email" id="loginEmail" placeholder="請輸入 Email" autocomplete="username"
                            style="width: 100%; box-sizing: border-box; padding: 2cqw; border:0.2cqw solid #e5e7eb; border-radius:2cqw; box-sizing:border-box; font-size:5cqw; background-color:#f9fafb; color: #111111;">
                    </div>
                    <div style="margin-bottom:10cqw;">
                        <label for="loginPassword"
                            style="display:block; margin-bottom:0.25cqw; font-size:5cqw; color:#6b7280; font-weight:500;">密碼</label>
                        <div style="position: relative; display: flex; align-items: center;">
                            <input type="password" id="loginPassword" placeholder="請輸入密碼"
                                autocomplete="current-password"
                                style="width: 100%; padding:0.25cqw 0.75cqw; border:0.2cqw solid #e5e7eb; border-radius:2cqw; box-sizing:border-box; font-size:5cqw; background-color:#f9fafb; color: #111111;">
                            <button type="button" data-action="togglePasswordVisibility"
                                style="position: absolute; right: 5cqw; background: none; border: none; cursor: pointer; font-size: 5cqw; padding: 0; color: #6b7280; z-index: 10;">👁️</button>
                        </div>
                    </div> <button data-action="emailLogin"
                        style="background-color: #059669; color: white; border: none; width: 100%; padding: 0.25cqw; border-radius: 0.5cqw; font-size: 5cqw; font-weight: 700; cursor: pointer; box-shadow: 0 0.25cqw 0.5cqw rgba(255, 255, 255, 0.15);">電子郵件登入
                        / 註冊</button>
                </div><span class="modal-close" data-action="customReturnBtn"
                    style="margin-top: 0.5cqw; text-decoration: underline; cursor: pointer; display: block; text-align: center;">暫時返回</span>
            </div>
        </div>
    </div>
    <script type="module" src="app.js"></script>
    <script type="module">

        // 🟢 🔴 最左側巨型營業狀態切換防線
        const shopStatusToggle = document.getElementById('shopStatusToggle');
        bindFastClick(shopStatusToggle, () => {
            if (shopStatusToggle.classList.contains('close-shop')) {
                shopStatusToggle.classList.remove('close-shop');
                shopStatusToggle.innerText = '🟢 營業中';
            } else {
                shopStatusToggle.classList.add('close-shop');
                shopStatusToggle.innerText = '🔴 打烊中';
            }
        });

        // 🧑‍🍳 廚房實戰假資料庫（加入單價與總計防線）
        const ordersDatabase = {
            "023": {
                items: [{ name: "木盒便當", price: 120, qty: "x2" }, { name: "大雞腿", price: 65, qty: "x1" }],
                total: "$305",
                pay: { text: "線上已付", cls: "badge-green" },
                time: "12:30", countdown: "剩 20 分", timeCls: "badge-amber",
                type: "外帶自取", typeCls: "badge-purple"
            },
            "022": {
                items: [{ name: "大排骨", price: 85, qty: "x2" }],
                total: "$170",
                pay: { text: "現場付現", cls: "badge-red" },
                time: "12:45", countdown: "剩 35 分", timeCls: "badge-amber",
                type: "內用/05桌", typeCls: "badge-purple"
            },
            "021": {
                items: [{ name: "鯖魚便當", price: 95, qty: "x1" }, { name: "經典手搖", price: 40, qty: "x1" }],
                total: "$135",
                pay: { text: "線上已付", cls: "badge-green" },
                time: "13:00", countdown: "剩 50 分", timeCls: "badge-amber",
                type: "外帶自取", typeCls: "badge-purple"
            }
        };

        const orderIds = ["023", "022", "021"];
        let currentOrderIndex = 0;

        const kitchenBillContainer = document.getElementById('kitchenBillContainer');
        const kitchenOrderTotal = document.getElementById('kitchenOrderTotal');
        const lightPay = document.getElementById('light_pay');
        const lightTime = document.getElementById('light_time');
        const lightCountdown = document.getElementById('light_countdown');
        const lightType = document.getElementById('light_type');

        function renderOrder(id) {
            const data = ordersDatabase[id];

            document.querySelectorAll('.order-tab').forEach(tab => tab.classList.remove('active'));
            document.getElementById(`tab_${id}`).classList.add('active');

            lightPay.className = `light-badge ${data.pay.cls}`;
            lightPay.innerText = data.pay.text;

            lightTime.innerText = data.time;
            lightCountdown.innerText = data.countdown;

            lightType.innerText = data.type;

            // 連動更新本單巨型合計金額
            kitchenOrderTotal.innerText = data.total;

            // 渲染右側三倍巨型大字商品項目（內置單價顯示）
            kitchenBillContainer.innerHTML = '';
            data.items.forEach(item => {
                const row = document.createElement('div');
                row.className = 'kitchen-row';
                row.innerHTML = `
                    <div style="display: flex; flex-direction: column; gap: 4px; text-align: left;">
                        <span class="kitchen-food-name">${item.name}</span>
                        <span style="font-size: 14px; font-weight: 700; color: var(--text-muted);">單價: $${item.price}</span>
                    </div>
                    <span class="kitchen-food-qty">${item.qty}</span>
                `;
                kitchenBillContainer.appendChild(row);
            });

            kitchenBillContainer.classList.remove('slide-animate');
            void kitchenBillContainer.offsetWidth;
            kitchenBillContainer.classList.add('slide-animate');
        }

        // 👈 👉 盲操全螢幕手勢滑動偵測外掛
        const gestureTouchBoard = document.getElementById('gestureTouchBoard');
        let touchStartX = 0;
        let touchEndX = 0;

        gestureTouchBoard.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches.screenX;
        }, { passive: true });

        gestureTouchBoard.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches.screenX;
            handleSwipeGesture();
        }, { passive: true });

        function handleSwipeGesture() {
            const threshold = 50;
            if (touchStartX - touchEndX > threshold) {
                if (currentOrderIndex < orderIds.length - 1) {
                    currentOrderIndex++;
                    renderOrder(orderIds[currentOrderIndex]);
                }
            } else if (touchEndX - touchStartX > threshold) {
                if (currentOrderIndex > 0) {
                    currentOrderIndex--;
                    renderOrder(orderIds[currentOrderIndex]);
                }
            }
        }

        // 初始渲染
        renderOrder(orderIds[currentOrderIndex]);

        // 全局相對路徑跳轉無縫對接
        const navElements = document.querySelectorAll('.nav-fast');
        navElements.forEach(elem => {
            bindFastClick(elem, () => {
                const dest = elem.getAttribute('href');
                if (dest && dest !== '#') {
                    window.location.href = dest;
                }
            });
        });
    </script>
</body>

</html>
