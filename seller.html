<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PACE 派思 pacetake.tw - 買家首頁</title>
    <!-- PWA 配置 -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#ffffff">
    <!-- 一般網頁分頁圖示 -->
    <link rel="icon" type="image/png" href="png/logo192.png" sizes="192x192">
    <!-- iPhone 桌面圖示專用（已修改為 180x180 正方形） -->
    <link rel="apple-touch-icon" href="png/logo180.png">
    <link rel="stylesheet" href="style.css">
    <style>
        .tabs-container {
            height: 7%;
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: start;
            align-items: center;
            overflow-x: auto;
            color: var(--text-main);
            gap: 1cqw;
            cursor: pointer;
            white-space: nowrap;
            border-bottom: 0.3cqw solid var(--border-color);
        }

        .order-tab {
            display: flex;
            flex-direction: row;
            justify-content: start;
            align-items: center;
            color: var(--text-main);
            flex-shrink: 0;
            background-color: var(--card-bg);
            border: 0.2cqw solid var(--border-color);
            padding: 1cqw 3cqw;
            border-radius: 3cqw;
            font-size: 4cqw;
            font-weight: 600;
        }

        .order-tab.active {
            background-color: var(--brand-blue);
            border-color: var(--brand-blue);
            color: #FFFFFF;
        }

        /* 核心盲操主工作區 */
        .workspace-layout {
            height: 68%;
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: stretch;
        }

        /* 左側連動狀態亮燈區 */
        .lights-sidebar {
            height: 100%;
            width: 25%;
            border-right: 0.2cqw solid var(--border-color);
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
        }

        /* 右側巨型廚房字體與手勢工作區 */
        .gesture-main-board {
            height: 100%;
            width: 75%;
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
        }

        .light-indicator-card {
            height: 18%;
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .light-title {
            color: var(--text-main);
            line-height: 1.2;
            font-size: 4cqw;
            font-weight: 700;
            text-align: center;
        }

        .light-badge {
            color: var(--text-main);
            line-height: 1.2;
            font-size: 4cqw;
            font-weight: 700;
            text-align: center;
        }

        .lightpay {
            height: 28%;
            width: 100%;
            color: var(--brand-green);
            box-shadow: var(--shadow-sm);
            background-color: rgba(16, 185, 129, 0.1);
            border: 0.2cqw solid var(--brand-green);
            border-radius: 5cqw;
            line-height: 1.2;
            font-size: 3.5cqw;
            font-weight: 600;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            transition: transform 0.2s;
        }

        .lightpay:active {
            transform: scale(0.95);
            /* 按下去變小一點，模擬點擊感 */
        }

        .lightpay.pending {
            background-color: rgba(239, 68, 68, 0.1);
            border-color: var(--brand-red);
            color: var(--brand-red);
        }

        .lighttype {
            height: 95%;
            width: 95%;
            color: var(--text-main);
            box-shadow: var(--shadow-sm);
            background-color: var(--card-bg);
            border: 0.2cqw solid var(--border-color);
            border-radius: 5cqw;
            line-height: 1.2;
            font-size: 3.5cqw;
            font-weight: 600;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            white-space: pre-line;
        }

        .lighttime {
            height: 95%;
            width: 95%;
            color: var(--text-main);
            box-shadow: var(--shadow-sm);
            background-color: var(--card-bg);
            border: 0.2cqw solid var(--border-color);
            border-radius: 5cqw;
            line-height: 1.2;
            font-size: 4cqw;
            font-weight: 600;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            white-space: pre-line;
        }

        .kitchen-remark {
            height: 70%;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
        }

        .kitchen-bill-area {
            height: 90%;
            width: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: start;
            align-items: stretch;
            gap: 0.5cqw;
            /* 卡片與卡片之間的間距改用 cqw */
            padding: 0 3cqw;
            /* 微調右邊 padding，留出空間給滾動條，卡片才不會黏在一起 */
            box-sizing: border-box;
            /* 隱藏 Firefox 的卷軸 */
            scrollbar-width: none;
            /* 確保內容依然可以滑動 */
            -ms-overflow-style: none;
            /* 隱藏 Chrome, Safari, Edge 的卷軸 */
        }

        .kitchen-bill-area::-webkit-scrollbar {
            /* Chrome, Safari 隱藏軸線 */
            display: none;
        }

        .bill-item {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            height: 7cqw;
            width: 100%;
            line-height: 1.2;
            font-size: 5cqw;
            font-weight: 700;
            color: var(--text-main);
        }

        .buyer-remark {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            height: 10%;
            width: 100%;
            line-height: 1.2;
            font-size: 4cqw;
            font-weight: 600;
            color: var(--text-main);
            padding: 0 3cqw;
        }

        .kitchenOrderTotal {
            height: 15%;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            border-radius: 5cqw;
            line-height: 1.2;
            border-top: 0.2cqw dashed var(--border-color);
            color: var(--brand-green);
            box-shadow: var(--shadow-sm);
            background-color: rgba(16, 185, 129, 0.1);
            border: 0.2cqw solid var(--brand-green);
            transition: transform 0.2s;
        }

        .kitchenOrderTotal:active {
            transform: scale(0.95);
            /* 按下去變小一點，模擬點擊感 */
        }

        .kitchenOrderTotal.preparing {
            background-color: rgba(239, 68, 68, 0.1);
            border-color: var(--brand-red);
            color: var(--brand-red);
        }

        .kitchenOrder {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            height: 80%;
            width: 100%;
            line-height: 1.2;
            font-size: 5cqw;
            font-weight: 700;
            padding: 0 3cqw;
        }

        .namephone {
            height: 15%;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            color: var(--text-main);
        }

        /* 手勢操作提示底浮層 */
        .gesture-hint-footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 3cqw;
            font-weight: 700;
            border-top: 0.2cqw solid var(--border-color);
            padding-top: 3cqw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nameandphone {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            height: 20%;
            width: 100%;
            line-height: 1.2;
            font-size: 3.5cqw;
            font-weight: 500;
            padding: 0 3cqw;
        }

        /* 模擬資料滑動切換載體動畫 */
        .slide-animate {
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .slide-out {
            transform: translateX(-5cqw);
            opacity: 0;
        }

        .bottom-bar {
            height: 10%;
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
            background-color: var(--blur-bg);
            border-top: 0.3cqw solid var(--border-color);
            color: var(--text-main);
            box-sizing: border-box;
            position: relative;
        }

        .time-display {
            color: var(--text-main);
            line-height: 1.2;
            font-size: 4cqw;
            font-weight: 700;
            text-align: center;
        }

        .status-display {
            background-color: rgba(16, 185, 129, 0.1);
            border: 0.2cqw solid var(--brand-green);
            color: var(--brand-green);
            padding: 2cqw 3cqw;
            border-radius: 5cqw;
            font-size: 4cqw;
            font-weight: 800;
            transition: all 0.1s ease;
        }

        .status-display.close-shop {
            background-color: rgba(239, 68, 68, 0.1);
            border-color: var(--brand-red);
            color: var(--brand-red);
        }

        .btn {
            height: 13cqw;
            width: 22cqw;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            background-color: #007AFF;
            /* Apple 風格的藍色 */
            color: white;
            font-weight: 600;
            font-size: 3.5cqw;
            padding: 2cqw 3cqw;
            border-radius: 2cqw;
            transition: transform 0.2s;
            /* 按下去會有一點點回饋感 */
        }

        .btn:active {
            transform: scale(0.95);
            /* 按下去變小一點，模擬點擊感 */
        }

        #volumectrlbox {
            display: none;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            /* 預設隱藏，點擊時用 JS 切換顯示 */
            position: absolute;
            bottom: 100%;
            right: 10%;
            height: 35cqw;
            width: 70cqw;
            z-index: 500;
            border-radius: 5cqw;
            padding: 2cqw;
            text-align: center;
            color: var(--text-main);
            background-color: var(--bg-global);
            user-select: none;
            font-size: 4cqw;
        }

        #volumeslider {
            -webkit-appearance: none;
            appearance: none;
            height: 15%;
            width: 100%;
            background: #ddd;
            cursor: pointer;
            user-select: none;
        }

        #volumeslider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 5cqw;
            height: 5cqw;
            background: #007bff;
            border-radius: 50%;
        }

        #volumectrlbox label {
            height: 20%;
            width: 100%;
            font-weight: bold;
            color: var(--brand-red);
            text-align: center;
            letter-spacing: 2cqw;
            font-size: 6cqw;
        }

        #volumevalue {
            height: 20%;
            width: 100%;
            color: var(--brand-red);
            font-size: 6cqw;
            text-align: center;
        }

        #muteBtn {
            -webkit-appearance: none;
            appearance: none;
            border: none;

            /* 尺寸與佈局：配合外層 flexbox */
            width: 90%;
            height: 22%;
            display: flex;
            justify-content: center;
            align-items: center;

            /* 質感外觀：圓角膠囊感與內建主題色反轉 */
            border-radius: 2.5cqw;
            background-color: var(--text-main);
            /* 預設用主文字顏色當背景 */
            color: var(--bg-global);
            /* 文字用全域背景色反轉，對比強烈 */

            /* 字體設定 */
            font-size: 4.5cqw;
            font-weight: bold;
            letter-spacing: 0.3cqw;
            cursor: pointer;

            /* 陰影與動畫過渡 */
            box-shadow: 0 0.6cqw 1.5cqw rgba(0, 0, 0, 0.15);
            transition: all 0.2s ease;
            user-select: none;
        }

        /* 滑鼠懸停 / 靈敏觸控反饋 */
        #muteBtn:hover {
            opacity: 0.9;
            transform: translateY(-0.3cqw);
            /* 微微浮起感 */
            box-shadow: 0 0.8cqw 2cqw rgba(0, 0, 0, 0.2);
        }

        /* 點擊壓下去的超爽回饋 */
        #muteBtn:active {
            transform: translateY(0.2cqw);
            /* 壓下去 */
            box-shadow: 0 0.2cqw 0.5cqw rgba(0, 0, 0, 0.1);
        }

        /* 🌟 靜音狀態下的特殊樣式 (選用，搭配下方 JS 效果炸裂) */
        #muteBtn.muted {
            background-color: #6c757d;
            /* 變成沉穩的灰色 */
            color: #fff;
            /* 如果你想用你的品牌紅，也可以改成這樣：
            background-color: var(--brand-red); 
            color: #fff; */
        }

        /* 燈箱外層遮罩 (覆蓋全螢幕) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            /* 半透明黑底 */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            /* 確保在最上層 */
        }

        /* 燈箱主體 */
        .modal-content {
            background: white;
            width: 90%;
            max-width: 100cqw;
            padding: 6cqw;
            border-radius: 3cqw;
            box-shadow: 0 1cqw 4cqw rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            gap: 4cqw;
        }

        .modal-content h3 {
            margin: 0;
            color: #333;
        }

        /* 警告區塊樣式 */
        .warning-msg {
            background-color: #fff3cd;
            color: #856404;
            padding: 3cqw;
            border-left: 1cqw solid #ffeeba;
            border-radius: 1cqw;
            font-size: 4cqw;
            line-height: 1.4;
        }

        /* 輸入框樣式 */
        .input-group label {
            display: block;
            margin-bottom: 2cqw;
            font-weight: bold;
        }

        .input-group .required {
            color: red;
        }

        .input-group textarea {
            width: 100%;
            padding: 2.5cqw;
            border: 0.2cqw solid #ccc;
            border-radius: 1.5cqw;
            resize: none;
            /* 禁止拖拉大小 */
            box-sizing: border-box;
        }

        /* 按鈕區塊 */
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 3cqw;
            margin-top: 2cqw;
        }

        .btn-cancel {
            background: #e0e0e0;
            border: none;
            padding: 2.5cqw 4cqw;
            border-radius: 1.5cqw;
            cursor: pointer;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
            border: none;
            padding: 2.5cqw 4cqw;
            border-radius: 1.5cqw;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-danger:disabled {
            background: #f5c6cb;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <div class="phone-wrapper">
        <div id="buyerView" style="display: block;">
            <header class="header">
                <div class="pace-logo">
                    <a href="index.html" class="logo-link">
                        <img src="png/pace3.png" alt="派思 官方網站">
                    </a>
                    <div class="avatar-container">
                        <span id="defaultIcon">👤</span>
                        <img id="userAvatarImg" src=""
                            style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;"
                            onerror="this.style.display='none'; document.getElementById('defaultIcon').style.display='block';">
                    </div>
                </div>
                <div class="two">
                    <div class="pace">
                        <button class="theme-toggle" id="themeToggleBtn" aria-label="切換主題">🌙</button>
                        <span>店內價外帶自取/點餐系統</span>
                    </div>
                    <div class="avatarBtnMenu" data-action="avatarBtnMenu">
                        <span class="user-name" id="userNameDisplay"></span>
                        <div class="dropdown-menu" id="dropdownMenu"></div>
                    </div>
                </div>
            </header>
            <div class="tabs-container" id="orderTabsContainer"></div>
            <div class="workspace-layout">
                <aside class="lights-sidebar">
                    <div class="lightpay" data-action="lightpay" id="payContainer">
                        <span class="light-badge badge-green" id="light_pay">讀取中...</span>
                        <span class="light-badge" id="paymentStatus">讀取中...</span>
                        <span>點擊可變更<br>收款狀態</span>
                    </div>
                    <div class="light-indicator-card">
                        <div class="lighttype">
                            <span class="light-title">用餐方式</span>
                            <span class="light-badge badge-purple" id="light_type">讀取中...</span>
                        </div>
                    </div>
                    <div class="light-indicator-card">
                        <div class="lighttime">接單時間<br>：<br><span id="light_time">讀取中...</span>
                        </div>
                    </div>
                    <div class="light-indicator-card">
                        <button class="btn" data-action="cancelReason">❌<br>取消訂單</button>
                    </div>
                    <div class="light-indicator-card">
                        <div class="time-display">目前時間<br>：<br><span id="clock">讀取中...</span>
                        </div>
                    </div>
                </aside>
                <main class="gesture-main-board" id="gestureTouchBoard">
                    <div class="kitchen-remark">
                        <div class="kitchen-bill-area slide-animate" id="kitchenBillContainer"></div>
                        <div class="buyer-remark">備註:<span id="remark">讀取中...</span></div>
                    </div>
                    <div class="kitchenOrderTotal" data-action="kitchenOrderTotal" id="statusContainer">
                        <div class="kitchenOrder">
                            <span style="font-size: 6cqw; font-weight: 800; color: var(--text-muted);">本單合計</span>
                            <span style="font-size: 7cqw; font-weight: 900; color: var(--brand-blue);"
                                id="kitchenOrderTotal">$0</span>
                        </div>
                        <span id="statusTotal"
                            style="font-size: 3.5cqw; font-weight: 500; color: var(--text-main);">讀取中...</span>
                    </div>
                    <!-- 底部手勢手感提示 -->
                    <div class="namephone">
                        <div class="gesture-hint-footer">
                            <span>👈 左滑下一單</span>
                            <span>•</span>
                            <span>右滑前一單 👉</span>
                        </div>
                        <div class="nameandphone">
                            <div class="buyername">聯絡人:<span id="buyername">讀取中...</span></div>
                            <div class="buyerphone">連絡電話:<span id="buyerphone">讀取中...</span></div>
                        </div>
                    </div>
                </main>
            </div>
            <footer class="bottom-bar">
                <button class="btn" data-action="storemanage">🏪<br>前往後台</button>
                <div class="status-display" id="shopStatusDisplay">🟢 營業中</div>
                <button class="btn" data-action="volumemenu" type="button">🎵<br>測試鈴聲</button>
                <!-- 預設隱藏的音量控制區塊 -->
                <div id="volumectrlbox"><span>部分裝置無法透過此拉桿控制音量</span>
                    <div class="audio-controls">
                        <label for="volumeslider">音量</label>
                        <!-- range 拉桿 -->
                        <input type="range" id="volumeslider" min="0" max="1" step="0.1" value="0.5">
                        <span id="volumevalue">50%</span>
                        <button id="muteBtn" type="button">🔊 聲音開啟</button>
                    </div>
                    <audio id="orderbell" preload="auto">
                        <source src="audio/ringtone.mp3" type="audio/mpeg">
                    </audio>
                </div>
            </footer>
        </div>

        <div id="cancelOrderModal" class="modal-overlay" style="display: none;">
            <div class="modal-content">
                <h3>❌ 取消訂單</h3>
                <div id="cancelWarningMsg" class="warning-msg" style="display: none;">
                    <strong>⚠️ 提醒：此為線上付款訂單！</strong><br>
                    取消後，請務必至「藍新後台」執行退款，並至系統總後台標記為「已退款」。
                </div>
                <div class="input-group">
                    <label for="cancelReasonInput">請輸入取消原因 <span class="required">*</span></label>
                    <textarea id="cancelReasonInput" rows="3" placeholder="例如：餐點售完、顧客來電要求..."></textarea>
                </div>
                <div class="modal-actions">
                    <button id="btnCancelModal" class="btn-cancel">保留訂單 (返回)</button>
                    <button id="btnConfirmCancel" class="btn-danger">確認取消訂單</button>
                </div>
            </div>
        </div>
        <div class="lightbox-modal" id="loginLightbox">
            <div class="modal-card">
                <div class="modal-title" style=" font-weight: 600; color: var(--text-main);">加入PACE 派思</div>
                <button class="modal-btn google" data-action="googleLogin"
                    style="box-shadow: 0 0.2cqw 0.125 rgba(0,0,0,0.05);">
                    <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right:0.5cqw;">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"

    <script type="module" src="app.js"></script>
    <script type="module">
        import { authReady, app, auth, db, provider, currentStoreInfo, signInAnonymously, signInWithPopup, signOut, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, collection, getDocs, doc, onSnapshot, getDoc, setDoc, updateDoc, addDoc, deleteDoc, query, where, serverTimestamp, orderBy, limit } from './app.js';
        let allStores = [];
        let buyerLat = null;
        let buyerLng = null;
        let currentBuyerAddress = "正在獲取定位中...";
        let currentUserId = null;
        let activeDragItem = null;
        let cachedQrCanvas = null;
        let orders = []; // 存儲從 Firebase 撈回的訂單
        let currentIndex = 0; // 當前正在顯示的訂單索引
        let currentOrderToCancel = null;
        let isInitialLoad = true;
        let activeOrderId = null; // 全域變數
        // 🚩 開發時設為 true，上線前請務必改回 false！
        const IS_DEBUG_MODE = true;// 🚩 開發時設為 true，上線前請務必改回 false！
        const MOCK_USER_ID = "56TND0b1QBaj994IUmB9gwtYAWF2";// 🚩 開發時設為 true，上線前請務必改回 false！
        // 取得網址參數 (記得在網址手動加上 ?storeId=你的ID)
        const params = new URLSearchParams(window.location.search);
        const storeId = params.get('storeId') || MOCK_USER_ID;
        async function initPage() {
            let user;
            if (IS_DEBUG_MODE) {
                console.warn("⚠️ 目前處於開發模式，已自動模擬登入");
                user = { uid: MOCK_USER_ID }; // 偽造一個使用者物件
            } else {
                user = await authReady; // 真實登入檢查
                if (!user) {
                    alert("尚未登入，請先前往登入頁面。");
                    window.location.href = "index.html";
                    return;
                }
            }
            // 權限檢查 (開發模式下我們可以直接跳過，或者也讓他跑)
            if (!IS_DEBUG_MODE && storeId !== user.uid) {
                alert("存取權限不足！");
                window.location.href = "index.html";
                return;
            }
            console.log("驗證通過，開始載入...");
            listenToStoreStatus(storeId);
            initOrderListener(storeId);
            /*const user = await authReady;
            if (!user) {
                alert("尚未登入，請先前往登入頁面。");
                window.location.href = "index.html";
                return;
            }
            const params = new URLSearchParams(window.location.search);
            const storeId = params.get('storeId');
            // 權限檢查 (取消註解)
            if (storeId !== user.uid) {
                alert("存取權限不足！您無權管理此商店。");
                window.location.href = "index.html";
                return;
            }
            console.log("驗證通過，開始載入管理介面...");
            // 1. 初始化狀態監聽 (營業/休息)
            listenToStoreStatus(storeId);
            // 2. 初始化訂單監聽
            initOrderListener(storeId);*/
        }
        // 訂單監聽函數
        function listenToStoreStatus(storeId) {
            const statusRef = doc(db, "stores", storeId);
            // 直接監聽該商店文件的 status 欄位變化
            onSnapshot(statusRef, (doc) => {
                if (doc.exists()) {
                    const data = doc.data();
                    const statusDisplay = document.getElementById('shopStatusDisplay');
                    // 根據布林值更新 UI
                    // true -> 營業中, false -> 休息中
                    if (data.status === true) {
                        statusDisplay.innerText = '🟢 營業中';
                        statusDisplay.classList.remove('close-shop');
                    } else {
                        statusDisplay.innerText = '🔴 休息中';
                        statusDisplay.classList.add('close-shop');
                    }
                }
            });
        }
        // 3. 訂單監聽 (資料變更時)
        function initOrderListener(storeId) {
            const q = query(
                collection(db, "orders"),
                where("storeId", "==", storeId),
                orderBy("createdAt", "desc") // 最新訂單在前
            );
            onSnapshot(q, (snapshot) => {
                // 1. 先判斷這次更新有沒有「真正的新進訂單」(用來決定要不要播音效)
                let hasNewOrder = false;
                snapshot.docChanges().forEach((change) => {
                    const data = change.doc.data();
                    // 🌟 核心修正：用你的雙軌欄位做精準定義！
                    // 滿足以下任一條件才是店家要處理的「有效訂單」：
                    // 條件 A：它是現場付現單 (CASH)
                    // 條件 B：它是線上刷卡單 (CREDIT) 且 狀態已經不是「等待付款(UNPAID)」了
                    const isValidOrder = (data.paymentMethod === "CASH") ||
                        (data.paymentMethod === "CREDIT" && data.paymentStatus !== "UNPAID");
                    if (isValidOrder && !isInitialLoad) {
                        // 檢查這張單是不是本來就在店家的畫面上
                        const isAlreadyOnScreen = orders.some(o => o.id === change.doc.id);
                        // 如果是新單，或者是線上單剛付完款（原本不在畫面上），才觸發新訂單通知
                        if (!isAlreadyOnScreen) {
                            hasNewOrder = true;
                        }
                    }
                });
                // 這樣 100% 貼齊 desc 排序，絕對不會再亂掉
                orders.length = 0; // 清空舊陣列 (保留記憶體參考)
                snapshot.docs.forEach(doc => {
                    const data = doc.data();
                    // 🌟 核心修正：撈取列表時，同步過濾掉還沒付錢的線上刷卡單
                    const isValidOrder = (data.paymentMethod === "CASH") ||
                        (data.paymentMethod === "CREDIT" && data.paymentStatus !== "UNPAID");

                    if (isValidOrder) {
                        orders.push({ id: doc.id, ...data });
                    }
                });
                // 3. 處理畫面與音效
                if (isInitialLoad) {
                    if (orders.length > 0) {
                        updateUI(orders[0].id); // 載入最新的第一張單
                    }
                    isInitialLoad = false;
                } else {
                    // 🌟 關鍵修改點：
                    if (hasNewOrder) {
                        AudioController.play(); // 播音效
                        if (orders.length > 0) {
                            console.log("🔔 偵測到新訂單！自動跳轉到最新單：", orders[0].id);
                            updateUI(orders[0].id); // 🚀 直接跳轉到最新進來的那張單！
                        }
                    } else {
                        // 如果「沒有」新單，代表只是舊訂單的內容被修改（例如店家自己按了接單、出餐等）
                        // 這時候保持在原本這張單，並直接刷新工作區內容就好，不要打斷老闆目前的瀏覽
                        const currentOrder = orders.find(o => o.id === activeOrderId);
                        if (currentOrder) {
                            renderOrderToWorkspace(currentOrder);
                        }
                    }
                }
                // 4. 最後統一重繪 Tab，順序保證正確 [0, 1, 2...]
                renderTabs();
            });
        }
        // 1. 初始化 Tab 點擊監聽 (使用事件代理)
        document.getElementById('orderTabsContainer').addEventListener('click', (e) => {
            const tab = e.target.closest('.order-tab');
            if (!tab) return;
            const orderId = tab.dataset.id; // 取得綁定的 ID
            updateUI(orderId);
        });
        // 2. 切換訂單的核心函式
        function updateUI(orderId) {
            if (!orderId) return;
            activeOrderId = orderId; // 更新全域狀態
            // 從陣列中撈出資料
            const order = orders.find(o => o.id === orderId);
            if (order) {
                renderOrderToWorkspace(order);
            }
            renderTabs(); // 刷新亮起狀態
        }
        // 4. 渲染 Tab (直接用全域的 orders 和 currentIndex)
        function renderTabs() {
            const container = document.getElementById('orderTabsContainer');
            container.innerHTML = '';
            orders.forEach((order) => {
                const tab = document.createElement('div');
                // 🌟 關鍵：比較的是 order.id (Firestore ID)
                tab.className = `order-tab ${order.id === activeOrderId ? 'active' : ''}`;
                // 顯示的是 order.orderId (你的業務單號)
                tab.innerText = `#${order.orderId ? order.orderId.slice(-3) : '???'}`;
                tab.dataset.id = order.id; // 綁定 ID
                container.appendChild(tab);
            });
        }
        // 3. 渲染資料到畫面
        function renderOrderToWorkspace(order) {
            // 更新左側燈號
            const payContainer = document.getElementById('payContainer');
            const paymentStatusEl = document.getElementById('paymentStatus');
            payContainer.classList.toggle('pending', order.paymentStatus === 'UNPAID');
            paymentStatusEl.innerText = (order.paymentStatus === 'UNPAID') ? '未付款' : '已付款';
            document.getElementById('light_pay').innerText = order.paymentMethod === 'CREDIT' ? '線上支付' : '現場付款';
            const displayType = (order.diningType === 'DINE_IN')
                ? `內用桌號:\n(${order.table})`
                : '外帶自取';
            document.getElementById('light_type').innerText = displayType;
            let timeString = "";
            if (order.createdAt) {
                // 1. 判斷它是不是 Firestore Timestamp (有 toDate 函式)，如果是就轉換，否則直接當 Date 處理
                const dateObj = order.createdAt.toDate ? order.createdAt.toDate() : new Date(order.createdAt);
                // 2. 自動轉成你要的「時:分:秒」 (24小時制，例如：17:57:10)
                timeString = dateObj.toLocaleTimeString('zh-TW', {
                    hour12: false,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
            }
            document.getElementById('light_time').innerText = timeString;
            // 更新右側主看板
            document.getElementById('kitchenOrderTotal').innerText = `$${order.totalAmount}`;
            // 渲染商品明細 (假設 order.items 是陣列)
            const billContainer = document.getElementById('kitchenBillContainer');
            billContainer.innerHTML = order.items.map(item => `
                    <div class="bill-item">
                        <span>${item.name} x ${item.qty}</span>
                        <span>$${item.price * item.qty}</span>
                    </div>  `).join('');
            // 如果你的資料庫存的是 name 和 phone：
            // 更新聯絡人與電話 (如果沒有資料，就顯示 '未提供')
            document.getElementById('buyername').innerText = order.buyerName || '未提供';
            document.getElementById('buyerphone').innerText = order.buyerPhone || '未提供';
            document.getElementById('remark').innerText = order.remark || '無備註';
            const statusContainer = document.getElementById('statusContainer');
            const statusTotalEl = document.getElementById('statusTotal');
            statusContainer.classList.toggle('preparing', order.Status === 'PREPARING');
            statusTotalEl.innerText = (order.Status === 'PREPARING') ? '#餐點製作完成請點選此處以通知顧客' : '已完成';
        }
        const gestureTouchBoard = document.getElementById('gestureTouchBoard');
        let touchStartX = 0;
        let touchEndX = 0;
        gestureTouchBoard.addEventListener('touchstart', (e) => {
            // 關鍵修正：必須加上 [0]
            touchStartX = e.changedTouches[0].clientX;
        }, { passive: true });
        gestureTouchBoard.addEventListener('touchend', (e) => {
            // 關鍵修正：必須加上 [0]
            touchEndX = e.changedTouches[0].clientX;
            handleSwipeGesture();
        }, { passive: true });
        function handleSwipeGesture() {
            const diff = touchStartX - touchEndX;
            // 增加一個靈敏度設定，避免太微小的誤觸
            if (Math.abs(diff) < 50) return;
            // 1. 先從 orders 陣列中，根據當前的 activeOrderId 找到它在陣列中的位置
            const currentIndex = orders.findIndex(o => o.id === activeOrderId);
            // 如果因為某些原因找不到 (例如 activeOrderId 是 null)，直接跳出
            if (currentIndex === -1) return;
            let newIndex;
            if (diff > 0) {
                // 左滑 (diff > 0) -> 試著去下一筆 (因為新單在前面，index 0 是最新的，所以「下一筆」其實是 index + 1)
                newIndex = currentIndex + 1;
            } else {
                // 右滑 (diff < 0) -> 試著去上一筆 (index - 1)
                newIndex = currentIndex - 1;
            }
            // 2. 防呆：檢查 newIndex 是否在合法的陣列範圍內
            if (newIndex >= 0 && newIndex < orders.length) {
                // 3. 成功計算出新的 ID，呼叫我們封裝好的 updateUI(id)
                updateUI(orders[newIndex].id);
            } else {
                console.log("已經滑到底了，無法再切換");
            }
        }
        // 初始渲染
        function updateClock() {
            const now = new Date();
            // 格式化時間 (顯示 時:分:秒)
            const timeString = now.toLocaleTimeString('zh-TW', { hour12: false });
            // 將時間填入剛剛定義的 span 中
            document.getElementById('clock').innerText = timeString;
        }
        const AudioController = {
            bell: document.getElementById('orderbell'),
            isMuted: localStorage.getItem("isMuted") === "true",
            init() {
                if (!this.bell) return; // 防呆
                // 🌟 新增：強制設定音效為「循環播放」
                // 這樣打開 volumectrlbox 或是新訂單進來呼叫 play() 時，音效就會一直逼逼叫
                this.bell.loop = true;
                // 1. 恢復音量
                const savedVolume = parseFloat(localStorage.getItem("orderBellVolume")) || 0.5;
                this.bell.volume = savedVolume;
                // 2. 恢復靜音按鈕狀態
                const muteBtn = document.getElementById('muteBtn');
                if (muteBtn) {
                    muteBtn.innerText = this.isMuted ? "🔇 已靜音" : "🔊 聲音開啟";
                    muteBtn.classList.toggle('muted', this.isMuted);
                }
                // 3. 初始化拉桿的 UI 狀態
                const volumeSlider = document.getElementById("volumeslider");
                const volumeValue = document.getElementById("volumevalue");
                if (volumeSlider) {
                    volumeSlider.value = savedVolume;
                    if (volumeValue) volumeValue.textContent = Math.round(savedVolume * 100) + "%";
                    volumeSlider.style.background = `linear-gradient(to right, #007bff ${savedVolume * 100}%, #ddd ${savedVolume * 100}%)`;
                    volumeSlider.addEventListener("input", (e) => {
                        const val = parseFloat(e.target.value);
                        AudioController.bell.volume = val;
                        if (volumeValue) volumeValue.textContent = Math.round(val * 100) + "%";
                        localStorage.setItem("orderBellVolume", val);
                        // 滑動時自動解除靜音
                        if (AudioController.isMuted) AudioController.toggleMute();
                        // 更新拉桿顏色
                        volumeSlider.style.background = `linear-gradient(to right, #007bff ${val * 100}%, #ddd ${val * 100}%)`;
                    });
                }
            },
            play() {
                if (!this.bell) return;
                // 🌟 關鍵修改：不再用 return 擋住播放！
                // 改用原生 .muted 屬性同步狀態。如果是靜音，它會在背景「無聲循環播放」
                // 這樣好處是：當使用者拉動音量桿解除靜音時，聲音能一瞬間從背景冒出來，體驗極佳！
                this.bell.muted = this.isMuted;

                this.bell.currentTime = 0;
                this.bell.play().catch(e => console.warn("自動播放被瀏覽器阻擋", e));
            },
            stop() {
                if (!this.bell) return;
                this.bell.pause();
                this.bell.currentTime = 0;
            },
            toggleMute() {
                this.isMuted = !this.isMuted;
                localStorage.setItem("isMuted", this.isMuted);

                // 🌟 關鍵修改：讓當下「正在播放」的音效，立刻同步最新的靜音狀態！
                // 點擊靜音的瞬間，聲音會立刻消失；再次點擊，聲音會立刻原地恢復
                if (this.bell) {
                    this.bell.muted = this.isMuted;
                }
                const muteBtn = document.getElementById('muteBtn');
                if (muteBtn) {
                    muteBtn.innerText = this.isMuted ? "🔇 已靜音" : "🔊 聲音開啟";
                    muteBtn.classList.toggle('muted', this.isMuted);
                }
            }
        };
        //  全域點擊事件 (負責開關選單、點擊停止音效)
        document.addEventListener('click', async (e) => {
            // 🌟 關鍵修改：先把判斷位置的變數挪到最上方
            const volumeBtn = e.target.closest('[data-action="volumemenu"]');
            const isInsideVolumeBox = e.target.closest('#volumectrlbox');
            const volumeBox = document.getElementById('volumectrlbox');

            // 🔥 【優化功能】：只要聲音正在播，且點擊的地方「不是」音量控制盒、也「不是」音量按鈕，才立刻停止！
            if (AudioController.bell && !AudioController.bell.paused && !isInsideVolumeBox && !volumeBtn) {
                AudioController.stop();
                // 這裡不加上 return，讓使用者點擊畫面的原本動作可以繼續執行
            }

            // 處理靜音按鈕 (獨立出來，避免跟下面打架)
            if (e.target.closest('#muteBtn')) {
                AudioController.toggleMute();
                return;
            }

            // 處理「點擊音量按鈕」開關邏輯
            if (volumeBtn) {
                if (!volumeBox) return;
                const isHidden = window.getComputedStyle(volumeBox).display === "none";
                if (isHidden) {
                    volumeBox.style.display = "flex";
                    AudioController.play(); // 打開時播放測試音
                } else {
                    volumeBox.style.display = "none";
                    AudioController.stop(); // 關閉時停止
                }
                return; // 🛑 點了按鈕就結束判斷，不要往下跑
            }

            // 處理「點擊選單外部」自動關閉（修正尾端未完結的程式碼）
            if (!isInsideVolumeBox && volumeBox && window.getComputedStyle(volumeBox).display !== "none") {
                volumeBox.style.display = "none";
                AudioController.stop(); // 🌟 補齊原本斷掉的地方
            }
            // 處理其他按鈕
            const target = e.target.closest('[data-action]');
            if (!target) return;
            const action = target.dataset.action;
            if (action === 'storemanage') {
                window.location.href = `manage.html?storeId=${storeId}`;
            }
            else if (action === 'cancelReason') {
                const index = currentIndex;
                const order = orders[index];
                handleCancelOrder(order);
            }
            else if (action === 'lightpay') {
                const order = orders[currentIndex];
                if (!order) return;
                // 1. 計算切換後的目標狀態
                const isCurrentlyUnpaid = order.paymentStatus === 'UNPAID';
                const newStatus = isCurrentlyUnpaid ? 'PAID' : 'UNPAID';
                const newPaidAt = isCurrentlyUnpaid ? serverTimestamp() : null;
                // 2. 防呆確認 (這很重要，避免誤觸)
                const confirmMsg = isCurrentlyUnpaid
                    ? "確定要將此筆訂單標記為「已付款」嗎？"
                    : "確定要將此筆訂單改回「未付款」嗎？";
                if (!confirm(confirmMsg)) return;
                // 3. 執行 Firebase 更新
                try {
                    const orderRef = doc(db, "orders", order.id);
                    await updateDoc(orderRef, {
                        paymentStatus: newStatus,
                        paidAt: newPaidAt
                    });
                    // 成功後不需要額外寫 render，因為 onSnapshot 會自動偵測變更並重繪畫面
                    console.log("收款狀態已切換為:", newStatus);

                } catch (error) {
                    console.error("更新狀態失敗:", error);
                    alert("操作失敗，請檢查網路連線。");
                }
            }
            else if (action === 'kitchenOrderTotal') {
                const order = orders[currentIndex];
                if (!order) return;
                // 1. 計算切換後的目標狀態
                const isCurrentlyUnpaid = order.Status === 'PREPARING';
                const newStatus = isCurrentlyUnpaid ? 'COMPLETED' : 'PREPARING';
                const newStatusAt = isCurrentlyUnpaid ? serverTimestamp() : null;
                // 2. 防呆確認 (這很重要，避免誤觸)
                const confirmMsg = isCurrentlyUnpaid
                    ? "確定要將此筆訂單標記為「完成」嗎？"
                    : "確定要將此筆訂單改回「未完成」嗎？";
                if (!confirm(confirmMsg)) return;
                // 3. 執行 Firebase 更新
                try {
                    const orderRef = doc(db, "orders", order.id);
                    await updateDoc(orderRef, {
                        Status: newStatus,
                        StatusAt: newStatusAt
                    });
                    // 成功後不需要額外寫 render，因為 onSnapshot 會自動偵測變更並重繪畫面
                    console.log("製作狀態已切換為:", newStatus);

                } catch (error) {
                    console.error("更新狀態失敗:", error);
                    alert("操作失敗，請檢查網路連線。");
                }
            }
        });
        function handleCancelOrder(order) {
            currentOrderToCancel = order; // 把訂單資料存起來
            const modal = document.getElementById('cancelOrderModal');
            const warningMsg = document.getElementById('cancelWarningMsg');
            const reasonInput = document.getElementById('cancelReasonInput');
            // 每次打開前先清空輸入框
            reasonInput.value = '';
            // 🌟 核心邏輯：判斷是否為線上付款，決定要不要顯示警告
            if (orders.paymentMethod === 'CREDIT' || orders.paymentStatus === 'PAID') {
                warningMsg.style.display = 'block';
            } else {
                warningMsg.style.display = 'none';
            }
            // 顯示燈箱
            modal.style.display = 'flex';
            console.log("傳入的訂單物件是:", currentOrderToCancel);
        }
        // 2. 綁定燈箱內的「返回/放棄」按鈕
        document.getElementById('btnCancelModal').addEventListener('click', () => {
            document.getElementById('cancelOrderModal').style.display = 'none';
            currentOrderToCancel = null; // 清除暫存
        });
        // 3. 綁定燈箱內的「確認取消訂單」按鈕
        document.getElementById('btnConfirmCancel').addEventListener('click', async () => {
            if (!currentOrderToCancel) return;
            const reason = document.getElementById('cancelReasonInput').value.trim();
            // 防呆機制：沒有寫原因不給過
            if (!reason) {
                alert('請務必填寫取消原因，以便後續查帳與管理！');
                document.getElementById('cancelReasonInput').focus();
                return;
            }
            const confirmBtn = document.getElementById('btnConfirmCancel');
            try {
                // 鎖定按鈕，防止店家連點
                confirmBtn.innerText = '處理中...';
                confirmBtn.disabled = true;
                // 🔥 執行 Firestore 更新
                // (假設 currentOrderToCancel.id 是該筆訂單在 Firestore 的 Document ID)
                const orderRef = doc(db, "orders", currentOrderToCancel.id);
                await updateDoc(orderRef, {
                    status: "CANCELLED",
                    cancelReason: reason,
                    cancelledAt: serverTimestamp() // 記錄取消時間
                });
                // 成功後的收尾動作
                alert("訂單已成功取消！");
                document.getElementById('cancelOrderModal').style.display = 'none';
                currentOrderToCancel = null;
                // 🌟🌟🌟 這裡超級重要：記得重新渲染畫面！
                // 可能是呼叫你原本寫的 fetchOrders() 或是 renderTabs() 之類的，
                // 把這筆被取消的訂單從畫面上移走。
            } catch (error) {
                console.error("取消訂單失敗:", error);
                alert("系統發生錯誤，取消失敗。請檢查網路或稍後再試。");
            } finally {
                // 無論成功失敗，按鈕狀態恢復原狀
                confirmBtn.innerText = '確認取消訂單';
                confirmBtn.disabled = false;
            }
        });
        document.addEventListener('DOMContentLoaded', () => {
            initPage();
            // 頁面載入時先執行一次
            updateClock();
            // 每 1000 毫秒（即 1 秒）執行一次更新
            setInterval(updateClock, 1000);
            handleSwipeGesture();
            AudioController.init();
            console.log("系統初始化完成");
        });
    </script>
</body>
