<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PACE 派思 pacetake.tw - 買家首頁</title>
    <!-- Favicon & Apple Touch Icon -->
    <link rel="icon" type="image/png" href="png/logoapple.png" sizes="180x180">
    <link rel="apple-touch-icon" href="png/logoapple.png">
    <link rel="apple-touch-icon" sizes="180x180" href="png/logoapple.png">
    <link rel="apple-touch-icon-precomposed" href="png/logoapple.png">
    <link rel="stylesheet" href="style.css">
    <style>
        /* 頂部導航與大字留白 */
        .store {
            height: 17%;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            border-bottom: 0.2cqw solid var(--border-color);
        }

        .store-header-info {
            height: 80%;
            max-width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
        }

        .store-header-info h1 {
            font-size: 6cqw;
            font-weight: 800;
            letter-spacing: -0.5cqw;
            color: var(--text-main);
        }

        .store-meta {
            height: 20%;
            max-width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
            font-size: 0px;
            color: var(--text-muted);
            margin-top: 6px;
            font-weight: 500;
            display: flex;
            gap: 8px;
        }

        /* 中間精品菜單區 */
        .menu-Container {
            height: 55%;
            max-width: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1cqw;
            /* 卡片與卡片之間的間距改用 cqw */
            padding: 2cqw 3cqw 2cqw 4cqw;
            /* 微調右邊 padding，留出空間給滾動條，卡片才不會黏在一起 */
            box-sizing: border-box;
        }

        .food-card {
            min-height: 24cqw;
            /* 💡 新增：設定最小高度，確保卡片視覺比例穩固 */
            width: 100%;
            /* 撐滿 store-list 的寬度（扣除 padding） */
            display: flex;
            align-items: center;
            gap: 3cqw;
            /* 圖片與文字區塊的間距 */
            background-color: var(--card-bg);
            border: 0.3cqw solid var(--border-color);
            border-radius: 4cqw;
            /* 圓角改用 cqw */
            text-decoration: none;
            color: inherit;
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            padding: 1cqw;
            /* 卡片內部內襯改用 cqw */
            box-sizing: border-box;
        }

        .food-img {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            background-color: var(--bg-global);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            flex-shrink: 0;
            border: 1px solid var(--border-color);
        }

        .food-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-grow: 1;
            gap: 6px;
        }

        .food-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
        }

        .food-price {
            font-size: 18px;
            font-weight: 800;
            color: var(--brand-blue);
        }

        /* 按鈕基本結構 */
        .action-Container {
            flex-shrink: 0;
        }

        .add-cart-btn {
            background-color: var(--bg-global);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .add-cart-btn:active {
            transform: scale(0.92);
        }

        /* 連動下架防線樣式 */
        .food-card.sold-out {
            filter: grayscale(1) opacity(0.5);
            pointer-events: none;
            /* 阻斷所有點擊 */
        }

        .sold-out-btn {
            background-color: #E2E8F0;
            border: 1px solid #CBD5E1;
            color: var(--brand-red);
            font-weight: bold;
            cursor: not-allowed;
        }

        [data-theme="dark"] .sold-out-btn {
            background-color: #262626;
            border-color: #404040;
            color: var(--brand-red);
        }

        /* 底部懸浮欄 */
        .bottom-bar {
            height: 10%;
            max-width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
            bottom: 0;
            left: 0;
            right: 0;
            height: 20cqw;
            width: 100%;
            background-color: var(--blur-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            padding: 0 2cqw;
            z-index: 90;
        }

        .cart-summary {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        .checkout-btn {
            background-color: var(--brand-blue);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 22px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            box-shadow: var(--shadow-sm);
        }
    </style>
</head>

<body>
    <div class="phone-wrapper">
        <div id="buyerView">
            <header id="header">
                <div class="pace-logo">
                    <a href="index.html" class="logo-link">
                        <img src="png/pace3.png" alt="派思 官方網站">
                    </a>
                    <span id="defaultIcon" class="avatar-icon">👤</span>
                    <img id="userAvatarImg" src=""
                        style="font-weight: 500; display: none; border-radius: 50%;font-size: 4.25cqw; height: 75%; max-width: 30%; flex-direction: row; justify-content: flex-end; align-items: flex-end;">
                </div>
                <div class="two">
                    <div class="pace">
                        <button class="theme-toggle" id="themeToggleBtn" aria-label="切換主題">🌙</button>
                        <span>店內價外帶自取/點餐系統</span>
                    </div>
                    <button class="login-btn" id="loginBtn">登入/註冊</button>
                    <button class="user-avatar-btn" id="avatarBtn" style="display: none;">
                        <span class="user-name" id="userNameDisplay"></span></button>
                    <div class="dropdown-menu" id="dropdownMenu"></div>
                </div>
            </header>

            <div class="store">
                <div class="store-header-info" id="storeHeaderInfo">
                    <h1 id="storeNameText">載入中...</h1>
                </div>
                <div class="store-meta">
                    <span id="storeAddressText">📍 載入中...</span>
                    <span>•</span>
                    <span id="storeDistanceText">⚡ 計算中...</span>
                </div>
            </div>

            <main class="menu-Container" id="menuContainer"></main>

            <footer class="bottom-bar">
                <div id="cartSummaryText" class="cart-summary">
                    🛒 購物車已加入<br> 0 項商品 · 總計 $0
                </div>
                <a href="cart.html" class="checkout-btn" id="checkoutBtn">去結帳 >></a>
            </footer>
        </div>
    </div>
    <script src="js/cart-manager.js"></script>
    <script type="module" src="js/app.js"></script>
</body>

</html>
