<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PACE 派思 pacetake.tw - 商家開店</title>
<!-- 1. 給電腦版、手機版 Chrome 瀏覽器標籤頁使用的標準圖示 -->
<link rel="icon" type="image/png" sizes="32x32" href="logo.png">
<link rel="icon" type="image/png" sizes="16x16" href="logo.png">
<!-- 2. 給 Apple iOS 系統（Safari/Chrome）加入主畫面與我的最愛使用的圖示 -->
<link rel="apple-touch-icon" sizes="180x180" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
    <style>
        /* 頂部導航與大字留白 */
        .store {
            padding: 20px 20px 16px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .store-header-info h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .store-meta {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 6px;
            font-weight: 500;
            display: flex;
            gap: 8px;
        }

        /* 中間精品菜單區 */
        .menu-container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .food-card {
            display: flex;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px;
            gap: 12px;
            align-items: center;
            box-shadow: var(--shadow-sm);
            position: relative;
            transition: all 0.2s ease;
        }

        .food-img {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            background-color: var(--bg-global);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            flex-shrink: 0;
            border: 1px solid var(--border-color);
        }

        .food-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-grow: 1;
            gap: 6px;
        }

        .food-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
        }

        .food-price {
            font-size: 18px;
            font-weight: 800;
            color: var(--brand-blue);
        }

        /* 按鈕基本結構 */
        .action-container {
            flex-shrink: 0;
        }

        .add-cart-btn {
            background-color: var(--bg-global);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .add-cart-btn:active {
            transform: scale(0.92);
        }

        /* 連動下架防線樣式 */
        .food-card.sold-out {
            filter: grayscale(1) opacity(0.5);
            pointer-events: none; /* 阻斷所有點擊 */
        }

        .sold-out-btn {
            background-color: #E2E8F0;
            border: 1px solid #CBD5E1;
            color: var(--brand-red);
            font-weight: bold;
            cursor: not-allowed;
        }

        [data-theme="dark"] .sold-out-btn {
            background-color: #262626;
            border-color: #404040;
            color: var(--brand-red);
        }

        /* 底部懸浮欄 */
        .bottom-bar {
            bottom: 0;
            left: 0;
            right: 0;
            height: 20cqw;
            width: 100%;
            background-color: var(--blur-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            padding: 0 2cqw;
            z-index: 90;
        }

        .cart-summary {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        .checkout-btn {
            background-color: var(--brand-blue);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 22px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            box-shadow: var(--shadow-sm);
        }
    </style>
<div class="phone-wrapper">
    <!-- 頂部高級感大字留白區 -->
    <header id="header-container"></header>
    <div class="store">
        <div class="store-header-info" id="storeHeaderInfo">
            <h1 id="storeNameText">正在載入雲端店家...</h1>
            <div class="store-meta">
                <span id="storeAddressText">📍 讀取地址中...</span>
                <span>•</span>
                <span>⚡ 0.05 km</span>
            </div>
        </div>
    </div>

    <!-- 中間精品菜單 -->
    <main class="menu-container" id="menuContainer">
        <!-- 菜單品項會動態渲染在這裡 -->
    </main>

    <!-- 底部懸浮欄 -->
    <footer class="bottom-bar">
        <div class="cart-summary" id="cartSummaryText">
            🛒 購物車已加入<br> 0 項商品 · 總計 $0
        </div>
        <a href="cart.html" class="checkout-btn nav-fast" id="checkoutBtn">去結帳 &gt;&gt;</a>
    </footer>
</div>
<script type="module" src="app.js">
    // ==========================================
// 🚀 PACE 專屬：store.html 點餐與購物車獨立控制腳本
// ==========================================

// 1. 先抓到網址後面的店家 ID
const urlParams = new URLSearchParams(window.location.search);
const currentStoreId = urlParams.get('storeId');

// 2. 當網頁完全開好之後，立刻發動
window.addEventListener('DOMContentLoaded', () => {
    if (!currentStoreId) {
        alert("❌ 找不到店家資訊，將返回首頁！");
        window.location.href = "index.html";
        return;
    }
    
    // 呼叫下方抓資料的函式
    loadStoreAndMenu();
});

// ==========================================
// 專門去雲端抓這家店資料與菜單的函式 (大括號完美修復版)
// ==========================================
async function loadStoreAndMenu() {
    try {
        // 💡 直接沿用您專案最習慣的連線大腦！
        const docRef = firebase.firestore().collection("stores").doc(currentStoreId);
        const docSnap = await docRef.get();

        if (docSnap.exists) {
            const storeData = docSnap.data();
            
                        // --- 區塊 B：畫出中間的菜單品項與備註欄 ---
            const menuList = storeData.menuList || [];
            const menuContainer = document.getElementById('menuContainer');
            menuContainer.innerHTML = ""; // 清空載入中提示

            if (menuList.length === 0) {
                menuContainer.innerHTML = `<div style="text-align:center; padding:10cqw; color:var(--text-main);">📭 本店家目前尚未上架任何餐點。</div>`;
                return;
            }

            let localCartData = []; // 用來裝這頁選好商品的籃子
            const cartSummaryText = document.getElementById('cartSummaryText');

            // 迴圈把菜一道一道畫出來
            menuList.forEach((item, index) => {
                const itemId = `item_${index}`;
                const itemName = item.name || '未命名商品';
                const itemPrice = parseInt(item.price, 10) || 0;
                const itemImg = item.image || '';
                const isSoldOut = storeData.status === "offline";

                const foodCard = document.createElement('div');
                foodCard.className = `food-card ${isSoldOut ? 'sold-out' : ''}`;
                
                // 處理餐點本身的相片 (Base64)
                let imgElement = `🍱`;
                if (itemImg && itemImg.startsWith('data:image')) {
                    imgElement = `<img src="${itemImg}" style="width:100%; height:100%; object-fit:cover; border-radius:2cqw;">`;
                }

                // 注入一整道菜的卡片 HTML (含數量加減與備註輸入框)
                foodCard.innerHTML = `
                    <div class="food-main-row" style="display: flex; width: 100%; align-items: center;">
                        <div class="food-img">${imgElement}</div>
                        <div class="food-info" style="flex: 1; margin-left: 3cqw;">
                            <div class="food-name">${itemName}</div>
                            <div class="food-price">$${itemPrice}</div>
                        </div>
                        <div class="action-container">
                            ${isSoldOut 
                                ? `<button class="add-cart-btn sold-out-btn" disabled>🔴 暫停供應</button>`
                                : `
                                  <div class="quantity-control-panel" style="display: flex; align-items: center; gap: 2cqw; background: var(--bg-secondary); border-radius: 50px; padding: 1cqw 2cqw; border: 1px solid var(--border-color);">
                                      <button class="minus-btn" style="border: none; background: transparent; font-size: 4cqw; padding: 1cqw 3cqw; cursor: pointer; color: var(--text-main); font-weight: bold;">-</button>
                                      <span class="qty-number" style="font-size: 3.5cqw; font-weight: bold; min-width: 4cqw; text-align: center;">0</span>
                                      <button class="plus-btn" style="border: none; background: transparent; font-size: 4cqw; padding: 1cqw 3cqw; cursor: pointer; color: var(--brand-blue); font-weight: bold;">+</button>
                                  </div>
                                `
                            }
                        </div>
                    </div>
                    <div class="note-wrapper" style="width: 100%; margin-top: 2.5cqw; border-top: 1px dashed var(--border-color); padding-top: 2cqw;">
                        <input type="text" class="item-note-input" placeholder="✍️ 填寫去冰、微辣、不加蔥等客製化備註..." style="width: 100%; background: var(--bg-global); border: 1px solid var(--border-color); border-radius: 1.5cqw; padding: 1.5cqw 2.5cqw; font-size: 3cqw; color: var(--text-main); outline: none;">
                    </div>
                `;

                menuContainer.appendChild(foodCard);

                // --- 區塊 C：控制「加鍵」、「減鍵」與「打字備註」的同步計算 ---
                if (!isSoldOut) {
                    const plusBtn = foodCard.querySelector('.plus-btn');
                    const minusBtn = foodCard.querySelector('.minus-btn');
                    const qtyDisplay = foodCard.querySelector('.qty-number');
                    const noteInput = foodCard.querySelector('.item-note-input');

                    // 重新加總下方黑條金額與總數量的功能
                    function refreshTotalCartUI() {
                        let totalQty = 0;
                        let totalPrice = 0;
                        localCartData.forEach(cartItem => {
                            totalQty += cartItem.qty;
                            totalPrice += (cartItem.price * cartItem.qty);
                        });
                        if (cartSummaryText) {
                            cartSummaryText.innerText = `🛒 購物車已加入 ${totalQty} 項商品 · 總計 $${totalPrice}`;
                        }
                    }

                    // 把當前這道菜的最新「數量」與「備註文字」打包存進瀏覽器的功能
                    function saveToBrowserStorage() {
                        const currentQty = parseInt(qtyDisplay.innerText, 10);
                        const currentNote = noteInput ? noteInput.value.trim() : "";

                        // 先清除舊紀錄，防重複
                        localCartData = localCartData.filter(i => i.id !== itemId);

                        // 如果數量大於 0，才寫進籃子裡
                        if (currentQty > 0) {
                            localCartData.push({
                                id: itemId,
                                name: itemName,
                                price: itemPrice,
                                qty: currentQty,
                                note: currentNote, // 備註裝進這裡
                                storeId: currentStoreId
                            });
                        }
                        // 100% 對接您 cart.html 的關鍵金鑰 'pacetake_cart'
                        localStorage.setItem('pacetake_cart', JSON.stringify(localCartData));
                        refreshTotalCartUI();
                    }

                    // 點擊「+」
                    plusBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        let count = parseInt(qtyDisplay.innerText, 10);
                        count += 1;
                        qtyDisplay.innerText = count;
                        saveToBrowserStorage();
                    });

                    // 點擊「-」
                    minusBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        let count = parseInt(qtyDisplay.innerText, 10);
                        if (count > 0) {
                            count -= 1;
                            qtyDisplay.innerText = count;
                            saveToBrowserStorage();
                        }
                    });

                    // 在備註欄每打一個字
                    if (noteInput) {
                        noteInput.addEventListener('input', () => {
                            saveToBrowserStorage();
                        });
                    }
                }
            });

        } else {
            console.error("雲端無此店家檔案。");
            if (document.getElementById('storeNameText')) {
                document.getElementById('storeNameText').innerText = "❌ 店家暫停營業中";
            }
        }
    } catch (error) {
        console.error("載入點餐頁失敗：", error);
    }
}

</script>
</body>
</html>
