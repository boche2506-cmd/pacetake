<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PACE 派思 pacetake.tw - 買家首頁</title>
    <!-- Favicon & Apple Touch Icon -->
    <link rel="icon" type="image/png" href="png/logoapple.png" sizes="180x180">
    <link rel="apple-touch-icon" href="png/logoapple.png">
    <link rel="apple-touch-icon" sizes="180x180" href="png/logoapple.png">
    <link rel="apple-touch-icon-precomposed" href="png/logoapple.png">
    <link rel="stylesheet" href="style.css">
    <style>
        .store {
            /* 這裡的高度與寬度原本是 15% 和 100%，我們用 cqw 重新定義它們的比例 */
            height: 11%;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            /* 改用 space-between 讓上下兩列自動均分上下空間 */
            align-items: stretch;
            box-sizing: border-box;
            border-bottom: 0.2cqw solid var(--border-color);
            padding: 1cqw;
            /* 使用 cqw 控制外襯 padding */
        }

        .store-header-info {
            height: 53%;
            max-width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            gap: 2cqw;
            /* 元件間距改用 cqw */
        }

        .fav-icon {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            height: 100%;
            max-width: 100%;
            font-size: 6cqw;
            padding: 1cqw;
            background-color: transparent;
            border: transparent;
            border-radius: 50%;
            color: var(--text-main);
            cursor: pointer;
        }

        .store-logo-display {
            width: 13cqw;
            /* 你想要的寬度 */
            height: 13cqw;
            /* 你想要的高度 */
            object-fit: contain;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 3cqw;
        }

        /* 確保塞進去的圖片能填滿盒子 */
        .store-logo-display img {
            width: 13cqw;
            /* 依比例放大/縮小 */
            height: 13cqw;
            background-color: var(--bg-global);
            border-radius: 3cqw;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5cqw;
            /* 裡面的 Emoji 大小 */
            flex-shrink: 0;
            object-fit: contain;
            /* 關鍵：確保完整顯示，不裁切，短邊留空 */
            display: block;
            box-sizing: border-box;
        }

        .store-header-info h1 {
            font-size: 6cqw;
            font-weight: 700;
            color: var(--text-main);
        }

        .store-meta {
            height: 45%;
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            line-height: 1.1;
            color: var(--text-main);
            font-size: 3.75cqw;
        }

        .menu-Container {
            height: 62%;
            max-width: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5cqw;
            /* 卡片與卡片之間的間距改用 cqw */
            padding: 1cqw 1.5cqw 1cqw 1cqw;
            /* 微調右邊 padding，留出空間給滾動條，卡片才不會黏在一起 */
            box-sizing: border-box;
        }

        /* 卡片基礎樣式 */
        .food-card {
            min-height: 34cqw;
            width: 100%;
            background-color: var(--card-bg);
            border: 0.3cqw solid var(--border-color);
            border-radius: 4cqw;
            text-decoration: none;
            color: inherit;
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            padding: 0.5cqw;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: stretch;
        }

        .card-note-display {
            height: 5cqw;
            max-width: 100%;
            font-size: 4cqw;
            font-weight: 600;
            color: var(--text-muted);
            line-height: 1.1;
            /* 讓行距跟著字體一起自動調整 */
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            align-items: center;
            box-sizing: border-box;
            white-space: nowrap;
            padding: 0 2cqw;
        }

        .food-img-info {
            height: 24cqw;
            width: 100%;
            border-radius: 4cqw;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            padding: 0.5cqw;
            box-sizing: border-box;
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            align-items: stretch;
            gap: 2cqw;
        }

        .food-img {
            padding: 0.5cqw;
            height: 23cqw;
            width: 23cqw;
            background-color: var(--bg-global);
            border-radius: 3cqw;
            align-items: center;
            justify-content: center;
            font-size: 5cqw;
            /* 裡面的 Emoji 大小 */
            flex-shrink: 0;
            object-fit: contain;
            /* 關鍵：確保完整顯示，不裁切，短邊留空 */
            display: block;
            box-sizing: border-box;
            position: relative;
        }

        .food-info {
            height: 24cqw;
            width: 76%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-start;
            box-sizing: border-box;
        }

        .food-name {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            height: 35%;
            max-width: 100%;
            font-size: 6cqw;
            /* 字體改用 cqw */
            font-weight: 700;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            /* 💡 新增：隱藏超出部分 */
            text-overflow: ellipsis;
            /* 超出顯示 ... */
            line-height: 1.1;
        }

        .size-options {
            height: 65%;
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: stretch;
            gap: 2cqw;
        }

        .one-size-row {
            height: 65%;
            width: 20cqw;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
        }

        .size-row {
            height: 100%;
            width: 20cqw;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
        }

        .size-label,
        .food-price {
            height: 35%;
            width: 100%;
            border: 0.2cqw solid #ddd;
            border-radius: 1.5cqw;
            cursor: pointer;
            font-size: 4.25cqw;
            color: white;
            transition: all 0.2s;
            background: #ff5722;
            border-color: #ff5722;
            font-weight: bold;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            line-height: 1.1;
        }

        .quantity-control-panel {
            height: 55%;
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
            line-height: 1.1;
        }

        .note-wrapper {
            height: 5cqw;
            max-width: 100%;
            font-size: 4cqw;
            font-weight: 600;
            line-height: 1.1;
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            align-items: center;
            box-sizing: border-box;
            white-space: nowrap;
            padding: 0 2cqw;
        }



        .input-style {
            width: 100%;
            height: 100%;
            color: var(--text-main);
            background-color: var(--bg-global);
            border: 0.2cqw solid var(--border-color);
            border-radius: 2cqw;
            padding: 0 2cqw;
            font-size: 4cqw;
            outline: none;
            line-height: 1.1;
        }

        .minus-btn,
        .plus-btn {
            width: 6cqw;
            height: 6cqw;
            border-radius: 50%;
            border: none;
            background: #eee;
            font-size: 6cqw;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            line-height: 1.1;
        }

        .qty-number {
            font-weight: bold;
            min-width: 5cqw;
            text-align: center;
            color: var(--text-main);
        }

        [data-theme="dark"] .sold-out-btn {
            background-color: #262626;
            border-color: #404040;
            color: var(--brand-red);
        }

        /* 底部懸浮欄 */
        .bottom-bar {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            height: 12%;
            /* 保留你原本佔外殼的 15% 高度比例 */
            max-width: 100%;
            background-color: var(--blur-bg);
            border-top: 0.3cqw solid var(--border-color);
            /* 邊框 cqw */
            padding: 1cqw 2cqw;
            /* 左右微調內襯，讓留白更好看 */
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .cart-summary {
            font-size: 4cqw;
            font-weight: 600;
            color: var(--text-main);
        }

        .checkout-btn {
            background-color: var(--brand-blue);
            color: white;
            border: none;
            padding: 4cqw;
            border-radius: 6cqw;
            font-size: 4cqw;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            box-shadow: var(--shadow-sm);
        }
    </style>
</head>

<body>
    <div class="phone-wrapper">
        <div id="buyerView">
            <header class="header">
                <div class="pace-logo">
                    <a href="index.html" class="logo-link">
                        <img src="png/pace3.png" alt="派思 官方網站">
                    </a>
                    <div class="pace-avatar-icon">
                        <span id="defaultIcon" class="avatar-icon">👤</span>
                        <img id="userAvatarImg" src=""
                            style="display: none; border-radius: 50%;height: 13cqw; width: 13cqw;">
                    </div>
                </div>
                <div class="two">
                    <div class="pace">
                        <button class="theme-toggle" id="themeToggleBtn" aria-label="切換主題">🌙</button>
                        <span>店內價外帶自取/點餐系統</span>
                    </div>
                    <button class="login-btn" id="loginBtn">登入/註冊</button>
                    <button class="user-avatar-btn" id="avatarBtn" style="display: none;">
                        <span class="user-name" id="userNameDisplay"></span></button>
                    <div class="dropdown-menu" id="dropdownMenu"></div>
                </div>
            </header>

            <div class="store">
                <div class="store-header-info" id="storeHeaderInfo">
                    <div id="logo-wrapper" class="store-logo-display"></div>
                    <h1 id="storeNameText">載入中...</h1>
                    <button id="favorite-btn" class="fav-icon" aria-label="加入最愛">
                        <span id="heart-icon">🤍</span>
                    </button>
                </div>
                <div class="store-meta">
                    <span id="storeAddressText">📍 載入中...</span>
                    <span id="storeDistanceText">⚡ 計算中...</span>
                </div>
            </div>

            <main class="menu-Container" id="menuContainer"></main>

            <footer class="bottom-bar">
                <div id="cartSummaryText" class="cart-summary">
                    🛒 購物車已加入<br> 0 項商品 · 總計 $0
                </div>
                <a href="cart.html" class="checkout-btn" id="checkoutBtn">去結帳 >></a>
            </footer>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>

</html>
