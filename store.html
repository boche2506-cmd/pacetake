<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PACE 派思 pacetake.tw - 商家開店</title>
<!-- 1. 給電腦版、手機版 Chrome 瀏覽器標籤頁使用的標準圖示 -->
<link rel="icon" type="image/png" sizes="32x32" href="logo.png">
<link rel="icon" type="image/png" sizes="16x16" href="logo.png">
<!-- 2. 給 Apple iOS 系統（Safari/Chrome）加入主畫面與我的最愛使用的圖示 -->
<link rel="apple-touch-icon" sizes="180x180" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
    <style>
        /* 頂部導航與大字留白 */
        .store {
            padding: 20px 20px 16px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .store-header-info h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .store-meta {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 6px;
            font-weight: 500;
            display: flex;
            gap: 8px;
        }

        /* 中間精品菜單區 */
        .menu-container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .food-card {
            display: flex;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px;
            gap: 12px;
            align-items: center;
            box-shadow: var(--shadow-sm);
            position: relative;
            transition: all 0.2s ease;
        }

        .food-img {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            background-color: var(--bg-global);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            flex-shrink: 0;
            border: 1px solid var(--border-color);
        }

        .food-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-grow: 1;
            gap: 6px;
        }

        .food-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
        }

        .food-price {
            font-size: 18px;
            font-weight: 800;
            color: var(--brand-blue);
        }

        /* 按鈕基本結構 */
        .action-container {
            flex-shrink: 0;
        }

        .add-cart-btn {
            background-color: var(--bg-global);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .add-cart-btn:active {
            transform: scale(0.92);
        }

        /* 連動下架防線樣式 */
        .food-card.sold-out {
            filter: grayscale(1) opacity(0.5);
            pointer-events: none; /* 阻斷所有點擊 */
        }

        .sold-out-btn {
            background-color: #E2E8F0;
            border: 1px solid #CBD5E1;
            color: var(--brand-red);
            font-weight: bold;
            cursor: not-allowed;
        }

        [data-theme="dark"] .sold-out-btn {
            background-color: #262626;
            border-color: #404040;
            color: var(--brand-red);
        }

        /* 底部懸浮欄 */
        .bottom-bar {
            bottom: 0;
            left: 0;
            right: 0;
            height: 20cqw;
            width: 100%;
            background-color: var(--blur-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            padding: 0 2cqw;
            z-index: 90;
        }

        .cart-summary {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        .checkout-btn {
            background-color: var(--brand-blue);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 22px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            box-shadow: var(--shadow-sm);
        }
    </style>
<div class="phone-wrapper">
    <!-- 頂部高級感大字留白區 -->
    <header id="header-container"></header>
    <div class="store">
        <div class="store-header-info" id="storeHeaderInfo">
            <h1 id="storeNameText">正在載入雲端店家...</h1>
            <div class="store-meta">
                <span id="storeAddressText">📍 讀取地址中...</span>
                <span>•</span>
                <span>⚡ 0.05 km</span>
            </div>
        </div>
    </div>

    <!-- 中間精品菜單 -->
    <main class="menu-container" id="menuContainer">
        <!-- 菜單品項會動態渲染在這裡 -->
    </main>

    <!-- 底部懸浮欄 -->
    <footer class="bottom-bar">
        <div class="cart-summary" id="cartSummaryText">
            🛒 購物車已加入<br> 0 項商品 · 總計 $0
        </div>
        <a href="cart.html" class="checkout-btn nav-fast" id="checkoutBtn">去結帳 &gt;&gt;</a>
    </footer>
</div>
<script type="module" src="app.js">
    // ==========================================
    // 🧯 1. FIREBASE 初始化防線（請填入您專案的真實金鑰）
    // ==========================================
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY_HERE",
        authDomain: "YOUR_PROJECT_://firebaseapp.com",
        projectId: "YOUR_PROJECT_ID_HERE",
        storageBucket: "YOUR_PROJECT_://appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    // 確保不重複初始化，安全防線
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

    // ==========================================
    // 🚀 2. 解析網址並「強制推進」撈取雲端資料
    // ==========================================
    const urlParams = new URLSearchParams(window.location.search);
    const currentStoreId = urlParams.get('storeId');

    console.log("[PACE DEBUG] 網址抓到的店家 ID 為:", currentStoreId);

    if (!currentStoreId) {
        alert("❌ 找不到店家資訊，將返回首頁！");
        window.location.href = "index.html";
    } else {
        // 拋棄所有監聽器，直接執行！
        fetchStoreAndMenu();
    }

    function fetchStoreAndMenu() {
        console.log("[PACE DEBUG] 開始連線 Firestore 讀取店家...");
        const db = firebase.firestore();
        
        db.collection("stores").doc(currentStoreId).get().then((doc) => {
            console.log("[PACE DEBUG] Firebase 連線成功！該店家存在狀態:", doc.exists);
            
            if (doc.exists) {
                const storeData = doc.data();
                
                // 讀取您的真實資料庫欄位
                const finalName = storeData.shopName || '未命名店家';
                const finalAddress = storeData.shopAddress || '';
                const emoji = storeData.shopLogo || '🏪';

                // 渲染頂部店家資訊
                document.getElementById('storeNameText').innerText = `${finalName}`;
                document.getElementById('storeAddressText').innerText = `📍 ${finalAddress}`;
                
                // 讀取您的 menuList 陣列
                const menuList = storeData.menuList || [];
                const menuContainer = document.getElementById('menuContainer');
                menuContainer.innerHTML = ""; // 清空載入中提示

                if (menuList.length === 0) {
                    menuContainer.innerHTML = `<div style="text-align:center; padding:10cqw; color:var(--text-main);">📭 本店家目前尚未上架任何餐點。</div>`;
                    return;
                }

                // 迴圈渲染菜單陣列
                menuList.forEach((item, index) => {
                    const itemId = `item_${index}`; 
                    const itemName = item.name || '未命名商品';
                    const itemPrice = parseInt(item.price, 10) || 0;
                    const itemImg = item.image || ''; 
                    
                    // 根據您資料庫的 status 判斷是否下線
                    const isSoldOut = storeData.status === "offline"; 

                    const foodCard = document.createElement('div');
                    foodCard.className = `food-card ${isSoldOut ? 'sold-out' : ''}`;
                    foodCard.setAttribute('data-price', itemPrice);
                    foodCard.setAttribute('data-id', itemId);
                    foodCard.setAttribute('data-name', itemName);

                    // 處理您資料庫中的 Base64 圖片編碼
                    let imgElement = `🍱`;
                    if (itemImg && itemImg.startsWith('data:image')) {
                        imgElement = `<img src="${itemImg}" style="width:100%; height:100%; object-fit:cover; border-radius:2cqw;">`;
                    }

                    foodCard.innerHTML = `
                        <div class="food-img">${imgElement}</div>
                        <div class="food-info">
                            <div class="food-name">${itemName} ${isSoldOut ? '(暫停供應)' : ''}</div>
                            <div class="food-price">$${itemPrice}</div>
                        </div>
                        <div class="action-container">
                            ${isSoldOut 
                                ? `<button class="add-cart-btn sold-out-btn" disabled>🔴 暫停供應</button>`
                                : `<button class="add-cart-btn btn-trigger">➕ 加到購物車</button>`
                            }
                        </div>
                    `;

                    menuContainer.appendChild(foodCard);

                    // 動態對接購物車點擊事件
                    if (!isSoldOut) {
                        const btn = foodCard.querySelector('.btn-trigger');
                        bindCartEvent(btn);
                    }
                });

            } else {
                document.getElementById('storeNameText').innerText = "❌ 店家不存在";
                document.getElementById('menuContainer').innerHTML = "雲端無此店家檔案。";
            }
        })
        .catch((error) => {
            console.error("[PACE ERROR] 讀取失敗，原因為:", error);
            document.getElementById('storeNameText').innerText = "❌ 雲端連線失敗";
        });
    }

    // ==========================================
    // 🏎️ 3. 0秒無縫閃轉外掛核心架構
    // ==========================================
    function bindFastClick(element, callback) {
        if (!element) return;
        let triggered = false;
        function trigger(e) {
            if (!triggered) {
                triggered = true;
                setTimeout(() => { triggered = false; }, 300);
                callback(e);
            }
            e.preventDefault();
        }
        element.addEventListener('touchstart', trigger, { passive: false });
        element.addEventListener('mousedown', trigger);
    }

    // 🌓 系統全局膚色同步防線
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    function initTheme() {
        const savedTheme = localStorage.getItem('pacetake-theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    }
    bindFastClick(themeToggleBtn, () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('pacetake-theme', newTheme);
    });
    initTheme();

    // ==========================================
    // 🛒 4. 購物車暫存與動態計數核心
    // ==========================================
    let cartCount = 0;
    let cartTotal = 0;
    let localCartData = []; // 用來暫存準備傳給 cart.html 的資料
    const cartSummaryText = document.getElementById('cartSummaryText');

    function updateCartUI() {
        cartSummaryText.innerText = `🛒 購物車已加入 ${cartCount} 項商品 · 總計 $${cartTotal}`;
    }

    function bindCartEvent(btn) {
        bindFastClick(btn, (e) => {
            const card = btn.closest('.food-card');
            if(card.classList.contains('sold-out')) return; 
            
            const price = parseInt(card.getAttribute('data-price'), 10);
            const id = card.getAttribute('data-id');
            const name = card.getAttribute('data-name');
            
            // 累加數值
            cartCount += 1;
            cartTotal += price;

            // 存入暫存陣列，以便等等傳給 cart.html（對接剛才的 localStorage 結構）
            const existingItem = localCartData.find(i => i.id === id);
            if (existingItem) {
                existingItem.qty += 1;
            } else {
                localCartData.push({
                    id: id,
                    name: name,
                    price: price,
                    qty: 1,
                    storeId: currentStoreId // 傳送當前店家 ID，供金流判斷
                });
            }
            // 寫入 localStorage 供下一頁讀取
            localStorage.setItem('pacetake_cart', JSON.stringify(localCartData));

            // 精品流暢點擊回饋動畫
            btn.innerText = "✓ 已加入";
            btn.style.backgroundColor = "rgba(0, 102, 255, 0.1)";
            btn.style.color = "var(--brand-blue)";
            btn.style.borderColor = "var(--brand-blue)";

            setTimeout(() => {
                btn.innerText = "➕ 加到購物車";
                btn.style.backgroundColor = "var(--bg-global)";
                btn.style.color = "var(--text-main)";
                btn.style.borderColor = "var(--border-color)";
            }, 400);

            updateCartUI();
        });
    }

    // 全局相對路徑跳轉無縫對接
const navElements = document.querySelectorAll('.nav-fast');
navElements.forEach(elem => {
    bindFastClick(elem, () => {
        const dest = elem.getAttribute('href');
        
        // 檢查如果網址存在，且不是「#」空網址，就執行跳轉
        if (dest && dest !== '#') {
            window.location.href = dest;
        }
    });
});
</script>
</body>
</html>
