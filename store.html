<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PACE 派思 店內價外帶自取/點餐系統</title>
    <!-- PWA 配置 -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#ffffff">
    <!-- 一般網頁分頁圖示 -->
    <link rel="icon" type="image/png" href="png/logo192.png" sizes="192x192">
    <!-- iPhone 桌面圖示專用（已修改為 180x180 正方形） -->
    <link rel="apple-touch-icon" href="png/logo180.png">
    <link rel="stylesheet" href="style.css">
    <style>
        .store {
            /* 這裡的高度與寬度原本是 15% 和 100%，我們用 cqw 重新定義它們的比例 */
            height: 13%;
            max-width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            /* 改用 space-between 讓上下兩列自動均分上下空間 */
            align-items: stretch;
            box-sizing: border-box;
            padding: 0.25cqw;
            /* 使用 cqw 控制外襯 padding */
        }

        .store-logo {
            /* 這裡的高度與寬度原本是 15% 和 100%，我們用 cqw 重新定義它們的比例 */
            height: 100%;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            /* 改用 space-between 讓上下兩列自動均分上下空間 */
            align-items: stretch;
            box-sizing: border-box;
            border-bottom: 0.2cqw solid var(--border-color);
            padding: 0.25cqw;
            /* 使用 cqw 控制外襯 padding */
            flex: 1;
        }

        .store-logo-display {
            aspect-ratio: 1 / 1;
            /* 你想要的寬度 */
            height: 100%;
            /* 你想要的高度 */
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 3cqw;
        }

        /* 確保塞進去的圖片能填滿盒子 */
        .store-logo-display img {
            width: 100%;
            /* 依比例放大/縮小 */
            height: 100%;
            background-color: var(--bg-global);
            border-radius: 3cqw;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5cqw;
            /* 裡面的 Emoji 大小 */
            flex-shrink: 0;
            object-fit: contain;
            /* 關鍵：確保完整顯示，不裁切，短邊留空 */
            display: block;
            box-sizing: border-box;
        }

        .store-header-info {
            height: 55%;
            max-width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            padding-left: 1cqw;
        }

        .fav-icon {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            height: 100%;
            max-width: 100%;
            font-size: 8cqw;
            padding: 1cqw;
            background-color: transparent;
            border: transparent;
            border-radius: 50%;
            color: var(--text-main);
            cursor: pointer;
            transition: transform 0.2s;
            /* 按下去會有一點點回饋感 */
        }

        .fav-icon:active {
            transform: scale(0.95);
            /* 按下去變小一點，模擬點擊感 */
        }



        .store-header-info h1 {
            font-size: 6cqw;
            font-weight: 700;
            color: var(--text-main);
        }

        .storephone {
            font-size: 3cqw;
            font-weight: 500;
            color: var(--text-main);
        }

        .store-meta {
            height: 45%;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: start;
            box-sizing: border-box;
            line-height: 1.1;
            color: var(--text-main);
            font-size: 3.75cqw;
        }

        .storeAddressText {
            transition: transform 0.2s;
            /* 按下去會有一點點回饋感 */
        }

        .storeAddressText:active {
            transform: scale(0.95);
            /* 按下去變小一點，模擬點擊感 */
        }

        .category-header {
            width: 100%;
            height: 6%;
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            align-items: center;
            box-sizing: border-box;
            /* 防止輸入框爆開 */
            overflow-x: auto;
            gap: 0.25cqw;
            line-height: 1.1;
            /* 隱藏 Firefox 的卷軸 */
            scrollbar-width: none;
            /* 確保內容依然可以滑動 */
            -ms-overflow-style: none;
            cursor: grab;
            /* 隱藏 Chrome, Safari, Edge 的卷軸 */
            touch-action: manipulation
        }

        .category-header::-webkit-scrollbar {
            /* Chrome, Safari 隱藏軸線 */
            display: none;
        }

        .menuContainer {
            height: 54%;
            max-width: 100%;
            overflow-y: auto;
            display: grid;
            flex-direction: row;
            justify-content: space-between;
            align-items: start;
            align-content: start;
            grid-template-columns: 1fr 1fr;
            gap: 0.25cqw;
            /* 卡片與卡片之間的間距改用 cqw */
            padding: 0.5cqw;
            /* 微調右邊 padding，留出空間給滾動條，卡片才不會黏在一起 */
            box-sizing: border-box;
            /* 隱藏 Firefox 的卷軸 */
            scrollbar-width: none;
            /* 確保內容依然可以滑動 */
            -ms-overflow-style: none;
            /* 隱藏 Chrome, Safari, Edge 的卷軸 */
        }

        .menuContainer::-webkit-scrollbar {
            /* Chrome, Safari 隱藏軸線 */
            display: none;
        }

        /* 卡片基礎樣式 */
        .food-card {
            height: 24cqw;
            width: 100%;
            display: flex;
            flex-direction: row;
            align-items: center;
            color: inherit;
            /* 繼承父色 */
            border-radius: 3cqw;
            padding: 0.125cqw;
            gap: 0.5cqw;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-sizing: border-box;
        }

        .food-card:hover {
            transform: translateY(-0.5cqw);
            box-shadow: 0 1cqw 3cqw rgba(0, 0, 0, 0.06);
        }

        .food-img {
            height: 100%;
            aspect-ratio: 1 / 1;
            display: block;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-global);
            border-radius: 3cqw;
            font-size: 5cqw;
            /* 裡面的 Emoji 大小 */
            flex-shrink: 0;
            object-fit: cover;
            box-sizing: border-box;
            position: relative;
        }

        .food-info {
            height: 100%;
            flex: 1;
            /*占滿剩餘寬度*/
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            gap: 0.125cqw;
        }

        .food-name {
            height: 50%;
            width: 100%;
            font-size: 4cqw;
            /* 字體改用 cqw */
            font-weight: 600;
            color: var(--text-main);
            white-space: normal;
            overflow: visible;
            /* 💡 新增：隱藏超出部分 */
            text-overflow: clip;
            /* 超出顯示 ... */
            line-height: 1.1;
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            align-items: center;
        }

        .one-size-row {
            height: 50%;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
        }

        .food-price {
            height: 50%;
            width: 100%;
            border-radius: 1.5cqw;
            cursor: pointer;
            font-size: 4.25cqw;
            color: var(--brand-blue);
            transition: all 0.2s;
            font-weight: bold;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            line-height: 1.1;
        }

        .quantity-control-panel {
            height: 50%;
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
            line-height: 1.1;
        }

        .input-style {
            width: 100%;
            height: 90%;
            color: var(--text-main);
            background-color: var(--bg-global);
            border: 0.2cqw solid var(--border-color);
            border-radius: 2cqw;
            padding: 0 2cqw;
            font-size: 4cqw;
            outline: none;
            line-height: 1.1;
        }

        .minus-btn {
            width: 6cqw;
            height: 6cqw;
            border-radius: 50%;
            border: none;
            background: #eee;
            color: var(--brand-red);
            font-size: 6cqw;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            line-height: 1.1;
            transition: transform 0.2s;
            /* 按下去會有一點點回饋感 */
        }

        .plus-btn {
            width: 6cqw;
            height: 6cqw;
            border-radius: 50%;
            border: none;
            background: #eee;
            color: var(--brand-green);
            font-size: 6cqw;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            line-height: 1.1;
            transition: transform 0.2s;
            /* 按下去會有一點點回饋感 */
        }

        .minus-btn:active,
        .plus-btn:active {
            transform: scale(0.95);
            /* 按下去變小一點，模擬點擊感 */
        }

        .qty-number {
            font-weight: bold;
            min-width: 5cqw;
            text-align: center;
            color: var(--text-main);
        }

        [data-theme="dark"] .sold-out-btn {
            background-color: #262626;
            border-color: #404040;
            color: var(--brand-red);
        }

        /* 底部懸浮欄 */
        .bottom-bar {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            height: 12%;
            /* 保留你原本佔外殼的 15% 高度比例 */
            max-width: 100%;
            background-color: var(--blur-bg);
            border-top: 0.3cqw solid var(--border-color);
            /* 邊框 cqw */
            padding: 1cqw 2cqw;
            /* 左右微調內襯，讓留白更好看 */
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .cart-summary {
            font-size: 4cqw;
            font-weight: 600;
            color: var(--text-main);
        }

        .checkout-btn {
            background-color: var(--brand-blue);
            color: white;
            border: none;
            padding: 4cqw;
            border-radius: 6cqw;
            font-size: 4cqw;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s;
            /* 按下去會有一點點回饋感 */
        }

        .checkout-btn:active {
            transform: scale(0.95);
            /* 按下去變小一點，模擬點擊感 */
        }
    </style>
</head>

<body>
    <div class="phone-wrapper">
        <div id="buyerView">
            <header class="header">
                <div class="pace-logo">
                    <a href="index.html" class="logo-link">
                        <img src="png/pace3.png" alt="派思 官方網站">
                    </a>
                    <div class="avatar-container">
                        <span id="defaultIcon">👤</span>
                        <img id="userAvatarImg" src=""
                            style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;"
                            onerror="this.style.display='none'; document.getElementById('defaultIcon').style.display='block';">
                    </div>
                </div>
                <div class="two">
                    <div class="pace">
                        <button class="theme-toggle" id="themeToggleBtn" aria-label="切換主題">🌙</button>
                        <span>店內價外帶自取/點餐系統</span>
                    </div>
                    <div class="avatarBtnMenu" data-action="avatarBtnMenu">
                        <span class="user-name" id="userNameDisplay"></span>
                        <div class="dropdown-menu" id="dropdownMenu"></div>
                    </div>
                </div>
            </header>

            <div class="store">
                <div id="logo-wrapper" class="store-logo-display"></div>
                <div class="store-logo">
                    <div class="store-header-info">
                        <h1 id="storeNameText">載入中...</h1>
                        <div class="storephone">電話:<span id="storephone">讀取中...</span></div>
                        <button data-action="favorite-btn" class="fav-icon" aria-label="加入最愛">
                            <span id="heart-icon">🤍</span>
                        </button>
                    </div>
                    <div class="store-meta">
                        <span id="storeDistanceText">⚡ 計算中...</span>
                        <a class="storeAddressText" id="storeAddressText">📍 載入中...</a>
                    </div>
                </div>
            </div>
            <div class="category-header" id="categoryHeader"></div>
            <main class="menuContainer" id="menuContainer"></main>
            <footer class="bottom-bar">
                <div id="cartSummaryText" class="cart-summary">
                    🛒 購物車已加入<br> 0 項商品 · 總計 $0
                </div>
                <a href="cart.html" class="checkout-btn" id="checkoutBtn">去結帳 >></a>
            </footer>
        </div>
        <div class="lightbox-modal" id="loginLightbox" style="display: none;">
            <div class="modal-card">
                <div class="modal-title" style=" font-weight: 600; color: var(--text-main);">加入PACE 派思</div>
                <button class="modal-btn google" data-action="googleLogin"
                    style="box-shadow: 0 0.2cqw 0.125 rgba(0,0,0,0.05);">
                    <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right:0.5cqw;">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
                        <path fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
                    </svg>
                    Google 登入
                </button>
                <button data-action="toggleEmailFormBtn"
                    style="display: flex; align-items: center; justify-content: center; width: 100%; margin-bottom: 5cqw; background-color: white; border: 0.2cqw solid #e5e7eb; border-radius: 3cqw; padding: 3cqw 0; font-size: 5cqw; font-weight: 600; color: #374151; cursor: pointer; box-shadow: 0 0.5cqw 2cqw rgba(0,0,0,0.05);">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" style="margin-right:0.5cqw;">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    使用電子郵件登入
                </button>
                <div id="emailFormSection" class="email-form">
                    <div style="margin-bottom: 1cqw;">
                        <label for="loginEmail"
                            style="display:block; margin-bottom: 5cqw; font-size:5cqw; color:#6b7280; font-weight:700;">電子郵件</label>
                        <input type="email" id="loginEmail" placeholder="請輸入 Email" autocomplete="username"
                            style="width: 100%; box-sizing: border-box; padding: 2cqw; border:0.2cqw solid #e5e7eb; border-radius:2cqw; box-sizing:border-box; font-size:5cqw; background-color:#f9fafb; color: #111111;">
                    </div>
                    <div style="margin-bottom:10cqw;">
                        <label for="loginPassword"
                            style="display:block; margin-bottom:0.25cqw; font-size:5cqw; color:#6b7280; font-weight:500;">密碼</label>
                        <div style="position: relative; display: flex; align-items: center;">
                            <input type="password" id="loginPassword" placeholder="請輸入密碼"
                                autocomplete="current-password"
                                style="width: 100%; padding:0.25cqw 0.75cqw; border:0.2cqw solid #e5e7eb; border-radius:2cqw; box-sizing:border-box; font-size:5cqw; background-color:#f9fafb; color: #111111;">
                            <button type="button" data-action="togglePasswordVisibility"
                                style="position: absolute; right: 5cqw; background: none; border: none; cursor: pointer; font-size: 5cqw; padding: 0; color: #6b7280; z-index: 10;">👁️</button>
                        </div>
                    </div> <button data-action="emailLogin"
                        style="background-color: #059669; color: white; border: none; width: 100%; padding: 0.25cqw; border-radius: 0.5cqw; font-size: 5cqw; font-weight: 700; cursor: pointer; box-shadow: 0 0.25cqw 0.5cqw rgba(255, 255, 255, 0.15);">電子郵件登入
                        / 註冊</button>
                </div><span class="modal-close" data-action="customReturnBtn"
                    style="margin-top: 0.5cqw; text-decoration: underline; cursor: pointer; display: block; text-align: center;">暫時返回</span>
            </div>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>

</html>
