<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>快拿自取街 pacetake.tw - 店家菜單</title>
    <!-- 精品藍色便當純代碼 SVG Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20x%3D%2210%22%20y%3D%2230%22%20width%3D%2280%22%20height%3D%2255%22%20rx%3D%2210%22%20fill%3D%22%230066FF%22%2F%3E%3Cpath%20d%3D%22M25%2030%20V15%20Q25%2010%2035%2010%20H65%20Q75%2010%2075%2015%20V30%22%20fill%3D%22none%22%20stroke%3D%22%230066FF%22%20stroke-width%3D%228%22%2F%3E%3Cline%20x1%3D%2210%22%20y1%3D%2255%22%20x2%3D%2290%22%20y2%3D%2255%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%224%22%2F%3E%3C%2Fsvg%3E">

    <style>
        /* 全局變數與主題防線 */
        :root {
            --bg-global: #F8FAFC;
            --bg-container: #FFFFFF;
            --border-color: #E2E8F0;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --brand-blue: #0066FF;
            --brand-red: #EF4444;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.05);
            --card-bg: #FFFFFF;
            --blur-bg: rgba(255, 255, 255, 0.85);
        }

        [data-theme="dark"] {
            --bg-global: #0A0A0A;
            --bg-container: #111111;
            --border-color: #262626;
            --text-main: #F5F5F5;
            --text-muted: #A3A3A3;
            --brand-blue: #3B82F6;
            --brand-red: #F87171;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.4);
            --card-bg: #1C1C1E;
            --blur-bg: rgba(17, 17, 17, 0.85);
        }

        /* 基礎重設 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-global);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            transition: background-color 0.15s ease;
        }

        /* 手機直屏精品大外框與細邊界 */
        .phone-wrapper {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            background-color: var(--bg-container);
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            position: relative;
            padding-bottom: 90px;
            display: flex;
            flex-direction: column;
        }

        /* 頂部導航與大字留白 */
        .header {
            padding: 20px 20px 16px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .back-btn {
            background: none;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
            background-color: var(--card-bg);
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            font-size: 16px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            background-color: var(--card-bg);
        }

        .store-header-info h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .store-meta {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 6px;
            font-weight: 500;
            display: flex;
            gap: 8px;
        }

        /* 中間精品菜單區 */
        .menu-container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .food-card {
            display: flex;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px;
            gap: 12px;
            align-items: center;
            box-shadow: var(--shadow-sm);
            position: relative;
            transition: all 0.2s ease;
        }

        .food-img {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            background-color: var(--bg-global);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            flex-shrink: 0;
            border: 1px solid var(--border-color);
        }

        .food-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-grow: 1;
            gap: 6px;
        }

        .food-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
        }

        .food-price {
            font-size: 18px;
            font-weight: 800;
            color: var(--brand-blue);
        }

        /* 按鈕基本結構 */
        .action-container {
            flex-shrink: 0;
        }

        .add-cart-btn {
            background-color: var(--bg-global);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .add-cart-btn:active {
            transform: scale(0.92);
        }

        /* 連動下架防線樣式 */
        .food-card.sold-out {
            filter: grayscale(1) opacity(0.5);
            pointer-events: none; /* 阻斷所有點擊 */
        }

        .sold-out-btn {
            background-color: #E2E8F0;
            border: 1px solid #CBD5E1;
            color: var(--brand-red);
            font-weight: bold;
            cursor: not-allowed;
        }

        [data-theme="dark"] .sold-out-btn {
            background-color: #262626;
            border-color: #404040;
            color: var(--brand-red);
        }

        /* 底部懸浮欄 */
        .bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 76px;
            background-color: var(--blur-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 90;
        }

        .cart-summary {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        .checkout-btn {
            background-color: var(--brand-blue);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 22px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            box-shadow: var(--shadow-sm);
        }
    </style>
</head>
<body>

    <div class="phone-wrapper">
        <!-- 頂部高級感大字留白區 -->
        <header class="header">
            <div class="top-nav">
                <a href="index.html" class="back-btn nav-fast">⬅️ 返回首頁</a>
                <button class="theme-toggle" id="themeToggleBtn">🌓</button>
            </div>
            <div class="store-header-info">
                <h1>池上木盒便當 - 信義店</h1>
                <div class="store-meta">
                    <span>📍 台北市信義區松山路 123 號</span>
                    <span>•</span>
                    <span>⚡ 0.05 km</span>
                </div>
            </div>
        </header>

        <!-- 中間精品菜單 -->
        <main class="menu-container">
            <!-- 品項 1 -->
            <div class="food-card" data-price="120" data-id="item_1">
                <div class="food-img">🍱</div>
                <div class="food-info">
                    <div class="food-name">招牌招牌木盒便當</div>
                    <div class="food-price">$120</div>
                </div>
                <div class="action-container">
                    <button class="add-cart-btn btn-trigger">➕ 加到購物車</button>
                </div>
            </div>

            <!-- 品項 2 -->
            <div class="food-card" data-price="135" data-id="item_2">
                <div class="food-img">🍗</div>
                <div class="food-info">
                    <div class="food-name">酥炸大雞腿便當</div>
                    <div class="food-price">$135</div>
                </div>
                <div class="action-container">
                    <button class="add-cart-btn btn-trigger">➕ 加到購物車</button>
                </div>
            </div>

            <!-- 品項 3 -->
            <div class="food-card" data-price="110" data-id="item_3">
                <div class="food-img">🥩</div>
                <div class="food-info">
                    <div class="food-name">厚切大排骨便當</div>
                    <div class="food-price">$110</div>
                </div>
                <div class="action-container">
                    <button class="add-cart-btn btn-trigger">➕ 加到購物車</button>
                </div>
            </div>

            <!-- 品項 4 (連動下架防線展示) -->
            <div class="food-card sold-out" data-price="95" data-id="item_4">
                <div class="food-img">🐟</div>
                <div class="food-info">
                    <div class="food-name">薄鹽鯖魚便當 (售罄)</div>
                    <div class="food-price">$95</div>
                </div>
                <div class="action-container">
                    <button class="add-cart-btn sold-out-btn" disabled>🔴 已售罄</button>
                </div>
            </div>
        </main>

        <!-- 底部懸浮欄 -->
        <footer class="bottom-bar">
            <div class="cart-summary" id="cartSummaryText">
                🛒 購物車已加入 0 項商品 · 總計 $0
            </div>
            <a href="cart.html" class="checkout-btn nav-fast" id="checkoutBtn">去結帳 &gt;&gt;</a>
        </footer>
    </div>

    <script>
        // 🚀 0秒無縫閃轉外掛核心架獲
        function bindFastClick(element, callback) {
            if (!element) return;
            let triggered = false;
            function trigger(e) {
                if (!triggered) {
                    triggered = true;
                    setTimeout(() => { triggered = false; }, 300);
                    callback(e);
                }
                e.preventDefault();
            }
            element.addEventListener('touchstart', trigger, { passive: false });
            element.addEventListener('mousedown', trigger);
        }

        // 🌓 系統全局膚色同步防線
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        function initTheme() {
            const savedTheme = localStorage.getItem('pacetake-theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        }
        bindFastClick(themeToggleBtn, () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('pacetake-theme', newTheme);
        });
        initTheme();

        // 🛒 購物車動態計數與金額加算核心
        let cartCount = 0;
        let cartTotal = 0;
        const cartSummaryText = document.getElementById('cartSummaryText');

        function updateCartUI() {
            cartSummaryText.innerText = `🛒 購物車已加入 ${cartCount} 項商品 · 總計 $${cartTotal}`;
        }

        // 綁定所有加到購物車按鈕
        const addBtns = document.querySelectorAll('.btn-trigger');
        addBtns.forEach(btn => {
            bindFastClick(btn, (e) => {
                const card = btn.closest('.food-card');
                if(card.classList.contains('sold-out')) return; // 安全防線
                
                const price = parseInt(card.getAttribute('data-price'), 10);
                
                cartCount += 1;
                cartTotal += price;

                // 0.2秒極簡精品流暢點擊回饋動畫
                btn.innerText = "✓ 已加入";
                btn.style.backgroundColor = "rgba(0, 102, 255, 0.1)";
                btn.style.color = "var(--brand-blue)";
                btn.style.borderColor = "var(--brand-blue)";

                setTimeout(() => {
                    btn.innerText = "➕ 加到購物車";
                    btn.style.backgroundColor = "var(--bg-global)";
                    btn.style.color = "var(--text-main)";
                    btn.style.borderColor = "var(--border-color)";
                }, 400);

                updateCartUI();
            });
        });

        // 全局相對路徑跳轉無縫對接
        const navElements = document.querySelectorAll('.nav-fast');
        navElements.forEach(elem => {
            bindFastClick(elem, () => {
                const dest = elem.getAttribute('href');
                if (dest && dest !== '#') {
                    window.location.href = dest;
                }
            });
        });
    </script>
</body>
</html>
