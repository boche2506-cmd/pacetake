<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PACE 派思 pacetake.tw - 買家首頁</title>

    <!-- Favicon & Apple Touch Icon -->
    <link rel="icon" type="image/png" href="png/logoapple.png" sizes="180x180">
    <link rel="apple-touch-icon" href="png/logoapple.png">
    <link rel="apple-touch-icon" sizes="180x180" href="png/logoapple.png">
    <link rel="apple-touch-icon-precomposed" href="png/logoapple.png">

    <link rel="stylesheet" href="style.css">
<style>
        /* 頂部導航與大字留白 */
        .store {
            padding: 20px 20px 16px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .store-header-info h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .store-meta {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 6px;
            font-weight: 500;
            display: flex;
            gap: 8px;
        }

        /* 中間精品菜單區 */
        .menu-container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .food-card {
            display: flex;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px;
            gap: 12px;
            align-items: center;
            box-shadow: var(--shadow-sm);
            position: relative;
            transition: all 0.2s ease;
        }

        .food-img {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            background-color: var(--bg-global);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            flex-shrink: 0;
            border: 1px solid var(--border-color);
        }

        .food-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-grow: 1;
            gap: 6px;
        }

        .food-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
        }

        .food-price {
            font-size: 18px;
            font-weight: 800;
            color: var(--brand-blue);
        }

        /* 按鈕基本結構 */
        .action-container {
            flex-shrink: 0;
        }

        .add-cart-btn {
            background-color: var(--bg-global);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .add-cart-btn:active {
            transform: scale(0.92);
        }

        /* 連動下架防線樣式 */
        .food-card.sold-out {
            filter: grayscale(1) opacity(0.5);
            pointer-events: none;
            /* 阻斷所有點擊 */
        }

        .sold-out-btn {
            background-color: #E2E8F0;
            border: 1px solid #CBD5E1;
            color: var(--brand-red);
            font-weight: bold;
            cursor: not-allowed;
        }

        [data-theme="dark"] .sold-out-btn {
            background-color: #262626;
            border-color: #404040;
            color: var(--brand-red);
        }

        /* 底部懸浮欄 */
        .bottom-bar {
            bottom: 0;
            left: 0;
            right: 0;
            height: 20cqw;
            width: 100%;
            background-color: var(--blur-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            padding: 0 2cqw;
            z-index: 90;
        }

        .cart-summary {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        .checkout-btn {
            background-color: var(--brand-blue);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 22px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            box-shadow: var(--shadow-sm);
        }
    </style>
</head>

<body>
    <div class="phone-wrapper">
        <div id="buyerView" style="display: block;">
            <!-- 頂部高級感大字留白區 -->
            <header id="header-container"></header>
            <div class="store">
                <div class="store-header-info" id="storeHeaderInfo">
                    <h1 id="storeNameText">正在載入雲端店家...</h1>
                    <div class="store-meta">
                        <span id="storeAddressText">📍 讀取地址中...</span>
                        <span>•</span>
                        <span>⚡ 0.05 km</span>
                    </div>
                </div>
            </div>

            <!-- 中間精品菜單 -->
            <main class="menu-container" id="menuContainer">
                <!-- 菜單品項會動態渲染在這裡 -->
            </main>

            <!-- 底部懸浮欄 -->
            <footer class="bottom-bar">
                <div class="cart-summary" id="cartSummaryText">
                    🛒 購物車已加入<br> 0 項商品 · 總計 $0
                </div>
                <a href="cart.html" class="checkout-btn nav-fast" id="checkoutBtn">去結帳 &gt;&gt;</a>
            </footer>
        </div>
    </div>
    <script type="module" src="js/app.js"></script>
    <script src="js/cart-manager.js"></script>
</body>

</html>
